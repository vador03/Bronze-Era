l_english:
 be_tribal_migration: "Become a Migrating People"
 be_tribal_migration_desc: "#R WARNING: WIP — NOT RECOMMENDED#!\nOnly an independent tribe or steppe horde at peace can begin a total migration. Gather all nobles and soldiers, 60% of burghers, laborers and clergy, and 20% of peasants and tribesmen in a frontier camp. Raise a controllable escort and become an army-based country. Costs 50 gold and 5 stability; once per country."
 be_tribal_migration_decision.title: "Become a Migrating People"
 be_tribal_migration_decision.desc: "#R WARNING: WIP — NOT RECOMMENDED#!\nLead the whole people into a neighbouring unowned frontier camp. The camp is selected automatically; use the action in Form New Country to choose it manually. This total migration is available once per country."
 be_tribal_migration_decision.a: "Begin the migration"
 be_tribal_migration_select_camp: "Choose an unowned neighbouring province for the migration camp:"
 be_tribal_migration_no_camp: "@trigger_no! No suitable unowned neighbouring province is available."
 be_move_migration_camp: "Move Migrating Population to Army"
 be_move_migration_camp_desc: "After moving the migration army, order its people to follow to the army's current location. The native POP migration takes six months. This order has a one-year cooldown."
 be_move_migration_camp_select_army: "Choose the migration army:"
 be_settle_migration: "Settle the Migrating People"
 be_settle_migration_desc: "Settle at the migration army's location, if it is unowned or already yours. Population in the last camp follows over six months. Foreign-owned land must be acquired through normal game mechanics first."
 be_settle_migration_select_army: "Choose the army and settlement location:"
 be_migration_no_army: "@trigger_no! No migration army is available at a valid location."
 be_migration_escort: "Migration Escort"
 be_migration_colonize_decision.title: "Colonize the Land Beneath the Army"
 be_migration_colonize_decision.desc: "Move the migration escort onto unowned land, then take this decision in Country Content. The country remains army-based. The colony immediately receives 20% of the camp's POPs. Cost: 25 gold; cooldown: 5 years; at most four colonies in addition to the camp."
 be_migration_colonize_decision.a: "Found the colony"
 be_migration_settle_decision.title: "Settle the Migrating People Permanently"
 be_migration_settle_decision.desc: "Move the escort onto unowned or already owned land, then take this decision. The camp's POPs move there immediately and the country becomes territorial. Foreign land must first be acquired through normal game mechanics."
 be_migration_settle_decision.a: "Found a territorial country"
 be_create_migration_offshoot: "Send a Migrating Offshoot"
 be_create_migration_offshoot_desc: "#R WARNING: WIP — NOT RECOMMENDED#!\nDetach 10–40% of each sizeable POP at one owned location. The offshoot becomes an army-based vassal with its own camp and escort; the parent country remains independent. You may play the offshoot. Costs 30 gold, requires peace, and has a 20-year cooldown."
 be_create_migration_offshoot_select_source: "Choose the source location:"
 be_create_migration_offshoot_select_camp: "Choose a neighbouring unowned province for the offshoot camp:"
 be_create_migration_offshoot_select_share: "Choose the POP share to detach:"
 be_create_migration_offshoot_select_play: "Play as the migrating offshoot?"
 be_tribal_migration_no_source: "@trigger_no! No owned location has enough population."
 be_migrant_band: "Migrating Offshoot"
 be_migrant_band_desc: "A politically subordinate migrating people with its own army."
 be_migration.1.title: "Shortage in the Migration Camp"
 be_migration.1.desc: "Food stores are dangerously low where the migrating people are camped."
 be_migration.1.a: "Endure the shortage"
 be_migration.1.b: "Buy supplies for 20 gold"
 be_migration.2.title: "Passage Through Foreign Lands"
 be_migration.2.desc: "Our migrating people have established a camp in another country's territory. Local authorities demand payment for the passage."
 be_migration.2.a: "Pay 20 gold for passage"
 be_migration.2.b: "Refuse and endure the unrest"

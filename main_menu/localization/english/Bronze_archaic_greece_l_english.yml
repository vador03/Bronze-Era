l_english:
 bronze_archaic_greek_colonies: "Archaic Greek Colonies"
 bronze_archaic_greek_colonies_desc: "Greek poleis send settlers to the Mediterranean and Black Sea coasts. Overseas settlement is limited to those shores."
 bronze_archaic_greek_colony: "Found a Greek Coastal Colony"
 bronze_archaic_greek_colony_desc: "Establish a Greek settlement on a discovered, unclaimed Mediterranean or Black Sea coast."
 bronze_archaic_greek_colony_choose_target: "Choose a coastal site"
 bronze_archaic_greek_colony_no_target: "No discovered, unclaimed Mediterranean or Black Sea coastal site is available."
 bronze_archaic_greece.1.title: "The Songs of Homer"
 bronze_archaic_greece.1.desc: "Across the Aegean, singers weave the wars of Troy and the wanderings of Odysseus into lasting verse. Tradition attributes the Iliad and the Odyssey to Homer, whose voice gives the emerging Greek world a shared memory."
 bronze_archaic_greece.1.a: "Preserve the two epics."
 bronze_iliad: "The Iliad"
 bronze_odyssey: "The Odyssey"
 bronze_archaic_greece.2.title: "Greek Settlers on Our Shores"
 bronze_archaic_greece.2.desc: "Several waves of Greek sailors, farmers and merchants have settled our coastal towns. Their customs now shape the harbors and nearby communities. Shall our court embrace their culture or recognize them while preserving its own traditions?"
 bronze_archaic_greece.2.a: "Embrace Greek customs."
 bronze_archaic_greece.2.b: "Welcome the settlers, retain our traditions."

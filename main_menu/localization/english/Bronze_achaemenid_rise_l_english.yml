l_english:
 bronze_achaemenid_rise: "Rise of the Achaemenids"
 bronze_achaemenid_rise_desc: "The Median kingdoms gather the peoples of the Iranian plateau. Their strongest claimant can turn this fragile supremacy into an empire by taking Ecbatana, the Median heartland and Persis. Nineveh and Babylon offer further chapters in its ascent."
 hint_bronze_achaemenid_rise: "Rise of the Achaemenids"
 hint_bronze_achaemenid_rise_hint_text: "The strongest independent Median or Persian realm in the Persia region becomes the claimant. Media has an early advantage. The claimant must control Abhar, Ecbatana (Hamadan), Istakhr and 55% of the listed Iranian plateau lands, then form the Persian Empire."
 bronze_achaemenid_panel_phase: "Imperial ascent"
 bronze_achaemenid_panel_phase_value: "#Y [GetSituationByKey('bronze_achaemenid_rise').MakeScope.GetVariable('bronze_achaemenid_phase').GetValue|V0]#!/3"
 bronze_achaemenid_panel_goal: "Imperial crown"
 bronze_achaemenid_panel_goal_value: "Abhar · Ecbatana · Persis"
 bronze_achaemenid_story_card: "From Median alliance to Persian empire"
 bronze_achaemenid_story_card_desc: "From 750 BC, Media can rally the plateau with stronger levies and cavalry. Each year the independent Iranian states are ranked by armed strength, income and status. The strongest receives the claimant's support. The favored realm can change when wars redraw the balance of power."
 bronze_achaemenid_milestones_card: "Three stages of ascent"
 bronze_achaemenid_milestones_card_desc: "1. Unite the Median and Persian lands. 2. From 612 BC, Nineveh (Mosul) offers a conquest objective and a prestige reward. 3. From 552 BC, the claimant can reconcile Median and Persian elites. Formation requires Abhar, Hamadan, Istakhr and 55% of the Iranian core lands."
 bronze_achaemenid_map_card: "Campaign map"
 bronze_achaemenid_map_card_desc: "Gold marks the leading claimant, brown the other eligible Iranian realms. Yellow marks Abhar, Ecbatana and Persis; red marks Nineveh. The displayed dates follow the Bronze Era historical calendar."
 bronze_achaemenid_legend_claimant: "Leading Iranian claimant"
 bronze_achaemenid_legend_rivals: "Other Median and Persian realms"
 bronze_achaemenid_legend_objectives: "Imperial heartlands"
 bronze_achaemenid_median_head_start: "Median Confederation"
 bronze_achaemenid_median_head_start_desc: "The Median tribes gather cavalry and tribute around their royal court during the early ascent."
 bronze_achaemenid_leading_claimant: "Claimant to the Iranian Empire"
 bronze_achaemenid_leading_claimant_desc: "The strongest Iranian realm draws warriors and ambitious nobles to its standard."
 bronze_achaemenid_median_cavalry: "Reformed Iranian Cavalry"
 bronze_achaemenid_median_cavalry_desc: "A larger cavalry host answers the throne, while farms and workshops bear the mobilization cost."
 bronze_achaemenid_court_of_peoples: "Court of the Iranian Peoples"
 bronze_achaemenid_court_of_peoples_desc: "Local aristocrats administer the realm through royal agreements, though the court must satisfy competing interests."
 bronze_achaemenid_imperial_foundation: "Achaemenid Imperial Foundation"
 bronze_achaemenid_imperial_foundation_desc: "A durable imperial court joins Median and Persian institutions under one crown."
 bronze_achaemenid_babylonian_settlement: "Babylonian Settlement"
 bronze_achaemenid_babylonian_settlement_desc: "Royal guarantees to Babylonian communities strengthen trade and provincial order."
 bronze_achaemenid_royal_road: "Royal Road"
 bronze_achaemenid_royal_road_desc: "Relay stations, guards and royal messengers tie distant provinces to the imperial court."
 bronze_achaemenid_rise_candidate_text: "Is an independent Median or Persian country in the Iranian plateau"
 bronze_achaemenid_rise_claimant_text: "Is the leading Iranian claimant"
 bronze_achaemenid_select_claimant_text: "Choose the strongest Iranian claimant"
 bronze_achaemenid_rise.1.title: "The Banner of the Plateau"
 bronze_achaemenid_rise.1.desc: "The chiefs of the Iranian plateau look for a king able to bind their houses together. Horsemen ride to the court, while scribes count the gifts needed to keep the alliances intact. This realm now carries the leading claim to a greater empire."
 bronze_achaemenid_rise.1.a: "Muster the horsemen of the plateau."
 bronze_achaemenid_rise.1.b: "Bind the noble houses to the court."
 bronze_achaemenid_rise.10.title: "The Road to Nineveh"
 bronze_achaemenid_rise.10.desc: "Assyria's great city of Nineveh still dominates the northern Mesopotamian roads. Its fall would announce that the balance of power has shifted toward the Iranian highlands."
 bronze_achaemenid_rise.10.a: "Prepare the campaign against Nineveh."
 bronze_achaemenid_rise.20.title: "Nineveh Taken"
 bronze_achaemenid_rise.20.desc: "The city remembered as Nineveh has fallen to our armies. Its surrender is carried from court to court, and the prestige of the Iranian crown grows."
 bronze_achaemenid_rise.20.a: "Let every court hear of this victory."
 bronze_achaemenid_rise.30.title: "Medes and Persians"
 bronze_achaemenid_rise.30.desc: "The highland kings can no longer rule by the allegiance of one people alone. Median horsemen, Persian nobles and provincial elites must find a place beneath the same royal seal."
 bronze_achaemenid_rise.30.a: "Recognize both peoples at court."
 bronze_achaemenid_rise.40.title: "The King of Kings"
 bronze_achaemenid_rise.40.desc: "Ecbatana and Persis now answer to one imperial crown. The Median foundation and the Persian court together proclaim a new power over the Iranian plateau."
 bronze_achaemenid_rise.40.a: "An empire has risen."
 bronze_achaemenid_rise.50.title: "Babylon Opens Its Gates"
 bronze_achaemenid_rise.50.desc: "The city of Babylon joins the empire. Its temples, merchants and communities will be governed through royal guarantees and provincial officers rather than left to the fate of a conquered city."
 bronze_achaemenid_rise.50.a: "Secure the Babylonian settlement."
 bronze_achaemenid_rise.60.title: "The Royal Road"
 bronze_achaemenid_rise.60.desc: "From Susa, a chain of guarded roads and relay stations carries the king's orders across the provinces. Messengers, armies and merchants now cross the empire under the protection of the crown."
 bronze_achaemenid_rise.60.a: "Set the royal messengers on their way."

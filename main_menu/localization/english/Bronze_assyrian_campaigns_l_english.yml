l_english:
 bronze_assyrian_campaigns: "Assyrian Campaigns in the Levant"
 bronze_assyrian_campaigns_desc: "In 804 BC, Adad-nirari III led Assyria west through Syria and Palestine toward Gaza. Secure Damascus and Gaza before the campaign window closes."
 hint_bronze_assyrian_campaigns: "Assyrian Campaigns"
 hint_bronze_assyrian_campaigns_hint_text: "From 804 BC, Assyria has thirty years to hold Damascus and Gaza."
 bronze_assyrian_campaigns_legend: "Assyrian lands"
 bronze_assyrian_campaigns_objectives: "Campaign objectives"
 bronze_assyrian_campaigns.1.title: "Adad-nirari's Western Campaign"
 bronze_assyrian_campaigns.1.desc: "King Adad-nirari III gathers the armies of Assyria for a western campaign. Syria's cities and the route through Palestine to Gaza promise tribute, strategic roads and royal renown."
 bronze_assyrian_campaigns.1.a: "March toward Damascus and Gaza."
 bronze_assyrian_campaigns.2.title: "Assyria Reaches Gaza"
 bronze_assyrian_campaigns.2.desc: "Damascus and Gaza answer to the Assyrian king. The western road has been brought under imperial authority, and the court celebrates the campaign."
 bronze_assyrian_campaigns.2.a: "Record the victory."
 bronze_assyrian_campaigns.3.title: "The Western Campaign Fades"
 bronze_assyrian_campaigns.3.desc: "The years allotted to secure Damascus and Gaza have passed. The royal court must reckon with an unfinished western campaign."
 bronze_assyrian_campaigns.3.a: "The court remembers."

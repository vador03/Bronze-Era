 be_rite_pasture: "Seasonal pastures"
 be_rite_shelter: "Protected stores"
 be_rite_lineage: "Ancestral consent"
 be_rite_guard: "Community guard"
 be_rite_hunt: "Careful hunting"
 be_rite_oaths: "Local agreements"
 be_rite_food: "Shared harvests"
 be_rite_exchange: "Trusted exchanges"
 be_rite_seaways: "Coastal routes"
 baal_hammon_guardian: "Baal Hammon, Guardian of the City"
 aramazd_royal_oath: "Aramazd, Keeper of Royal Oaths"

 bronze_unserved_religions.1.title: "The Herds at the Dry Ford"
 bronze_unserved_religions.1.desc: "Pastures have thinned. Elders say the household offerings should travel with the herds; the drovers ask for stored fodder."
 bronze_unserved_religions.1.a: "Carry the hearth offerings"
 bronze_unserved_religions.1.b: "Open the winter fodder stores"
 bronze_unserved_religions.2.title: "Oaths Beside the Burial Mound"
 bronze_unserved_religions.2.desc: "War bands gather near an ancestral mound. The clans see the rite as a pledge to defend their kin, while captains want supplies."
 bronze_unserved_religions.2.a: "Renew the clan oath"
 bronze_unserved_religions.2.b: "Equip the riders"
 bronze_unserved_religions.3.title: "The Grove and the Border Villages"
 bronze_unserved_religions.3.desc: "Disputed villages ask their elders to protect a grove used for seasonal offerings. No single priest speaks for all the households."
 bronze_unserved_religions.3.a: "Fund the grove's keepers"
 bronze_unserved_religions.3.b: "Broker village oaths"
 bronze_unserved_religions.4.title: "Offerings by the River"
 bronze_unserved_religions.4.desc: "Before a crossing, families place gifts beside the river and ask for a safe return. Warriors argue that watching the ford matters as much as ceremony."
 bronze_unserved_religions.4.a: "Hold the river rite"
 bronze_unserved_religions.4.b: "Guard the crossing"
 bronze_unserved_religions.5.title: "The Lake's Winter Stores"
 bronze_unserved_religions.5.desc: "A hard season threatens fish and game. Local ritual specialists speak of respecting the lake's keepers; households need food set aside now."
 bronze_unserved_religions.5.a: "Support the lakeside rite"
 bronze_unserved_religions.5.b: "Organize winter stores"
 bronze_unserved_religions.6.title: "A Diviner at the Forest Path"
 bronze_unserved_religions.6.desc: "Scouts return from a wooded route. A diviner reads the signs as the community understands them, while the war band debates an ambush."
 bronze_unserved_religions.6.a: "Hear the diviner"
 bronze_unserved_religions.6.b: "Prepare the forest guard"
 bronze_unserved_religions.7.title: "Offerings at the River Landing"
 bronze_unserved_religions.7.desc: "When the river's harvest fails, riverside families ask for offerings at a local landing. Boat crews propose moving grain between settlements."
 bronze_unserved_religions.7.a: "Honor the local waters"
 bronze_unserved_religions.7.b: "Move grain by boat"
 bronze_unserved_religions.8.title: "Guests Across the Estuary"
 bronze_unserved_religions.8.desc: "Foreign sailors arrive with unfamiliar rites. Village elders insist that exchange should respect local household ceremonies."
 bronze_unserved_religions.8.a: "Host a shared feast"
 bronze_unserved_religions.8.b: "Keep trade at the landing"
 bronze_unserved_religions.9.title: "Grain Jars for the Ancestors"
 bronze_unserved_religions.9.desc: "As stores shrink, families debate how much grain to reserve for household offerings. The village council can instead ration seed."
 bronze_unserved_religions.9.a: "Keep the ancestral portion"
 bronze_unserved_religions.9.b: "Protect next year's seed"
 bronze_unserved_religions.10.title: "Stones Between the Villages"
 bronze_unserved_religions.10.desc: "Several settlements dispute who will maintain an old burial ground. Elders propose a joint remembrance; others prefer a practical pact."
 bronze_unserved_religions.10.a: "Hold a common remembrance"
 bronze_unserved_religions.10.b: "Agree on shared boundaries"
 bronze_unserved_religions.11.title: "The New Clearing"
 bronze_unserved_religions.11.desc: "Families opening fields at the forest edge ask elders to mark the place with household rites. Neighbors fear the boundary will become a quarrel."
 bronze_unserved_religions.11.a: "Mark the clearing together"
 bronze_unserved_religions.11.b: "Settle the boundary first"
 bronze_unserved_religions.12.title: "A Feast After Poor Rains"
 bronze_unserved_religions.12.desc: "A village proposes a seasonal feast even after a meagre harvest. Some see it as a duty to ancestors; others would save the grain."
 bronze_unserved_religions.12.a: "Share a modest offering"
 bronze_unserved_religions.12.b: "Store the remaining harvest"
 bronze_unserved_religions.13.title: "The Basin and the Local Shrine"
 bronze_unserved_religions.13.desc: "A failed harvest raises a dispute over water. Shrine keepers ask the ruler to sponsor a local rite; cultivators want channels repaired."
 bronze_unserved_religions.13.a: "Support the shrine keepers"
 bronze_unserved_religions.13.b: "Repair the water channels"
 bronze_unserved_religions.14.title: "An Oath for the New Settlements"
 bronze_unserved_religions.14.desc: "New settlements seek recognition from the ruler. Local custodians offer a ceremonial oath, while village heads request clear duties."
 bronze_unserved_religions.14.a: "Receive the local custodians"
 bronze_unserved_religions.14.b: "Confirm village obligations"
 bronze_unserved_religions.15.title: "Herd Tracks in the Cold Season"
 bronze_unserved_religions.15.desc: "Grazing routes are strained. Families treat old cairns as reminders of their forebears, but herders need a new pasture plan."
 bronze_unserved_religions.15.a: "Renew the cairn gathering"
 bronze_unserved_religions.15.b: "Move the herds early"
 bronze_unserved_religions.16.title: "Signs on the Steppe"
 bronze_unserved_religions.16.desc: "Warriors ask a local diviner about a campaign. The reading reflects their beliefs, while the captains can rely on scouts."
 bronze_unserved_religions.16.a: "Hear the diviner's counsel"
 bronze_unserved_religions.16.b: "Send more scouts"
 bronze_unserved_religions.17.title: "Incense at the Shore"
 bronze_unserved_religions.17.desc: "Mariners prepare a voyage along the coast. Some families burn fragrant resin for a safe return; merchants ask for better harbour watches."
 bronze_unserved_religions.17.a: "Support the shore ceremony"
 bronze_unserved_religions.17.b: "Strengthen the harbour watch"
 bronze_unserved_religions.18.title: "A Lean Season Inland"
 bronze_unserved_religions.18.desc: "Shore traders hear that inland communities have little to exchange. Elders propose a shared meal; carriers suggest sending supplies."
 bronze_unserved_religions.18.a: "Organize a common meal"
 bronze_unserved_religions.18.b: "Send stores inland"
 bronze_unserved_religions.19.title: "The Disputed Watering Place"
 bronze_unserved_religions.19.desc: "Herds converge on a shrinking well. Families ask elders to oversee offerings and access, while drovers want a strict schedule."
 bronze_unserved_religions.19.a: "Call the elders together"
 bronze_unserved_religions.19.b: "Set a watering schedule"
 bronze_unserved_religions.20.title: "A Pledge Before the Raid"
 bronze_unserved_religions.20.desc: "A border war unsettles pastoral families. The clans can renew mutual obligations or concentrate on protecting their herds."
 bronze_unserved_religions.20.a: "Renew the clan pledge"
 bronze_unserved_religions.20.b: "Guard the herds"
 bronze_unserved_religions.21.title: "Marks of a Low River"
 bronze_unserved_religions.21.desc: "River villages compare the old flood marks with the current waterline. Local custodians call for a communal rite; farmers ask to share stores."
 bronze_unserved_religions.21.a: "Gather at the riverbank"
 bronze_unserved_religions.21.b: "Share the grain stores"
 bronze_unserved_religions.22.title: "The River Villages' Compact"
 bronze_unserved_religions.22.desc: "Distant villages dispute who maintains a crossing. Their elders offer a public oath before the community; boatmen want a regular levy of labor."
 bronze_unserved_religions.22.a: "Witness the village oath"
 bronze_unserved_religions.22.b: "Assign crossing duties"
 bronze_unserved_religions.23.title: "The Roadside Ancestors"
 bronze_unserved_religions.23.desc: "Caravans now link several communities. Lineage elders ask that travelers honor local ancestors; traders want agreed market rules."
 bronze_unserved_religions.23.a: "Hold a meeting of lineages"
 bronze_unserved_religions.23.b: "Standardize market duties"
 bronze_unserved_religions.24.title: "The Smiths and the War Band"
 bronze_unserved_religions.24.desc: "A war band asks smiths for tools and weapons. Families attach ritual meaning to the forge, while commanders need equipment before departure."
 bronze_unserved_religions.24.a: "Support the forge gathering"
 bronze_unserved_religions.24.b: "Supply the war band"
 bronze_unserved_religions.25.title: "Seed from the Old Village"
 bronze_unserved_religions.25.desc: "A poor season forces a village to seek seed from its neighbors. Household elders ask that ancestral obligations be remembered in the exchange."
 bronze_unserved_religions.25.a: "Share seed with a rite"
 bronze_unserved_religions.25.b: "Organize a reserve"
 bronze_unserved_religions.26.title: "Kinship Across New Fields"
 bronze_unserved_religions.26.desc: "Families settling new fields disagree over land and access to water. Clan elders can mediate, or the ruler can impose a practical boundary."
 bronze_unserved_religions.26.a: "Let the elders mediate"
 bronze_unserved_religions.26.b: "Survey the fields"
 bronze_unserved_religions.27.title: "A Waterhole in the Dry Season"
 bronze_unserved_religions.27.desc: "Several bands meet at a dwindling waterhole. Elders recall local stories of its care; hunters propose moving before it fails."
 bronze_unserved_religions.27.a: "Agree on shared access"
 bronze_unserved_religions.27.b: "Move the camp"
 bronze_unserved_religions.28.title: "Tracks Beyond the Ridge"
 bronze_unserved_religions.28.desc: "Scouts find signs of an approaching enemy. A gathering gives families time to renew obligations; others favor dispersing the hunters."
 bronze_unserved_religions.28.a: "Gather the families"
 bronze_unserved_religions.28.b: "Send out the hunters"
 bronze_unserved_religions.29.title: "The First Rain Is Late"
 bronze_unserved_religions.29.desc: "Fields wait for rain. Families read the season through local stories of sky and water; farmers urge the ruler to protect the grain stores."
 bronze_unserved_religions.29.a: "Sponsor the rain ceremony"
 bronze_unserved_religions.29.b: "Guard the grain stores"
 bronze_unserved_religions.30.title: "Ancestral Names at the New Court"
 bronze_unserved_religions.30.desc: "As settlements grow, a ruling lineage asks that its ancestors be remembered publicly. Village heads want the court to honor their own histories too."
 bronze_unserved_religions.30.a: "Establish a lineage shrine"
 bronze_unserved_religions.30.b: "Invite the village heads"
 bronze_unserved_religions.31.title: "Signs in the Ritual Calendar"
 bronze_unserved_religions.31.desc: "Several Oaxaca communities debate the timing of a public ceremony. Calendar keepers propose one date; village leaders ask for room to follow local customs."
 bronze_unserved_religions.31.a: "Fund the calendar keepers and shrine"
 bronze_unserved_religions.31.b: "Allow local observances"
 bronze_unserved_religions.32.title: "Offerings on the Hill"
 bronze_unserved_religions.32.desc: "A poor harvest brings people to a hilltop gathering place. Some seek to honor ancestors there; others want to repair the fields below."
 bronze_unserved_religions.32.a: "Hold the hilltop gathering"
 bronze_unserved_religions.32.b: "Repair the fields"
 bronze_unserved_religions.33.title: "Water for the Courtyard"
 bronze_unserved_religions.33.desc: "A settlement faces low water. Household custodians ask for a communal observance; builders propose repairing the channels and jars."
 bronze_unserved_religions.33.a: "Gather the households"
 bronze_unserved_religions.33.b: "Repair the water stores"
 bronze_unserved_religions.34.title: "The Shared Gathering Place"
 bronze_unserved_religions.34.desc: "Outlying communities disagree over a gathering place and its upkeep. Their elders can seek a common pledge, or work crews can divide the labor."
 bronze_unserved_religions.34.a: "Seek a common pledge"
 bronze_unserved_religions.34.b: "Assign the work crews"
 bronze_unserved_religions.35.title: "A Mound Before the March"
 bronze_unserved_religions.35.desc: "A war band passes an ancestral mound. Families ask for a remembrance of those buried there; the scouts press to leave at once."
 bronze_unserved_religions.35.a: "Hold the remembrance"
 bronze_unserved_religions.35.b: "March with the scouts"
 bronze_unserved_religions.36.title: "Gifts Along the River"
 bronze_unserved_religions.36.desc: "Neighboring communities meet beside a river to exchange gifts and settle access to fishing grounds. Elders give the gathering ceremonial meaning."
 bronze_unserved_religions.36.a: "Mark the exchange with a feast"
 bronze_unserved_religions.36.b: "Set practical fishing rules"
 bronze_unserved_religions.37.title: "The Canoes Return"
 bronze_unserved_religions.37.desc: "Canoes bring news and goods from another shore. Families ask to welcome the crews according to local custom; traders want to prepare the next voyage."
 bronze_unserved_religions.37.a: "Hold a shore welcome"
 bronze_unserved_religions.37.b: "Equip the next voyage"
 bronze_unserved_religions.38.title: "Storm Damage in the Gardens"
 bronze_unserved_religions.38.desc: "A storm has damaged gardens near the coast. Neighbors recall their obligations to one another; boat crews offer to carry food."
 bronze_unserved_religions.38.a: "Gather the households"
 bronze_unserved_religions.38.b: "Move food by canoe"
 bronze_unserved_religions.39.title: "A Village at the River Bend"
 bronze_unserved_religions.39.desc: "A new village and its neighbors contest fishing access. Elders urge a shared ceremony of kinship; hunters favor a clear boundary."
 bronze_unserved_religions.39.a: "Renew kinship ties"
 bronze_unserved_religions.39.b: "Mark the fishing grounds"
 bronze_unserved_religions.40.title: "The Canoe War Council"
 bronze_unserved_religions.40.desc: "Warriors gather before a river campaign. Families read the moment through local ancestral stories; captains ask for provisions and scouts."
 bronze_unserved_religions.40.a: "Hear the elders"
 bronze_unserved_religions.40.b: "Supply the canoe crews"
 bronze_unserved_religions.41.title: "Thin Ice, Few Seals"
 bronze_unserved_religions.41.desc: "Hunters report unreliable ice and scarce prey. Elders describe duties toward the animals in local tradition; families need supplies for the next journey."
 bronze_unserved_religions.41.a: "Hold a hunters' gathering"
 bronze_unserved_religions.41.b: "Save stores for the crossing"
 bronze_unserved_religions.42.title: "Visitors at the Shore"
 bronze_unserved_religions.42.desc: "Another coastal group arrives by boat. The hosts can renew customary rules of welcome or concentrate on exchanging tools and food."
 bronze_unserved_religions.42.a: "Observe the welcome custom"
 bronze_unserved_religions.42.b: "Trade useful supplies"
 bronze_unserved_religions.43.title: "Shells Across the Water"
 bronze_unserved_religions.43.desc: "Coastal households receive visitors carrying shells and food. Clan elders ask that local obligations be acknowledged before exchange."
 bronze_unserved_religions.43.a: "Let the clans host the visitors"
 bronze_unserved_religions.43.b: "Organize the sea exchange"
 bronze_unserved_religions.44.title: "Paths Between the Gardens"
 bronze_unserved_religions.44.desc: "Families disagree over paths linking gardens and fishing places. Local custodians can mediate; work crews can build another route."
 bronze_unserved_religions.44.a: "Ask local custodians to mediate"
 bronze_unserved_religions.44.b: "Cut a new path"
 bronze_unserved_religions.45.title: "Care for the Water Place"
 bronze_unserved_religions.45.desc: "A water place is under strain. Its local custodians recall obligations to Country and ancestral journeys; families also need a plan for scarce supplies."
 bronze_unserved_religions.45.a: "Support the custodians' gathering"
 bronze_unserved_religions.45.b: "Protect the water stores"
 bronze_unserved_religions.46.title: "Paths Through Country"
 bronze_unserved_religions.46.desc: "War disrupts routes between communities. Custodians ask that journeys respect local places and stories; scouts seek a safer path."
 bronze_unserved_religions.46.a: "Consult the local custodians"
 bronze_unserved_religions.46.b: "Prepare an alternate route"
 bronze_unserved_religions.47.title: "Tanit's Offering at the Harbor"
 bronze_unserved_religions.47.desc: "Merchants preparing to sail ask the city's temple to bless their departure. They regard Tanit as a guardian of their crossing, while harbor elders urge the ruler to keep the quays open to every trading family."
 bronze_unserved_religions.47.a: "Support the temple procession"
 bronze_unserved_religions.47.b: "Entrust the departure to harbor families"
 bronze_unserved_religions.48.title: "An Oath Before Baal Hammon"
 bronze_unserved_religions.48.desc: "War threatens the city. Priests propose a public oath before Baal Hammon, whom worshippers regard as a protector of their community. Commanders ask for supplies and a clear defense plan."
 bronze_unserved_religions.48.a: "Fund the public oath"
 bronze_unserved_religions.48.b: "Equip the city guard"
 bronze_unserved_religions.49.title: "The Royal Offering to Anahit"
 bronze_unserved_religions.49.desc: "A newly governed district disputes its obligations to the court. Temple keepers propose an offering to Anahit, honored in later Armenian tradition, while local elders ask the ruler to confirm their customary rights."
 bronze_unserved_religions.49.a: "Hold a royal temple ceremony"
 bronze_unserved_religions.49.b: "Confirm the elders' agreements"
 bronze_unserved_religions.50.title: "The King Takes Aramazd's Oath"
 bronze_unserved_religions.50.desc: "With an enemy approaching, the ruler's companions invoke Aramazd as the divine witness to a pledge of defense. Village leaders offer to guard the passes if their obligations are recognized."
 bronze_unserved_religions.50.a: "Proclaim the royal pledge"
 bronze_unserved_religions.50.b: "Entrust the passes to local guards"

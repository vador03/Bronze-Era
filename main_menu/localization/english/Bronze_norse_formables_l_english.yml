l_english:
 ASGARD_f: "Asgard"
 ASGARD_f_desc: "The sea lanes, forests and bronze halls of the north can be gathered under one high crown. Asgard is not a divine realm, but a human kingdom claiming the prestige of the Aesir's domain."
 bronze_asgard_high_kingship: "High Kingship of Asgard"
 bronze_asgard_high_kingship_desc: "The rulers of Asgard bind Nordic chiefs, cult places and sea-routes into a lasting royal order."
 bronze_asgard_remaining_claims_tt: "Gain conquest claims on the remaining Asgard locations, but no free cores."

 MIDGARD_f: "Midgard"
 MIDGARD_f_desc: "The central Swedish folklands can be gathered into a durable human kingdom under Norse rites and bronze-age law. Midgard claims the middle world as a political ideal, not as a magical realm."
 bronze_midgard_folkland_order: "Order of the Folklands"
 bronze_midgard_folkland_order_desc: "Midgard's kings bind scattered settlements, assemblies and war-bands into a more stable Swedish realm."
 bronze_midgard_remaining_claims_tt: "Gain conquest claims on the remaining Midgard locations, but no free cores."

 JOTUNHEIM_f: "Jotunheim"
 JOTUNHEIM_f_desc: "The mountains, fjords and inland valleys of Norway can be gathered into a stern human kingdom. Jotunheim draws its name from legendary highland clans, but its authority rests on Norse rites, mountain law and defended passes."
 bronze_jotunheim_mountain_clans: "Mountain Clan Holds"
 bronze_jotunheim_mountain_clans_desc: "Jotunheim's rulers bind upland halls, valley farms and fortified passes into a durable defensive realm."
 bronze_jotunheim_remaining_claims_tt: "Gain conquest claims on the remaining Jotunheim locations, but no free cores."

 VANAHEIM_f: "Vanaheim"
 VANAHEIM_f_desc: "The southern woods, island fields and cattle lands of the Norse world can be gathered into a rural human kingdom. Vanaheim honors the Vanir through cult, law and fertility rites, without claiming supernatural rule."
 bronze_vanaheim_vanir_folklands: "Vanir Folklands"
 bronze_vanaheim_vanir_folklands_desc: "Vanaheim's rulers protect fields, herds and rural assemblies, turning scattered farming lands into a durable Nordic realm."
 bronze_vanaheim_remaining_claims_tt: "Gain conquest claims on the remaining Vanaheim locations, but no free cores."

 ALFHEIM_f: "Alfheim"
 ALFHEIM_f_desc: "The Finnish coasts, lakes and forest folklands can be gathered into a human kingdom under Norse religion. Alfheim uses a sacred mythic name for a forest realm, without changing local cultures or claiming supernatural people."
 bronze_alfheim_forest_folklands: "Forest Folklands"
 bronze_alfheim_forest_folklands_desc: "Alfheim's rulers adapt Norse rites to lake routes, wooded clearings and difficult forest terrain."
 bronze_alfheim_remaining_claims_tt: "Gain conquest claims on the remaining Alfheim locations, but no free cores."

 NIDAVELLIR_f: "Nidavellir"
 NIDAVELLIR_f_desc: "The northern ore fields, river valleys and smithing settlements can be gathered into Nidavellir. Some traditions call such a realm Svartalfheim, but here the name belongs to human miners, metalworkers and legendary artisan lineages."
 bronze_nidavellir_bronze_smiths: "Bronze Smith Clans"
 bronze_nidavellir_bronze_smiths_desc: "Nidavellir protects mines, charcoal tracks and bronze workshops, strengthening copper extraction and practical craft production."
 bronze_nidavellir_remaining_claims_tt: "Gain conquest claims on the remaining Nidavellir locations, but no free cores."

 MUSPELLHEIM_f: "Muspellheim"
 MUSPELLHEIM_f_desc: "The volcanic islands and northern sea stations can be bound into Muspellheim, a human Norse kingdom shaped by harsh coasts, ash-dark soil and long supply routes. It reveals or colonizes nothing by itself."
 bronze_muspellheim_volcanic_seaways: "Volcanic Seaways"
 bronze_muspellheim_volcanic_seaways_desc: "Muspellheim's crews learn to keep ships supplied across hard northern waters and defend isolated island settlements."
 bronze_muspellheim_remaining_claims_tt: "Gain conquest claims on the remaining Muspellheim locations, but no free cores or colonies."

 NIFLHEIM_f: "Niflheim"
 NIFLHEIM_f_desc: "The cold marches of the far north can be gathered into a human Norse kingdom of mountains, mist and hard routes. Niflheim is a religious name for a northern realm, not a supernatural domain."
 bronze_niflheim_cold_marches: "Cold March Adaptation"
 bronze_niflheim_cold_marches_desc: "Niflheim's clans endure poor roads, cold lands and mountain passes while making invasion costly."
 bronze_niflheim_remaining_claims_tt: "Gain conquest claims on the remaining Niflheim locations, but no free cores."

 HELHEIM_f: "Helheim"
 HELHEIM_f_desc: "The Danish islands, straits and Jutland lands can be gathered into Helheim, a human Norse kingdom tied to burial rites, ancestor cults and guarded crossings. It has no undead or supernatural rule."
 bronze_helheim_ancestor_straits: "Ancestor Straits"
 bronze_helheim_ancestor_straits_desc: "Helheim's rulers reinforce ancestral law, ritual cohesion and the defense of islands and straits."
 bronze_helheim_remaining_claims_tt: "Gain conquest claims on the remaining Helheim locations, but no free cores."

 VINDLAND_f: "Vindland"
 VINDLAND_f_desc: "The Baltic and Finnic riverlands can be gathered into Vindland by a Norse religious realm that keeps its local culture. Amber, forests and waterways define the kingdom more than any Nordic bloodline."
 bronze_vindland_amber_waterways: "Amber Waterways"
 bronze_vindland_amber_waterways_desc: "Vindland's rulers protect amber routes, forest tracks and Baltic river crossings."
 bronze_vindland_remaining_claims_tt: "Gain conquest claims on the remaining Vindland locations, but no free cores."

 PERSIA_f: "Persian Empire"
 PERSIA_f_desc: "The strongest independent Median or Persian claimant can form an empire by controlling Abhar, Ecbatana, Persis and most of the Iranian heartland."
 bronze_formed_persian_empire: "Formed the Persian Empire"
 bronze_formed_persian_empire_desc: "This country formed the Persian Empire."

 bronze_formed_asgard: "Formed Asgard"
 bronze_formed_asgard_desc: "This country formed Asgard and now stands above the regional Nordic crowns."
 bronze_formed_norse_regional_realm: "Formed a Norse Regional Realm"
 bronze_formed_norse_regional_realm_desc: "This country formed one of the regional Norse realms and cannot form another regional Norse crown."

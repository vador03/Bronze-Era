l_english:
 be_romulus_she_wolf: "Son of the She-Wolf"
 be_romulus_she_wolf_desc: "The Romans tell of their founder's rescue by a she-wolf. The tale lends force to his claims of protection, command, and a city born from hardship."
 bronze_roman_kings.1.title: "The End of the Roman Kings"
 bronze_roman_kings.1.desc: "The reign of Tarquinius Superbus reaches its crisis. Roman tradition tells of outrage at the royal house and a decision to entrust public power to elected magistrates. The city must choose how to answer the challenge."
 bronze_roman_kings.1.a: "Establish the Republic"
 bronze_roman_kings.1.b: "Keep the kingship"

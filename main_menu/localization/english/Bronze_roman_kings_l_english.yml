l_english:
 be_romulus_she_wolf: "Son of the She-Wolf"
 be_romulus_she_wolf_desc: "The Romans tell of their founder's rescue by a she-wolf. The tale lends force to his claims of protection, command, and a city born from hardship."
 bronze_roman_kings.1.title: "The End of the Roman Kings"
 bronze_roman_kings.1.desc: "The reign of Tarquinius Superbus reaches its crisis. Roman tradition tells of outrage at the royal house and a decision to entrust public power to elected magistrates. The city must choose how to answer the challenge."
 bronze_roman_kings.1.a: "Establish the Republic"
 bronze_roman_kings.1.b: "Keep the kingship"
 bronze_roman_kings.2.title: "The Abduction of the Sabine Women"
 bronze_roman_kings.2.desc: "Rome's founders fear that their new city cannot endure without families. Their requests for marriage ties with neighboring communities have been rejected. According to Roman tradition, Romulus invites the Sabines and nearby peoples to the Consualia, then orders women seized while the guests are distracted. The captives are brought to Rome against their will. Their presence may help the city grow, but the outrage will poison relations with its neighbors."
 bronze_roman_kings.2.a: "The deed is done; Rome must face its neighbors."
 bronze_rome_sabine_households: "Households of the New City"
 bronze_rome_sabine_households_desc: "New households increase the population of Rome for a time. Their origins in a violent seizure remain a source of tension."
 bronze_rome_sabine_abductions: "Abduction at the Consualia"
 bronze_rome_sabine_abductions_desc: "Our neighbors condemn Rome's seizure of women during the festival."

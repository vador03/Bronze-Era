l_english:
  dispersion_of_authority_advance: "Dispersion of Authority"
  dispersion_of_authority_advance_desc: "Political and economic life becomes less dependent on a single center as authority spreads among towns, communities, households, and local institutions. This wider distribution of power encourages the growth of independent settlements and more locally organized economic activity."

  independent_craftsmen: "Independent Craftsmen"
  independent_craftsmen_desc: "Skilled artisans increasingly establish themselves as independent producers within growing towns, serving local markets and patrons while developing specialized traditions of craft. Their presence strengthens the economic life and productive capacity of urban communities."

  independent_smiths: "Independent Smiths"
  independent_smiths_desc: "Metalworkers increasingly practice their crafts as established urban trades, producing tools and weapons for a growing range of customers. Concentrated expertise in ironworking and other metals strengthens the productive capacity of towns and expands access to specialized implements."
  bronze_age_oppidum_advance: "Oppida"
  bronze_age_oppidum_advance_desc: "Hilltop communities strengthen their approaches with walls, gates, and defended enclosures, turning elevated settlements into places of refuge and regional authority."

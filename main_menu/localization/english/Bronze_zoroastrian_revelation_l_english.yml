l_english:
 bronze_zoroastrian_revelation: "The Revelation of Zarathustra"
 bronze_zoroastrian_revelation_desc: "Teachings attributed to Zarathustra take root among the followers of the older Iranian rites. The courts of the plateau must choose whether to welcome the new faith or defend inherited customs."
 hint_bronze_zoroastrian_revelation: "The Revelation of Zarathustra"
 hint_bronze_zoroastrian_revelation_hint_text: "Tradition places Zarathustra's birth around 660 BC; his teachings appear in the mod around 630 BC. Countries following the Iranian rites, or with at least 35% of their population following them, receive an event. Embracing Zoroastrianism gradually converts the older faithful and limits unrest. Resistance stops that automatic spread."
 bronze_zoroastrian_panel_title: "Teachings of Zarathustra"
 bronze_zoroastrian_panel_date: "Around 630 BC"
 bronze_zoroastrian_panel_goal: "A new faith"
 bronze_zoroastrian_panel_goal_value: "Ahura Mazda"
 bronze_zoroastrian_adopters_label: "Courts converted"
 bronze_zoroastrian_adopters_value: "#Y [GetSituationByKey('bronze_zoroastrian_revelation').MakeScope.GetVariable('bronze_zoroastrian_adopters').GetValue|V0]#!"
 bronze_zoroastrian_resisters_label: "Courts resisting"
 bronze_zoroastrian_resisters_value: "#Y [GetSituationByKey('bronze_zoroastrian_revelation').MakeScope.GetVariable('bronze_zoroastrian_resisters').GetValue|V0]#!"
 bronze_zoroastrian_story_card: "A changing tradition"
 bronze_zoroastrian_story_card_desc: "Tradition places Zarathustra around 660 BC, although his date remains debated. In this scenario, his first followers appear among populations practicing the Iranian rites. Each affected court decides whether to embrace or oppose the new teaching."
 bronze_zoroastrian_spread_card: "Choose and guide conversion"
 bronze_zoroastrian_spread_card_desc: "Embrace: the court and ruling family adopt Zoroastrianism. Each year, some followers of the old Iranian rites convert; tolerance and public order reduce unrest for 25 years. Resist: the country keeps its religion and stops this automatic spread. A small local community may retain the new faith."
 bronze_zoroastrian_legend_embraced: "Court embracing Zoroastrianism"
 bronze_zoroastrian_legend_resisted: "Court defending the old rites"
 bronze_zoroastrian_legend_undecided: "Affected country awaiting a decision"
 bronze_zoroastrian_gentle_transition: "Guided Religious Transition"
 bronze_zoroastrian_gentle_transition_desc: "The court protects old sanctuaries and new believers as Zarathustra's teaching spreads."
 bronze_zoroastrian_ritual_resistance: "Defence of the Old Rites"
 bronze_zoroastrian_ritual_resistance_desc: "The court preserves established rites, but opposing a teaching already present in the country creates tension."
 bronze_zoroastrian_religious_settlement: "Faith Established in the Realm"
 bronze_zoroastrian_religious_settlement_desc: "Most people now follow Zoroastrianism, allowing the court to settle provincial disputes."
 bronze_zoroastrian_relevant_text: "Follows Iranian rites or has a large population of that religion"
 bronze_zoroastrian_can_receive_teaching_text: "Can receive Zarathustra's teachings"
 bronze_zoroastrian_offer_teaching_text: "Present the teaching to affected courts"
 bronze_zoroastrian_refresh_totals_text: "Update the choices of the courts"
 bronze_zoroastrian_spread_to_iranic_pops_text: "Spread Zoroastrianism among followers of the Iranian rites"
 bronze_zoroastrian_revelation.1.title: "The Teachings of Zarathustra"
 bronze_zoroastrian_revelation.1.desc: "Preachers from Iranian communities speak of Ahura Mazda and a moral choice between truth and falsehood. Their teaching has already found a few followers among our people. The court must decide whether to recognize it or defend the rites inherited from the ancestors."
 bronze_zoroastrian_revelation.1.a: "Embrace the new faith and guide its spread."
 bronze_zoroastrian_revelation.1.b: "Oppose the teaching and defend the old rites."
 bronze_zoroastrian_revelation.2.title: "A Faith of the Majority"
 bronze_zoroastrian_revelation.2.desc: "Most of our population now follows the teachings of Zarathustra. Priests and administrators can settle the remaining conflicts of custom without force."
 bronze_zoroastrian_revelation.2.a: "Seal peace among the communities."

l_english:
  frontier_post: "Frontier Outpost"
  frontier_post_desc: "A fortified outpost established along trade routes, borderlands, and strategic crossings. Garrisoned by loyal retainers and officials, it projects authority into distant regions, safeguards commerce, and serves as a base for patrols, messengers, and local administration."

  HAS_CITY_WALLS_IN_LOC: "Has city walls (minimum Fort Level: I). Walls do not stack with a real fort."

  town_walls: "Settlement Walls"
  town_walls_desc: "Stone walls, gates, and defensive earthworks surround the settlement, providing protection against raiders and rival communities. Their construction reflects the growing permanence and prosperity of early towns."

  bronze_city_walls: "City Walls"
  bronze_city_walls_desc: "Fortifications encircle the city with imposing walls, towers, and fortified gates maintained by centralized authorities. Beyond their defensive value, these structures proclaim the wealth, power, and organizational capacity of the urban state."

  iron_city_walls: "Iron Age City Walls"
  iron_city_walls_desc: "Growing cities employ improved masonry techniques and more capable tools to construct substantial defensive circuits. Greater scale, precision, and durability reflect the accumulated knowledge of generations of builders."

  iron_citadel: "Citadel"
  iron_citadel_desc: "A fortified stronghold serving as a permanent seat of local authority and defense. Citadels provide a secure base for garrisons and officials, protecting important settlements and controlling the surrounding territory."

  hill_fort: "Hill Fort"
  hill_fort_desc: "A fortified settlement or stronghold established on elevated ground, using steep slopes and difficult approaches to strengthen its defenses. Such sites provide communities with a secure refuge and a commanding position over the surrounding countryside."

  bronze_age_oppidum: "Oppidum"
  bronze_age_oppidum_desc: "A permanently inhabited hilltop settlement defended by earthworks, timber, and stone. Its elevated position shelters the community and commands the surrounding approaches."

  # GOODS DEMAND, PRODUCTION METHODS AND MAINTENANCE

  town_walls_construction: "Settlement Walls Construction"
  town_walls_construction_desc: "Masons and laborers construct defensive walls, gates, and supporting fortifications to protect settlements from raiders and rival communities."

  bronze_city_walls_construction: "City Wall Construction"
  bronze_city_walls_construction_desc: "The construction of massive urban fortifications requires extensive masonry work, large labor forces, and careful planning to defend major population centers and seats of power."

  iron_city_walls_construction: "Iron Age City Wall Construction"

  bronze_city_walls_maintenance: "Fortification Maintenance"

  iron_citadel_maintenance: "Citadel Maintenance"
  iron_citadel_maintenance_desc: "Regular supplies of timber, masonry, weapons, and protective materials keep the stronghold defensible and its garrison equipped."

  frontier_post_maintenance: "Hill Fort Maintenance"
  frontier_post_maintenance_desc: "Timber, weapons, and protective materials are maintained for the garrison and defensive works, keeping the fortification ready for conflict."

  # CULTURE SPECIFIC

  cyclopean_walls: "Cyclopean Walls"
  cyclopean_walls_desc: "Constructed from massive stone blocks fitted without mortar, these immense fortifications surround royal citadels and palace centers. Their scale inspires awe among subjects and visitors alike, making them both formidable defenses and enduring symbols of royal power."

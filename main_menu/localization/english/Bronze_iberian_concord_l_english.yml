l_english:
 iberian_tribal_concord: "Iberian Tribal Concord"
 iberian_tribal_concord_desc: "The $iberian_tribal_concord$ is the ancient web of oaths, shared sanctuaries, trade paths and blood feuds that binds every people of the Iberian peninsula. It has no king and no council that rules over the others: every tribe is born into it and none can leave it. Its members may fight one another for pasture, cattle and honour, yet all remain part of the same world."
 iberian_concord_cannot_leave_tt: "The Iberian peoples cannot leave the Concord."
 IBERIAN_CONCORD_NATURAL_MEMBER: "Peoples of Iberia"
 cb_iberian_concord_tribal_feud: "Tribal Feud"
 cb_iberian_concord_tribal_feud_desc: "Iberian peoples settle their grievances over pastures, herds and honour by force of arms."
 diplomatic_status_iberian_tribal_concord_name: "Iberian Tribal Concord"
 diplomatic_status_iberian_tribal_concord_tooltip: "The Iberian Tribal Concord is the ancient web of oaths, shared sanctuaries, trade paths and blood feuds that binds every people of the Iberian peninsula."
 iberian_tribal_concord_list_who_tt: "Shows every sovereign tribe whose capital lies within Iberia."

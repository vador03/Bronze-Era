l_english:
 bronze_northern_frontier_settlement_advance: "Northern Frontier Settlement"
 bronze_northern_frontier_settlement_advance_desc: "Iron Age Nordic and Finnic communities can settle a discovered, unowned neighboring location in Scandinavia or Finland. Migrants leave an adjacent owned location over time. This does not unlock overseas colonization."
 bronze_begin_frontier_settlement: "Settle Neighboring Land"
 bronze_begin_frontier_settlement_desc: "Begin a 40-month settlement project in a discovered, unowned neighboring location in Scandinavia or Finland. Choose an adjacent owned location with Nordic or Finnic peasants or tribesmen as the source. A small number of its people move each month, retaining their culture and religion. Only one project can run at a time."
 bronze_cancel_frontier_settlement: "Cancel Settlement"
 bronze_cancel_frontier_settlement_desc: "End the current settlement project. Migrants who already moved remain in the destination."
 bronze_frontier_choose_target: "Choose an adjacent vacant location"
 bronze_frontier_choose_source: "Choose the neighboring source location"
 bronze_frontier_no_target: "No discovered, unowned neighboring location is available in Scandinavia or Finland."
 bronze_frontier_no_source: "No adjacent owned location has enough peasants or tribesmen of your primary culture."
 bronze_frontier_progress_label: "Settlement"
 bronze_frontier_months_label: "months left"
 bronze_frontier_progress_tip: "Migrants from the selected neighboring location settle here each month. Ownership changes only when progress reaches 100%."

 mumun_rites_ADJ: "Mumun Rites"
 mumun_rites_desc: "Village gatherings, grain stores and ancestor remembrance shape these early Korean rites; named gods for the period remain uncertain."
 austroasiatic_rites: "Austroasiatic Rites"
 austroasiatic_rites_ADJ: "Austroasiatic Rites"
 austroasiatic_rites_desc: "This broad label covers varied household, forest-edge and river customs, maintained locally rather than by one priesthood."
 khmer_rites: "Khmer Rites"
 khmer_rites_ADJ: "Khmer Rites"
 khmer_rites_desc: "Local shrine keepers, water management and emerging rulers interact in early Khmer communities; later temple traditions are not projected backward."
 austronesian_rites: "Austronesian Rites"
 austronesian_rites_ADJ: "Austronesian Rites"
 austronesian_rites_desc: "A Bronze Age religious system rooted in local temples, seasonal rites, dynastic cult, and community tradition."
 karasuk_rites: "Karasuk Rites"
 karasuk_rites_ADJ: "Karasuk Rites"
 karasuk_rites_desc: "Pastoral households mark seasonal routes and ancestral places; the exact myths of Karasuk communities are not securely known."
 puntite_rites: "Puntite Rites"
 puntite_rites_ADJ: "Puntite Rites"
 puntite_rites_desc: "Coastal and inland households connect seafaring exchange with local ceremonies; the cult names of ancient Punt are uncertain."
 cushitic_rites: "Cushitic Rites"
 cushitic_rites_ADJ: "Cushitic Rites"
 cushitic_rites_desc: "A broad grouping of locally varied pastoral and village traditions around herds, wells and kin obligations."
 nilo_saharan_rites: "Nilo-Saharan Rites"
 nilo_saharan_rites_ADJ: "Nilo-Saharan Rites"
 nilo_saharan_rites_desc: "River and inland communities observe different seasonal and ancestral customs; this label does not imply a common priesthood."
 mande_rites: "Mande Rites"
 mande_rites_ADJ: "Mande Rites"
 mande_rites_desc: "Lineage gatherings and local obligations accompany exchange routes and village life; named later traditions are not imposed on this early period."
 bantu_rites: "Bantu Rites"
 bantu_rites_ADJ: "Bantu Rites"
 bantu_rites_desc: "This umbrella term represents diverse household and ancestral practices among communities speaking Bantu languages, without a shared pantheon."
 khoisan_rites: "Khoisan Rites"
 khoisan_rites_ADJ: "Khoisan Rites"
 khoisan_rites_desc: "Local stories and obligations around water, hunting and kin differ widely between communities and are not treated as one uniform religion."
 olmec_rites: "Olmec Rites"
 olmec_rites_ADJ: "Olmec Rites"
 olmec_rites_desc: "A Bronze Age religious system rooted in local temples, seasonal rites, dynastic cult, and community tradition."
 mayan_rites: "Mayan Rites"
 mayan_rites_ADJ: "Mayan Rites"
 mayan_rites_desc: "Early Maya communities connect rain, cultivation and lineage memory through local ceremonies; later written divine names are used cautiously."
 zapotec_rites: "Zapotec Rites"
 zapotec_rites_ADJ: "Zapotec Rites"
 zapotec_rites_desc: "Oaxaca village rites and ancestral places develop alongside public ceremonies and, later, calendrical practice; no later pantheon is assumed."
 puebloan_rites: "Puebloan Rites"
 puebloan_rites_ADJ: "Puebloan Rites"
 puebloan_rites_desc: "Distinct communities organize water, household obligations and gathering places locally; this broad term does not define a single priesthood."
 andean_rites: "Andean Rites"
 andean_rites_ADJ: "Andean Rites"
 andean_rites_desc: "A Bronze Age religious system rooted in local temples, seasonal rites, dynastic cult, and community tradition."
 woodland_rites: "Woodland Rites"
 woodland_rites_ADJ: "Woodland Rites"
 woodland_rites_desc: "Regional communities give meaning to ancestral mounds, rivers, seasonal hunting and gift exchange in different local ways."
 arawak_rites: "Arawak Rites"
 arawak_rites_ADJ: "Arawak Rites"
 arawak_rites_desc: "Coastal and island households maintain local ancestral and welcoming customs alongside canoe routes and cultivation."
 tupi_rites: "Tupi Rites"
 tupi_rites_ADJ: "Tupi Rites"
 tupi_rites_desc: "This broad label covers varied riverine village, kinship and ancestral customs; it is not a single timeless Tupi pantheon."
 saqqaq_rites: "Saqqaq Rites"
 saqqaq_rites_ADJ: "Saqqaq Rites"
 saqqaq_rites_desc: "Arctic hunting households sustain local obligations toward people, animals and shore travel; their named mythology is not securely recoverable."
 lapita_rites: "Lapita Rites"
 lapita_rites_ADJ: "Lapita Rites"
 lapita_rites_desc: "A Bronze Age religious system rooted in local temples, seasonal rites, dynastic cult, and community tradition."
 papuan_rites: "Papuan Rites"
 papuan_rites_ADJ: "Papuan Rites"
 papuan_rites_desc: "Many Papuan communities maintain distinct clan, ancestral, garden and coastal exchange customs; no island-wide pantheon is implied."
 dreaming_ways: "Dreaming Ways"
 dreaming_ways_ADJ: "Dreaming Ways"
 dreaming_ways_desc: "Local ancestral journeys, custodianship and obligations to Country vary among Indigenous Australian peoples; this broad game label is not one uniform creed."

l_polish:
  # ########################
  # CURRENCY POLICIES
  # ########################
  commodity_money_policy_common: "Waluta Towarowa oparta na Plonach"
  commodity_money_policy_desc: "Wprowadzenie pieniądza towarowego w społeczeństwach Epoki Brązu umożliwiło sprawniejszy handel i dokonywanie transakcji, zastępując systemy wymiany barterowej ustandaryzowanym środkiem płatniczym. Waluta sama w sobie przedstawia wartość i może być wykorzystywana w handlu, jako środek oszczędności oraz jednostka rozrachunkowa. Polityka ta pozwala wykorzystywać plony w formie pieniądza towarowego, ułatwiając pierwsze kroki ku bardziej złożonej gospodarce i rozwojowi sieci handlowych w społeczeństwach Epoki Brązu."
  commodity_money_policy_weaponry: "Broń jako Waluta"
  commodity_money_policy_weaponry_desc: "W niektórych społeczeństwach Epoki Brązu broń była wykorzystywana jako forma waluty. Wartość broni, takiej jak miecze, włócznie czy topory, była uznawana i akceptowana w handlu oraz transakcjach gospodarczych. Praktyka ta umożliwiała wymianę dóbr i usług przy użyciu wartościowych i użytecznych przedmiotów jako środka wymiany."
  commodity_money_policy_textiles: "Tkaniny jako Waluta"
  commodity_money_policy_textiles_desc: "W niektórych społeczeństwach Epoki Brązu tkaniny były wykorzystywane jako forma waluty. Wartość tkanin, takich jak tkane materiały czy odzież, była uznawana i akceptowana w handlu oraz transakcjach gospodarczych. Praktyka ta umożliwiała wymianę dóbr i usług przy użyciu wartościowych i użytecznych przedmiotów jako środka wymiany."
  commodity_money_policy_salt: "Sól jako Waluta"
  commodity_money_policy_salt_desc: "W niektórych społeczeństwach Epoki Brązu sól była wykorzystywana jako forma waluty. Wartość soli, niezbędnej do konserwowania żywności i poprawiania jej smaku, była uznawana i akceptowana w handlu oraz transakcjach gospodarczych. Praktyka ta umożliwiała wymianę dóbr i usług przy użyciu wartościowych i użytecznych przedmiotów jako środka wymiany."
  commodity_money_policy_furs: "Futra jako Waluta"
  commodity_money_policy_furs_desc: "W niektórych społeczeństwach Epoki Brązu futra były wykorzystywane jako forma waluty. Wartość futer, niezbędnych do produkcji odzieży i zapewniania ciepła, była uznawana i akceptowana w handlu oraz transakcjach gospodarczych. Praktyka ta umożliwiała wymianę dóbr i usług przy użyciu wartościowych i użytecznych przedmiotów jako środka wymiany."
  commodity_money_policy_spices: "Przyprawy jako Waluta"
  commodity_money_policy_spices_desc: "W niektórych społeczeństwach Epoki Brązu przyprawy były wykorzystywane jako forma waluty. Wartość przypraw, niezbędnych do nadawania smaku i konserwowania żywności, była uznawana i akceptowana w handlu oraz transakcjach gospodarczych. Praktyka ta umożliwiała wymianę dóbr i usług przy użyciu wartościowych i użytecznych przedmiotów jako środka wymiany."
  commodity_money_policy_jewelry: "Biżuteria jako Waluta"
  commodity_money_policy_jewelry_desc: "W niektórych społeczeństwach Epoki Brązu biżuteria była wykorzystywana jako forma waluty. Wartość biżuterii, często wykonanej z metali szlachetnych i zdobionej kamieniami szlachetnymi, była uznawana i akceptowana w handlu oraz transakcjach gospodarczych. Praktyka ta umożliwiała wymianę dóbr i usług przy użyciu wartościowych i użytecznych przedmiotów jako środka wymiany."
  commodity_money_policy_livestock: "Żywy Inwentarz jako Waluta"
  commodity_money_policy_livestock_desc: "W niektórych społeczeństwach Epoki Brązu żywy inwentarz był wykorzystywany jako forma waluty. Wartość zwierząt hodowlanych, niezbędnych jako źródło żywności, siły roboczej i innych zasobów, była uznawana i akceptowana w handlu oraz transakcjach gospodarczych. Praktyka ta umożliwiała wymianę dóbr i usług przy użyciu wartościowych i użytecznych przedmiotów jako środka wymiany."
  commodity_money_policy_tea: "Herbata jako Waluta"
  commodity_money_policy_tea_desc: "W niektórych społeczeństwach Epoki Brązu herbata była wykorzystywana jako forma waluty. Wartość herbaty, cenionej ze względu na właściwości pobudzające i znaczenie kulturowe, była uznawana i akceptowana w handlu oraz transakcjach gospodarczych. Praktyka ta umożliwiała wymianę dóbr i usług przy użyciu wartościowych i użytecznych przedmiotów jako środka wymiany."
  gold_and_silver_coins: "Monety Złote i Srebrne"
  gold_and_silver_coins_desc: "Państwo emituje standaryzowane monety z obu metali szlachetnych, zapewniając uznane jednostki wartości na potrzeby podatków, płatności i większych transakcji."
  gold_coins: "Monety Złote"
  gold_coins_desc: "Złoto jest wybijane w standaryzowanych sztukach noszących oznaczenia władzy emitującego je państwa, zapewniając środek płatniczy o wysokiej wartości i świadcząc o kontroli władcy nad walutą z metali szlachetnych."
  silver_coins: "Monety Srebrne"
  silver_coins_desc: "Srebro jest wybijane w standaryzowanych sztukach o uznanej wadze, zapewniając praktyczny środek płatniczy do poboru podatków, handlu i dokonywania płatności, a zarazem umożliwiając państwu sprawowanie większej kontroli nad obiegiem metalu szlachetnego."
  copper_coins: "Monety Miedziane"
  copper_coins_desc: "Miedź jest formowana w standaryzowane sztuki przeznaczone do mniejszych transakcji, rozszerzając użycie monet poza sferę płatności metalami szlachetnymi i zwiększając użyteczność waluty emitowanej przez państwo w codziennej wymianie."
  bullion_coins: "Monety Bilonowe"
  bullion_coins_desc: "Srebro jest celowo stapiane z miedzią przed wybiciem w standaryzowane sztuki, pozwalając państwu zwiększyć wykorzystanie zapasów srebra przy zachowaniu wyglądu i uznanej wartości waluty z metalu szlachetnego."
  # BURIAL POLICIES
  bronze_age_burial_pits_law: "Groby Jamowe"
  bronze_age_burial_pits_law_desc: "Prawo grobów jamowych nakazuje stosowanie prostych jam grobowych do pochówku zmarłych w społeczeństwach Epoki Brązu. Praktyka ta odzwierciedla wierzenia kulturowe i normy społeczne związane ze śmiercią oraz życiem pozagrobowym, podkreślając skromniejsze podejście do pochówku w porównaniu z wystawnymi grobowcami czy mauzoleami."
  bronze_age_aristocratic_mounds_law: "Kurhany Arystokratyczne"
  bronze_age_aristocratic_mounds_law_desc: "Prawo kurhanów arystokratycznych nakazuje stosowanie okazałych kopców grobowych do pochówku zmarłych w społeczeństwach Epoki Brązu. Praktyka ta odzwierciedla wierzenia kulturowe i normy społeczne związane ze śmiercią oraz życiem pozagrobowym, podkreślając bardziej prestiżowe podejście do pochówku w porównaniu z prostymi grobami jamowymi."
  bronze_age_urnfields_law: "Pola Popielnicowe"
  bronze_age_urnfields_law_desc: "Pola popielnicowe stawały się coraz powszechniejsze w późnej Epoce Brązu, gdy społeczeństwa zwracały się ku kremacji i składaniu prochów w urnach. Prawo pól popielnicowych nakazuje wyznaczanie specjalnych obszarów przeznaczonych do pochówku zmarłych w społeczeństwach Epoki Brązu. Praktyka ta odzwierciedla wierzenia kulturowe i normy społeczne związane ze śmiercią oraz życiem pozagrobowym, podkreślając bardziej wspólnotowe podejście do pochówku w porównaniu z pojedynczymi grobami."
  bronze_age_collective_tombs_law: "Groby Zbiorowe"
  bronze_age_collective_tombs_law_desc: "Prawo grobów zbiorowych nakazuje wykorzystywanie wspólnych przestrzeni grobowych do pochówku zmarłych w społeczeństwach Epoki Brązu. Praktyka ta odzwierciedla wierzenia kulturowe i normy społeczne związane ze śmiercią oraz życiem pozagrobowym, podkreślając wspólnotowe podejście do pochówku."
  # ####################
  # SUBJECT POLICIES
  # ####################
  freeman_recognition_law: "Uznanie Wolnych"
  freeman_recognition_law_desc: "Prawo uznaje szeroką klasę ludzi wolnych, których prawa i obowiązki wynikają ze zwyczaju, a nie z posiadania ziemi, statusu gospodarstwa domowego, zadłużenia czy osobistej zależności. Choć nadal istnieją różnice majątkowe, płciowe i społeczne, uznanie prawne wykracza poza wąskie grupy uprzywilejowane."
  landed_subj_law: "Podmiotowość Ziemska"
  landed_subj_law_desc: "Pełna podmiotowość prawna przysługuje tym, którzy posiadają ziemię lub uznane prawa do jej użytkowania. Posiadanie własności stanowi podstawę statusu obywatelskiego, udziału w życiu politycznym i ochrony prawnej, podczas gdy pozbawieni ziemi cieszą się mniejszą liczbą praw i przywilejów."
  household_subj_law: "Uznanie Gospodarstwa Domowego"
  household_subj_law_desc: "To gospodarstwo domowe, a nie jednostka, jest uznawane za podstawowy podmiot prawa i zwyczaju. Prawa, obowiązki, podatki i służba są przypisywane zbiorowo poprzez jednostki rodzinne i ich uznanych zwierzchników."
  periodical_cancel_law: "Okresowe Umorzenie Długów"
  periodical_cancel_law_desc: "Władze okresowo umarzają niespłacone długi, przywracając zadłużonym gospodarstwom domowym stabilność i zapobiegając narastaniu zobowiązań, które w przeciwnym razie mogłyby zagrozić stabilności społecznej."
  indebt_servitude_law: "Służba za Długi"
  indebt_servitude_law_desc: "Dłużnicy mogą być zmuszani do świadczenia pracy lub popadania w osobistą zależność w celu spłacenia niespełnionych zobowiązań. Dług staje się tym samym ważnym źródłem siły roboczej i hierarchii społecznej."
  negotiated_payment_law: "Negocjowane Spłaty"
  negotiated_payment_law_desc: "Spory dotyczące długów są rozstrzygane poprzez negocjacje, arbitraż i kompromis między wierzycielami a dłużnikami. Elastyczne porozumienia pomagają zachować relacje gospodarcze, unikając jednocześnie poważnych zakłóceń społecznych."
  generational_debt_law: "Dług Pokoleniowy"
  generational_debt_law_desc: "Niespłacone długi mogą być dziedziczone przez potomków, wiążąc rodziny długoterminowymi zobowiązaniami, które mogą trwać przez kolejne pokolenia. System ten wzmacnia pozycję wierzycieli, utrwalając jednocześnie trwałe hierarchie społeczne i gospodarcze."
  compensation_law: "Pierwszeństwo Odszkodowania"
  compensation_law_desc: "Sądy przedkładają zadośćuczynienie nad przymus, nakazując sprawcom wynagrodzenie szkód wyrządzonych poszkodowanym. Takie rozstrzygnięcia wzmacniają prawo zwyczajowe i spójność społeczną, choć często zależą od wpływów i zasobów ugruntowanych rodów."
  punishment_law: "Pierwszeństwo Kary"
  punishment_law_desc: "Władze coraz częściej zastrzegają sobie prawo do bezpośredniego karania sprawców poprzez grzywny, kary cielesne lub inne sankcje. Egzekwowanie sprawiedliwości staje się coraz ściślej związane z władzą publiczną i utrzymywaniem porządku."
  retribution_law: "Sprawiedliwość Odwetowa"
  retribution_law_desc: "Oczekuje się, że wyrządzone krzywdy spotkają się z proporcjonalnym odwetem, czy to poprzez waśnie krwi, zemstę, czy wzajemne zobowiązania. Zwyczaje te zmniejszają potrzebę istnienia formalnych instytucji, lecz mogą osłabiać władzę centralną i utrwalać cykle konfliktów."
  mediated_sett_law: "Rozstrzygnięcie Mediowane"
  mediated_sett_law_desc: "Spory są rozwiązywane poprzez arbitraż szanowanych starszyzn, kapłanów, sędziów lub lokalnych notabli. Utrzymanie harmonii wymaga szeroko zakrojonych negocjacji i nadzoru, lecz porozumienia osiągnięte w drodze konsensusu są często trwalsze i szerzej akceptowane."
  royal_land_law: "Ziemia Królewska"
  royal_land_law_desc: "Władca rości sobie prawo do ostatecznej własności znacznej części ziem królestwa, przyznając prawa użytkowania w zamian za podatki, pracę i służbę. Takie rozwiązania wzmacniają władzę centralną, lecz wymagają rozbudowanego nadzoru i administracji."
  temple_land_law: "Posiadłości Świątynne"
  temple_land_law_desc: "Rozległe obszary ziemi zostają powierzone instytucjom religijnym, których dochody utrzymują kulty, kapłaństwo i obowiązki sakralne. Świątynie gromadzą znaczne wpływy dzięki kontroli nad bogactwem rolniczym i zależną siłą roboczą."
  household_land_law: "Własność Gospodarstw Domowych"
  household_land_law_desc: "Ziemia znajduje się przede wszystkim pod kontrolą gospodarstw domowych, rodów i lokalnych elit, które przekazują własność poprzez dziedziczenie i zwyczaj. System ten wzmacnia tradycyjne struktury społeczne i zapewnia niezawodne źródło lokalnej siły wojskowej."
  bureaucratic_land_law: "Przydział Administracyjny"
  bureaucratic_land_law_desc: "Prawa do ziemi są rozdzielane i zarządzane poprzez administracyjne nadania zamiast trwałej własności. Rozwiązania te usprawniają pobór dochodów i ograniczają powstawanie niezależnych interesów ziemiańskich, lecz wymagają rozbudowanego aparatu władzy."
  # ############################
  # ADVISOR COUNCIL POLICIES
  # ############################
  clergy_admin_policy: "Doradcy Kapłańscy"
  clergy_admin_policy_desc: "Urzędnicy religijni i funkcjonariusze świątynni zajmują ważne stanowiska w radzie władcy. Ich wiedza o rytuałach, tradycji i administracji zapewnia kapłaństwu znaczne wpływy w sprawowaniu rządów."
  noble_admin_policy: "Doradcy Szlacheccy"
  noble_admin_policy_desc: "Rządy są prowadzone przez arystokratów wojowników i czołowych posiadaczy ziemskich, których doświadczenie w wojnie, przywództwie i sprawach lokalnych czyni z nich naturalnych doradców władcy."
  burgher_admin_policy: "Doradcy Kupieccy"
  burgher_admin_policy_desc: "Kupcy, finansjerzy i urzędnicy handlowi odgrywają ważną rolę w administracji. Ich wiedza o wymianie, logistyce i handlu sprzyja rządom zwracającym szczególną uwagę na sprawy gospodarcze."
  commune_admin_policy: "Reprezentacja Wspólnotowa"
  commune_admin_policy_desc: "Starszyzny wsi, przywódcy klanów i lokalne zgromadzenia uczestniczą w sprawowaniu rządów. Ich udział zapewnia, że administracja pozostaje związana z potrzebami i zwyczajami zwykłych wspólnot."
  dynastic_admin_policy: "Dwór Dynastyczny"
  dynastic_admin_policy_desc: "Władca coraz bardziej polega na krewnych, członkach swojego dworu i osobistych poddanych zamiast na ugruntowanych instytucjach. Władza staje się coraz bardziej scentralizowana wokół rodu panującego i jego najbliższego otoczenia."
  council_of_captains: "Rada Kapitanów"
  council_of_captains_desc: "Królestwem kieruje rada doświadczonych kapitanów, których autorytet opiera się na sukcesach militarnych, sztuce żeglarskiej i lojalności ich stronników."
  # ###################
  # RECRUITMENT LAW
  # ###################
  palace_obligation: "Obowiązek Pałacowy"
  palace_obligation_desc: "Służba wojskowa jest organizowana przede wszystkim poprzez dwór władcy i zależne od niego instytucje, przy czym dwór ponosi odpowiedzialność za utrzymanie sił zbrojnych królestwa. Takie rozwiązania wzmacniają osobistą lojalność oraz pozycję ugruntowanych stronników."
  community_obligation: "Obowiązek Wspólnotowy"
  community_obligation_desc: "Służba wojskowa jest rozumiana jako obowiązek wspólnot tworzących królestwo, a od gospodarstw domowych i lokalnych grup oczekuje się dostarczania ludzi do wspólnej obrony. Takie zobowiązania sprawiają, że udział w służbie wojskowej staje się szerzej podzielaną instytucją."
  # ###################
  # OTHER POLICIES
  # ###################
  pietism_society: "Pobożne Społeczeństwo"
  pietism_society_law_desc: "Wspólnota przywiązuje wielką wagę do utrzymywania harmonii z bóstwami poprzez rytuały, ofiary i przestrzeganie obyczajów. Instytucje religijne odgrywają ważną rolę w zachowywaniu porządku społecznego, legitymizowaniu władzy i kształtowaniu tradycji ludu."
  # ########################
  # LAWS
  # ########################
  burial_law: "Prawo Pogrzebowe"
  burial_law_desc: "Prawo pogrzebowe reguluje praktyki i zwyczaje związane z pochówkiem zmarłych w społeczeństwach Epoki Brązu. Ustanawia zasady dotyczące obrzędów pogrzebowych, miejsc pochówku i traktowania zmarłych, odzwierciedlając wierzenia kulturowe oraz normy społeczne związane ze śmiercią i życiem pozagrobowym."
  subj_law: "Podmiotowość Prawna"
  subj_law_desc: "Prawa te określają, kto jest uznawany za podmiot prawny królestwa oraz na jakiej podstawie przyznawane są prawa, obowiązki, ochrona i powinności obywatelskie."
  debt_law: "Zarządzanie Długiem"
  debt_law_desc: "Prawa te regulują kwestie zadłużenia, określając prawa wierzycieli i dłużników oraz zobowiązania wynikające z niespłaconych należności. Różne podejścia równoważą stabilność społeczną, aktywność gospodarczą i interesy wpływowych grup."
  verdict_law: "Rozstrzyganie Wyroków"
  verdict_law_desc: "Starożytna sprawiedliwość rzadko ograniczała się wyłącznie do ustalenia winy. Sądy, zgromadzenia, władcy, kapłani i grupy krewniacze dążyły do przywrócenia porządku społecznego po wyrządzeniu krzywdy za pomocą różnych środków, równoważąc interesy ofiar, sprawców, potężnych rodów i całej wspólnoty."
  land_property_law: "Własność Ziemska"
  land_property_law_desc: "Prawa te określają, kto ostatecznie kontroluje ziemię uprawną i jakie obowiązki wiążą się z jej użytkowaniem. Jako podstawa bogactwa, podatków, służby wojskowej i władzy politycznej, własność ziemska leży u podstaw organizacji starożytnych społeczeństw."
  advisor_council_law: "Rada Doradców"
  advisor_council_law_desc: "Władcy rzadko rządzą samotnie. Prawa te określają, które grupy społeczne dostarczają doradców, administratorów i zaufanych powierników, kształtując priorytety i charakter rządów."
  ancient_recruitment_law: "Organizacja Rekrutacji Wojskowej"
  ancient_recruitment_law_desc: "Organizacja rekrutacji wojskowej określa sposób identyfikowania, wzywania, wyposażania i gromadzenia żołnierzy do służby. W miarę rozwoju bardziej ugruntowanych instytucji wojskowych odpowiedzialność za wystawianie sił zbrojnych staje się coraz bardziej regularną częścią sprawowania rządów."
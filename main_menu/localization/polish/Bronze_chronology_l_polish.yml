l_polish:
  bronze_era_chronology_note: "Chronologia Epoki Brązu"
  bronze_era_chronology_note_desc: "Dla zapewnienia stabilności technicznej silnik gry wykorzystuje dodatnie lata wewnętrzne. Rok wewnętrzny 1 odpowiada 1209 r. p.n.e.; rok wewnętrzny 15 odpowiada 1195 r. p.n.e.; rok wewnętrzny 1329 odpowiada 120 r. n.e. W części kampanii obejmującej lata p.n.e. rok historyczny wynosi w przybliżeniu 1210 minus rok wewnętrzny silnika."

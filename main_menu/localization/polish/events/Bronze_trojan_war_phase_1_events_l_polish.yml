l_polish:
  # Event 1: Successful Raid Outcomes
  trojan_war_raid_on_anatolia_success: "Udany najazd na Anatolię"
  trojan_war_raid_on_anatolia_success.t: "Udany najazd na Anatolię"
  trojan_war_raid_on_anatolia_success.d: "Twe siły wysłane na łupieżczą wyprawę do Anatolii powróciły zwycięsko, przywożąc zdobyczne łupy i osłabiając linie zaopatrzeniowe wroga. Morale naszych wojsk wzrosło, a siły greckie zostały zmuszone do defensywy."
  trojan_war_raid_on_anatolia_success.a: "Świętujmy zwycięstwo"
  trojan_war_raid_on_anatolia_success.b: "Zabezpieczmy łupy"

  # Event 2: Failed Raid Outcomes
  trojan_war_raid_on_anatolia_failed: "Nieudany najazd na Anatolię"
  trojan_war_raid_on_anatolia_failed.t: "Nieudany najazd na Anatolię"
  trojan_war_raid_on_anatolia_failed.d: "Twe siły wysłane na łupieżczą wyprawę do Anatolii powróciły z niczym, ponosząc ciężkie straty i nie zdoławszy zakłócić linii zaopatrzeniowych wroga. Morale naszych wojsk ucierpiało, a siły greckie nabrały odwagi."
  trojan_war_raid_on_anatolia_failed.a: "Pozostawmy ocalałych ich losowi"
  trojan_war_raid_on_anatolia_failed.b: "Zbierzmy siły, by ocalić ocalałych"

  # Event 3: Coastline Defended Outcomes
  anatolia_coastline_is_defend: "Obronione wybrzeże"
  anatolia_coastline_is_defend.t: "Obrona przed Grekami"
  anatolia_coastline_is_defend.d: "Nasza obrona została wzmocniona dzięki straży przybrzeżnej; siłom greckim będzie trudniej przeprowadzać udane najazdy na nasze nadmorskie prowincje."
  anatolia_coastline_is_defend.a: "Kontynuujmy obronę wybrzeża"


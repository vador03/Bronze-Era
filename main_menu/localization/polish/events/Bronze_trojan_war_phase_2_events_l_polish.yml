  trojan_war_phase_2_flavor_event_10.t: "Zaopatrzenie frontu w żywność"
  trojan_war_phase_2_flavor_event_10.d: "Do stolicy napłynęły prośby o dostarczenie zapasów armiom walczącym na pierwszej linii. Kupcy zaoferowali zaopatrzenie wojska w żywność, lecz za odpowiednią cenę. Możemy również sięgnąć do własnych zapasów i przekazać je armii, jednak odbije się to na naszej produkcji żywności oraz morale ludności. Co powinniśmy uczynić?"

l_polish:
  ARM: "Armenia"
  ARM_ADJ: "Ormiański"
  AZZI_HAJAS: "Azzi-Hayasa-Urartu"
  AZZI_HAJAS_ADJ: "Azzi-Hayasko-Urartyjska"
  armenian_culture: "Ormiańska"
  armenian_culture_ADJ: "Ormiański"
  armenian_pagan: "Obrzędy Ormiańskie"
  armenian_pagan_ADJ: "Ormiański"
  armenian_pagan_desc: "Górska tradycja religijna skupiona wokół świętych gór, królewskich przodków, kultów wojowników i lokalnych sanktuariów."
  BRONZE_ARMENIA_f: "Utwórz Wielkie Królestwo Armenii"
  BRONZE_ARMENIA_f_desc: "Wyżyny wokół Araratu, jeziora Wan i górnego Eufratu mogą zostać zjednoczone w nowe królestwo ormiańskie, łączące dawne tradycje Hayasy, Urartu i Kaukazu pod panowaniem jednego rodu królewskiego."
  bronze_azzi_hayasa_unify_confederation: "Zjednocz Konfederację Wyżynną"
  bronze_azzi_hayasa_unify_confederation_desc: "Zintegruj młodszych partnerów związku wyżynnego w jedną konfederację ormiańską, łączącą Azzi, Hayasę i Urartu."
  bronze_azzi_hayasa_unify_tt: "Partnerzy związku zostają zintegrowani. Nasze państwo przyjmuje ormiańską tożsamość, a społeczności urartyjskie na całej mapie przyjmują kulturę ormiańską."
  bronze_armenia_urartian_conversion_tt: "Społeczności urartyjskie na całej mapie przyjmują kulturę ormiańską."
  bronze_azzi_hayasa_confederation: "Konfederacja Azzi-Hayasa"
  bronze_azzi_hayasa_confederation_desc: "Wyżynne rody Azzi, Hayasy i Urartu zostały połączone w jedną konfederację, wzmacniając królewską kontrolę nad Wyżyną Ormiańską."
  bronze_armenia_foundation: "Wielka Monarchia Ormiańska"
  bronze_armenia_foundation_desc: "Ród królewski rości sobie władzę nad Wyżyną Ormiańską oraz górskimi szlakami łączącymi Anatolię, Kaukaz i Mezopotamię."
  bronze_yerevan_foundation_site: "Królewska Fundacja w Erywaniu"
  bronze_yerevan_foundation_site_desc: "Nowe mury, spichlerze i pałacowe warsztaty czynią Erywań królewskim centrum Wyżyny Ormiańskiej."
  bronze_armenia.1.title: "Fundacja Erywania"
  bronze_armenia.1.desc: "Górzyste ziemie wokół Erywania stały się naturalnym miejscem spotkań wyżynnych wodzów, skrybów i drużyn wojowników. Dysponując wystarczającym skarbcem królewskim, osadę można rozbudować w ufortyfikowane miasto i ośrodek pałacowy, zapewniając Wyżynie Ormiańskiej trwałe centrum polityczne."
  bronze_armenia.1.a: "Wznieśmy mury i pałac."
  bronze_yerevan_foundation_1a_tt: "Wydaj #negative_value 200#! złota. Erywań stanie się miastem, zyska Mury Miejskie oraz Kompleks Pałacowy, a nasze państwo przyjmie nazwę Armenia. Zyskamy #positive_value 10#! Stabilności, #positive_value 20#! Legitymizacji oraz #positive_value 20#! Prestiżu."

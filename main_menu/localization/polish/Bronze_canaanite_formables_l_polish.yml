l_polish:
  ISRAEL_f: "Izrael"
  ISRAEL_f_desc: "Górskie miasta Safed, Sychem, Jaffa i Irbid mogą zostać zjednoczone w królestwo kananejskie, gdy tylko zostanie zrzucone obce zwierzchnictwo."
  JUDAH_f: "Juda"
  JUDAH_f_desc: "Jerozolima, Hebron i Beer Szewa mogą zostać zjednoczone w południowe królestwo wzgórz, zakorzenione w kananejskich obrzędach i miejscowej władzy królewskiej."
  MOAB_f: "Moab"
  MOAB_f_desc: "Madaba i Karak mogą zostać połączone w królestwo Moabu — niewielką koronę Zajordania kontrolującą szlaki na wschód od Morza Martwego."
  EDOM_f: "Edom"
  EDOM_f_desc: "Sughar, Shoubak i Maan mogą zostać zjednoczone w Edom — górskie królestwo południowych rubieży, szlaków karawanowych i ufortyfikowanych wyżyn."
  ARDAM_f: "Aram-Damaszek"
  ARDAM_f_desc: "Oazy, równiny i szlaki wokół Damaszku mogą zostać zjednoczone w aramejskie królestwo skupione wokół królewskiego miasta Damaszku."
  AMMON_f: "Ammon"
  AMMON_f_desc: "Amman i Bosra mogą zostać zjednoczone w Ammon — królestwo wzgórz kontrolujące wschodnie podejścia do Kanaanu."
  PHILST_f: "Państwa Filistyńskie"
  PHILST_f_desc: "Gaza i Majdal mogą zostać połączone w nadmorskie królestwo Peleset, wykorzystujące handel morski, tradycje łupieżcze i ufortyfikowane porty do dominacji nad południowym wybrzeżem."
  PHO_f: "Fenicja"
  PHO_f_desc: "Fenickie królestwa portowe Sydonu, Byblos, Beritu i Arwadu mogą zostać połączone z Akshaph w morskie królestwo purpury, cedrowych okrętów i handlu na wschodnich morzach."
  bronze_canaanite_kingdom_foundation: "Fundament Królestwa Kananejskiego"
  bronze_canaanite_kingdom_foundation_desc: "To królestwo zjednoczyło swoje lokalne ziemie miejskie pod trwałą kananejską koroną. Liczebność pospolitego ruszenia, prawowitość władzy i kontrola lokalna ulegają niewielkiej poprawie."
  bronze_philistine_maritime_states: "Morskie Państwa Peleset"
  bronze_philistine_maritime_states_desc: "Filistyńskie miasta organizują okręty, porty i nadbrzeżne warsztaty, tworząc silniejszą gospodarkę morską."
  bronze_phoenician_maritime_kingdom: "Fenickie Królestwo Morskie"
  bronze_phoenician_maritime_kingdom_desc: "Fenickie miasta koordynują porty, szlaki drewna, warsztaty farbiarskie i załogi okrętów, tworząc potężniejszą handlową siłę morską."
  bronze_phoenician_merchant_republic: "Rada Portów"
  bronze_phoenician_merchant_republic_desc: "Rody kupieckie, skarbce świątynne i starszyzna portowa kierują nowym państwem fenickim poprzez zgromadzenia obywatelskie i patronat handlowy."
  bronze_phoenician_royal_thalassocracy: "Królewska Talassokracja"
  bronze_phoenician_royal_thalassocracy_desc: "Królewski ród obejmuje władzę nad fenickimi portami, łącząc okręty, pospolite ruszenie i dynastyczną prawowitość pod jedną morską koroną."
  bronze_formed_canaanite_kingdom: "Utworzono Królestwo Kananejskie"
  bronze_formed_canaanite_kingdom_desc: "To państwo utworzyło jedno z regionalnych królestw kananejskich."
  bronze_formed_philistine_states: "Utworzono Państwa Filistyńskie"
  bronze_formed_philistine_states_desc: "To państwo utworzyło Państwa Filistyńskie."
  bronze_formed_phoenicia: "Utworzono Fenicję"
  bronze_formed_phoenicia_desc: "To państwo zjednoczyło fenickie królestwa miejskie."
  bronze_phoenicia.1.title: "Porty Decydują"
  bronze_phoenicia.1.desc: "Sydon, Byblos, Berit, Arwad i Akshaph odpowiadają teraz przed jedną fenicką władzą. Porty są bogate, lecz nowe królestwo musi zdecydować, czy władza powinna spocząć w rękach królewskiego rodu, czy też rad kupieckich, skarbców świątynnych i starszyzny portowej."
  bronze_phoenicia.1.a: "Niech rządzą rady portowe."
  bronze_phoenicia.1.b: "Wznieśmy króla nad wybrzeżem purpury."
  bronze_phoenicia_1a_tt: "Fenicja staje się republiką i zyskuje stały, niewielki bonus do tradycji republikańskiej, inwestycji w stabilność oraz szybkości budowy."
  bronze_phoenicia_1b_tt: "Fenicja pozostaje monarchią i zyskuje stały, niewielki bonus do prawowitości władzy, pospolitego ruszenia oraz morale wojsk lądowych."
  MACED_f: "Macedonia"
  MACED_f_desc: "Północnogreckie i paeońskie pogranicza mogą zostać zjednoczone w Macedonię po rozpoczęciu epoki żelaza, zastępując rozproszone lokalne władze królewskim państwem wojskowym."
  THESS_f: "Tesalia"
  THESS_f_desc: "Tesalska równina i jej porty mogą zostać zjednoczone w księstwo, gdy epoka żelaza otworzy nowe formy polityczne wykraczające poza porządek epoki pałacowej."
  MOLSI_f: "Molossia"
  MOLSI_f_desc: "Wyżyny i zachodnie doliny Epiru mogą zostać zjednoczone w molosskie królestwo pod panowaniem hellenistycznego rodu królewskiego."
  bronze_macedonian_iron_kingship: "Macedońska Monarchia Żelazna"
  bronze_macedonian_iron_kingship_desc: "Nowa macedońska monarchia łączy pospolite ruszenie z wyżyn, królewskich towarzyszy i ufortyfikowane przełęcze pod trwalszą koroną wojskową."
  bronze_thessalian_duchy: "Tesalscy Władcy Koni"
  bronze_thessalian_duchy_desc: "Tesalskie równiny sprzyjają hodowli koni, lokalnemu pospolitemu ruszeniu i arystokratycznemu prestiżowi skupionemu wokół Larisy."
  bronze_molossian_highland_kingship: "Molosska Monarchia Wyżynna"
  bronze_molossian_highland_kingship_desc: "Molosska korona opiera się na bronionych dolinach, wojownikach z wyżyn i hellenistycznym rodzie królewskim."
  bronze_formed_greek_iron_realm: "Utworzono Greckie Królestwo Epoki Żelaza"
  bronze_formed_greek_iron_realm_desc: "To państwo utworzyło regionalne greckie królestwo po upadku pałacowego porządku epoki brązu."
  MHELL_f: "Hi Megáli Hellás"
  MHELL_f_desc: "Greckie miasta i nadmorskie królestwa zachodnich mórz mogą zostać zjednoczone w większe królestwo helleńskie po rozpoczęciu epoki żelaza."
  bronze_megale_hellas_kinship: "Zachodnia Wspólnota Helleńska"
  bronze_megale_hellas_kinship_desc: "To państwo cieszy się szacunkiem za zjednoczenie zachodnich Greków w Hi Megáli Hellás."
  bronze_formed_megale_hellas: "Utworzono Hi Megáli Hellás"
  bronze_formed_megale_hellas_desc: "To państwo utworzyło Hi Megáli Hellás."
  HIBR_f: "Hibernia"
  CPLN_f: "Niziny Centralne"

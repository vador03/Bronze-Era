l_polish:
  mycenaean_league: "Liga Mykeńska"
  mycenaean_league_desc: "$mycenaean_league$ jest luźnym porządkiem hegemonicznym achajskich królestw pałacowych. Jej Wielki Wanaks jest pierwszym wśród rywalizujących władców, a nie absolutnym cesarzem, wiążąc pałace poprzez prestiż, daniny, sanktuaria i przysięgi wojenne.\n\nObecna Jedność Achajska: #Y [GetUniqueInternationalOrganization('mycenaean_league').MakeScope.GetVariable('mycenaean_league_authority').GetValue|V0]#! /100"
  MYCENAEAN_LEAGUE_LEADER_MALE: "Wielki Wanaks"
  MYCENAEAN_LEAGUE_LEADER_MALE.long: "Wielki Wanaks Achajów"
  MYCENAEAN_LEAGUE_LEADER_MALE.short: "Wanaks"
  MYCENAEAN_LEAGUE_LEADER_FEMALE: "Wielka Wanassa"
  MYCENAEAN_LEAGUE_LEADER_FEMALE.long: "Wielka Wanassa Achajów"
  MYCENAEAN_LEAGUE_LEADER_FEMALE.short: "Wanassa"
  MYCENAEAN_LEAGUE_AUTHORITY_DISPLAY: "$VAL$"
  change_mycenaean_league_authority_text: "$VALUE|+=2$ $mycenaean_league_authority$"
  current_mycenaean_league_authority_text: "$mycenaean_league_authority$ wynosi co najmniej $VALUE|0$"
  mycenaean_league_authority: "Jedność Achajska"
  mycenaean_league_authority_desc: "Jedność Achajska mierzy prestiż Wielkiego Wanaksa, spójność dyplomacji pałacowej, wspólną legitymizację sanktuariów oraz gotowość królestw achajskich do walki jako jedno."
  high_wanax: "Wielki Wanaks"
  high_wanax_desc: "Władca uznawany za pierwszego wśród achajskich królów pałacowych."
  great_palace_candidate: "Wielki Pałac"
  great_palace_candidate_desc: "Znaczące królestwo pałacowe o silnych roszczeniach do przewodzenia światu achajskiemu."
  palace_candidate: "Rywalizujący Pałac"
  palace_candidate_desc: "Cieszące się szacunkiem królestwo pałacowe, zdolne rzucić wyzwanie hegemonii, gdy wielkie ośrodki słabną."
  palace_kingdom: "Królestwo Pałacowe"
  palace_kingdom_desc: "Członkowskie wanakstwo achajskiej sieci pałacowej."
  sanctuary_patron: "Patron Sanktuarium"
  sanctuary_patron_desc: "Królestwo, którego władca czerpie autorytet z ofiar, świąt i poparcia kapłanów w wielkich sanktuariach."
  island_wanaxate: "Wyspiarskie Wanakstwo"
  island_wanaxate_desc: "Morskie królestwo pałacowe związane z ligą poprzez okręty, handel i dyplomację egejską."
  mycenaean_palace_tribute: "Danina Pałacowa"
  mycenaean_palace_tribute_desc: "Miesięczne dostawy brązu, zboża, tkanin i bogactw przesyłane z pomniejszych pałaców do Wielkiego Wanaksa. Każdy członek płaci stosownie do dochodów pałacu i zgromadzonego skarbca."
  mycenaean_palace_tribute_price: "Danina Pałacowa"
  MYCENAEAN_LEAGUE_TRIBUTE_BASE: "Podstawa daniny pałacowej"
  MYCENAEAN_LEAGUE_TRIBUTE_SHARE: "Bogactwo pałacu"
  MYCENAEAN_LEAGUE_TRIBUTE_STORED_WEALTH: "Zgromadzony skarbiec"
  MYCENAEAN_LEAGUE_HIGH_WANAX_SHARE: "Wielki Wanaks"
  MYCENAEAN_LEAGUE_PALACE_WEALTH: "Bogactwo pałacu"
  MYCENAEAN_LEAGUE_PALACE_HOUSE: "Ród pałacowy"
  MYCENAEAN_LEAGUE_PALACE_HOUSE_TRIBUTE: "Należności rodu pałacowego"
  MYCENAEAN_LEAGUE_GREAT_PALACE: "Pretendent Wielkiego Pałacu"
  MYCENAEAN_LEAGUE_SECONDARY_PALACE: "Pretendent Rywalizującego Pałacu"
  MYCENAEAN_LEAGUE_SANCTUARY_INFLUENCE: "Wpływy sanktuarium"
  MYCENAEAN_LEAGUE_ISLAND_DISTANCE: "Odległość wyspiarska"
  MYCENAEAN_LEAGUE_MARITIME_WEALTH: "Bogactwo morskie"
  MYCENAEAN_LEAGUE_INTERNAL_PEACE: "Pokój między pałacami"
  MYCENAEAN_LEAGUE_MEMBER_NETWORK: "Sieć pałacowa"
  MYCENAEAN_LEAGUE_NO_HIGH_WANAX: "Brak Wielkiego Wanaksa"
  MYCENAEAN_LEAGUE_HIGH_WANAX_AT_WAR: "Wielki Wanaks na wojnie"
  MYCENAEAN_LEAGUE_FRAGMENTED_PALACES: "Rozbite pałace"
  MYCENAEAN_LEAGUE_SHARED_CULTURE: "Wspólna kultura achajska"
  MYCENAEAN_LEAGUE_WANTS_PALACE_NETWORK: "Sieć pałacowa"
  MYCENAEAN_LEAGUE_MEMBER_AUTONOMY: "Autonomia pałaców"
  MYCENAEAN_LEAGUE_BALANCED_HEGEMONY: "Zrównoważona hegemonia"
  wanaxate_hegemony: "Hegemonia Wanakstw"
  wanaxate_hegemony_desc: "Określa, jak wielką władzę najsilniejszy pałac może sprawować nad pozostałymi wanakstwami achajskimi."
  equal_palaces_policy: "Równe Pałace"
  equal_palaces_policy_desc: "Pałace uznają wspólne zwyczaje, lecz odrzucają silnego hegemona."
  recognized_high_wanax_policy: "Uznany Wielki Wanaks"
  recognized_high_wanax_policy_desc: "Jeden władca zostaje uznany za pierwszego wśród równych, mogąc rozstrzygać spory i przemawiać w imieniu Achajów."
  great_wanax_policy: "Wielkie Wanakstwo"
  great_wanax_policy_desc: "Wiodący pałac rości sobie prawo do silniejszej ceremonialnej i wojskowej zwierzchności nad ligą."
  palace_tribute_law: "Danina Pałacowa"
  palace_tribute_law_desc: "Reguluje dary, daniny i kontyngenty należne Wielkiemu Wanaksowi, w tym miesięczne płatności zależne od dochodów i skarbca każdego pałacu."
  gift_exchange_policy: "Wymiana Darów"
  gift_exchange_policy_desc: "Dary prestiżowe krążą między pałacami bez formalnego systemu danin."
  bronze_tribute_policy: "Danina Brązowa"
  bronze_tribute_policy_desc: "Członkowskie pałace płacą Wielkiemu Wanaksowi miesięczną daninę zależną od ich dochodów i zgromadzonego skarbca."
  palace_levies_policy: "Kontyngenty Pałacowe"
  palace_levies_policy_desc: "Wielki Wanaks może żądać większych zasobów i siły ludzkiej na potrzeby kampanii ligi."
  sanctuary_legitimacy_law: "Legitymizacja Sanktuariów"
  sanctuary_legitimacy_law_desc: "Reguluje, w jaki sposób ofiary, święta i kapłaństwa wspierają autorytet ligi."
  local_sanctuaries_policy: "Lokalne Sanktuaria"
  local_sanctuaries_policy_desc: "Każdy pałac utrzymuje własny kalendarz świąt i obrzędów."
  shared_festivals_policy: "Wspólne Święta"
  shared_festivals_policy_desc: "Wspólne święta i ofiary wzmacniają tożsamość achajską."
  divine_omens_policy: "Boskie Znaki"
  divine_omens_policy_desc: "Wielki Wanaks umacnia swoją legitymizację poprzez kapłańskie wróżby i przywództwo ceremonialne."
  war_council_law: "Rada Wojenna"
  war_council_law_desc: "Określa, czy królestwa achajskie walczą osobno, na mocy przysięgi, czy też w wyprawach panachajskich."
  local_war_bands_policy: "Lokalne Drużyny Wojenne"
  local_war_bands_policy_desc: "Członkowie preferują lokalne kampanie i jedynie luźno koordynują obronę."
  palace_oaths_policy: "Przysięgi Pałacowe"
  palace_oaths_policy_desc: "Przysięgi między pałacami pozwalają Wielkiemu Wanaksowi organizować koalicje obronne."
  pan_achaean_campaign_policy: "Wyprawa Panachajska"
  pan_achaean_campaign_policy_desc: "Liga może zgromadzić wielką wyprawę, gdy Jedność Achajska jest wysoka."
  wanax_title: "Wanaks"
  lawagetas_title: "Lawagetas"
  mycenaean_league_name_achaean_league: "Liga Achajska"
  mycenaean_league_name_league_of_achaeans: "Liga Achajów"
  mycenaean_league_name_kingdoms_of_achaeans: "Królestwa Achajów"
  mycenaean_league_name_great_wanaxate: "Wielkie Wanakstwo"
  mycenaean_league_name_achaean_hegemony: "Hegemonia Achajska"
  mycenaean_league_title_great_wanax: "Wielki Wanaks"
  mycenaean_league_title_king_of_kings: "Król Królów Achajów"
  mycenaean_league.1.title: "Rada w Megaronie"
  mycenaean_league.1.desc: "Posłańcy z achajskich pałaców gromadzą się przed paleniskiem megaronu. Księgi rachunkowe, przysięgi i dary z brązu zostają złożone przed Wielkim Wanaksem, a pałacowi skrybowie przygotowują nowe rozliczenie lojalności."
  mycenaean_league.1.a: "Związać pałace przysięgą."
  mycenaean_league.1.b: "Przyjąć dary i unikać nacisku."
  mycenaean_league.2.title: "Znaki w Sanktuarium"
  mycenaean_league.2.desc: "Kapłani odczytują dym, wnętrzności ofiar i szepty zgromadzonych możnych. Bogowie mogą sprzyjać zjednoczonej wyprawie, lecz każdy pałac interpretuje znak przez pryzmat własnych ambicji."
  mycenaean_league.2.a: "Podzielić się ofiarą."
  mycenaean_league.2.b: "Niech każdy pałac zważa na własnych bogów."
  mycenaean_league.10.title: "Rywalizacja Pałaców"
  mycenaean_league.10.desc: "Spór graniczny, roszczenie małżeńskie lub zniewaga podczas uczty zwróciły jeden pałac przeciwko drugiemu. Spór zagraża kruchemu prestiżowi Wielkiego Wanaksa."
  mycenaean_league.10.a: "Niech rywalizacja rozstrzygnie sprawę."
  mycenaean_league.10.b: "Wysłać dary, by zażegnać spór."
  mycenaean_league.100.title: "Pałace Płoną"
  mycenaean_league.100.desc: "Szlaki handlowe zawodzą, magazyny pustoszeją, a uchodźcy mówią o najeźdźcach, głodzie i ogniu. Jeśli Wielki Wanaks nie zdoła przywrócić zaufania, liga pałaców może pogrążyć się w mroku następującym po epoce brązu."
  mycenaean_league.100.a: "Przysięgi się rozpadają."
  mycenaean_league.100.b: "Wydać to, co pozostało, by utrzymać pałace razem."
  MYCENAEAN_LEAGUE_MEGARON_COUNCIL: "Rada w megaronie"
  MYCENAEAN_LEAGUE_SHARED_SACRIFICE: "Wspólna ofiara"
  MYCENAEAN_LEAGUE_LINEAR_B: "Administracja Linear B"
  MYCENAEAN_LEAGUE_PAN_ACHAEAN_EXPEDITION: "Wyprawa panachajska"
  MYCENAEAN_LEAGUE_RIVAL_CLAIMANT: "Rywalizujący pretendent do tytułu Wanaksa"
  MYCENAEAN_LEAGUE_FORCED_TRIBUTE: "Wymuszona danina"
  MYCENAEAN_LEAGUE_MEDIATED_RIVALRIES: "Zażegnane rywalizacje"
  MYCENAEAN_LEAGUE_PALACES_BURNING: "Płonące pałace"
  MYCENAEAN_LEAGUE_COLLAPSE_PRESSURE: "Presja rozpadu"
  MYCENAEAN_LEAGUE_FRAGMENTATION_CRISIS: "Rozpad Mykeński"
  MYCENAEAN_LEAGUE_PALACE_INFLUENCE: "Wpływy pałacowe"
  mycenaean_league_current_authority_tt: "Obecna Jedność Achajska: #Y [GetUniqueInternationalOrganization('mycenaean_league').MakeScope.GetVariable('mycenaean_league_authority').GetValue|V0]#! /100"
  mycenaean_call_megaron_council: "Zwołaj Radę w Megaronie"
  mycenaean_call_megaron_council_desc: "Zwołaj achajskich władców, skrybów, kapłanów i lawagetasów przed palenisko Wielkiego Wanaksa. Przysięgi i dary podnoszą Jedność Achajską, lecz rody szlacheckie niechętnie znoszą zbyt ścisłe więzy."
  mycenaean_call_megaron_council_price: "Rada w Megaronie"
  mycenaean_call_megaron_council_tt: "#G +6#! Jedności Achajskiej. Dodaje modyfikator #Y Rada w Megaronie#! na 5 lat. Możni tracą zadowolenie; duchowieństwo zyskuje zadowolenie."
  mycenaean_sponsor_shared_sacrifice: "Sponsoruj Wspólną Ofiarę"
  mycenaean_sponsor_shared_sacrifice_desc: "Opłać wspólne ofiary i uczty w wielkim sanktuarium. Kapłaństwo wspiera ligę, lecz zapasy i towary handlowe zostają zużyte podczas ceremonii."
  mycenaean_sponsor_shared_sacrifice_price: "Wspólna Ofiara"
  mycenaean_sponsor_shared_sacrifice_tt: "#G +4#! Jedności Achajskiej. Dodaje modyfikator #Y Wspólna Ofiara#! na 4 lata. Duchowieństwo zyskuje zadowolenie; mieszczanie tracą zadowolenie."
  mycenaean_send_linear_b_administrators: "Wyślij Administratorów Linear B"
  mycenaean_send_linear_b_administrators_desc: "Wyślij skrybów i strażników tabliczek, by policzyli zboże, brąz, wełnę i zobowiązania kontyngentowe. Kontrola pałacu się poprawia, lecz chłopi odczują ciężar ewidencji."
  mycenaean_send_linear_b_administrators_price: "Administratorzy Linear B"
  mycenaean_send_linear_b_administrators_tt: "#G +3#! Jedności Achajskiej. Dodaje modyfikator #Y Administracja Linear B#! na 5 lat. Kontrola i produkcja się poprawiają, lecz chłopi tracą zadowolenie."
  mycenaean_mediate_palace_rivalry: "Pośrednicz w Rywalizacji Pałaców"
  mycenaean_mediate_palace_rivalry_desc: "Wyślij dary, zorganizuj przysięgi i zmusić rywalizujące wanakstwa do rozstrzygnięcia sporu, zanim rozerwie on spójność ligi."
  mycenaean_mediate_palace_rivalry_price: "Mediacja Pałacowa"
  mycenaean_mediate_palace_rivalry_tt: "#G +5#! Jedności Achajskiej. Dodaje modyfikator #Y Mediacja Pałacowa#! na 4 lata. Możni tracą zadowolenie."
  mycenaean_demand_bronze_tribute: "Wyegzekwuj Daninę Pałacową"
  mycenaean_demand_bronze_tribute_desc: "Zażądaj od sieci pałacowej brązu, zboża, tkanin i rzemieślników. Wielki Wanaks zyskuje krótkoterminową siłę, lecz jedność cierpi."
  mycenaean_demand_bronze_tribute_price: "Żądanie Daniny Pałacowej"
  mycenaean_demand_bronze_tribute_tt: "#R -5#! Jedności Achajskiej. Dodaje modyfikator #Y Żądanie Daniny Pałacowej#! na 5 lat. Produkcja i import wzrastają, lecz chłopi i mieszczanie tracą zadowolenie."
  mycenaean_summon_palace_levies: "Powołaj Kontyngenty Pałacowe"
  mycenaean_summon_palace_levies_desc: "Wezwij rolników, drużynników i załogi rydwanów do służby pod Wielkim Wanaksem. Liga zyskuje ludzi, lecz gospodarstwa i warsztaty cierpią."
  mycenaean_summon_palace_levies_price: "Kontyngenty Pałacowe"
  mycenaean_summon_palace_levies_tt: "#R -8#! Jedności Achajskiej. Dodaje modyfikator #Y Powołane Kontyngenty Pałacowe#! na 4 lata. Wielkość kontyngentów i obrona wzrastają, lecz wzrost populacji, produkcja i zadowolenie spadają."
  mycenaean_proclaim_pan_achaean_expedition: "Ogłoś Wyprawę Panachajską"
  mycenaean_proclaim_pan_achaean_expedition_desc: "Zgromadź okręty, rydwany i wojowników związanych przysięgą na heroiczną wyprawę pod wodzą Wielkiego Wanaksa. Możliwa jest chwała, lecz koszt będzie ogromny."
  mycenaean_proclaim_pan_achaean_expedition_price: "Wyprawa Panachajska"
  mycenaean_proclaim_pan_achaean_expedition_tt: "#R -12#! Jedności Achajskiej. Dodaje modyfikator #Y Wyprawa Panachajska#! na 6 lat. Armie i floty zyskują na sile, podczas gdy zapasy żywności i import zostają nadwyrężone."
  mycenaean_fortify_megara: "Ufortyfikuj Megarę"
  mycenaean_fortify_megara_desc: "Wzmocnij mury pałacu, spichlerze i dziedzińce schronienia. Chroni to królestwo, lecz kieruje uwagę do wewnątrz i osłabia wspólne zaufanie Achajów."
  mycenaean_fortify_megara_price: "Ufortyfikowanie Megary"
  mycenaean_fortify_megara_tt: "#R -2#! Jedności Achajskiej. Dodaje modyfikator #Y Ufortyfikowana Megara#! na 6 lat. Obrona i kontrola wzrastają, podczas gdy rozwój i żywność cierpią."
  mycenaean_megaron_council_modifier: "Rada w Megaronie"
  mycenaean_megaron_council_modifier_desc: "Pałac gościł ostatnio radę achajskich władców i świadków przysiąg."
  mycenaean_shared_sacrifice_modifier: "Wspólna Ofiara"
  mycenaean_shared_sacrifice_modifier_desc: "Wspólne obrzędy wiążą pałace poprzez prestiż sanktuarium i aprobatę kapłanów."
  mycenaean_linear_b_administration_modifier: "Administracja Linear B"
  mycenaean_linear_b_administration_modifier_desc: "Pałacowi skrybowie zacieśniają kontrolę poprzez tabliczki, inwentarze i rejestry kontyngentów."
  mycenaean_palace_mediation_modifier: "Mediacja Pałacowa"
  mycenaean_palace_mediation_modifier_desc: "Wielki Wanaks pośredniczył ostatnio w sporze między rywalizującymi rodami pałacowymi."
  mycenaean_rival_claimant_modifier: "Rywalizujący Pretendent do Tytułu Wanaksa"
  mycenaean_rival_claimant_modifier_desc: "Ten pałac otwarcie gromadzi prestiż, przygotowując przyszłe roszczenia do hegemonii achajskiej."
  mycenaean_bronze_tribute_demand_modifier: "Żądanie Daniny z Brązu"
  mycenaean_bronze_tribute_demand_modifier_desc: "Gospodarka pałacowa agresywnie ściąga daniny, tworząc bogactwo i budząc niezadowolenie."
  mycenaean_palace_levies_mustered_modifier: "Powołane Kontyngenty Pałacowe"
  mycenaean_palace_levies_mustered_modifier_desc: "Kontyngenty pałacowe zostały wyciągnięte z pól i warsztatów do służby wojskowej w lidze."
  mycenaean_pan_achaean_expedition_modifier: "Wyprawa Panachajska"
  mycenaean_pan_achaean_expedition_modifier_desc: "Pałace zaangażowały się w wielką heroiczną kampanię, wraz z całą jej chwałą i kosztami."
  mycenaean_fortified_megara_modifier: "Ufortyfikowana Megara"
  mycenaean_fortified_megara_modifier_desc: "Ośrodki pałacowe są ufortyfikowane, magazyny strzeżone, a dziedzińce schronienia przygotowane."
  mycenaean_palaces_burning_modifier: "Płonące Pałace"
  mycenaean_palaces_burning_modifier_desc: "Porządek pałacowy upada, gdy ogień, głód, uchodźcy i lokalne bunty rozrywają stary system."
  mycenaean_league.20.title: "Tabliczki Daniny"
  mycenaean_league.20.desc: "Wielki Wanaks żąda brązu, zboża i tkanin zapisanych na świeżych tabliczkach. Lokalni starsi ostrzegają, że wioski już cierpią na niedostatek."
  mycenaean_league.20.a: "Wyślijcie daninę."
  mycenaean_league.20.b: "Ukryjcie to, czego skrybowie nie zdołają policzyć."
  mycenaean_league.30.title: "Lawagetas Żądają Wojny"
  mycenaean_league.30.desc: "Przywódcy wojenni gromadzą się w megaronie, naciskając na Wielkiego Wanaksa, by dowiódł swej wyższości czynem. Odmowa może wyglądać na słabość."
  mycenaean_league.30.a: "Wezwijcie rejestry kontyngentów."
  mycenaean_league.30.b: "Opóźnijcie kampanię."
  mycenaean_league.40.title: "Roszczenie do Wielkiego Tronu"
  mycenaean_league.40.desc: "Rywalizujący wanaks chełpi się, że bogowie i wojownicy sprzyjają jego pałacowi. Jego dary, małżeństwa i zgromadzenia rydwanów rzucają teraz wyzwanie istniejącemu porządkowi."
  mycenaean_league.40.a: "Poprzyjmy nasze roszczenie."
  mycenaean_league.40.b: "Uszanujmy obecny porządek."
  mycenaean_league.50.title: "Święto Achajów"
  mycenaean_league.50.desc: "Możni, kapłani i śpiewacy gromadzą się we wspólnym sanktuarium. Uczta może związać pałace, lecz władca może zachować najwspanialsze dary dla własnego rodu."
  mycenaean_league.50.a: "Niech wszystkie pałace uczestniczą w obrzędzie."
  mycenaean_league.50.b: "Uprzywilejować własny ród."
  mycenaean_league.60.title: "Tabliczki Się Przelewają"
  mycenaean_league.60.desc: "Pałacowe archiwa pęcznieją od spisów wełny, brązu, robotnic, okrętów i zboża. Więcej skrybów mogłoby wzmocnić ligę, choć wieś odczuje tego skutki."
  mycenaean_league.60.a: "Wyślijcie skrybów."
  mycenaean_league.60.b: "Pozostawcie wioski w spokoju."
  mycenaean_league.70.title: "Ziemia Wstrząsa Megaronem"
  mycenaean_league.70.desc: "Mury pękają, magazyny opróżniają się, a kapłani mówią o gniewie pod ziemią. Pałac musi wybrać między wspólną odbudową a schronieniem za własnymi bramami."
  mycenaean_league.70.a: "Odbudujcie mury i magazyny."
  mycenaean_league.70.b: "Porządek pałacowy upada."
  mycenaean_league.80.title: "Rodos i Morskie Szlaki"
  mycenaean_league.80.desc: "Wyspiarscy wanakci kontrolują okręty łączące Morze Egejskie. Mogą eskortować morskie szlaki ligi lub wykorzystać kryzys, by wzbogacić własne porty."
  mycenaean_league.80.a: "Utrzymać otwarte morskie szlaki."
  mycenaean_league.80.b: "Niech nasze okręty służą naszemu pałacowi."
  mycenaean_league.90.title: "Chwała Przed Pałacami"
  mycenaean_league.90.desc: "Wieść o zwycięstwie dociera do paleniska Wielkiego Wanaksa. Przez chwilę rywalizujące pałace przypominają sobie, dlaczego złożyły swoje przysięgi."
  mycenaean_league.90.a: "Niech śpiewacy niosą tę opowieść."
  mycenaean_league.110.title: "Przypomniane Przysięgi"
  mycenaean_league.110.desc: "Danina przybywa, ofiary są wspólne, a rywalizujący królowie ostrożnie przemawiają przed Wielkim Wanaksem. Liga nie stała się imperium, lecz wciąż oddycha."
  mycenaean_league.110.a: "Achajowie stoją razem."
  mycenaean_league.120.title: "Archiwum Zawodzi"
  mycenaean_league.120.desc: "Tabliczki znikają, zapasy są źle policzone, a posłańcy przestają wracać na czas. Bez zapisów pałac nie może rozkazywać temu, czego nie jest w stanie dostrzec."
  mycenaean_league.120.a: "Zapisy obróciły się w popiół."
  mycenaean_league.120.b: "Wyślijcie skrybów do wiosek."
  mycenaean_fragmentation: "Liga Mykeńska"
  mycenaean_fragmentation_desc: "Zarządzaj ligą achajskich pałaców. Utrzymuj wysoką Jedność, aby zachować daniny, wspólną obronę i władzę Wielkiego Wanaksa.\n\nJedność Achajska: #Y [GetUniqueInternationalOrganization('mycenaean_league').MakeScope.GetVariable('mycenaean_league_authority').GetValue|V0]#! /100"
  hint_mycenaean_fragmentation: "Liga Mykeńska"
  mycenaean_fragmentation_panel_high_wanax: "Wielki Wanaks"
  mycenaean_fragmentation_panel_unity: "Jedność Achajska"
  mycenaean_fragmentation_panel_unity_value: "[GetUniqueInternationalOrganization('mycenaean_league').MakeScope.GetVariable('mycenaean_league_authority').GetValue|V0] / 100"
  mycenaean_fragmentation_panel_strong_palace: "Silny Pałac"
  mycenaean_fragmentation_overview_card: "Porządek Pałacowy"
  mycenaean_fragmentation_overview_card_desc: "Liga jest luźnym porządkiem achajskich rodów pałacowych. Silna Jedność utrzymuje lojalność członków. Niska Jedność pozwala potężnym pałacom wysuwać roszczenia terytorialne i może przekształcić ligę w otwarty rozpad."
  mycenaean_fragmentation_actions_card: "Działania Ligi"
  mycenaean_fragmentation_actions_card_desc: "Używaj poniższych działań do zarządzania daninami, przysięgami, wpływami pałaców, obroną i królestwami odłączającymi się od ligi. Większość działań wiąże się z rzeczywistymi kosztami w złocie, zapasach, prestiżu, stabilności lub poparciu stanów."
  mycenaean_fragmentation_map_card: "Mapa Ligi"
  mycenaean_fragmentation_map_card_desc: "Mapa wyróżnia Wielkiego Wanaksa i najsilniejszych rywali pałacowych. Jeśli rozpocznie się rozpad, znajdujące się na lądzie królestwa pałacowe pojawią się tutaj."
  mycenaean_palace_has_valid_landable_location.tt: "Ten ród pałacowy ma co najmniej jedną lokację, w której jego sieć pałacowa może stać się władzą terytorialną."
  turn_mycenaean_palace_into_normal_tag.tt: "Ten ród pałacowy staje się w pełni niezależnym państwem terytorialnym, opuszcza Ligę Mykeńską i przejmuje bezpośrednią kontrolę nad lokacjami, w których posiada dominującą sieć pałacową."
  turn_mycenaean_palace_into_building_based.tt: "To niezależne państwo pałacowe zostaje ponownie przekształcone w eksterytorialny ród pałacowy i ponownie dołącza do Ligi Mykeńskiej pod władzą Wielkiego Wanaksa."
  mycenaean_proclaim_palace_autonomy: "Ogłoś Niezależność Pałacu"
  mycenaean_proclaim_palace_autonomy_desc: "Zerwij każdą przysięgę ligi i przejmij ziemie administrowane przez ten ród jako niezależne królestwo. Mykeny otrzymają casus belli, by przywrócić władzę."
  mycenaean_proclaim_palace_autonomy_price: "Ogłoszenie Niezależności"
  mycenaean_proclaim_palace_autonomy_tt: "Pałac staje się w pełni niezależny, opuszcza Ligę Mykeńską i usuwa swoje ziemie spod władzy ligi. #R -10#! Jedności Achajskiej. Wielki Wanaks otrzymuje casus belli w celu przywrócenia porządku pałacowego."
  mycenaean_reassert_palace_authority: "Przywróć Władzę Pałacową"
  mycenaean_reassert_palace_authority_desc: "Ogłoś odłączony pałac nieposłusznym i przygotuj kampanię mającą na celu przywrócenie go do porządku achajskiego."
  mycenaean_reassert_palace_authority_price: "Przywrócenie Władzy"
  mycenaean_reassert_palace_authority_tt: "Otrzymujesz casus belli przeciwko wybranemu pałacowi. #R -3#! Jedności Achajskiej z powodu napięć politycznych."
  mycenaean_summon_oath_to_mycenae: "Wezwij do Przysięgi w Mykenach"
  mycenaean_summon_oath_to_mycenae_desc: "Wezwij członkowski pałac do odnowienia przysięgi przed Wielkim Wanaksem. Akceptacja przywraca jedność; odmowa pogłębia kryzys."
  mycenaean_summon_oath_to_mycenae_price: "Wezwanie do Przysięgi"
  mycenaean_grant_palace_privileges: "Nadaj Przywileje Pałacowe"
  mycenaean_grant_palace_privileges_desc: "Kup lojalność, potwierdzając lokalne prawa, archiwa i przywileje daninowe. Osłabia to władzę centralną, lecz może powstrzymać ród pałacowy przed odłączeniem się."
  mycenaean_grant_palace_privileges_price: "Przywileje Pałacowe"
  mycenaean_grant_palace_privileges_tt: "#R -4#! Jedności Achajskiej. Wybrany pałac otrzymuje przywileje na 5 lat, zwiększając zadowolenie możnych i zmniejszając jego Wpływy Pałacowe."
  cb_mycenaean_palace_rebel_against_high_wanax: "Autonomia Pałacu"
  cb_mycenaean_palace_rebel_against_high_wanax_desc: "Ród pałacowy rzuca wyzwanie Wielkiemu Wanaksowi i dąży do uzyskania autonomii terytorialnej."
  cb_mycenaean_high_wanax_reassert_authority: "Przywrócenie Władzy Pałacowej"
  cb_mycenaean_high_wanax_reassert_authority_desc: "Wielki Wanaks dąży do podporządkowania odłączonego pałacu władzy achajskiej."
  cb_mycenaean_palace_struggle: "Walka o Pałace"
  cb_mycenaean_palace_struggle_desc: "Rywalizujące pałace achajskie walczą o ziemię, prestiż przysięgi i przetrwanie podczas rozpadu."
  peace_mycenaean_gain_palace_autonomy: "Uznaj Autonomię Pałacu"
  peace_mycenaean_gain_palace_autonomy_desc: "Zwycięski pałac staje się zwykłym państwem terytorialnym."
  peace_mycenaean_revoke_palace_autonomy: "Cofnij Niezależność Pałacu"
  peace_mycenaean_revoke_palace_autonomy_desc: "Niewielki niezależny pałac zostaje ponownie przekształcony w eksterytorialny ród pałacowy i przywrócony do Ligi Mykeńskiej."
  bronze_mycenaean_oath_sworn: "Złożono Przysięgę Pałacową"
  bronze_mycenaean_oath_refused: "Odrzucono Przysięgę Pałacową"
  bronze_mycenaean_palace_autonomy: "Zażądano Autonomii Pałacu"
  bronze_mycenaean_reconciled_palace: "Pojednany Pałac"
  mycenaean_landed_palace_modifier: "Niezależne Królestwo Pałacowe"
  mycenaean_landed_palace_modifier_desc: "Ten dawniej eksterytorialny ród pałacowy włada obecnie własną ziemią poza Ligą Mykeńską. Jego prestiż wzrasta, lecz kontrola i równowaga elit pozostają niepewne."
  mycenaean_palace_autonomy_claimed_modifier: "Ogłoszono Niezależność Pałacu"
  mycenaean_palace_autonomy_claimed_modifier_desc: "Ten pałac zerwał przysięgę złożoną Wielkiemu Wanaksowi i ogłosił pełną niezależność polityczną."
  mycenaean_high_wanax_fragmentation_council_modifier: "Rada Rozpadu"
  mycenaean_high_wanax_fragmentation_council_modifier_desc: "Wielki Wanaks zwołuje nadzwyczajne rady, by utrzymać porządek pałacowy."
  mycenaean_palace_privileges_granted_modifier: "Nadane Przywileje Pałacowe"
  mycenaean_palace_privileges_granted_modifier_desc: "Ten pałac otrzymał od Wielkiego Wanaksa potwierdzone prawa lokalne i przywileje daninowe."
  mycenaean_league_oath_summoned_modifier: "Niedawno Wezwany do Przysięgi"
  mycenaean_league_oath_summoned_modifier_desc: "Ten pałac został niedawno wezwany do odnowienia przysięgi przed Wielkim Wanaksem."
  mycenaean_rising_palace_influence_modifier: "Rosnące Wpływy Pałacowe"
  mycenaean_rising_palace_influence_modifier_desc: "Ten pałac gromadzi prestiż, lokalną lojalność i zaufanie elit wewnątrz achajskiego porządku."
  mycenaean_dominant_palace_influence_modifier: "Dominujące Wpływy Pałacowe"
  mycenaean_dominant_palace_influence_modifier_desc: "Ten pałac stał się poważną siłą polityczną i może rzucić wyzwanie Wielkiemu Wanaksowi, jeśli jedność się załamie."
  mycenaean_league.200.title: "Porządek Pałacowy Upada"
  mycenaean_league.200.desc: "Posłańcy nie przekazują już rozkazów jako prawa. Rody pałacowe przejmują lokalne zapasy, wojownicy podążają za własnymi wanaksami, a dawny porządek achajski zaczyna się rozpadać."
  mycenaean_league.200.a: "Przysięgi drżą."
  mycenaean_league.210.title: "Pałac Roszczy Sobie Swoje Ziemie"
  mycenaean_league.210.desc: "Starsi pałacowi twierdzą, że odległe Mykeny nie są już w stanie chronić powierzonych im wiosek, zapasów i sanktuariów."
  mycenaean_league.210.a: "Przejmijcie ziemię i spichlerze."
  mycenaean_league.210.b: "Pozostańcie pod władzą Wielkiego Wanaksa."
  mycenaean_league.220.title: "Rada Łamania Przysiąg"
  mycenaean_league.220.desc: "Wielki Wanaks dowiaduje się, że pałace wzmacniają bramy i liczą zapasy bez pozwolenia. Twarda rada może utrzymać ligę razem lub jeszcze bardziej ją rozdzielić."
  mycenaean_league.220.a: "Zgromadźcie wanaksów w megaronie."
  mycenaean_league.220.b: "Zagroźcie nieposłusznym rodom."
  mycenaean_league.225.title: "Pałac Sprzeciwia się Mykenom"
  mycenaean_league.225.desc: "Ród pałacowy przejął bezpośrednią władzę nad swoimi ziemiami. Tabliczki określają go mianem nieposłusznego; wojownicy pytają, czy Wielki Wanaks wyruszy na wojnę."
  mycenaean_league.225.a: "Przygotujcie listy przysiąg."
  mycenaean_league.230.title: "Wielki Wanaks Potępia Nas"
  mycenaean_league.230.desc: "Mykeny uznały ten pałac za nieposłuszny i roszczą sobie prawo do przywrócenia władzy siłą."
  mycenaean_league.230.a: "Niech przyjdą."
  mycenaean_league.240.title: "Wezwani Przed Wielkiego Wanaksa"
  mycenaean_league.240.desc: "Przybywają posłowie z brązowymi pieczęciami i żądaniem: odnowić przysięgę Mykenom, wysłać zakładników i ponownie stanąć pod władzą Wielkiego Wanaksa."
  mycenaean_league.240.a: "Odnowić przysięgę."
  mycenaean_league.240.b: "Odrzucić wezwanie."
  mycenaean_league.250.title: "Po Rozpadzie"
  mycenaean_league.250.desc: "Dawny porządek pałacowy uległ zmianie. Niektóre rody są niezależne, inne ponownie uginają się przed Mykenami, a świat achajski nie jest już taki, jak opisywały go niegdyś tabliczki."
  mycenaean_league.250.a: "Śpiewacy będą pamiętać."
  mycenaean_league_200_a_tt: "Rozpoczyna się rozpad. Wielki Wanaks doznaje wstrząsu autorytetu, podczas gdy członkowskie pałace zyskują większą swobodę działania."
  mycenaean_league_210_a_tt: "Stań się w pełni niezależnym państwem terytorialnym, opuść Ligę Mykeńską, zyskaj rdzenie na ziemiach sieci pałacowej i zmniejsz Jedność Achajską o #R 8#!."
  mycenaean_league_210_b_tt: "Pozostań lojalnym na razie. Jedność Achajska wzrasta o #G 3#!, a stosunki z Wielkim Wanaksem ulegają poprawie."
  mycenaean_league_220_a_tt: "Zyskaj #G 4#! Jedności Achajskiej i modyfikatory nadzwyczajnej rady, lecz zadowolenie możnych spada."
  mycenaean_league_220_b_tt: "Zmniejsz Jedność Achajską o #R 6#!. Wielki Wanaks zyskuje presję kryzysową i traci prestiż."
  mycenaean_league_225_a_tt: "Wielki Wanaks zostaje ostrzeżony i może użyć działań związanych z autorytetem lub casus belli, by przywrócić porządek pałacowy."
  mycenaean_league_230_a_tt: "Zyskaj presję rywalizującego pretendenta i zmniejsz Jedność Achajską o #R 3#!."
  mycenaean_league_240_a_tt: "Zaakceptuj przysięgę. Jedność Achajska wzrasta o #G 5#!, lecz prestiż zostaje wydany."
  mycenaean_league_240_b_tt: "Odrzuć przysięgę. Jedność Achajska spada o #R 7#!, a Wielki Wanaks otrzymuje casus belli na rzecz przywrócenia porządku."
  mycenaean_league_250_a_tt: "Usuwa tymczasowe flagi rozpadu. Polityczny rezultat pozostaje na mapie."
  MYCENAEAN_LEAGUE_PALACE_REDISTRIBUTION: "Redystrybucja Pałacowa"
  mycenaean_redistribute_palace_stores: "Redystrybuuj Zapasy Pałacowe"
  mycenaean_redistribute_palace_stores_desc: "Otwórz królewskie spichlerze, magazyny brązu i warsztaty pałacowe, by zapewnić wyżywienie i posłuszeństwo achajskiego porządku. Jedność wzrasta, lecz możni są oburzeni utratą prywatnych zapasów, a gospodarka zwalnia."
  mycenaean_redistribute_palace_stores_price: "Redystrybucja Pałacowa"
  mycenaean_redistribute_palace_stores_tt: "#G +5#! Jedności Achajskiej. Wszystkie członkowskie pałace tracą #G 3#! Wpływów Pałacowych. Wielki Wanaks otrzymuje #Y Redystrybucję Pałacową#! na 3 lata: większe bezpieczeństwo żywnościowe, słabsza produkcja i nadwyrężony import."
  mycenaean_demand_palace_hostages: "Zażądaj Zakładników z Pałacu"
  mycenaean_demand_palace_hostages_desc: "Zażądaj od rodu pałacowego zakładników spośród możnych, by zagwarantować posłuszeństwo. Ogranicza to jego zdolność do przewodzenia frakcji odłamowej, lecz budzi trwałą urazę."
  mycenaean_demand_palace_hostages_price: "Zakładnicy Pałacowi"
  mycenaean_demand_palace_hostages_tt: "#G +3#! Jedności Achajskiej. Wybrany pałac traci obecnie #G 12#! Wpływów Pałacowych, lecz jego możni są rozgniewani, a stosunki z Wielkim Wanaksem pogarszają się."
  mycenaean_restore_palace_network: "Przywróć Sieć Pałacową"
  mycenaean_restore_palace_network_desc: "Zaproponuj niewielkiemu, osłabionemu królestwu pałacowemu kosztowne porozumienie: jego lokalne ziemie powrócą pod kontrolę Myken, podczas gdy dynastia przetrwa jako eksterytorialny ród pałacowy."
  mycenaean_restore_palace_network_price: "Przywrócenie Sieci Pałacowej"
  mycenaean_restore_palace_network_tt: "Wybrany pałac otrzymuje wydarzenie. Jeśli zaakceptuje, ponownie stanie się eksterytorialnym rodem pałacowym, a Jedność Achajska wzrośnie o #G 8#!. Jeśli odmówi, Jedność spadnie, a Wielki Wanaks otrzyma casus belli."
  mycenaean_palace_redistribution_modifier: "Redystrybucja Pałacowa"
  mycenaean_palace_redistribution_modifier_desc: "Wielki Wanaks redystrybuuje zboże, brąz i produkcję warsztatów, by utrzymać sieć pałacową przy życiu podczas kryzysu."
  mycenaean_palace_hostages_taken_modifier: "Wzięto Zakładników Pałacowych"
  mycenaean_palace_hostages_taken_modifier_desc: "Zakładnicy spośród możnych zostali wysłani do Wielkiego Wanaksa. Lokalne elity na razie są posłuszne, lecz nie wybaczają łatwo."
  bronze_mycenaean_hostages_taken: "Wzięto Zakładników Spośród Możnych"
  mycenaean_league.260.title: "Powrót do Sieci Pałacowej"
  mycenaean_league.260.desc: "Posłowie z Myken przybywają z pieczęciami, darami i twardą ofertą. Wielki Wanaks zachowa tę dynastię jako ród pałacowy, lecz pola, porty i magazyny muszą powrócić do wspólnego porządku achajskiego."
  mycenaean_league.260.a: "Zaakceptujcie porozumienie."
  mycenaean_league.260.b: "Zachowajcie ziemię."
  mycenaean_league_260_a_tt: "To państwo powraca do statusu eksterytorialnego rodu pałacowego. Jego ziemie przechodzą z powrotem pod władzę Wielkiego Wanaksa, a Jedność Achajska wzrasta o #G 8#!."
  mycenaean_league_260_b_tt: "Odrzućcie porozumienie. Jedność Achajska spada o #R 6#!, ten pałac staje się rywalizującym pretendentem, a Wielki Wanaks otrzymuje casus belli na rzecz przywrócenia porządku."
  #IO GUI Under here
  Cohesion_Title: "Spójność"
  Value_Cohesion: "Wartość:"
  Influence_Title: "Wpływy"
  Influence_Dsec: "Wpływy opierają się na bazie podatkowej i modyfikatorach, a ich wartość wynosi 100 punktów. Im więcej punktów, tym większą kontrolę masz nad decyzjami ligi."
  MYCENAEAN_LEAGUE_CUSTOM_TAB: "Liga Mykeńska"
  mycenaean_league_leader: "Przywódca — Mykeny:"
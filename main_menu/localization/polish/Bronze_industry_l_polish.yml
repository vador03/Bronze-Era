l_polish:
  bronze_age_bronze_foundry: "Warsztat Wytopu Stopów Brązu"
  bronze_age_bronze_foundry_desc: "Warsztat z piecami, tyg­lami i formami, w którym miedź łączy się z cenną cyną, tworząc brąz dla gospodarek pałacowych, rzemieślników i płatnerzy."
  bronze_age_bronze_forge: "Kuźnia Brązu"
  bronze_age_bronze_forge_desc: "We wczesnej epoce brązu obróbka metalu wciąż była rzemiosłem domowym, a mieszkańcy wsi odlewali narzędzia i broń na własny użytek, zamiast polegać na wyspecjalizowanych kowalach."
  bronze_age_bronze: "Brąz"
  bronze_age_bronze_desc: "Brąz jest stopem miedzi i cyny, cenionym za zastosowanie w narzędziach, broni, okuciach i przedmiotach prestiżowych. Jego produkcja zależy od delikatnych szlaków handlowych, którymi na duże odległości sprowadza się cynę."
  tin: "Cyna"
  tin_desc: "Cyna jest rzadkim metalem o znaczeniu strategicznym, niezbędnym do wytwarzania właściwego brązu. Jej niedostatek sprawiał, że odległe kopalnie i morskie szlaki handlowe miały kluczowe znaczenie dla gospodarek późnej epoki brązu."
  bronze_age_full_bronze_supply: "Pełne Zaopatrzenie w Brąz"
  bronze_age_full_bronze_supply_desc: "Odlewnia ma niezawodny dostęp zarówno do miedzi, jak i cyny, dzięki czemu jej rzemieślnicy mogą odlewać trwały brąz z pełną wydajnością."
  bronze_age_bronze_shortage: "Wytop przy Niedoborze Cyny"
  bronze_age_bronze_shortage_desc: "Szlaki dostaw cyny są zawodne. Odlewnia oszczędza zapasy miedzi, przetapia złom i wytwarza jedynie niewielkie ilości użytecznego brązu."
  carpenter_yard: "Warsztat Ciesielski"
  carpenter_yard_desc: "Wykwalifikowani cieśle obrabiają drewno na użyteczny materiał, przygotowując deski i belki do budowy, wyrobu narzędzi, statków i innych rzemiosł. Ich praca pozwala lepiej wykorzystywać lasy otaczające rozrastające się osady."
  sponsored_tool_maker: "Utrzymywani Rzemieślnicy Narzędzi"
  sponsored_tool_maker_desc: "Rzemieślnicy wspierani przez wodza, świątynię lub innego patrona poświęcają się wytwarzaniu narzędzi bez polegania wyłącznie na rynku. Taki patronat pozwala wykwalifikowanym specjalistom zajmować się swoim rzemiosłem w pełnym wymiarze."
  sponsored_weaponry_maker: "Utrzymywani Zbrojmistrzowie"
  sponsored_weaponry_maker_desc: "Wspierani przez potężnych patronów kowale wytwarzają broń dla drużynników, straży i wojowników. Ich byt zależy od stałego patronatu elit, a nie od zwykłego popytu handlowego."
  sponsored_fine_cloth_maker: "Utrzymywani Tkacze"
  sponsored_fine_cloth_maker_desc: "Wykwalifikowani pracownicy włókiennictwa wytwarzają wysokiej jakości tkaniny pod ochroną i patronatem lokalnych władców, świątyń lub szlacheckich gospodarstw domowych, dostarczając elitarne stroje na potrzeby dworu i ceremonii."
  sponsored_beer_maker: "Utrzymywani Piwowarzy"
  sponsored_beer_maker_desc: "Piwowarzy utrzymywani dzięki patronatowi wodzów lub instytucji wytwarzają napoje na uczty, ceremonie religijne i potrzeby zależnych gospodarstw domowych, zapewniając niezawodne dostawy wykraczające poza zwykłą produkcję wiejską."
  sponsored_pottery_maker: "Utrzymywani Garncarze"
  sponsored_pottery_maker_desc: "Profesjonalni garncarze wspierani przez zamożnych patronów wytwarzają naczynia do przechowywania, rytuałów, administracji i codziennego użytku, pozwalając na większą specjalizację i jednolitość produkcji."
  sponsored_navy_supplies_maker: "Utrzymywani Dostawcy Wyposażenia Morskiego"
  sponsored_navy_supplies_maker_desc: "Specjaliści wytwarzają liny, olinowanie, preparaty smołowe, żagle i inne niezbędne wyposażenie pod patronatem elit, wspierając zorganizowaną żeglugę i utrzymanie jednostek pływających."
  sponsored_wine_maker: "Utrzymywani Winiarze"
  sponsored_wine_maker_desc: "Winiarze wspierani przez patronów produkują wino dla elitarnych gospodarstw domowych, na uroczystości, wymianę dyplomatyczną i wystawne uczty, poświęcając się w pełni swojemu rzemiosłu."
  sponsored_jewelry_maker: "Utrzymywani Złotnicy"
  sponsored_jewelry_maker_desc: "Wysoko wykwalifikowani rzemieślnicy tworzą ozdoby, insygnia i dobra luksusowe pod patronatem władców, świątyń lub szlachetnych patronów, wytwarzając przedmioty symbolizujące bogactwo, status i władzę."
  sponsored_leather_maker: "Utrzymywani Rymarze i Garbarze"
  sponsored_leather_maker_desc: "Rzemieślnicy skórzani utrzymywani dzięki patronatowi wytwarzają uprzęże, pojemniki, odzież i wyposażenie wojskowe, zaspokajając potrzeby elitarnych gospodarstw domowych i wyspecjalizowanych instytucji."
  tools_guild: "Królewski Warsztat Narzędzi"
  tools_guild_desc: "Wielkie zadanie budowy zamożnego państwa wymaga najlepszych narzędzi i wyposażenia. Królewski warsztat narzędzi to wyspecjalizowany zakład, w którym wykwalifikowani rzemieślnicy i artyści tworzą wysokiej jakości narzędzia i przybory przeznaczone do dystrybucji zgodnie z rozkazami Pałacu."
  weapon_guild: "Królewski Warsztat Broni"
  weapon_guild_desc: "Wielkie zadanie budowy zamożnego państwa wymaga najlepszej broni i wyposażenia. Królewski warsztat broni to wyspecjalizowany zakład, w którym wykwalifikowani rzemieślnicy i artyści tworzą wysokiej jakości broń i przybory przeznaczone do dystrybucji zgodnie z rozkazami Pałacu."
  tablets_guild: "Królewski Warsztat Tabliczek"
  tablets_guild_desc: "Wynalezienie tabliczek pisarskich umożliwia zapisywanie informacji, komunikację i rozwój złożonych systemów administracyjnych w społeczeństwach epoki brązu."
  royal_scribe_guild: "Królewska Szkoła Skrybów"
  royal_scribe_guild_desc: "Królewska szkoła skrybów to prestiżowa instytucja, w której najbardziej utalentowane osoby uczą się sztuki pisania i prowadzenia rejestrów. Szkoła kształci wysoko wykwalifikowanych skrybów, którzy służą potrzebom administracyjnym pałacu i przyczyniają się do rozwoju złożonych systemów biurokratycznych w społeczeństwach epoki brązu."
  fine_cloth_palace: "Królewscy Tkacze"
  fine_cloth_palace_desc: "Powiązane z gospodarką pałacową królewskie warsztaty tkackie wytwarzają wysokiej jakości tkaniny na stroje dworskie, ceremonie, dary dyplomatyczne i potrzeby elit. Ich rzemieślnicy przetwarzają cenne włókna i barwniki w dobra ukazujące bogactwo, status i władzę."
  cloth_palace: "Królewskie Warsztaty Sukiennicze"
  cloth_palace_desc: "Królewskie warsztaty sukiennicze wytwarzają tkaniny dla dworu, świątyń, urzędników i potrzeb całego państwa. Ich rzemieślnicy przetwarzają wełnę, bawełnę i inne włókna, zapewniając stały zapas materiału na odzież i codzienny użytek."
  beer_palace: "Królewscy Piwowarzy"
  beer_palace_desc: "Działające pod nadzorem pałacu królewskie browary produkują duże ilości napojów fermentowanych na uczty, ceremonie religijne, racje dla pracowników, dary dyplomatyczne i potrzeby elit. Ich produkcja wspiera zarówno codzienne funkcjonowanie, jak i prestiż gospodarki pałacowej."
  pottery_palace: "Królewscy Garncarze"
  pottery_palace_desc: "Pałacowe warsztaty garncarskie produkują w dużych ilościach dzbany do przechowywania, zastawę stołową, pojemniki transportowe i naczynia ceremonialne. Ich wyroby wspierają administrację, handel, instytucje religijne i codzienne potrzeby gospodarki pałacowej."
  naval_supplies_palace: "Królewscy Szkutnicy"
  naval_supplies_palace_desc: "Pod nadzorem pałacu szkutnicy i rzemieślnicy wytwarzają liny, żagle, olinowanie, smołę i inne niezbędne zaopatrzenie morskie. Ich warsztaty utrzymują floty handlowe, statki rybackie i okręty wojenne, które rozszerzają zasięg państwa na rzekach i morzach."
  winery_palace: "Królewskie Winiarnie"
  winery_palace_desc: "Pałacowe winiarnie produkują napoje fermentowane na uczty, potrzeby dyplomacji, ceremonie religijne i konsumpcję elit. Ich wyroby są zarówno symbolami prestiżu, jak i cennymi dobrami w gospodarce redystrybucyjnej."
  jewelry_palace: "Królewscy Złotnicy"
  jewelry_palace_desc: "Pod nadzorem pałacu wykwalifikowani rzemieślnicy tworzą biżuterię, ozdoby, ceremonialne insygnia i dobra prestiżowe z metali szlachetnych oraz kamieni szlachetnych. Ich dzieła służą jako symbole statusu, dary dyplomatyczne, ofiary religijne i przejawy królewskiego bogactwa."
  weapon_iron_age_workshop: "Warsztaty Zbrojmistrzów"
  weapon_iron_age_workshop_desc: "Wyspecjalizowani zbrojmistrzowie coraz częściej pracują jako miejscy rzemieślnicy, wytwarzając broń z żelaza obok tradycyjnych materiałów, takich jak stopy miedzi i kamień. Ich warsztaty odpowiadają na rosnący popyt na standaryzowaną i wyspecjalizowaną broń."
  tools_iron_age_workshop: "Warsztaty Wytwórców Narzędzi"
  tools_iron_age_workshop_desc: "Wyspecjalizowani wytwórcy narzędzi produkują coraz bardziej różnorodne przybory z żelaza i innych materiałów, zaopatrując rolników, budowniczych, górników i rzemieślników w trwałe wyposażenie. Wyspecjalizowane warsztaty pozwalają obróbce metalu stać się stałym rzemiosłem miejskim."
  fine_cloth_iron_age: "Warsztat Włókienniczy"
  fine_cloth_iron_age_desc: "Miejska produkcja włókiennicza skupia wykwalifikowanych tkaczy, farbiarzy i innych specjalistów, których rzemiosło odpowiada na coraz bardziej wyrafinowane potrzeby rynku. Wysokiej jakości tkaniny stają się ważnym wyrazem bogactwa, statusu i wymiany kulturowej."
  beer_iron_age: "Warsztat Piwowarski"
  beer_iron_age_desc: "Produkcja napojów fermentowanych coraz silniej wiąże się z wyspecjalizowanymi miejskimi wytwórcami, obsługując rynki, uczty, uroczystości religijne i rosnącą populację miast."
  pottery_iron_age: "Warsztat Garncarski"
  pottery_iron_age_desc: "Miejscy garncarze rozwijają coraz bardziej wyspecjalizowane tradycje formowania, wypalania i zdobienia naczyń. Ich wyroby zaspokajają rosnące potrzeby gospodarstw domowych, rynków, kupców i instytucji."
  naval_supplies_iron_age: "Warsztat Szkutniczy"
  naval_supplies_iron_age_desc: "Rozwój zorganizowanej żeglugi tworzy zapotrzebowanie na rzemieślników wyspecjalizowanych w produkcji żagli, lin, smoły i innego wyposażenia. Specjaliści ci stają się ważną częścią handlowego i morskiego życia rozwijających się miast."
  winery_iron_age: "Warsztat Winiarski"
  winery_iron_age_desc: "Produkcja wina staje się wyspecjalizowanym rzemiosłem w społecznościach, gdzie popyt wykracza poza lokalną konsumpcję domową. Wykwalifikowani wytwórcy zaopatrują stoły zamożnych gospodarstw domowych, kupców, sanktuariów i miejskich rynków."
  jewelry_iron_age: "Warsztat Jubilerski"
  jewelry_iron_age_desc: "Rosnące bogactwo miast tworzy rynek na ozdoby wykonywane z metali szlachetnych, kamieni szlachetnych, kości słoniowej, bursztynu i innych cenionych materiałów. Wykwalifikowani jubilerzy rozwijają coraz bardziej wyszukane techniki i charakterystyczne lokalne tradycje."

  # ########################
  # PRODUCTION METHODS
  # ########################

  tools_guild_stone_recipe: "Warsztaty Narzędzi Kamiennych"
  tools_guild_stone_recipe_desc: "Pałacowe warsztaty organizują rzemieślników wytwarzających proste narzędzia kamienne do rolnictwa, budownictwa i prac domowych z powszechnie dostępnych lokalnych materiałów."
  tools_guild_copper_recipe: "Warsztaty Obróbki Miedzi"
  tools_guild_copper_recipe_desc: "Królewskie warsztaty zatrudniają wyspecjalizowanych kowali do odlewania i kształtowania miedzianych narzędzi, zwiększając ich trwałość i wspierając bardziej zaawansowaną produkcję rzemieślniczą."
  tools_guild_bronze_recipe: "Odlewnie Brązu"
  tools_guild_bronze_recipe_desc: "Scentralizowane pałacowe odlewnie wytwarzają wysokiej jakości narzędzia z brązu dzięki kontrolowanemu stopowaniu i wyspecjalizowanej metalurgii, znacznie zwiększając wydajność i wzmacniając ekonomiczną potęgę elit."
  bronze_age_small_scale_bronze_prod: "Lokalny Wytop Brązu"
  bronze_age_small_scale_bronze_prod_desc: "Lokalna kuźnia produkuje niewielką ilość brązu."
  scribe_tablets_maintenance: "Materiały do Pisania na Tabliczkach"
  scribe_tablets_maintenance_desc: "Królewscy skrybowie używają tabliczek do swojej pracy."
  scribe_paper_maintenance: "Materiały do Pisania na Papierze"
  scribe_paper_maintenance_desc: "Królewscy skrybowie używają papieru do swojej pracy."
  clay_tablets_maintenance: "Produkcja Tabliczek Glinianych"
  clay_tablets_maintenance_desc: "Lokalny warsztat tabliczek wytwarza proste tabliczki gliniane do prowadzenia rejestrów i komunikacji."
  copper_tablets_maintenance: "Produkcja Tabliczek Miedzianych"
  copper_tablets_maintenance_desc: "Lokalny warsztat tabliczek wytwarza miedziane tabliczki do prowadzenia rejestrów i komunikacji."
  weapon_guild_stone_recipe: "Warsztaty Broni Kamiennej"
  weapon_guild_stone_recipe_desc: "Królewscy rzemieślnicy wytwarzają broń z kamiennymi głowicami, maczugi, włócznie i prostą broń z ciosanego kamienia, drewna oraz przy użyciu podstawowych technik rzemieślniczych."
  weapon_guild_bronze_recipe: "Odlewnie Broni z Brązu"
  weapon_guild_bronze_recipe_desc: "Pałacowe odlewnie wyposażają wojowników w trwałą broń z brązu, wytwarzaną dzięki zaawansowanej metalurgii, zorganizowanej pracy i kontrolowanemu dostępowi do strategicznych surowców."
  weapon_guild_obsidian_recipe: "Warsztaty Broni Obsydianowej"
  weapon_guild_obsidian_recipe_desc: "Wyspecjalizowani rzemieślnicy kształtują szkliwo wulkaniczne w niezwykle ostre ostrza, groty włóczni i broń ceremonialną cenioną za siłę cięcia i prestiż."
  weapon_guild_copper_recipe: "Warsztaty Broni Miedzianej"
  weapon_guild_copper_recipe_desc: "Królewskie warsztaty broni odlewają i wykuwają z miedzi topory, sztylety, groty włóczni i inną broń, przewyższającą kamienne uzbrojenie wszechstronnością i statusem."
  weapon_guild_iron_recipe: "Kucie Broni Żelaznej"
  weapon_guild_iron_recipe_desc: "Wraz z nastaniem wytopu żelaza królewskie warsztaty rozpoczynają wykuwanie żelaznej broni. Choć wczesne żelazo bywa kruche i mniej trwałe niż brąz, stanowi znaczący przełom technologiczny, dający potencjał do masowej produkcji i powszechniejszego dostępu do broni."
  fine_cloth_guild_maintenance: "Tkanie Wysokiej Jakości Tkanin"
  fine_cloth_guild_maintenance_desc: "Wykwalifikowani tkacze przetwarzają zwykłe tkaniny w materiały wyższej jakości, odpowiednie dla elitarnych gospodarstw domowych i instytucji administracyjnych."
  wool_weavers_maintenance: "Tkanie Wełny"
  wool_weavers_maintenance_desc: "Doświadczeni rzemieślnicy wytwarzają wysokiej jakości tkaniny wełniane cenione za trwałość, wygodę i wszechstronność."
  silk_weavers_maintenance: "Tkanie Jedwabiu"
  silk_weavers_maintenance_desc: "Rzadkie włókna jedwabne przekształcane są w luksusowe tkaniny zarezerwowane dla najzamożniejszych patronów i najbardziej prestiżowych zastosowań ceremonialnych."
  base_fine_cloth_guild_maintenance: "Barwione Tkaniny"
  base_fine_cloth_guild_maintenance_desc: "Zastosowanie barwników zwiększa wartość i atrakcyjność wysokiej jakości tkanin, poszerzając jednocześnie gamę dostępnych kolorów."
  alum_fine_cloth_guild_maintenance: "Barwienie z Zaprawami"
  alum_fine_cloth_guild_maintenance_desc: "Ałun zwiększa intensywność i trwałość barwionych tkanin, pozwalając tkaczom wytwarzać bardziej żywe i trwalsze materiały."
  fur_trim_guild_maintenance: "Futrzane Obszycia"
  fur_trim_guild_maintenance_desc: "Wysokiej jakości odzież jest wzbogacana starannie dobranymi futrami, zwiększającymi jej prestiż i atrakcyjność wśród elitarnych odbiorców."
  wheat_palace_brewery_maintenance: "Warzenie Piwa Pszennego"
  wheat_palace_brewery_maintenance_desc: "Pałacowi piwowarzy wytwarzają piwo pszenne przeznaczone dla robotników, drużynników, urzędników i uczestników uroczystości."
  millet_palace_brewery_maintenance: "Warzenie Piwa Jaglanego"
  millet_palace_brewery_maintenance_desc: "Proso stanowi niezawodną podstawę produkcji piwa na dużą skalę, zaspokajającej potrzeby pałacu i jego poddanych."
  fruit_palace_brewery_maintenance: "Fermentacja Owoców"
  fruit_palace_brewery_maintenance_desc: "Napoje na bazie owoców wytwarza się na uczty, obrzędy religijne i stoły elitarnych gospodarstw domowych."
  maize_palace_brewery_maintenance: "Warzenie Piwa Kukurydzianego"
  maize_palace_brewery_maintenance_desc: "Wyspecjalizowani piwowarzy fermentują kukurydzę, tworząc napoje spożywane podczas ceremonii, zgromadzeń wspólnotowych i oficjalnych uroczystości."
  honey_palace_brewery_maintenance: "Warzenie Miodu"
  honey_palace_brewery_maintenance_desc: "Miód i zboże służą do tworzenia cenionych napojów fermentowanych kojarzonych z gościnnością, prestiżem i świątecznymi obrzędami."
  rice_palace_brewery_maintenance: "Warzenie Piwa Ryżowego"
  rice_palace_brewery_maintenance_desc: "Napoje alkoholowe na bazie ryżu są wytwarzane w zorganizowanych warsztatach, zaopatrujących zarówno codzienną konsumpcję, jak i uroczystości ceremonialne."
  palace_pottery_maintenance: "Produkcja Ceramiki"
  palace_pottery_maintenance_desc: "Wykwalifikowani garncarze formują i wypalają glinę w naczynia używane do przechowywania, transportu, gotowania, handlu i celów administracyjnych w całym państwie."
  naval_supplies_palace_maintenance: "Produkcja Wyposażenia Morskiego"
  naval_supplies_palace_maintenance_desc: "Wyspecjalizowani rzemieślnicy wytwarzają liny, żagle, materiały uszczelniające i okucia niezbędne do budowy, utrzymania i eksploatacji statków morskich."
  palace_fruit_winery_maintenance: "Produkcja Wina Owocowego"
  palace_fruit_winery_maintenance_desc: "Wykwalifikowani winiarze fermentują owoce, tworząc cenione napoje przeznaczone na uczty, ceremonie i dla gospodarstw domowych zamożnych elit."
  palace_rice_winery_maintenance: "Produkcja Wina Ryżowego"
  palace_rice_winery_maintenance_desc: "Ryż jest starannie fermentowany w wyrafinowane napoje alkoholowe spożywane podczas dworskich zgromadzeń i ważnych uroczystości religijnych."
  palace_honey_winery_maintenance: "Produkcja Miodu Pitnego"
  palace_honey_winery_maintenance_desc: "Miód przekształcany jest w luksusowe napoje fermentowane kojarzone z gościnnością, praktykami religijnymi i statusem elit."
  tools_sponsored_stone_recipe: "Wyrób Narzędzi Kamiennych"
  tools_sponsored_copper_recipe: "Wyrób Narzędzi Miedzianych"
  tools_sponsored_bronze_recipe: "Wyrób Narzędzi z Brązu"
  tools_sponsored_iron_recipe: "Wyrób Narzędzi Żelaznych"

  bronze_ruins_debug.2.title: "Wybierz profil dowódcy wyprawy"
  bronze_ruins_debug.2.desc: "Wybierz profil używany przez następną wyprawę do ruin. Jest to wybór oparty na profilu dowódcy, a nie pełny system przydzielania postaci."
  bronze_ruins_debug.2.a: "Królewski archiwista"
  bronze_ruins_debug.2.b: "Kapitan straży"
  bronze_ruins_debug.2.c: "Kwatermistrz"
  bronze_ruins_debug.2.d: "Wróżbita świątynny"
  bronze_ruins_debug_1a_tt: "Komenda konsolowa: event bronze_ruins_debug.1\nCzyści czas odnowienia wypraw kraju, usuwa nieaktualną pojemność wypraw, jeśli żadna wyprawa nie jest aktywna, oraz usuwa blokady niedawnej eksploracji z posiadanych ruin."
  bronze_ruins_debug_1b_tt: "Ustawia postęp bieżącej aktywnej wyprawy na 100% i uruchamia wydarzenie jej powrotu następnego dnia, jeśli istnieje prawidłowa aktywna wyprawa."
  bronze_ruins_debug_1c_tt: "Otwiera selektor profilu debugowania dla następnego dowódcy wyprawy."
  bronze_ruins_debug_1d_tt: "Włącza tymczasowe przyciski debugowania w interfejsie lokacji ruin. Użyj ich, aby przygotować lub bezpośrednio rozpocząć wyprawę z obecnie wybranych ruin."
  bronze_ruins_debug_2a_tt: "Następna wyprawa korzysta z profilu Królewskiego archiwisty: większa szansa powodzenia i zdobycia artefaktów."
  bronze_ruins_debug_2b_tt: "Następna wyprawa korzysta z profilu Kapitana straży: większe bezpieczeństwo w niebezpiecznych ruinach."
  bronze_ruins_debug_2c_tt: "Następna wyprawa korzysta z profilu Kwatermistrza: lepsza logistyka odzyskiwania i większy potencjał zysku w złocie."
  bronze_ruins_debug_2d_tt: "Następna wyprawa korzysta z profilu Wróżbity świątynnego: większy potencjał zdobycia artefaktów i wiedzy."
  be_ruins_debug_reset_launch_timers_effect_tt: "Liczniki rozpoczęcia wypraw do ruin i blokady niedawnej eksploracji zostają wyczyszczone na potrzeby testów debugowania."
  be_ruins_debug_force_active_expedition_return_effect_tt: "Aktywna wyprawa do ruin zostaje zmuszona do powrotu na potrzeby testów debugowania."
  be_ruins_debug_enable_location_buttons_effect_tt: "Tymczasowe przyciski debugowania wybranych ruin zostają włączone w interfejsie ruin."
  be_ruins_debug_prepare_selected_ruin_effect_tt: "Wybrane ruiny zostają wymuszenie przygotowane na potrzeby testów debugowania."
  be_ruins_debug_start_selected_expedition_effect_tt: "Z wybranych ruin zostaje rozpoczęta wyprawa debugowania przy użyciu normalnego przebiegu wyprawy."
  be_ruins_debug_prepare_selected_ruin: "Debugowanie: Przygotuj wybrane ruiny"
  be_ruins_debug_prepare_selected_ruin_tt: "Usuwa znaczniki zbyt świeżych ruin, eksploracji, czasu odnowienia, nieaktualnej pojemności i aktywnej wyprawy z wybranych ruin."
  be_ruins_debug_start_selected_expedition: "Debugowanie: Rozpocznij wybraną wyprawę"
  be_ruins_debug_start_selected_expedition_tt: "Wymusza przygotowanie wybranych ruin i natychmiast rozpoczyna normalny przebieg wyprawy. Obowiązują normalne koszty wyprawy."
  # From localization/english/Bronze_formables_l_english.yml
  ALLARAM_f: "Cała Aram"
  ALLARAM_f_desc: "Aramejskie miasta, pustynne szlaki i królestwa oaz można zjednoczyć pod jedną ludzką koroną. Cała Aram jednoczy szlaki karawanowe, miejscowe rody królewskie i wyżyny Lewantu, nie zastępując kultury ani wiary królestwa."
  bronze_allaram_caravan_kingship: "Królestwo karawan"
  bronze_allaram_caravan_kingship_desc: "Królowie Całej Aram łączą miasta oaz, ufortyfikowane szlaki i królewskie dwory w bardziej spójne królestwo aramejskie."
  bronze_allaram_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Całej Aram, lecz bez darmowych rdzeni."
  bronze_formed_allaram: "Utworzono Całą Aram"
  bronze_formed_allaram_desc: "To państwo utworzyło Królestwo Całej Aram."
  bronze_formed_shandong: "Utworzono Szantung"
  bronze_formed_shandong_desc: "To państwo zjednoczyło ziemie Lai, Xuan i Yuyi na półwyspie Szantung."
  SHAND_f: "Szantung"
  SHAND_f_desc: "Ziemie Lai, Xuan i Yuyi na półwyspie Szantung można zjednoczyć w jedno wschodnie królestwo pod rytami Shang."
  # From localization/english/Bronze_hatti_collapse_l_english.yml
  bronze_hatti_phase_1_rumours_from_the_coast_desc: "Kupcy szepczą o spalonych portach, zaginionych statkach i obcych bandach wojowników wzdłuż południowego morza."
  bronze_hatti_phase_2_grain_crisis_desc: "Pałacowy system redystrybucji nie jest w stanie wyżywić miast."
  bronze_hatti_phase_3_vassals_defy_hattusa_desc: "Królowie klienccy i namiestnicy opóźniają daniny, ignorują posłańców i zbroją własne gospodarstwa."
  bronze_hatti_phase_4_empire_cracks_desc: "Władza Wielkiego Króla słabnie poza najsilniejszymi ośrodkami pałacowymi."
  bronze_hatti_phase_5_fall_of_hatti_desc: "Dawne imperium ustępuje miejsca pozostałym dworom, lokalnym królom i państwom sukcesyjnym."
  bronze_hatti_grain_crisis_modifier_desc: "Niedobory żywności podkopują władzę pałacu."
  bronze_hatti_trade_collapse_modifier_desc: "Brąz, zboże, tkaniny i dobra luksusowe nie przepływają już niezawodnie przez rynki hetyckie."
  bronze_hatti_vassal_defiance_modifier_desc: "Władcy peryferyjni sprawdzają, czy Hattusa wciąż może wymagać posłuszeństwa."
  bronze_hatti_internal_breakdown_modifier_desc: "Lokalni arystokraci, żołnierze i głodne miasta rozrywają imperium od środka."
  bronze_hatti_southern_coast_raided_modifier_desc: "Najeźdźcy z wybrzeża spalili porty i zakłócili przepływ zboża oraz brązu."
  bronze_hatti_successor_state_modifier_desc: "To państwo wyłoniło się z upadku hetyckiej władzy imperialnej."
  # From localization/english/Bronze_industry_l_english.yml
  bronze_age_tools_bronze_recipe: "Produkcja narzędzi z brązu"
  bronze_age_tools_bronze_recipe_desc: "Rzemieślnicy odlewają brązowe ostrza, dłuta, szydła i narzędzia rolnicze. Metoda ta jest skuteczna w epoce brązu, lecz trudniejsza do skalowania niż późniejszy przemysł żelazny."
  bronze_age_tools_workshop_bronze_recipe: "Warsztat narzędzi z brązu"
  bronze_age_tools_workshop_bronze_recipe_desc: "Zorganizowane warsztaty przetwarzają sztaby brązu w narzędzia dla gospodarstw, pałaców i stoczni."
  bronze_age_weapons_bronze_recipe: "Produkcja broni z brązu"
  bronze_age_weapons_bronze_recipe_desc: "Brąz jest przetwarzany na groty włóczni, sztylety, miecze i okucia dla elitarnych wojowników. Produkcję ogranicza dostępność importowanej cyny."
  bronze_age_weapons_workshop_bronze_recipe: "Warsztat broni z brązu"
  bronze_age_weapons_workshop_bronze_recipe_desc: "Wyspecjalizowani kowale kształtują brąz w broń dla pałacowych arsenałów i drużyn arystokratycznych."
  # From localization/english/Bronze_religions_l_english.yml
  hattian_desc: "System religijny epoki brązu zakorzeniony w lokalnych świątyniach, obrzędach sezonowych, kulcie dynastycznym i tradycji wspólnotowej."
  # From localization/english/Bronze_town_rights_l_english.yml
  bronze_local_market_right: "Prawo do lokalnego targu"
  bronze_local_market_right_desc: "Miasto otrzymuje prawo do organizowania regularnego lokalnego targu, skupiającego pobliską wymianę handlową pod jego uznaną władzą."
  bronze_council_of_elders_right: "Rada starszych"
  bronze_council_of_elders_right_desc: "Miejscowi starsi otrzymują zadanie rozstrzygania sporów i utrzymywania porządku na zapleczu miasta."
  bronze_communal_granary_right: "Prawo do wspólnego spichlerza"
  bronze_communal_granary_right_desc: "Miasto może utrzymywać wspólne rezerwy zboża przeznaczone do przechowywania, redystrybucji i łagodzenia skutków głodu."
  bronze_artisan_quarter_right: "Prawo do dzielnicy rzemieślniczej"
  bronze_artisan_quarter_right_desc: "Wyspecjalizowane dzielnice skupiają wykwalifikowanych rzemieślników pod miejską ochroną i nadzorem."
  bronze_regional_warehouse_right: "Prawo do regionalnego magazynu"
  bronze_regional_warehouse_right_desc: "Miasto jest upoważnione do przechowywania i redystrybucji dóbr regionalnych dla okolicznych osad."
  bronze_sanctuary_privilege: "Przywilej sanktuarium"
  bronze_sanctuary_privilege_desc: "Uznane sanktuarium wzmacnia rytualny prestiż miasta oraz jego władzę nad pobliskimi społecznościami."
  bronze_palatial_redistribution_right: "Prawo do pałacowej redystrybucji"
  bronze_palatial_redistribution_right_desc: "Pałac kontroluje magazyny, obowiązki pracy i regularną redystrybucję na całym terytorium miejskim."
  bronze_scribe_archive_right: "Prawo do archiwum skrybów"
  bronze_scribe_archive_right_desc: "Archiwum skrybów rejestruje należności, dostawy, zobowiązania i transakcje elit."
  bronze_fortified_citadel_right: "Prawo do ufortyfikowanej cytadeli"
  bronze_fortified_citadel_right_desc: "Miasto może utrzymywać ufortyfikowaną cytadelę zapewniającą lokalną ochronę i kontrolę administracyjną."
  bronze_protected_emporion_right: "Prawo do chronionego emporionu"
  bronze_protected_emporion_right_desc: "Kupcy i wymieniane towary są chronieni przez władzę miasta, wspierając szersze sieci handlowe."
  bronze_regional_tribute_right: "Prawo do pobierania regionalnej daniny"
  bronze_regional_tribute_right_desc: "Miasto może pobierać daniny i świadczenia pracy od swoich regionalnych zależności."
  bronze_palace_workshop_monopoly: "Monopol pałacowych warsztatów"
  bronze_palace_workshop_monopoly_desc: "Pałac rezerwuje kluczową produkcję warsztatową na potrzeby królewskiej lub miejskiej redystrybucji."
  bronze_royal_palace_complex_privilege: "Przywilej królewskiego kompleksu pałacowego"
  bronze_royal_palace_complex_privilege_desc: "Rozległy kompleks pałacowy stanowi ośrodek bogactwa, administracji i prestiżu miasta."
  bronze_great_sanctuary_right: "Prawo do wielkiego sanktuarium"
  bronze_great_sanctuary_right_desc: "Wielkie sanktuarium przyciąga ofiary, odwiedzających i władzę rytualną z całego regionu."
  bronze_hegemonic_city_right: "Prawo miasta hegemonicznego"
  bronze_hegemonic_city_right_desc: "Miasto rości sobie uznaną rolę przywódczą wobec otaczających je społeczności miejskich i wiejskich."
  bronze_town_right_rank_5_tt: "Wymaga rangi Prestiżu miasta: Miasto lokalne lub wyższej."
  bronze_town_right_rank_4_tt: "Wymaga rangi Prestiżu miasta: Miasto regionalne lub wyższej."
  bronze_town_right_rank_3_tt: "Wymaga rangi Prestiżu miasta: Wielkie miasto lub wyższej."
  bronze_town_right_rank_2_tt: "Wymaga rangi Prestiżu miasta: Miasto imperialne lub wyższej."
  bronze_town_right_rank_1_tt: "Wymaga rangi Prestiżu miasta: Miasto światowe."
  bronze_town_right_trade_infrastructure_tt: "Miasto musi posiadać targ lub inną infrastrukturę handlową."
  # From localization/english/Bronze_trojan_war_phase_1_l_english.yml
  trojan_war_phase_1: "Wojna trojańska - Faza 1"
  trojan_war_phase_1_desc: "Twój konflikt przerodził się w pełnoskalową wojnę, lecz obie strony wciąż badają przeciwnika i próbują zdobyć przewagę. Grecy rozpoczęli najazdy na wybrzeże Anatolii, a mieszkańcy odpowiedzieli wzmocnieniem obrony wybrzeża. Wojna jest wciąż na wczesnym etapie, a jej wynik pozostaje niepewny, lecz działania podjęte teraz ukształtują dalszy przebieg konfliktu."
  trojan_war_panel_header: "WOJNA TROJAŃSKA"
  trojan_war_panel_phase: "Obecna faza:"
  trojan_war_panel_phase_value: "Faza 1: Przyczółek"
  trojan_war_panel_escalation: "Poziom eskalacji:"
  trojan_war_panel_escalation_value: "Wysoki"
  trojan_war_actions_header: "Działania wojenne"
  trojan_war_raid_on_anatolia: "Najedź Anatolię"
  trojan_war_defend_coastline: "Broń wybrzeża"
  trojan_war_raid_toggled: "Wojna trojańska - włączono najazd fazy 1"
  raid_on_anatolia_effect_desc: "Wydaj 75 skarbca i 250 siły roboczej, aby wysłać morskie oddziały łupieżcze przez Morze Egejskie. Sukces zapewnia tymczasowy bonus do najazdów; porażka osłabia wyprawę."
  defend_coastline_effect_desc: "Wydaj 25 skarbca i 150 siły roboczej, aby zmobilizować straże wybrzeża na sześć miesięcy, zmniejszając szansę powodzenia wrogich najazdów."
  trojan_war_defend_toggled: "Wojna trojańska - obrona wybrzeża fazy 1 włączona"
  # From localization/english/Bronze_western_foundations_l_english.yml
  bronze_western_foundations.1.title: "Miasta Etrusków"
  bronze_western_foundations.1.desc: "W całej Etrurii wzgórzowe społeczności Villanovan przekształcają się w arystokratyczne miasta. Pałacowa księgowość, żelazne narzędzia i nowe obrzędy elit nadają dawnym osadom odmienny język polityczny, skupiony wokół etruskich świątyń, magistratów i rodów szlacheckich."
  bronze_western_foundations.1.a: "Uznać porządek etruski."
  bronze_western_foundations_1a_tt: "Kultura państwowa i religia państwowa stają się etruskie. Tylko w posiadanych początkowych lokacjach Etrurii około 55% ludności przyjmuje kulturę etruską, a około 45% wyznaje religię etruską."
  bronze_western_foundations.2.title: "Założenie Kartaginy"
  bronze_western_foundations.2.desc: "Zachodni port w Tunisie stał się ostoją nowej kolonii fenickiej. Kupcy, żeglarze i gospodarstwa świątynne proszą o uznanie Kartaginy, miasta położonego tak, by kontrolować centralne szlaki zachodniego Morza Śródziemnego."
  bronze_western_foundations.2.a: "Założyć Kartaginę na zachodzie."
  bronze_western_foundations_2a_tt: "Kartagina zostaje utworzona w Tunisie, Tebourbie, Nabeul, Kelibii, Bizercie i Zaghouan z lewantyńską kulturą założyciela oraz religią punicką."
  bronze_western_foundations.3.title: "Kartagina na afrykańskim wybrzeżu"
  bronze_western_foundations.3.desc: "Zagraniczni kupcy i osadnicy zgromadzili się wokół portu w Tunisie, wciągając pobliskie miasta w nowe punickie miasto. Nawet bez rządzącej fenickiej metropolii kolonia ma już znaczenie pozwalające jej stać się Kartaginą."
  bronze_western_foundations.3.a: "Pozwolić Kartaginie nabrać kształtu."
  bronze_western_foundations_3a_tt: "Kartagina zostaje utworzona w Tunisie, Tebourbie, Nabeul, Kelibii, Bizercie i Zaghouan z kulturą fenicko-punicką oraz religią punicką. Będziesz kontynuować grę jako Kartagina."

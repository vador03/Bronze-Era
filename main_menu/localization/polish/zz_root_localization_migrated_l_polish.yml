  bronze_ruins_debug.1.title: "Debugowanie wyprawy do ruin"
  bronze_ruins_debug.1.desc: "To wydarzenie debugowania służy wyłącznie do testów konsolowych. Użyj go, aby ominąć liczniki czasu wypraw, wymusić powrót aktywnej wyprawy lub wybrać profil dowódcy wyprawy przed jej rozpoczęciem."
  bronze_ruins_debug.1.a: "Wyczyść liczniki czasu wypraw."
  bronze_ruins_debug.1.b: "Wymuś powrót aktywnej wyprawy."
  bronze_ruins_debug.1.c: "Wybierz profil dowódcy wyprawy."

  # From localization/english/Bronze_city_razing_l_english.yml
  bronze_city_razing.1.title: "Miasto upadło"
  bronze_city_razing.1.desc: "[bronze_captured_city.GetName] znajduje się pod naszą kontrolą. Bramy stoją otworem, magazyny są odsłonięte, a los mieszkańców spoczywa teraz w rękach zwycięskiej armii."
  bronze_city_razing.1.a: "Zająć miasto."
  bronze_city_razing.1.b: "Złupić miasto."
  bronze_city_razing.1.c: "Zrównać je z ziemią."
  bronze_city_razing.2.title: "Grabież zakończona"
  bronze_city_razing.2.desc: "Rozkaz złupienia [bronze_captured_city.GetName] dobiegł końca. Jeśli nadal kontrolujemy miasto i nie rozpoczęło się nowe oblężenie, grabież została zakończona. Jeśli miasto zostało odsieczone lub zakwestionowano nad nim kontrolę, pozostają jedynie początkowe zniszczenia."
  bronze_city_razing.2.a: "Zabrać łupy."
  bronze_city_razing.3.title: "Miasto zostało zniszczone"
  bronze_city_razing.3.desc: "Rozkaz zrównania [bronze_captured_city.GetName] z ziemią dobiegł końca. Jeśli nadal kontrolujemy miasto i nie rozpoczęło się nowe oblężenie, zniszczenie zostało zakończone. Jeśli miasto zostało odsieczone lub zakwestionowano nad nim kontrolę, pierwsze zniszczenia zostały już dokonane."
  bronze_city_razing.3.a: "Wykonać rozkaz zniszczenia."
  bronze_city_razing.9.title: "Ruiny czekają na zbadanie"
  bronze_city_razing.9.desc: "Na naszych ziemiach wciąż stoją stare mury, zniszczone świątynie i zakopane magazyny. Skrybowie i awanturnicy sądzą, że wyprawa do [bronze_ruins_site.GetName] może odzyskać kosztowności, zapiski lub szczątki władców ze zniszczonego miasta."
  bronze_city_razing.9.a: "Sfinansować wyprawę."
  bronze_city_razing.9.b: "Pozostawić martwe miasto w spokoju."
  bronze_city_razing.10.title: "Wyprawa dociera do ruin"
  bronze_city_razing.10.desc: "Wyprawa dotarła do roztrzaskanych pozostałości [bronze_ruins_site.GetName]. Pierwsze komnaty są niestabilne, lecz przewodnicy zapewniają, że głębsze przejścia mogą wciąż skrywać coś wartego poniesionych kosztów."
  bronze_city_razing.10.a: "Zagłębić się w ruiny."
  bronze_city_razing.10.b: "Wycofać się, zanim stracimy więcej."
  bronze_city_razing.11.title: "Zaginiona wyprawa"
  bronze_city_razing.11.desc: "Wyprawa powróciła późno, głodna i mocno uszczuplona. Zawalające się przejścia, choroby i wrogi teren pochłonęły większość wysiłku, zanim udało się odzyskać cokolwiek użytecznego."
  bronze_city_razing.11.a: "Spisać straty na straty."
  bronze_city_razing.12.title: "Ukryty skarb"
  bronze_city_razing.12.desc: "Zapewniony przed rabusiami magazyn pod ruinami skrywał wyroby metalowe, zgromadzone kosztowności oraz rytualne dary ukryte w ostatnich dniach istnienia miasta."
  bronze_city_razing.12.a: "Przenieść skarb do pałacu."
  bronze_city_razing.13.title: "Odnaleziono starożytne teksty"
  bronze_city_razing.13.desc: "Skrybowie odzyskali uszkodzone tabliczki i inskrypcje z ruin. Wiele z nich zachowało się jedynie fragmentarycznie, lecz pozostało dość, by ocalić utraconą wiedzę administracyjną i rytualną."
  bronze_city_razing.13.a: "Przesłać teksty naszym uczonym."
  bronze_city_razing.14.title: "Królewska komora grobowa"
  bronze_city_razing.14.desc: "Wyprawa odkryła komorę przygotowaną dla zapomnianego władcy. Jej zawartość jest umiarkowanie użyteczna, lecz jej znaczenie ceremonialne jest znacznie większe."
  bronze_city_razing.14.a: "Oddać cześć zmarłemu i zapisać odkrycie."
  bronze_city_razing.15.title: "Święta klątwa"
  bronze_city_razing.15.desc: "Robotnicy szepczą, że pogrzebani bogowie zostali niepokojeni. Niezależnie od tego, czy chodzi o klątwę, chorobę czy strach, powrót wyprawy przyniósł niepokój na dwór."
  bronze_city_razing.15.a: "Złożyć ofiary i zakończyć prace."
  bronze_city_razing_1a_tt: "Miasto zostaje zajęte, ponosząc minimalne dodatkowe zniszczenia."
  bronze_city_razing_1b_tt: "Rozpoczyna dwutygodniową grabież. Lokacja otrzymuje widoczny znacznik grabieży. Działanie nie blokuje już armii; kończy się niepowodzeniem tylko wtedy, gdy miasto zostanie wyzwolone lub nowe oblężenie zakwestionuje kontrolę nad nim przed zakończeniem. W przypadku powodzenia zyskujemy łupy, a miasto traci dobrobyt, ludność, żywność i Prestiż miasta. Straty wśród ludności cywilnej zapewniają dodatkowy wynik wojenny."
  bronze_city_razing_1c_tt: "Rozpoczyna operację zrównania z ziemią. Miasta wymagają jednego miesiąca, a megalopolie dwóch miesięcy. Lokacja otrzymuje widoczny znacznik zniszczenia. Działanie nie blokuje już armii; kończy się niepowodzeniem tylko wtedy, gdy miasto zostanie wyzwolone lub nowe oblężenie zakwestionuje kontrolę nad nim przed zakończeniem. W przypadku powodzenia miasto ponosi ciężkie straty ludności, zniszczenie budynków, zniszczenie centrum handlowego, jeśli istnieje, obniżenie rangi oraz poważną utratę dobrobytu, a straty wśród ludności cywilnej zapewniają dodatkowy wynik wojenny."
  bronze_city_razing_2a_tt: "Jeśli nadal kontrolujemy miasto i nie jest ono oblężone, zastosuj ostateczną grabież: łupy, utratę ludności, utratę żywności, uszkodzenie dobrobytu, utratę Prestiżu miasta oraz dodatkowy wynik wojenny za straty wśród ludności cywilnej. Jeśli miasto zostało odsieczone lub zakwestionowano nad nim kontrolę, przerwij grabież i zastosuj jedynie niewielkie zniszczenia."
  bronze_city_razing_3a_tt: "Jeśli nadal kontrolujemy miasto i nie jest ono oblężone, zastosuj ostateczne zrównanie z ziemią: łupy, poważną utratę ludności, zniszczenie budynków, zniszczenie centrum handlowego, jeśli istnieje, obniżenie rangi osady, usunięcie Prestiżu miasta, jeśli lokacja nie jest już miastem, oraz dodatkowy wynik wojenny za straty wśród ludności cywilnej. Jeśli miasto zostało odsieczone lub zakwestionowano nad nim kontrolę, przerwij niszczenie i zastosuj częściowe zniszczenia."
  bronze_city_razing_9a_tt: "Wydaj 50 sztuk złota, aby wysłać wyprawę."
  bronze_city_razing_9b_tt: "Żadna wyprawa nie zostaje wysłana."
  bronze_city_razing_10a_tt: "Wydaj dodatkowe 20 sztuk złota i kontynuuj."
  bronze_city_razing_10b_tt: "Zakończ wyprawę i oznacz ruiny jako niedawno zbadane."
  bronze_city_razing_11a_tt: "Ponosisz stratę zależną od zagrożenia ruin. Wyprawa dobiega końca."
  bronze_city_razing_12a_tt: "Odzyskaj bogactwo zależne od wartości nagrody ruin. Wyprawa dobiega końca."
  bronze_city_razing_13a_tt: "Odzyskaj wiedzę zależną od zachowanych archiwów ruin. Wyprawa dobiega końca."
  bronze_city_razing_14a_tt: "Odzyskaj zarówno bogactwo, jak i wiedzę dzięki wielkiemu odkryciu. Wyprawa dobiega końca."
  bronze_city_razing_15a_tt: "Ponosisz niebezpieczną stratę zależną od ryzyka związanego z ruinami. Wyprawa dobiega końca."
  bronze_city_capture_occupy_effect_tt: "Uporządkowana okupacja"
  bronze_city_start_sack_effect_tt: "Rozpocznij grabież"
  bronze_city_start_unit_sack_effect_tt: "Armia rozpoczyna dwutygodniową operację grabieży. Działanie trwa, dopóki miasto nie zostanie wyzwolone lub nowe oblężenie nie zakwestionuje kontroli nad nim."
  bronze_city_sack_interrupted_effect_tt: "Grabież przerwana"
  bronze_city_sack_effect_tt: "Złup miasto"
  bronze_city_start_raze_effect_tt: "Rozpocznij niszczenie"
  bronze_city_start_unit_raze_effect_tt: "Armia rozpoczyna operację zrównania miasta z ziemią. Miasta wymagają jednego miesiąca, a megalopolie dwóch miesięcy. Działanie trwa, dopóki miasto nie zostanie wyzwolone lub nowe oblężenie nie zakwestionuje kontroli nad nim."
  bronze_city_raze_interrupted_effect_tt: "Niszczenie przerwane"
  bronze_city_raze_effect_tt: "Zrównaj miasto z ziemią"
  bronze_city_create_ancient_ruins_effect_tt: "Zniszczone miasto staje się trwałymi Starożytnymi Ruinami."
  bronze_ruins_start_expedition_effect_tt: "Sfinansowana wyprawa zostaje wysłana do starożytnych ruin."
  STATIC_MODIFIER_NAME_bronze_city_orderly_occupation: "Uporządkowana okupacja"
  STATIC_MODIFIER_DESC_bronze_city_orderly_occupation: "Miasto zostało przejęte pod kontrolowaną okupacją, zamiast pozostawienia go na pastwę niekontrolowanej grabieży."
  STATIC_MODIFIER_NAME_bronze_city_being_sacked: "W trakcie grabieży"
  STATIC_MODIFIER_DESC_bronze_city_being_sacked: "Żołnierze ograbiają miasto z kosztowności, żywności, jeńców i prestiżu."
  STATIC_MODIFIER_NAME_bronze_city_recently_sacked: "Niedawno złupione"
  STATIC_MODIFIER_DESC_bronze_city_recently_sacked: "Rynki, gospodarstwa domowe i reputacja miasta nie podniosły się jeszcze po niedawnej grabieży."
  STATIC_MODIFIER_NAME_bronze_city_razing_underway: "Trwa niszczenie"
  STATIC_MODIFIER_DESC_bronze_city_razing_underway: "Siły okupacyjne rozbierają miasto. Miasta wymagają jednego miesiąca, a megalopolie dwóch miesięcy. Jeśli miasto zostanie wyzwolone lub zakwestionowane przed zakończeniem, niszczenie zostaje przerwane, lecz częściowe zniszczenia pozostają."
  STATIC_MODIFIER_NAME_bronze_city_razed: "Zniszczone miasto"
  STATIC_MODIFIER_DESC_bronze_city_razed: "Znaczna część osady została celowo zniszczona."
  STATIC_MODIFIER_NAME_bronze_city_severe_ruins: "Poważne ruiny"
  STATIC_MODIFIER_DESC_bronze_city_severe_ruins: "Duże części miasta są roztrzaskane, opuszczone lub niezdatne do użytku. Jest to znacznik wizualny; zniszczenia są obsługiwane przez modyfikator zniszczonego miasta."
  STATIC_MODIFIER_NAME_bronze_ancient_ruins_location: "Starożytne ruiny"
  STATIC_MODIFIER_DESC_bronze_ancient_ruins_location: "Lokacja zachowuje pozostałości zniszczonego miasta z epoki brązu. Ten znacznik nie ma bezpośredniego wpływu na rozgrywkę."
  STATIC_MODIFIER_NAME_bronze_ruins_expedition_camp: "Obóz wyprawy do ruin"
  STATIC_MODIFIER_DESC_bronze_ruins_expedition_camp: "Skrybowie, robotnicy, strażnicy i przewodnicy pracują wśród pozostałości starożytnego miasta."
  bronze_ruins_button: "Starożytne ruiny"
  bronze_ruins_button_desc: "Otwórz panel Starożytnych Ruin dla tej lokacji."
  bronze_ruins_panel_title: "Starożytne ruiny"
  bronze_ruins_panel_empty_desc: "To zniszczone miasto zostało oznaczone jako starożytne ruiny. Panel jest na razie celowo pusty i może w przyszłości otrzymać mechaniki wykopalisk, odbudowy lub pamięci."
  bronze_city_razing.20.title: "Zapasy, pieczęcie i rozkazy"
  bronze_city_razing.20.desc: "Zanim wyprawa wkroczy do [bronze_ruins_site.GetName], skrybowie liczą kosze zboża, strażnicy sprawdzają groty włóczni, a robotnicy czekają na ostateczne rozkazy. Pierwsze decyzje wpłyną na całą podróż."
  bronze_city_razing.20.a: "Załadować dodatkowe zapasy."
  bronze_city_razing.20.b: "Podróżować z lekkim bagażem i poruszać się szybko."
  bronze_city_razing.20.c: "Wynająć miejscowych przewodników."
  bronze_city_razing.21.title: "Droga do ruin"
  bronze_city_razing.21.desc: "Droga w kierunku [bronze_ruins_site.GetName] prowadzi przez zniszczone pola, wyschnięte jary i opuszczone posterunki straży. Wyprawa może zachować siły albo poświęcić bezpieczeństwo na rzecz szybkości."
  bronze_city_razing.21.a: "Wybrać bezpieczniejszą drogę."
  bronze_city_razing.21.b: "Wymusić szybki marsz."
  bronze_city_razing.21.c: "Poprosić o znaki przed wyruszeniem."
  bronze_city_razing.22.title: "Nieznana komnata"
  bronze_city_razing.22.desc: "Za zawalonym murem robotnicy odkrywają zapieczętowaną komnatę. Wyblakłe symbole wciąż pokrywają tynk, a zimne powietrze przedostaje się przez szczelinę pod kamieniami."
  bronze_city_razing.22.a: "Sporządzić mapę i zapisać wszystko."
  bronze_city_razing.22.b: "Złamać pieczęć."
  bronze_city_razing.22.c: "Pozostawić ją zapieczętowaną."
  bronze_city_razing.23.title: "Kamień i kurz"
  bronze_city_razing.23.desc: "Przejście zawala się pod ciężarem wyprawy. Mężczyźni krzyczą zza roztrzaskanych kamieni, a dowódca musi zdecydować, czy ryzykować kolejne życia w niestabilnej ciemności."
  bronze_city_razing.23.a: "Uratować uwięzionych robotników."
  bronze_city_razing.23.b: "Porzucić tę część ruin."
  bronze_city_razing.23.c: "Wysłać najpierw strażników."
  bronze_city_razing.24.title: "Pretendenci w ruinach"
  bronze_city_razing.24.desc: "Wyprawa nie jest sama. Uzbrojeni szabrownicy, miejscowi starsi i przewodnicy o niepewnej lojalności twierdzą, że mają prawo do tego, co kryje się pod [bronze_ruins_site.GetName]."
  bronze_city_razing.24.a: "Wynegocjować przejście."
  bronze_city_razing.24.b: "Przepędzić ich."
  bronze_city_razing.24.c: "Kupić ich mapę."
  bronze_city_razing.25.title: "Pierwsze odkrycie"
  bronze_city_razing.25.desc: "Wyprawa odkrywa ślady utraconego porządku: oznaczone dzbany, rozbite tabliczki, rytualne przedmioty z brązu oraz pomieszczenia zapieczętowane w ostatnich dniach istnienia miasta."
  bronze_city_razing.25.a: "Udokumentować znalezisko."
  bronze_city_razing.25.b: "Odzyskać kosztowności."
  bronze_city_razing.25.c: "Poświęcić komnatę."
  bronze_city_razing.26.title: "Zapieczętowane drzwi"
  bronze_city_razing.26.desc: "W centrum ruin stoją drzwi zablokowane ciężkimi kamieniami. Robotnicy twierdzą, że zwykły magazyn nie zostałby zapieczętowany z taką starannością."
  bronze_city_razing.26.a: "Otworzyć je."
  bronze_city_razing.26.b: "Wysłać mały zespół."
  bronze_city_razing.26.c: "Oznaczyć je do późniejszego zbadania."
  bronze_city_razing.27.title: "Obce spojrzenia"
  bronze_city_razing.27.desc: "Wyprawa zwróciła uwagę władców tej krainy. Ich posłańcy pytają, dlaczego uzbrojeni robotnicy przekopują ruiny znajdujące się pod ich władzą."
  bronze_city_razing.27.a: "Poprosić o formalne pozwolenie."
  bronze_city_razing.27.b: "Kontynuować po cichu."
  bronze_city_razing.27.c: "Wycofać się, zanim przerodzi się to w skandal."
  bronze_city_razing.28.title: "Zapasy się kończą"
  bronze_city_razing.28.desc: "Zapasy żywności wyprawy niemal się wyczerpały. Choroby, złe drogi i dłuższe niż oczekiwano przejścia zmieniły staranne plany w próbę wytrzymałości."
  bronze_city_razing.28.a: "Wysłać więcej zapasów."
  bronze_city_razing.28.b: "Ograniczyć straty."
  bronze_city_razing.28.c: "Zagłębić się dalej, zanim ludzie się rozproszą."
  bronze_city_razing.29.title: "Wyprawa powraca"
  bronze_city_razing.29.desc: "Ocaleni wracają z [bronze_ruins_site.GetName] z tabliczkami, fragmentami, opowieściami i zapieczętowanymi koszami. Niezależnie od tego, czy jest to triumf, czy ostrzeżenie, ruiny odcisnęły swoje piętno na dworze."
  bronze_city_razing.29.a: "Przyjąć wyprawę."
  be_ruin_final_artifact_unique_tt: "Unikatowy artefakt zostaje dodany do zapisów pałacowych."
  be_ruin_final_artifact_rare_tt: "Rzadki artefakt zostaje dodany do zapisów pałacowych."
  be_ruin_final_artifact_common_tt: "Odzyskany artefakt zostaje dodany do zapisów pałacowych."
  bronze_city_razing.30.title: "Dzielnica królewska"
  bronze_city_razing.30.desc: "Wyprawa dociera do wzniesionej dzielnicy kamiennych progów, malowanego tynku i zawalonych magazynów. Nawet w ruinie było to niegdyś miejsce władzy."
  bronze_city_razing.30.a: "Wysłać skrybów do komnat pałacowych."
  bronze_city_razing.30.b: "Otworzyć królewskie magazyny."
  bronze_city_razing.30.c: "Zapieczętować salę tronową ofiarami."
  bronze_city_razing.31.title: "Komnata archiwum"
  bronze_city_razing.31.desc: "Rzędy połamanych półek i stwardniałych tabliczek leżą pod popiołem i belkami dachu. Niektóre zapisy przetrwały ostatni pożar miasta."
  bronze_city_razing.31.a: "Pozwolić uczonym pracować powoli."
  bronze_city_razing.31.b: "Usunąć to, co można unieść."
  bronze_city_razing.31.c: "Skopiować kruche znaki na miejscu."
  bronze_city_razing.32.title: "Królewski grobowiec"
  bronze_city_razing.32.desc: "Pod ruinami otwiera się komora grobowa. Kości są stare, lecz przedmioty wokół nich wciąż świadczą o ostatnich honorach oddanych władcy."
  bronze_city_razing.32.a: "Uszanować zmarłego."
  bronze_city_razing.32.b: "Ograbić komorę."
  bronze_city_razing.32.c: "Ustawić straż przy wejściu."
  bronze_city_razing.33.title: "Magazyny portowe"
  bronze_city_razing.33.desc: "W pobliżu starych nabrzeży wyprawa odnajduje zapieczętowane magazyny pełne rozbitych dzbanów, znaków handlowych i śladów pośpiesznej ewakuacji."
  bronze_city_razing.33.a: "Zapisać znaki handlowe."
  bronze_city_razing.33.b: "Odzyskać zgromadzone towary."
  bronze_city_razing.33.c: "Najpierw zabezpieczyć doki."
  bronze_city_razing.34.title: "Zakopany ładunek statku"
  bronze_city_razing.34.desc: "Muł i zawalone mury zachowały część ładunku statku. Na niektórych dzbanach wciąż widnieją obce znaki."
  bronze_city_razing.34.a: "Ostrożnie wydobyć ładunek."
  bronze_city_razing.34.b: "Szybko ograbić statek."
  bronze_city_razing.34.c: "Zbadać obce znaki."
  bronze_city_razing.35.title: "Wewnętrzne sanktuarium"
  bronze_city_razing.35.desc: "Za zawalonym murem przetrwało sanktuarium. Zwęglone belki, naczynia rytualne i popękane posągi wypełniają komnatę."
  bronze_city_razing.35.a: "Złożyć ofiary przed wejściem."
  bronze_city_razing.35.b: "Usunąć relikwie."
  bronze_city_razing.35.c: "Zbadać znaki świątynne."
  bronze_city_razing.36.title: "Zbrojownia"
  bronze_city_razing.36.desc: "Pod dachem koszar leżą brązowe groty włóczni, połamane tarcze i stosy okuć. Miejsce zostało opuszczone w pośpiechu."
  bronze_city_razing.36.a: "Skatalogować broń."
  bronze_city_razing.36.b: "Odzyskać brąz."
  bronze_city_razing.36.c: "Zabezpieczyć koszary."
  bronze_city_razing.37.title: "Ulica warsztatów"
  bronze_city_razing.37.desc: "Piece, kowadła, ławy i niedokończone wyroby ciągną się wzdłuż wąskiej ulicy. Rąk, które niegdyś ich używały, już dawno tu nie ma."
  bronze_city_razing.37.a: "Zbadać znaki rzemieślnicze."
  bronze_city_razing.37.b: "Zebrać narzędzia."
  bronze_city_razing.37.c: "Zatrudnić ocalałych rzemieślników z okolicy."
  bronze_city_razing.38.title: "Ukryte przejście"
  bronze_city_razing.38.desc: "Pod ruinami biegnie wąskie przejście. Mogło służyć strażnikom, kapłanom, przemytnikom lub uciekinierom w ostatnich dniach istnienia miasta."
  bronze_city_razing.38.a: "Sporządzić mapę przejścia."
  bronze_city_razing.38.b: "Wysłać uzbrojonych ludzi do środka."
  bronze_city_razing.38.c: "Zablokować niebezpieczną odnogę."
  bronze_city_razing.39.title: "Pożar w obozie"
  bronze_city_razing.39.desc: "Iskra zajmuje suche drewno i starą tkaninę. Dym przetacza się przez obóz, podczas gdy robotnicy odciągają kosze od płomieni."
  bronze_city_razing.39.a: "Ocalić robotników i zapasy."
  bronze_city_razing.39.b: "Porzucić płonącą dzielnicę."
  bronze_city_razing.39.c: "Wykorzystać płomienie do usunięcia gruzu."
  bronze_city_razing.40.title: "Najeźdźcy w ruinach"
  bronze_city_razing.40.desc: "Wśród zewnętrznych murów pojawiają się uzbrojeni ludzie. Dobrze znają zniszczone ulice i z zainteresowaniem obserwują zapasy wyprawy."
  bronze_city_razing.40.a: "Zapłacić im, aby odeszli."
  bronze_city_razing.40.b: "Przepędzić ich."
  bronze_city_razing.40.c: "Zatrudnić ich jako przewodników."
  bronze_city_razing.41.title: "Zalane przejścia"
  bronze_city_razing.41.desc: "Woda przesącza się do niższych przejść. Podłoże staje się śliskie, lampy migoczą, a powietrze staje się cuchnące."
  bronze_city_razing.41.a: "Osuszyć przejście."
  bronze_city_razing.41.b: "Na razie zawrócić."
  bronze_city_razing.41.c: "Przedrzeć się dalej."
  bronze_city_razing.42.title: "Milcząca dzielnica"
  bronze_city_razing.42.desc: "Wyprawa spędza całe dnie na pustych ulicach. Pozostają ceramika, popiół i kości, lecz nic nie wyjaśnia jeszcze, dlaczego ta część miasta wymarła."
  bronze_city_razing.42.a: "Kontynuować poszukiwania ostrożnie."
  bronze_city_razing.42.b: "Przebić się do następnej dzielnicy."
  bronze_city_razing.42.c: "Wrócić z tym, co mamy."
  bronze_city_razing_20a_tt: "Wyprawa otrzymuje lepsze zaopatrzenie."
  bronze_city_razing_20b_tt: "Wyprawa porusza się szybko."
  bronze_city_razing_20c_tt: "Do wyprawy dołączają miejscowi przewodnicy."
  bronze_city_razing_21a_tt: "Wyprawa wybiera bezpieczniejszą drogę."
  bronze_city_razing_21b_tt: "Robotnicy wymuszają szybki marsz."
  bronze_city_razing_21c_tt: "Wyprawa czeka na znaki."

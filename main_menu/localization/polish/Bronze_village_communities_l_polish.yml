l_polish:
  village_community: "Wspólnota Wiejska"
  village_community_desc: "Wysoce zdecentralizowany związek wsi, rodzin i klanów rolniczych, utrzymywany wspólnym zgromadzeniem zamiast dziedzicznym dworem."
  village_clan_elective: "Wybór przez Zgromadzenie Klanów"
  village_clan_elective_desc: "Władca jest wybierany na czteroletnią kadencję spośród ważnych przywódców wsi, klanów i gospodarstw domowych. Kandydaci wywodzą się z lokalnych rodów, a nie z dziedzicznej dynastii."
  village_community_reform: "Wspólnota Wiejska"
  village_community_reform_desc: "Władza spoczywa w rękach autonomicznych wsi i grup pokrewieństwa. Wspólne zgromadzenie może wybrać pierwszego starszego, lecz pobór podatków, kontrola i stała administracja pozostają słabe poza najbliższymi osadami."
  maintain_clan_assembly_reform: "Utrzymanie Zgromadzenia Klanów"
  maintain_clan_assembly_reform_desc: "Zgromadzenie pozostaje centrum życia politycznego. Wsie zachowują autonomię, podczas gdy klany przyjmują bardziej formalny rytm debat i wyborów."
  clan_confederation_reform: "Konfederacja Klanów"
  clan_confederation_reform_desc: "Kilka wspólnot wiejskich zgadza się koordynować wojnę, dyplomację i daniny za pośrednictwem silniejszej rady konfederacyjnej. Władza centralna pozostaje ograniczona, lecz wspólnota może działać poza pojedynczym skupiskiem osad."
  hereditary_chiefdom_reform: "Dziedziczne Wodzostwo"
  hereditary_chiefdom_reform_desc: "Jeden wiodący klan przekształca wybieraną zwierzchność w zgromadzeniu w dziedziczną władzę. Wspólnota pozostaje Wspólnotą Wiejską, lecz jej zwyczaje przygotowują późniejsze przejście ku rządom plemiennym."
  village_community_adopt_monarchy_reform: "Dynastyczne Przywództwo Klanu"
  village_community_adopt_monarchy_reform_desc: "Jedna wiodąca rodzina zyskuje stałą zwierzchność w zgromadzeniu klanów. Wspólnota pozostaje wspólnotowa, lecz władza, daniny i lokalne dowództwo zaczynają skupiać się wokół dworu dynastycznego."
  village_community_to_clan_confederation: "Utwórz Konfederację Klanów"
  village_community_to_clan_confederation_desc: "Kilka wspólnot wiejskich może połączyć swoje zgromadzenia w szerszą konfederację, zanim przyjmie silniejszy ustrój plemienny."
  village_community_to_clan_confederation_tt: "Zorganizujemy wsie jako $clan_confederation_reform$."
  village_community_to_tribe: "Przyjmij Rządy Plemienne"
  village_community_to_tribe_desc: "Konfederacja klanów może przekształcić wspólne zgromadzenie w formalny rząd plemienny. Dopiero po przyjęciu ustroju plemiennego będzie można później skorzystać ze zwykłej drogi do monarchii."
  village_community_to_tribe_tt: "Przekształcimy się w rząd plemienny. Po tej zmianie dostępna stanie się zwykła droga plemienna do monarchii."
  village_community_clan_interest_law: "Interesy Zgromadzenia Klanów"
  village_community_clan_interest_law_desc: "Zgromadzenie daje pierwszeństwo jednemu szerokiemu blokowi interesów klanowych, bez odtwarzania sytuacji każdej rodziny z osobna. Polityki te odzwierciedlają praktyczne wpływy różnych grup kandydatów."
  cultivator_clan_interest_policy: "Klany Rolników"
  cultivator_clan_interest_policy_desc: "Rody rolnicze skupiają uwagę zgromadzenia na zbożu, magazynowaniu, uprawie ziemi i wzroście ludności wiejskiej."
  herder_clan_interest_policy: "Klany Pasterzy"
  herder_clan_interest_policy_desc: "Rody pasterskie skupiają uwagę zgromadzenia na żywym inwentarzu, sezonowej mobilności, zaopatrzeniu i dostępnej sile ludzkiej."
  warrior_clan_interest_policy: "Klany Wojowników"
  warrior_clan_interest_policy_desc: "Rody wojowników skupiają uwagę zgromadzenia na pospolitym ruszeniu wsi, lokalnej obronie i prestiżu wojskowym, kosztem zaufania zewnętrznego."
  elder_clan_interest_policy: "Klany Starszych"
  elder_clan_interest_policy_desc: "Starsi przywódcy gospodarstw domowych skupiają uwagę zgromadzenia na zwyczaju, mediacji i utrzymywaniu stabilnych stosunków między wsiami."

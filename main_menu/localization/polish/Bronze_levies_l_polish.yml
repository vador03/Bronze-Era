l_polish:
  levy_a_mustered_infantry: "Powołana Piechota Pospolita"
  levy_a_mustered_infantry_desc: "Powoływani spośród gospodarstw domowych zobowiązanych do służby wojskowej, wojownicy ci przybywają z własną bronią i wyposażeniem, gdy zostają wezwani przez lokalnych wodzów i władców. Brakuje im wyszkolenia elitarnych drużynników, lecz zapewniają siłę ludzką niezbędną do prowadzenia większych kampanii."
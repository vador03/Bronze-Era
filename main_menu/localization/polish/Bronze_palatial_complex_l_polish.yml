l_polish:
  bronze_age_palatial_complex: "Kompleks Pałacowy"
  bronze_age_palatial_complex_desc: "Administracyjne serce państwa epoki brązu: ufortyfikowane hale, archiwa, spichlerze, warsztaty i dwory królewskie, w których pod władzą pałacu rejestrowane i redystrybuowane są zboże, praca, podatki i dobra prestiżowe."
  bronze_age_palatial_complex_construction: "Budowa Kompleksu Pałacowego"
  # METODY PRODUKCJI
  bronze_age_palace_house: "Ród Pałacowy"
  bronze_age_palace_house_desc: "Regionalny mykeński ród pałacowy: skrybowie, drużynnicy, magazyny i arystokratyczni zależni, którzy zachowują lokalną władzę pod zwierzchnictwem Wielkiego Wanaksa."
  bronze_age_palace_house_setup_only_tt: "Rody pałacowe są rozmieszczane podczas konfiguracji scenariusza i reprezentują eksterytorialne mykeńskie podmioty polityczne."
  bronze_age_palace_administration: "Pałac Administracyjny"
  bronze_age_palace_administration_desc: "Skrybowie, nosiciele pieczęci i urzędnicy pałacowi rejestrują obowiązki pracy, daniny, nadania ziemskie i królewskie dekrety na glinianych tabliczkach."
  bronze_age_palace_trade: "Pałac Handlowy"
  bronze_age_palace_trade_desc: "Urzędnicy pałacowi nadzorują kupców, ważą metale, regulują magazyny i łączą dwór z sieciami handlu dalekosiężnego."
  bronze_age_palace_storage: "Pałac Magazynowy"
  bronze_age_palace_storage_desc: "Scentralizowane spichlerze i magazyny gromadzą plony, racjonują żywność dla robotników oraz chronią miasto przed głodem i oblężeniem."
  bronze_age_palace_sacred: "Święty Pałac"
  bronze_age_palace_sacred_desc: "Królewskie rytuały, służba kapłańska i święte ofiary wiążą władzę pałacu z bogami i ceremonialnym życiem miasta."
  bronze_age_palace_military: "Pałac Wojskowy"
  bronze_age_palace_military_desc: "Ufortyfikowana dzielnica pałacowa utrzymuje straże, wyposażenie rydwanów, arsenały i zapasy awaryjne do obrony królewskiego miasta."
  bronze_age_palace_bureaucracy: "Biurokracja Pałacowa"
  bronze_age_palace_bureaucracy_desc: "Warstwa skrybów, nadzorców i administratorów, którzy prowadzą rejestry i nadzorują zobowiązania gospodarki pałacowej."
  bronze_age_palace_redistribution: "Redystrybucja Pałacowa"
  bronze_age_palace_redistribution_desc: "Zboże, tkaniny, metale i siła robocza są gromadzone przez pałac i redystrybuowane wśród robotników, żołnierzy, świątyń i królewskich warsztatów."
  bronze_age_centralized_granaries: "Scentralizowane Spichlerze"
  bronze_age_centralized_granaries_desc: "Wielkie magazyny kontrolowane przez pałac, które przechowują plony, utrzymują osoby zależne i łagodzą skutki nieurodzajnych sezonów."
  palace_registry_maintenance_tablets: "Archiwa Tabliczek"
  palace_registry_maintenance_tablets_desc: "Obowiązki wojskowe, rejestry gospodarstw domowych i rachunki administracyjne są przechowywane na glinianych tabliczkach w archiwach rejestru."
  palace_registry_maintenance_leather: "Zapisy na Skórze"
  palace_registry_maintenance_leather_desc: "Trwałe dokumenty skórzane pozwalają urzędnikom prowadzić spisy wojskowe, inwentarze i rejestry administracyjne, które mogą wytrzymać częste użytkowanie."
  palace_registry_maintenance_potsherds: "Rejestry z Fragmentów Ceramiki"
  palace_registry_maintenance_potsherds_desc: "Potłuczone fragmenty ceramiki zapewniają tani materiał do prowadzenia rachunków, spisów, pokwitowań i innych rutynowych zapisów administracyjnych."
  palace_registry_maintenance_wood: "Rejestry Drewniane"
  palace_registry_maintenance_wood_desc: "Drewniane tabliczki i deski zapewniają powierzchnie wielokrotnego użytku do prowadzenia spisów, rejestracji zobowiązań i codziennych rachunków administracyjnych."
  palace_registry_maintenance_paper: "Archiwa Papierowe"
  palace_registry_maintenance_paper_desc: "Lekkie zapisy papierowe pozwalają urzędnikom prowadzić obszerne archiwa i korespondencję z niespotykaną dotąd wydajnością."
  # DODATKI
  palace_registry: "Rejestr Służby Pałacowej"
  palace_registry_desc: "Centralny urząd skrybów i administratorów odpowiedzialny za prowadzenie rejestrów gospodarstw domowych, zobowiązań, posiadłości ziemskich i służby wojskowej. Rejestr dostarcza pałacowi informacji niezbędnych do wystawiania wojsk i skutecznego zarządzania jego terytoriami."
  palace_trade_registry: "Rejestr Handlu Pałacowego"
  palace_trade_registry_desc: "Skrybowie związani z pałacem prowadzą rejestry karawan, kupców, dostaw danin, importowanych towarów i umów handlowych. Archiwa te pozwalają administracji monitorować i kierować przepływem bogactwa w całym państwie."
l_polish:

  dispersion_of_authority_advance: "Rozproszenie władzy"
  dispersion_of_authority_advance_desc: "Życie polityczne i gospodarcze staje się w mniejszym stopniu zależne od jednego ośrodka, ponieważ władza rozprzestrzenia się między miastami, społecznościami, gospodarstwami domowymi i lokalnymi instytucjami. Szerszy podział władzy sprzyja rozwojowi niezależnych osad oraz bardziej lokalnie zorganizowanej działalności gospodarczej."
  independent_craftsmen: "Niezależni rzemieślnicy"
  independent_craftsmen_desc: "Wykwalifikowani rzemieślnicy coraz częściej osiedlają się jako niezależni wytwórcy w rozwijających się miastach, obsługując lokalne rynki i klientów oraz rozwijając wyspecjalizowane tradycje rzemieślnicze. Ich obecność wzmacnia życie gospodarcze i zdolności produkcyjne miejskich społeczności."
  independent_smiths: "Niezależni kowale"
  independent_smiths_desc: "Metalurgowie coraz częściej wykonują swoje rzemiosło jako ugruntowane zawody miejskie, wytwarzając narzędzia i broń dla rosnącej liczby odbiorców. Skoncentrowana wiedza w zakresie obróbki żelaza i innych metali zwiększa zdolności produkcyjne miast oraz poszerza dostęp do wyspecjalizowanych narzędzi."

l_polish:
  rome_desc: "Zbudowany na wzgórzach nad Tybrem Rzym wyrósł z niewielkiej osady Latynów na dominującą potęgę środkowej Italii. Jego położenie nad rzeką i przy drogach Lacjum pomogło mu rozszerzać wpływy poprzez sojusze, wojny i kolonizację. Pod koniec republiki Rzym stał się centrum potęgi śródziemnomorskiej, której armie i kupcy przekształcali starożytny świat."
  jerusalem_desc: "Położona wśród wzgórz południowego Lewantu Jerozolima wyrosła na ważną osadę wyżynną i centrum religijne. Pod rządami królów Judy została ufortyfikowana i rozbudowana wokół świątyni oraz dzielnicy królewskiej. Jej położenie między wybrzeżem Morza Śródziemnego a terenami w głębi lądu uczyniło z niej zarówno święte centrum, jak i pożądany cel rywalizacji wielkich potęg starożytnego Bliskiego Wschodu."
  alexandria_desc: "Założona przez Aleksandra Wielkiego w 331 roku p.n.e. Aleksandria szybko stała się najważniejszym portem Egiptu Ptolemeuszy. Położona między Morzem Śródziemnym a jeziorem Mareotis, łączyła dolinę Nilu z szerszym światem greckim i bliskowschodnim. Jej instytucje królewskie, świątynie, port i środowiska uczonych uczyniły ją jednym z największych miast epoki hellenistycznej."
  megara_desc: "Megara była starożytnym greckim miastem położonym na przesmyku między Grecją środkową a Peloponezem. Jej położenie zapewniało dostęp zarówno do Zatoki Sarońskiej, jak i Korynckiej, sprzyjając handlowi morskiemu i kolonizacji zamorskiej. Megarejczycy zakładali kolonie w całym basenie Morza Śródziemnego i Morza Czarnego, podczas gdy samo miasto pozostawało ważną potęgą regionalną w okresie archaicznym i klasycznym."
  athens_desc: "Ateny wyrosły ze starożytnej osady skupionej wokół Akropolu i stały się jednym z najbardziej wpływowych państw-miast świata greckiego. Ich położenie w Attyce zapewniało dostęp do Morza Egejskiego poprzez pobliskie porty Pireusu, podczas gdy żyzne równiny pozwalały wyżywić rosnącą populację. W okresie klasycznym Ateny stały się wielką potęgą morską, handlową, polityczną i kulturalną."
  tunis_desc: "Osada znana później jako Tunis rozwijała się w cieniu Kartaginy, wielkiego miasta fenickiego i punickiego założonego pod koniec IX wieku p.n.e. Położony w pobliżu wybrzeża Morza Śródziemnego i połączony z żyznymi ziemiami północnej Afryki region stał się ważnym ośrodkiem rolnictwa i wymiany morskiej. Potęga Kartaginy sprawiła ostatecznie, że ta część wybrzeża stała się jednym z najważniejszych skrzyżowań zachodniego basenu Morza Śródziemnego."
  pingjin_desc: "Region wokół starożytnego Jinyangu rozwijał się wzdłuż rzeki Fen, w sercu Shanxi w północnych Chinach. Jego położenie między górami a północnymi równinami uczyniło go ważnym ośrodkiem rolniczym i strategicznym w późnej epoce brązu oraz we wczesnej epoce żelaza. Obszar ten został silnie związany z tradycjami politycznymi Jin oraz państwami, które po nim nastąpiły."
  jiaxing_desc: "Ziemie wokół starożytnego Jiaxingu leżały wśród bogatej sieci wodnej dolnego Jangcy, pomiędzy kręgami kulturowymi Wu i Yue. Rzeki, jeziora i tereny podmokłe sprzyjały intensywnemu rolnictwu i osadnictwu, podczas gdy drogi wodne łączyły region z szerszym światem południowo-wschodnich Chin. Społeczności epoki brązu i wczesnej epoki żelaza rozwijały tu własne tradycje, pozostając jednocześnie pod wpływem sąsiednich państw."
  changsha_desc: "Region wokół Changsha zajmował strategiczne położenie nad rzeką Xiang, w środkowej części dorzecza Jangcy. Żyzne doliny rzeczne sprzyjały osiadłym społecznościom rolniczym, podczas gdy drogi wodne łączyły południowe Chiny z centralnymi równinami. W późnej epoce brązu i we wczesnej epoce żelaza region ten należał do kręgu kulturowego Chu."
  ningxiang_desc: "Region Ningxiang w Hunan zachował jedne z najwspanialszych naczyń z brązu związanych z późnymi tradycjami Shang i wczesnymi tradycjami Zhou w południowych Chinach. Jego żyzne doliny i bliskość rzeki Xiang sprzyjały osiadłym społecznościom związanym z szerszym kręgiem kulturowym Chu. Region zasłynął szczególnie z wysoko rozwiniętych tradycji obróbki brązu."
  syracuse_desc: "Założone przez greckich osadników z Koryntu około 734 roku p.n.e. Syrakuzy wyrosły na jedno z najpotężniejszych greckich miast zachodniego basenu Morza Śródziemnego. Wspaniały naturalny port i żyzne zaplecze rolnicze zapewniały dobrobyt mieszkańcom, podczas gdy położenie miasta czyniło je ważnym ogniwem łączącym świat grecki, Sycylię i zachodnią część Morza Śródziemnego. W okresie klasycznym stało się ono potężną potęgą morską i wojskową."
  corinth_desc: "Korynt kontrolował wąski Przesmyk łączący Grecję środkową z Peloponezem oraz ważne szlaki między Zatoką Koryncką a Sarońską. Jego strategiczne położenie uczyniło go jednym z najbogatszych miast archaicznej Grecji, podczas gdy miejscowe warsztaty wytwarzały ceramikę, wyroby metalowe i dobra luksusowe na rynki całego Morza Śródziemnego. Korynt zakładał również kolonie wzdłuż zachodnich wybrzeży Grecji i Adriatyku."
  smyrna_desc: "Smyrna była starożytną osadą na egejskim wybrzeżu Anatolii, położoną wokół osłoniętego portu i żyznego zaplecza. Jej położenie łączyło śródlądowe szlaki Anatolii z morskim światem Morza Egejskiego. Miasto stało się ważnym ośrodkiem greckim w okresie archaicznym i klasycznym oraz było ściśle związane z szerszą siecią miast jońskich."
  ankara_desc: "Osada Ankara zajmowała strategiczne położenie na centralnym płaskowyżu Anatolii, gdzie krzyżowały się szlaki między zachodnią Anatolią, Morzem Czarnym a ziemiami na wschodzie. Region był związany z frygijskim, a później galackim kręgiem kulturowym. Położenie osady przy sieci dróg przecinających płaskowyż zapewniło jej trwałe znaczenie militarne i handlowe."
  amasya_desc: "Amasya leży w wąskiej dolinie rzeki Yeşilırmak, otoczonej górami północnej Anatolii. Jej obronne położenie i dostęp do zaplecza Morza Czarnego uczyniły ją ważnym ośrodkiem już od epoki żelaza. Region stał się później sercem Królestwa Pontu, lecz jego strategiczne znaczenie sięga czasów poprzedzających powstanie państwa królów Pontu."
  kayseri_desc: "Starożytna Mazaka leżała na ważnym skrzyżowaniu szlaków centralnego płaskowyżu Anatolii. Otoczona żyznymi ziemiami i zdominowana przez wulkaniczny masyw góry Erciyes, osada łączyła szlaki prowadzące ku Kapadocji, Eufratowi i zachodniej Anatolii. Stała się ważnym ośrodkiem królestw epoki żelaza w centralnej Anatolii, zanim została włączona do większych struktur imperialnych."
  izmit_desc: "Starożytna Nikomedia zajmowała osłonięte położenie na wschodnim wybrzeżu Morza Marmara. Region należał do królestwa Bitynii i leżał na szlakach morskich łączących Bosfor, Anatolię i Morze Egejskie. Naturalny port i strategiczne położenie uczyniły z niej ważną osadę późniejszego świata hellenistycznego."
  konya_desc: "Równina Konya stanowiła jeden z ważnych regionów rolniczych centralnej Anatolii. Starożytne osady na tym obszarze korzystały z żyznych gleb i dostępu do szlaków przecinających anatolijski płaskowyż. W epoce brązu i we wczesnej epoce żelaza region łączył kultury zachodniej Anatolii z kulturami centralnych i wschodnich wyżyn."
  sivas_desc: "Wyżyny wokół Sivas stanowiły naturalne skrzyżowanie szlaków między centralną Anatolią, górnym Eufratem a górami Pontyjskimi. Społeczności osiedlały się wzdłuż dolin rzecznych i górskich przełęczy, tworząc połączenia między kulturami Anatolii i wschodu. Ich strategiczne znaczenie wzrosło w epoce żelaza, gdy rywalizujące królestwa walczyły o kontrolę nad wschodnimi podejściami do płaskowyżu."
  trebizond_desc: "Wschodnie wybrzeże Morza Czarnego wokół Trapezuntu było częścią sieci morskich łączących Anatolię, Kaukaz i północne wybrzeża Morza Czarnego. W okresie archaicznym greckie osadnictwo rozszerzyło się wzdłuż tego wybrzeża, tworząc porty łączące lokalne zasoby z szerszym światem Morza Egejskiego. Otaczające góry zapewniały również dostęp do bogatego w minerały interioru."
  rhodes_desc: "Rodos zajmował dominującą pozycję na skrzyżowaniu Morza Egejskiego i wschodniej części Morza Śródziemnego. Jego trzy starożytne greckie miasta — Lindos, Ialysos i Kameiros — rozwinęły dobrze prosperujące sieci morskie w okresie archaicznym. Żeglarze i kupcy z wyspy łączyli Morze Egejskie z Anatolią, Cyprem, Egiptem i Lewantem."
  ioannina_desc: "Niecka wokół jeziora Pamvotis była zamieszkana przez społeczności północno-zachodniej Grecji już od czasów prehistorycznych. Otoczony górami i połączony szlakami Epiru region sprzyjał rolnictwu, pasterstwu i wymianie regionalnej. W epoce żelaza należał do szerszego kręgu kulturowego ludów epirockich."
  tarnovo_desc: "Wzgórza i doliny wokół Tarnowa stanowiły część starożytnego trackiego świata centralnych Bałkanów. Osady rozwijały się wzdłuż rzeki Jantry i otaczających ją wyżyn, korzystając z żyznych ziem oraz dostępu do regionalnych szlaków. Region łączył naddunajskie równiny z wnętrzem bałkańskich gór."
  nis_desc: "Starożytne Naissus zajmowało strategiczne położenie w miejscu, gdzie zbiegały się szlaki centralnych Bałkanów. Otaczające doliny łączyły dorzecze Dunaju z regionami Morawy i Morza Egejskiego, czyniąc z osady ważne skrzyżowanie już od epoki żelaza. Szerszy region zamieszkiwały społeczności trackie, a później celtyckie, zanim rozpoczęła się ekspansja Rzymu."
  durres_desc: "Założone jako Epidamnos przez greckich osadników z Koryntu i Korkyry pod koniec VII wieku p.n.e. Dyrrachium zajmowało jeden z najlepszych naturalnych portów wschodniego Adriatyku. Jego położenie czyniło z niego ważne ogniwo między światem greckim a ludami bałkańskiego interioru. Handel metalami, żywym inwentarzem, produktami rolnymi i wyrobami rzemieślniczymi przynosił miastu bogactwo."
  belgrad_desc: "Wzgórze u zbiegu Sawy i Dunaju tworzyło naturalną fortecę i skrzyżowanie szlaków centralnych Bałkanów. Znana w starożytności jako Singidunum osada rozwinęła się na bazie wcześniejszych społeczności celtyckich i trackich. Jej położenie łączyło naddunajskie pogranicze z wnętrzem Bałkanów oraz szlakami prowadzącymi ku Adriatykowi i Morzu Egejskiemu."
  dubrovnik_desc: "Osłonięte wybrzeże wokół Dubrownika należało od starożytności do morskiego świata wschodniego Adriatyku. Pobliskie osady łączyły społeczności iliryjskie z greckimi sieciami handlowymi oraz ludami bałkańskiego interioru. Surowe wybrzeże, naturalne porty i pobliskie wyspy sprzyjały żegludze oraz wymianie przybrzeżnej."
  sredets_desc: "Kotlina Sofijska leży na naturalnym skrzyżowaniu szlaków między Dunajem, Morzem Egejskim a zachodnimi Bałkanami. Starożytne społeczności osiedlały się wokół jej żyznych dolin i bogatych w minerały gór, podczas gdy szlaki prowadzące przez okoliczne przełęcze łączyły ziemie trackie z Europą Środkową i Anatolią. Osada znana później jako Serdica rozwijała się w ramach tej długo istniejącej sieci regionalnej."
  ohrid_desc: "Brzegi jeziora Ochrydzkiego były zamieszkane przez osiadłe społeczności już od czasów prehistorycznych, korzystające z żyznych dolin, obfitości wody i szlaków prowadzących przez góry zachodnich Bałkanów. Region należał do szerszego świata starożytnych ludów iliryjskich i macedońskich. Jego położenie między Adriatykiem a centralnymi Bałkanami czyniło go naturalnym skrzyżowaniem handlu i migracji."
  prizren_desc: "Kotlina Prizrenu leży u podnóża gór Šar, wzdłuż szlaków łączących centralne Bałkany ze światem Adriatyku i Morza Egejskiego. Społeczności epoki żelaza zamieszkujące szerszy region były związane z tradycjami iliryjskimi i dardańskimi. Żyzne doliny oraz dostęp do zasobów górskich sprzyjały osadnictwu połączonemu sieciami handlowymi i pasterskimi."
  aquila_desc: "Wyżynna kotlina centralnych Apeninów była zamieszkana przez społeczności italskie na długo przed podbojem rzymskim. Górskie doliny łączyły ludy interioru z wybrzeżami Adriatyku i Morza Tyrreńskiego, podczas gdy żyzne wyżyny sprzyjały rolnictwu i pasterstwu. Region należał do kręgu kulturowego Sabinów, Westynów, Marsów i sąsiednich ludów italskich."
  salerno_desc: "Zatoka Salerno leży między Morzem Tyrreńskim a górami południowej Italii, tworząc naturalny port i skrzyżowanie szlaków między społecznościami nadbrzeżnymi i śródlądowymi. Greccy osadnicy zakładali kolonie w całej Kampanii i południowej Italii, podczas gdy okoliczne ziemie pozostawały domem dla różnorodnych ludów italskich. Region stał się częścią kręgu kulturowego znanego później jako Wielka Grecja."
  messina_desc: "Wąska cieśnina między Sycylią a Kalabrią uczyniła Mesynę jednym z najważniejszych szlaków morskich starożytnego Morza Śródziemnego. Greccy osadnicy założyli Zankle przy porcie około początku VIII wieku p.n.e., wykorzystując jej położenie na szlakach morskich między światem jońskim a tyrreńskim. Miasto prosperowało dzięki handlowi morskiemu i kontroli nad przeprawą przez cieśninę."
  naples_desc: "Założony jako Neapolis przez greckich osadników pod koniec VI wieku p.n.e. Neapol rozwinął się przy jednym z najlepszych naturalnych portów Morza Tyrreńskiego. Miasto należało do greckiego kręgu kulturowego południowej Italii, utrzymując jednocześnie bliskie kontakty z sąsiednimi ludami italskimi. Żyzne okolice i nadmorskie położenie uczyniły z niego ważny ośrodek handlowy."
  milano_desc: "Starożytne Mediolanum rozpoczęło swoją historię jako osada galijskich Insubrów na żyznej Nizinie Padańskiej. Jego położenie na skrzyżowaniu szlaków przecinających północną Italię zapewniało dostęp do Alp, Adriatyku i zachodniej części Morza Śródziemnego. Osada zyskiwała na znaczeniu w późnej epoce żelaza, gdy społeczności celtyckie coraz częściej wchodziły w kontakt z potęgami etruskimi i rzymskimi."
  genoa_desc: "Osłonięte wybrzeże Ligurii wokół Genui było zamieszkane przez społeczności liguryjskie, zanim stało się ważnym punktem handlowym Morza Śródziemnego. Naturalny port łączył wybrzeże z alpejskimi przełęczami i śródlądową Niziną Padańską. Wymiana morska wiązała region z kupcami etruskimi, greckimi, a później rzymskimi."
  bologna_desc: "Starożytna Felsina była jednym z głównych ośrodków świata etruskiego na północ od Apeninów. Położona na żyznej Nizinie Padańskiej łączyła terytoria Etrusków w środkowej Italii z ziemiami celtyckimi i alpejskimi na północy. Osada stała się ważnym centrum rolnictwa, obróbki metali i wymiany regionalnej, zanim rozpoczęła się ekspansja Rzymu."
  palermo_desc: "Założone przez fenickich osadników na północnym wybrzeżu Sycylii Palermo rozwinęło się wokół chronionego naturalnego portu zwróconego ku zachodniej części Morza Śródziemnego. Jego położenie łączyło fenickie sieci handlowe z ludami Sycylii i szerszego świata środkowego Morza Śródziemnego. Osada stała się później częścią strefy wpływów punickich wraz z rozszerzaniem się potęgi Kartaginy na wyspie."
  verona_desc: "Położona nad rzeką Adygą, u południowych podejść do Alp, Werona zajmowała naturalne skrzyżowanie między Półwyspem Apenińskim a Europą Środkową. Region był zamieszkany przez społeczności weneckie i celtyckie przed ekspansją Rzymu. Kontrola nad doliną rzeki i pobliskimi szlakami alpejskimi sprawiała, że osada zyskiwała na znaczeniu w późnej epoce żelaza."
  siena_desc: "Wzgórza środkowej Toskanii były zamieszkane przez społeczności etruskie, których miasta kontrolowały szlaki przez Apeniny i zaplecze Morza Tyrreńskiego. Region wokół późniejszej Sieny stanowił część tej sieci osad na wzgórzach, gospodarstw rolnych i ośrodków obróbki metali. Jego położenie łączyło śródlądowe doliny z etruskimi miastami zachodniego wybrzeża."
  pisa_desc: "Dolna dolina Arno stanowiła naturalne miejsce spotkania śródlądowych regionów Toskanii z Morzem Tyrreńskim. Starożytne Pisae rozwijało się w krajobrazie kształtowanym przez społeczności etruskie, greckie i liguryjskie. Dostęp do rzeki i położenie nad wybrzeżem sprzyjały handlowi morskiemu oraz kontaktom z szerszym światem zachodniego Morza Śródziemnego."
  padova_desc: "Starożytne Patavium rozwijało się wśród dróg wodnych równiny Veneto, w regionie zamieszkanym przez społeczności weneckie. Jego położenie łączyło wybrzeże Adriatyku z podnóżami Alp i interiorami północnej Italii. Rolnictwo, hodowla zwierząt, obróbka metali i handel wspierały rozwój zamożnej osady, która w późnej epoce żelaza coraz silniej wiązała się z potęgą Rzymu."
  parma_desc: "Żyzne ziemie wokół rzeki Parmy były zamieszkane przez społeczności celtyckie i liguryjskie przed ekspansją Rzymu. Położony przy szlakach przecinających Nizinę Padańską region łączył podnóża Alp z Italią środkową i Adriatykiem. Produkcja rolna oraz kontrola nad przeprawami rzecznymi sprawiały, że obszar zyskiwał na wartości w późnej epoce żelaza."
  mantova_desc: "Jeziora i drogi wodne wokół Mantui tworzyły łatwy do obrony obszar osadniczy w sercu Niziny Padańskiej. Region był zamieszkany przez społeczności etruskie, a później znajdował się pod wpływem celtyckich migracji z północy. Jego położenie między Adriatykiem, Alpami a środkową Italią uczyniło z niego ważny ośrodek rolnictwa i wymiany regionalnej."
  lucca_desc: "Kotlina Lukki była zamieszkana przez społeczności etruskie i liguryjskie przed ekspansją Rzymu. Położona między Apeninami a wybrzeżem Morza Tyrreńskiego łączyła śródlądowe doliny ze szlakami morskimi. Rolnictwo, hodowla zwierząt oraz dostęp do zasobów mineralnych północnych Apeninów sprzyjały osadnictwu w regionie."
  brescia_desc: "Starożytna Brixia leżała na południowym skraju przedgórza Alp, w regionie zamieszkanym przez celtyckich Cenomani i sąsiednie ludy. Jej położenie łączyło Nizinę Padańską z alpejskimi przełęczami i jeziorem Garda. Osada zyskiwała na znaczeniu dzięki rolnictwu, obróbce metali i handlowi w późnej epoce żelaza."
  cremona_desc: "Dolny bieg Padu stanowił jeden z głównych szlaków komunikacyjnych północnej Italii. Region wokół Cremony był zamieszkany przez społeczności celtyckie i etruskie przed ekspansją Rzymu, a ruch rzeczny łączył osady na całej żyznej równinie. Kontrola nad Padem zapewniała dostęp zarówno do Adriatyku, jak i do interioru Półwyspu Apenińskiego."
  pavia_desc: "Zbieg Ticino i Padu tworzył strategiczną przeprawę w sercu północnej Italii. Społeczności celtyckie zamieszkiwały okoliczny region w epoce żelaza, podczas gdy rzeki łączyły Nizinę Padańską z alpejskimi przełęczami i wybrzeżem Adriatyku. Położenie osady sprawiało, że zyskiwała ona na znaczeniu wraz z rozszerzaniem się potęgi Rzymu na północ."
  perugia_desc: "Perugia była jednym z głównych ośrodków starożytnej Etrurii położonych na wzgórzach, kontrolującym szlaki przez dolinę Tybru i centralne Apeniny. Jej wyniesione położenie zapewniało naturalną obronę oraz kontrolę nad otaczającymi ziemiami rolniczymi. Miasto uczestniczyło w sieciach politycznych i handlowych łączących etruskie miasta Toskanii i Umbrii."
  ancona_desc: "Założona przez greckich osadników z Syrakuz około IV wieku p.n.e. Ankona zajmowała naturalnie osłonięty port na środkowym wybrzeżu Adriatyku. Położenie miasta łączyło świat grecki z ludami iliryjskimi i italskimi Adriatyku. Jej kupcy uczestniczyli w handlu morskim łączącym Italię, Bałkany i wschodnią część Morza Śródziemnego."
  ravenna_desc: "Region nadbrzeżny wokół Rawenny należał do świata północnego Adriatyku w późnej epoce żelaza. Jego laguny i drogi wodne zapewniały osłonięty dostęp do morza, podczas gdy szlaki przez Nizinę Padańską łączyły ten obszar ze społecznościami etruskimi, weneckimi i celtyckimi. Krajobraz sprzyjał zarówno wymianie morskiej, jak i kontroli nad nizinami północnej Italii."

  bronze_city_prestige_debug.1.desc: "Opcje dostępne wyłącznie z konsoli, służące do testowania rozszerzenia Prestiżu Miasta."
  bronze_city_prestige_debug.1.a: "Przelicz wszystkie miasta i odbuduj rejestr."
  bronze_city_prestige_debug.1.b: "Otwórz okno misji miejskiej."
  bronze_city_prestige_debug.1.c: "Ustaw upadek stolicy na Etap 1."
  bronze_city_prestige_debug.1.d: "Ustaw upadek stolicy na Etap 2."
  bronze_city_prestige_debug.1.e: "Ustaw upadek stolicy na Etap 3."
  bronze_city_prestige_debug.1.f: "Przetestuj wydarzenie opuszczenia na Etapie 4."
  bronze_city_prestige_debug.1.g: "Całkowicie przywróć stolicę do stanu sprzed upadku."

  bronze_city_mission_secure_food_supply: "Zabezpiecz Zaopatrzenie w Żywność"
  bronze_city_mission_secure_food_supply_desc: "Zorganizuj na nowo spichlerze i szlaki zaopatrzeniowe dla zagrożonego miasta."
  bronze_city_mission_secure_food_supply_price: "Zakupy Zboża"
  bronze_choose_urban_mission_city: "Wybierz Miasto"
  bronze_no_valid_urban_mission_city: "Żadne kwalifikujące się miasto nie jest gotowe na kolejną misję miejską."
  bronze_no_valid_artisan_mission_city: "Żadne kwalifikujące się miasto nie posiada wymaganej gałęzi rzemiosła."
  bronze_no_valid_market_mission_city: "Żadne kwalifikujące się miasto nie posiada wymaganej infrastruktury handlowej."
  bronze_no_valid_fortification_mission_city: "Żadne kwalifikujące się miasto nie posiada fortyfikacji wymagających odbudowy."
  bronze_no_valid_food_mission_city: "Żadne kwalifikujące się miasto nie cierpi obecnie z powodu zagrożonego zaopatrzenia w żywność."
  bronze_city_monuments.100.title: "Królewskie Kamieniołomy"
  bronze_city_monuments.100.desc: "Geodeci wyznaczyli złoża kamienia i zorganizowali drogi do [bronze_great_pyramid_site.GetName]. Skala prac w kamieniołomach określi wszystko, co nastąpi później."
  bronze_city_monuments.100.a: "Otwórz pełne królewskie kamieniołomy."
  bronze_city_monuments.100.b: "Zmniejsz planowaną skalę."
  bronze_city_monuments.101.title: "Praca Egiptu"
  bronze_city_monuments.101.desc: "Nadzorcy żądają robotników, racji żywnościowych, narzędzi i ochrony dla projektu, który przetrwa swoich pierwszych budowniczych."
  bronze_city_monuments.101.a: "Zmobilizuj królewski system pracy."
  bronze_city_monuments.101.b: "Zażądaj więcej od lokalnych okręgów."
  bronze_city_monuments.102.title: "Kamień dla Horyzontu"
  bronze_city_monuments.102.desc: "Największe bloki kamienia muszą zostać przetransportowane drogami i szlakami wodnymi bez zagłodzenia obozów roboczych ani pobliskich miast."
  bronze_city_monuments.102.a: "Sfinansuj bezpieczny transport i zaopatrzenie."
  bronze_city_monuments.102.b: "Opróżnij pobliskie spichlerze."
  bronze_city_monuments.103.title: "Piramida Wzrasta"
  bronze_city_monuments.103.desc: "Kolejne warstwy wznoszą się nad [bronze_great_pyramid_site.GetName], lecz główna konstrukcja wciąż wymaga wielu lat pracy."
  bronze_city_monuments.103.a: "Kontynuuj prace z pełną siłą."
  bronze_city_monuments.103.b: "Zaakceptuj mniejszy monument."
  bronze_city_monuments.104.title: "Dom Wieczności"
  bronze_city_monuments.104.desc: "Kapłani i architekci domagają się świątyni grobowej, dróg procesyjnych i ostatecznego świętego ogrodzenia."
  bronze_city_monuments.104.a: "Ukończ cały kompleks grobowy."
  bronze_city_monuments.104.b: "Dokończ jedynie najważniejsze obrzędy."
  bronze_city_monuments.105.title: "Nowa Wielka Piramida"
  bronze_city_monuments.105.desc: "Ostatnie kamienie zostały ułożone, a kompleks królewski w [bronze_great_pyramid_site.GetName] jest gotowy do poświęcenia."
  bronze_city_monuments.105.a: "Poświęć monument na wieczność."
  bronze_city_monuments.107.title: "Robotnicy Odmawiają Pracy w Kamieniołomach"
  bronze_city_monuments.107.desc: "Wyczerpanie i skąpe racje żywnościowe doprowadziły prace do zatrzymania. Dwór musi albo zaspokoić potrzeby robotników, albo narzucić porządek."
  bronze_city_monuments.107.a: "Zapłać robotnikom i zapewnij im zaopatrzenie."
  bronze_city_monuments.107.b: "Zmuś ich do powrotu."
  bronze_city_monuments.108.title: "Konwoje Zaopatrzeniowe Zawodzą"
  bronze_city_monuments.108.desc: "Opóźnione barki i puste spichlerze zagrażają zarówno ekipom budowlanym, jak i okolicznym terenom."
  bronze_city_monuments.108.a: "Kup zapasy awaryjne."
  bronze_city_monuments.108.b: "Niech okręgi poniosą ciężar niedoboru."
  bronze_city_monuments.suspend: "Wstrzymaj Prace Królewskie"
  bronze_city_development.200.title: "Rozliczenie Festiwalu"
  bronze_city_development.200.desc: "Lata przygotowań w [bronze_city_mission_site.GetName] dobiegły wyznaczonego czasu. Pomyślność zdecyduje, czy odwiedzający zapamiętają przepych, czy chaos."
  bronze_city_development.200.a: "Festiwal oddaje cześć miastu."
  bronze_city_development.201.title: "Nowi Mistrzowie Warsztatów"
  bronze_city_development.201.desc: "Rzemieślnicy i skrybowie wypróbowali patronat oferowany przez [bronze_city_mission_site.GetName]. Trwały rozwój rzemiosła jest teraz w zasięgu ręki."
  bronze_city_development.201.a: "Przyznaj im stałe siedziby."
  bronze_city_development.202.title: "Odnowiony Rynek"
  bronze_city_development.202.desc: "Nowe magazyny i chronione drogi sprowadziły kupców z powrotem do [bronze_city_mission_site.GetName]."
  bronze_city_development.202.a: "Otwórz rynek dla odległych kupców."
  bronze_city_development.203.title: "Mury Odbudowane"
  bronze_city_development.203.desc: "Odbudowane umocnienia [bronze_city_mission_site.GetName] ponownie kontrolują podejścia do miasta."
  bronze_city_development.203.a: "Poświęć odbudowane mury."
  bronze_city_development.204.title: "Zabezpieczone Spichlerze"
  bronze_city_development.204.desc: "Urzędnicy odpowiedzialni za zaopatrzenie [bronze_city_mission_site.GetName] donoszą, że miasto może ponownie przetrwać nieurodzaj."
  bronze_city_development.204.a: "Zaplombuj pełne spichlerze."
  bronze_city_development.mission_failed: "Przedsięwzięcie zakończyło się niepowodzeniem; ponieś konsekwencje."
  bronze_city_development.320.title: "Rywalizujące Miasta"
  bronze_city_development.320.desc: "[bronze_city_rivalry_home.GetName] i [bronze_city_rivalry_other.GetName] rywalizują teraz o kupców, rzemieślników i sławę. Ich rywalizację można załagodzić, odpowiedzieć na nią inwestycjami lub przekształcić w niebezpieczną intrygę."
  bronze_city_development.320.a: "Wynegocjuj porozumienie handlowe."
  bronze_city_development.320.b: "Prześcignij rywalizujące miasto w budowie."
  bronze_city_development.320.c: "Podkop ich pomyślność."
  bronze_city_development.321.title: "Rywalizacja w Państwie"
  bronze_city_development.321.desc: "Elity [bronze_city_rivalry_home.GetName] i [bronze_city_rivalry_other.GetName] domagają się pierwszeństwa, inwestycji i królewskiej przychylności."
  bronze_city_development.321.a: "Zainwestuj w oba miasta."
  bronze_city_development.321.b: "Wesprzyj pierwsze miasto."
  bronze_city_development.330.title: "Miasto Bliskie Opuszczenia"
  bronze_city_development.330.desc: "Całe dzielnice [bronze_declining_city.GetName] stoją puste. Możemy sfinansować kosztowną odbudowę, nadzorować częściową ewakuację lub oficjalnie pozostawić miasto jego ruinom."
  bronze_city_development.330.a: "Odbuduj miasto za wszelką cenę."
  bronze_city_development.330.b: "Ewakuuj najsłabsze dzielnice."
  bronze_city_development.330.c: "Opuść miasto."

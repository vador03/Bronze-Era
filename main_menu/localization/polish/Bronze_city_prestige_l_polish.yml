  bronze_city_prestige_debug.4.desc: "Utwórz testową rywalizację między kwalifikującymi się Wielkimi Miastami. Jeśli to możliwe, preferowane jest zagraniczne miasto sąsiada."
  bronze_city_prestige_debug.4.a: "Utwórz testową rywalizację."

  bronze_city_mission_develop_market_price: "Inwestycja w Rynek"
  bronze_city_mission_restore_fortifications: "Odbuduj Umocnienia"
  bronze_city_mission_restore_fortifications_desc: "Napraw mury i umocnienia garnizonowe wokół wybranego miasta."

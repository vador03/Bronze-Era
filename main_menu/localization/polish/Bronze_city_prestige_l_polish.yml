  bronze_city_prestige_debug.2.desc: "Przesuń aktywny projekt Wielkiej Piramidy do wydarzenia kolejnego etapu."
  bronze_city_prestige_debug.2.a: "Przejdź do kolejnego etapu projektu."
  bronze_city_prestige_debug.3.title: "Debugowanie Misji Miejskiej"
  bronze_city_prestige_debug.3.desc: "Otwórz wydarzenie rozstrzygające dla aktualnie aktywnej misji miejskiej."
  bronze_city_prestige_debug.3.a: "Rozstrzygnij aktywną misję."

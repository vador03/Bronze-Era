  STATIC_MODIFIER_NAME_bronze_city_prestige_rank_1_world_city: "Prestiż Miasta: Miasto Świata"
  STATIC_MODIFIER_DESC_bronze_city_prestige_rank_1_world_city: "Jedno z najważniejszych miast znanego świata, słynące z liczby ludności, bogactwa, zabytków i wpływów politycznych."
  STATIC_MODIFIER_NAME_bronze_city_prestige_rank_2_imperial_city: "Prestiż Miasta: Miasto Cesarskie"
  STATIC_MODIFIER_DESC_bronze_city_prestige_rank_2_imperial_city: "Dominujący ośrodek królewski i administracyjny, którego wpływy sięgają daleko poza otaczające je ziemie."
  STATIC_MODIFIER_NAME_bronze_city_prestige_rank_3_great_city: "Prestiż Miasta: Wielkie Miasto"
  STATIC_MODIFIER_DESC_bronze_city_prestige_rank_3_great_city: "Ważny ośrodek ludności, handlu, religii i władzy regionalnej."
  STATIC_MODIFIER_NAME_bronze_city_prestige_rank_4_regional_city: "Prestiż Miasta: Miasto Regionalne"
  STATIC_MODIFIER_DESC_bronze_city_prestige_rank_4_regional_city: "Ważna osada pełniąca funkcję regionalnego rynku i siedziby władzy."
  STATIC_MODIFIER_NAME_bronze_city_prestige_rank_5_local_city: "Prestiż Miasta: Miasto Lokalne"
  STATIC_MODIFIER_DESC_bronze_city_prestige_rank_5_local_city: "Uznany ośrodek miejski wywierający wpływ na swoje najbliższe okolice."
  BRONZE_CITY_PRESTIGE_LEDGER_TAB: "Wielkie Miasta"
  BRONZE_CITY_PRESTIGE_LEDGER_TITLE: "Wielkie Miasta Znanych Ziem"
  BRONZE_CITY_PRESTIGE_URBAN_INFLUENCE: "Wpływy Miejskie"
  BRONZE_CITY_PRESTIGE_URBAN_INFLUENCE_DESC: "Wymienione są wszystkie miasta i megalopolis na świecie. Piętnaście najwyżej sklasyfikowanych miast zapewnia ich właścicielom Wpływy Miejskie."
  BRONZE_CITY_PRESTIGE_URBAN_INFLUENCE_TT: "Wpływy Miejskie są zdobywane dzięki posiadaniu miast znajdujących się w pierwszej piętnastce świata. Są przeliczane na Projekcję Potęgi i miesięczny Prestiż poprzez jeden skonsolidowany modyfikator państwowy."
  BRONZE_CITY_PRESTIGE_INFLUENCE_SCORE: "Wpływy"
  BRONZE_CITY_PRESTIGE_WORLD_RANK: "Pozycja Światowa"
  BRONZE_CITY_PRESTIGE_UNRANKED: "-"
  BRONZE_CITY_PRESTIGE_CITY: "Miasto"
  BRONZE_CITY_PRESTIGE_OWNER: "Właściciel"
  BRONZE_CITY_PRESTIGE_POPULATION: "Ludność"
  BRONZE_CITY_PRESTIGE_CULTURE: "Kultura"
  BRONZE_CITY_PRESTIGE_RELATIVE_SCORE: "Wynik względny"
  BRONZE_CITY_PRESTIGE_CURRENT_BONUSES: "Efekty obecnej rangi"
  BRONZE_CITY_PRESTIGE_LOCAL_CITY_NO_BONUS: "Miasta Lokalne otrzymują niewielki bonus do atrakcyjności migracyjnej."
  BRONZE_CITY_PRESTIGE_NO_KNOWN_CITIES: "Obecnie nie zarejestrowano żadnego miasta ani megalopolis."
  BRONZE_CITY_PRESTIGE_DYNAMIC_SCORE_TT: "Surowy prestiż określa dokładną pozycję w światowym rankingu. Ranga wpływów uwzględnia również miejsce w rankingu, minimalny prestiż oraz status polityczny Miast Cesarskich."
  STATIC_MODIFIER_NAME_bronze_city_prestige_influence_1: "Słynny Ośrodek Miejski"
  STATIC_MODIFIER_DESC_bronze_city_prestige_influence_1: "Państwo kontroluje co najmniej jedno z najważniejszych miast znanego świata."
  STATIC_MODIFIER_NAME_bronze_city_prestige_influence_2: "Regionalne Wpływy Miejskie"
  STATIC_MODIFIER_DESC_bronze_city_prestige_influence_2: "Wielkie miasta państwa rozciągają jego władzę poza najbliższe okolice."
  STATIC_MODIFIER_NAME_bronze_city_prestige_influence_3: "Wielkie Wpływy Miejskie"
  STATIC_MODIFIER_DESC_bronze_city_prestige_influence_3: "Państwo kontroluje główne ośrodki ludności, handlu i administracji."
  STATIC_MODIFIER_NAME_bronze_city_prestige_influence_4: "Dominujące Wpływy Miejskie"
  STATIC_MODIFIER_DESC_bronze_city_prestige_influence_4: "Miasta państwa kształtują dyplomację, handel i prestiż w całym znanym świecie."
  STATIC_MODIFIER_NAME_bronze_city_prestige_influence_5: "Władca Wielkich Miast"
  STATIC_MODIFIER_DESC_bronze_city_prestige_influence_5: "Kilka z największych miast świata znajduje się pod władzą tego państwa."
  STATIC_MODIFIER_NAME_bronze_city_royal_capital_regional: "Słynna Stolica Królewska"
  STATIC_MODIFIER_DESC_bronze_city_royal_capital_regional: "Szanowana stolica regionalna dodaje władzy panującej dynastii autorytetu."
  STATIC_MODIFIER_NAME_bronze_city_royal_capital_great: "Wielka Stolica Królewska"
  STATIC_MODIFIER_DESC_bronze_city_royal_capital_great: "Sława tego wielkiego miasta wzmacnia prawowitość władcy."
  STATIC_MODIFIER_NAME_bronze_city_royal_capital_imperial: "Cesarska Stolica Królewska"
  STATIC_MODIFIER_DESC_bronze_city_royal_capital_imperial: "Stolica o cesarskiej sławie wyraźnie potwierdza prawo władcy do sprawowania zwierzchniej władzy."
  STATIC_MODIFIER_NAME_bronze_city_royal_capital_world: "Stolica Znanych Ziem"
  STATIC_MODIFIER_DESC_bronze_city_royal_capital_world: "Największe miasto swojej epoki jest najwybitniejszym symbolem władzy dynastycznej."
  STATIC_MODIFIER_NAME_bronze_city_scholars_gathered: "Zgromadzeni Uczeni"
  STATIC_MODIFIER_DESC_bronze_city_scholars_gathered: "Skrybowie, kapłani i uczeni podróżnicy uczynili z tego miasta ośrodek wiedzy."
  STATIC_MODIFIER_NAME_bronze_city_scholarly_patronage: "Patronat nad Nauką"
  STATIC_MODIFIER_DESC_bronze_city_scholarly_patronage: "Dwór wspiera nauczycieli, archiwa, skrybów i wymianę nowych idei."
  STATIC_MODIFIER_NAME_bronze_city_scholarly_court: "Uczony Dwór"
  STATIC_MODIFIER_DESC_bronze_city_scholarly_court: "Nauczyciele i wykształceni skrybowie podnoszą poziom edukacji dostępnej wśród rodziny panującej."
  STATIC_MODIFIER_NAME_bronze_city_famous_craftsmen: "Słynni Rzemieślnicy"
  STATIC_MODIFIER_DESC_bronze_city_famous_craftsmen: "Mistrzowie rzemiosła przyciągają zlecenia i uczniów z odległych krain."
  STATIC_MODIFIER_NAME_bronze_city_merchant_caravan: "Karawana Kupiecka"
  STATIC_MODIFIER_DESC_bronze_city_merchant_caravan: "Bogata karawana ożywiła handel i rozniosła wieści o pomyślności miasta po odległych krainach."
  STATIC_MODIFIER_NAME_bronze_city_foreign_envoys: "Zagraniczni Posłowie"
  STATIC_MODIFIER_DESC_bronze_city_foreign_envoys: "Zagraniczne delegacje na dworze poprawiają pozycję dyplomatyczną państwa."
  STATIC_MODIFIER_NAME_bronze_city_famine: "Głód w Mieście"
  STATIC_MODIFIER_DESC_bronze_city_famine: "Niedobór żywności zabija mieszkańców, opróżnia warsztaty i plami reputację miasta."
  STATIC_MODIFIER_NAME_bronze_city_trade_collapse: "Upadek Handlu Miejskiego"
  STATIC_MODIFIER_DESC_bronze_city_trade_collapse: "Przerwane szlaki i opustoszałe targowiska gwałtownie zmniejszyły pomyślność i wpływy miasta."
  STATIC_MODIFIER_NAME_bronze_city_population_exodus: "Exodus Ludności"
  STATIC_MODIFIER_DESC_bronze_city_population_exodus: "Rodziny i rzemieślnicy opuszczają zniszczone miasto na rzecz bezpieczniejszych osad."
  bronze_city_welcomed_envoys: "Przyjęto Posłów"
  bronze_city_taxed_envoys: "Wysoko Opodatkowano Posłów"
  bronze_city_prestige.1.title: "Zgromadzenie Uczonych"
  bronze_city_prestige.1.desc: "Skrybowie, kapłani, uzdrowiciele i uczeni podróżnicy gromadzą się w [bronze_city.GetName]. Przy odpowiednim patronacie ich debaty i archiwa mogłyby zwiększyć zarówno sławę miasta, jak i poziom wykształcenia naszego dworu."
  bronze_city_prestige.1.a: "Sfinansuj ich szkoły i archiwa."
  bronze_city_prestige.1.b: "Niech utrzymują się sami."
  bronze_city_prestige.2.title: "Słynni Rzemieślnicy"
  bronze_city_prestige.2.desc: "Warsztaty [bronze_city.GetName] goszczą teraz rzemieślników, których wyroby cieszą się uznaniem daleko poza naszymi granicami. Ich umiejętności mogą stać się trwałym źródłem pomyślności, jeśli dwór udzieli im wsparcia."
  bronze_city_prestige.2.a: "Przyznaj im warsztaty i królewskie zlecenia."
  bronze_city_prestige.2.b: "Nałóż nadzwyczajną daninę na ich sukces."
  bronze_city_prestige.3.title: "Karawana Kupiecka"
  bronze_city_prestige.3.desc: "Do [bronze_city.GetName] dotarła pomyślna karawana, przywożąc rzadkie surowce, zagranicznych kupców i cenne kontrakty. Jej przywódcy proszą o ochronę i przychylne traktowanie."
  bronze_city_prestige.3.a: "Chroń kupców i wspieraj trwały handel."
  bronze_city_prestige.3.b: "Pobierz możliwie najwyższą opłatę celną."
  bronze_city_prestige.4.title: "Zagraniczni Posłowie"
  bronze_city_prestige.4.desc: "Sława [bronze_city.GetName] przyciągnęła posłów z sąsiednich dworów. Sposób ich przyjęcia wpłynie na to, jak zagraniczni władcy będą postrzegać zarówno naszą stolicę, jak i naszą dynastię."
  bronze_city_prestige.4.a: "Przyjmij ich z kosztownymi honorami."
  bronze_city_prestige.4.b: "Zażądaj darów i opłat ceremonialnych."
  bronze_city_prestige.5.title: "Głód w Wielkim Mieście"
  bronze_city_prestige.5.desc: "Spichlerze [bronze_city.GetName] nie są w stanie wyżywić jego zatłoczonych dzielnic. Ceny rosną, najsłabsi mieszkańcy umierają, a każda opustoszała ulica szkodzi reputacji miasta."
  bronze_city_prestige.5.a: "Kup zboże za wszelką cenę."
  bronze_city_prestige.5.b: "Wprowadź ścisłe racjonowanie."
  bronze_city_prestige.6.title: "Upadek Handlu"
  bronze_city_prestige.6.desc: "Kupcy opuszczają [bronze_city.GetName], gdy drogi niszczeją, targowiska podupadają, a dostawcy z odległych krain przestają przybywać. Bez interwencji miasto utraci bogactwo, ludność i prestiż."
  bronze_city_prestige.6.a: "Dotuj targowiska i szlaki handlowe."
  bronze_city_prestige.6.b: "Zagarnij to, co pozostało, i zaakceptuj upadek."
  bronze_city_prestige.7.title: "Exodus Ludności"
  bronze_city_prestige.7.desc: "Zniszczenia i brak bezpieczeństwa wypędziły rodziny z [bronze_city.GetName]. Rzemieślnicy zabierają swoje narzędzia, rolnicy opuszczają pobliskie pola, a dawny prestiż miasta zanika wraz z jego mieszkańcami."
  bronze_city_prestige.7.a: "Zorganizuj uporządkowane przesiedlenie na terenie państwa."
  bronze_city_prestige.7.b: "Zamknij bramy i zabezpiecz skarbiec."

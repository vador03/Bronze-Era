l_polish:
  religious_tolerance_reform: "Tolerancja Religijna"
  religious_tolerance_reform_desc: "Administracja zezwala różnym wspólnotom religijnym na zachowanie ustanowionych obrzędów i instytucji, ograniczając potrzebę bezpośredniej ingerencji państwa w sprawy lokalnego kultu."
  thalassocracy_reform: "Talassokracja"
  thalassocracy_reform_desc: "Państwo uznaje sprawy morskie za jeden ze swoich głównych priorytetów, kierując większą uwagę administracji na porty, żeglugę, siły morskie oraz społeczności, które je utrzymują."
  agricultural_cultivation_reform: "Rozwój Rolnictwa"
  agricultural_cultivation_reform_desc: "Administracja odgrywa aktywniejszą rolę w organizowaniu i wspieraniu produktywnego wykorzystania ziemi rolnej. Lepszy nadzór nad uprawą i powiązanymi zasobami wzmacnia materialne podstawy państwa."
  religious_laws_enforced_reform: "Egzekwowanie Prawa Religijnego"
  religious_laws_enforced_reform_desc: "Zwyczaje religijne zostają ściślej włączone do administracji państwa, a urzędnicy otrzymują zadanie podtrzymywania ustanowionych obowiązków religijnych i odpowiedniego regulowania zachowania."
  vassal_obligation_decree_reform: "Obowiązki Wasalne"
  vassal_obligation_decree_reform_desc: "Obowiązki podległych władców i wspólnot są coraz dokładniej określane i egzekwowane poprzez ustanowione powinności. Daniny, służba wojskowa i inne formy wsparcia stają się bardziej regularnymi elementami administracji państwowej."
  literate_aristocracy_reform: "Piśmienna Arystokracja"
  literate_aristocracy_reform_desc: "Członkowie arystokracji coraz częściej zdobywają umiejętność czytania i pisania niezbędną do udziału w pracy rządu. Ich zdolność do czytania, pisania i prowadzenia zapisów zapewnia dworowi większą pulę kompetentnych administratorów."
  diplomatic_traditions_reform: "Tradycje Dyplomatyczne"
  diplomatic_traditions_reform_desc: "Państwo rozwija ustalone praktyki prowadzenia stosunków z zagranicznymi władcami, zapewniając posłom i innym przedstawicielom uznane procedury negocjacji, komunikacji i utrzymywania więzi dyplomatycznych."
  patrimonialism_reform: "Patrymonializm"
  patrimonialism_reform_desc: "Dwór władcy stanowi podstawę rządów, a władza polityczna sprawowana jest poprzez osobiste więzi lojalności i zależności. Obowiązki administracyjne powierza się członkom szerzej pojmowanego dworu władcy oraz jego osobistemu otoczeniu."
  trade_office_network_reform: "Sieć Biur Handlowych"
  trade_office_network_reform_desc: "Państwo rozwija sieć biur i mianowanych przedstawicieli nadzorujących handel na odległych rynkach. Placówki te zapewniają administracji stałą obecność za granicą oraz ułatwiają przepływ i nadzór nad handlem zagranicznym."
  merchant_seals_reform: "Pieczęcie Kupieckie"
  merchant_seals_reform_desc: "Administracja przyjmuje ustanowione pieczęcie i oznaczenia służące do uwierzytelniania dokumentów handlowych, towarów i transakcji. Praktyki te ułatwiają identyfikację legalnie działających kupców oraz prowadzenie wiarygodnych rejestrów w ramach państwowych sieci handlowych."
  multilingual_diplomats_reform: "Wielojęzyczni Dyplomaci"
  multilingual_diplomats_reform_desc: "Przedstawiciele dyplomatyczni zdobywają większą znajomość języków używanych przez sąsiednie dwory i ludy. Pozwala to przedstawicielom państwa skuteczniej prowadzić negocjacje i korespondencję ponad granicami językowymi."

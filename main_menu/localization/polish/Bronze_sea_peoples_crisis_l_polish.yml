l_polish:
  sea_peoples_crisis: "Kryzys Ludów Morza"
  sea_peoples_crisis_desc: "Widoczna [situation_with_icon|e] Późnej Epoki Brązu śledząca upadek gospodarek pałacowych, głód, ruchy uchodźców, najazdy i osadnictwo na wybrzeżach.\n\n#T Obecna Sytuacja#!\nFaza: #Y [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_phase').GetValue|V0]#! /5\nPresja Kryzysu: #R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_pressure').GetValue|V0]#! /100\nPresja Głodu: #R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_famine_pressure').GetValue|V0]#! /100\nUdane Najazdy na Wybrzeża: #R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_raids').GetValue|V0]#!\nOdparte Najazdy: #P [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_repulsed_raids').GetValue|V0]#!\nZakłócenia Rynków: #R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_market_damage').GetValue|V0]#!\nRuchy Uchodźców: #R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_refugee_movements').GetValue|V0]#!\nEnklawy Migrantów: #R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_migrant_enclaves').GetValue|V0]#!\nEnklawy Sphejnicyzowane: #P [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_phoenicianized_enclaves').GetValue|V0]#!\nPowiązanie z Hatti: #Y Upadek Hatti obejmuje imperialną Anatolię#!\n\n#T Przebieg Faz#!\nFazy postępują wraz z upływem czasu kryzysu: faza 2 po 3 latach, faza 3 po 6 latach, faza 4 po 10 latach, faza 5 po 15 latach. Presja pokazuje tempo regionalnego upadku i lokalne zagrożenie; nie blokuje postępu faz.\n\nNajbardziej bezpośrednio zagrożone państwa we wschodniej części Morza Śródziemnego, na Morzu Egejskim, w Egipcie, na Cyprze i w Lewancie mogą korzystać z kosztownych działań w celu ograniczenia lokalnych szkód. Hatti i jego poddani korzystają z odrębnych działań Upadku Hatti dotyczących imperialnego głodu, buntu wasali i rozpadu."
  sea_peoples_crisis_overview_card: "Przegląd Kryzysu"
  sea_peoples_crisis_overview_card_desc: "Kryzys Ludów Morza to regionalna [situation_with_icon|e] we wschodniej części Morza Śródziemnego. Śledzi głód, najazdy, ruchy uchodźców, upadek handlu, osadnictwo na wybrzeżach i kryzys pałaców. Specyficzne dla Hatti kwestie głodu, buntu wasali i rozpadu są obsługiwane przez odrębną sytuację Upadku Hatti."
  sea_peoples_crisis_panel_phase: "Faza Kryzysu"
  sea_peoples_crisis_panel_phase_value: "#Y [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_phase').GetValue|V0]#! /5"
  sea_peoples_crisis_panel_pressure: "Presja Kryzysu"
  sea_peoples_crisis_panel_pressure_value: "#R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_pressure').GetValue|V0]#! /100"
  sea_peoples_crisis_panel_famine: "Presja Głodu"
  sea_peoples_crisis_panel_famine_value: "#R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_famine_pressure').GetValue|V0]#! /100"
  sea_peoples_crisis_panel_raids: "Najazdy na Wybrzeża"
  sea_peoples_crisis_panel_raids_value: "#R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_raids').GetValue|V0]#! / #P [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_repulsed_raids').GetValue|V0]#!"
  sea_peoples_crisis_panel_refugees: "Ruchy Uchodźców"
  sea_peoples_crisis_panel_refugees_value: "#R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_refugee_movements').GetValue|V0]#!"
  sea_peoples_crisis_panel_enclaves: "Enklawy Migrantów"
  sea_peoples_crisis_panel_enclaves_value: "#R [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_migrant_enclaves').GetValue|V0]#!"
  sea_peoples_crisis_panel_phoenicianized: "Enklawy Sfenicjanizowane"
  sea_peoples_crisis_panel_phoenicianized_value: "#P [GetSituationByKey('sea_peoples_crisis').MakeScope.GetVariable('sea_peoples_global_phoenicianized_enclaves').GetValue|V0]#!"
  sea_peoples_crisis_panel_hatti: "Powiązanie z Hatti"
  sea_peoples_crisis_panel_hatti_value: "#Y Odrębny kryzys#!"
  sea_peoples_crisis_actions_card: "Możliwe Reakcje"
  sea_peoples_crisis_actions_card_desc: "Poniżej pojawiają się dostępne działania dla państw bezpośrednio dotkniętych kryzysem Ludów Morza. Hatti i jego poddani korzystają zamiast tego z działań Upadku Hatti. Każda reakcja kosztuje zboże, bogactwo, stabilność, cierpliwość stanów, siłę żywą, marynarzy lub kontrolę polityczną."
  sea_peoples_crisis_map_card: "Jak Czytać Mapę"
  sea_peoples_crisis_map_card_desc: "Mapa wyróżnia dotknięte państwa, spalone porty, splądrowane wybrzeża i wewnętrzny rozpad. Strefa kryzysu obejmuje obszar wschodniej części Morza Śródziemnego i nie obejmuje Italii. Rozpad właściwy dla Hatti przedstawiono w sytuacji Upadku Hatti."
  hint_sea_peoples_crisis: "[GetSituationByKey('sea_peoples_crisis').GetNameWithNoTooltip]"
  hint_sea_peoples_crisis_hint_text: "$hint_sea_peoples_crisis_hint_text_1$\n\n$hint_sea_peoples_crisis_hint_text_2$"
  hint_sea_peoples_crisis_hint_text_1: "Kryzys Ludów Morza to [situation_with_icon|e], a nie zwykłe państwo. Śledzi głód, najazdy, ruchy uchodźców, upadek handlu i presję osadniczą we wschodniej części Morza Śródziemnego."
  hint_sea_peoples_crisis_hint_text_2: "#T Sugerowana Reakcja:#!\n@arrow_bonus_tier_2! Korzystaj z [actions_with_icon|e] kryzysowych wcześnie, ale spodziewaj się rzeczywistych kosztów w zbożu, prestiżu, stabilności, sile żywej, marynarzach i zadowoleniu stanów.\n@arrow_bonus_tier_1! Najazdy morskie wystawiają teraz na próbę poszczególne porty. Forty, armie nadbrzeżne, floty, obrona portów i eskortowane konwoje zmniejszają szansę powodzenia najazdu.\n@arrow_bonus_tier_1! Państwa nadbrzeżne i pałacowe powinny fortyfikować porty, chronić konwoje z brązem, ostrożnie otwierać spichlerze i przygotowywać się na presję osadniczą, zamiast oczekiwać łatwego zwycięstwa."
  sea_peoples_situation_location_active_tt: "Ta lokacja należy do państwa obecnie dotkniętego Kryzysem Ludów Morza."
  sea_peoples_situation_location_port_hit_tt: "Port ten został bezpośrednio zaatakowany przez Ludów Morza."
  sea_peoples_situation_location_raided_tt: "Właściciel ucierpiał wskutek najazdów na wybrzeże."
  sea_peoples_situation_location_refugees_tt: "Właściciel znajduje się pod presją uchodźców."
  sea_peoples_situation_location_breakdown_tt: "Właściciel cierpi z powodu wewnętrznego rozpadu."
  sea_peoples_situation_legend_active: "Dotknięte kryzysem"
  sea_peoples_situation_legend_burned_port: "Spalony port"
  sea_peoples_situation_legend_raided: "Splądrowane wybrzeże"
  sea_peoples_situation_legend_breakdown: "Wewnętrzny rozpad"
  sea_peoples_crisis_name: "Kryzys Ludów Morza"
  sea_peoples_crisis_name_desc: "Długi ciąg wydarzeń upadku Późnej Epoki Brązu napędzany głodem, załamaniem handlu, najazdami na wybrzeża, uchodźcami, upadkiem pałaców i migracjami morskimi."
  sea_peoples_raider_country_identity_text: "To państwo należy do strefy najeźdźców Ludów Morza"
  sea_peoples_crisis_phase_at_least_text: "Kryzys Ludów Morza jest co najmniej w fazie $VALUE|0$"
  sea_peoples_crisis_active_country_text: "Kryzys Ludów Morza jest aktywny"
  sea_peoples_crisis_eastern_mediterranean_country_text: "To państwo należy do strefy kryzysu wschodniej części Morza Śródziemnego"
  sea_peoples_crisis_direct_country_text: "To państwo otrzymuje bezpośrednie wydarzenia związane z Kryzysem Ludów Morza; Hatti i jego poddani korzystają z odrębnej sytuacji Upadku Hatti"
  sea_peoples_crisis_maritime_target_text: "To państwo jest narażone na najazdy morskie i migracje"
  sea_peoples_crisis_high_assimilation_zone_text: "To państwo leży w strefie wysokiej asymilacji dla osadnictwa Ludów Morza"
  sea_peoples_crisis_egyptian_target_text: "To państwo jest egipskim celem kryzysu"
  sea_peoples_crisis_mycenaean_target_text: "To państwo jest związane ze światem pałaców mykeńskich"
  sea_peoples_begin_crisis_text: "Rozpoczyna się Kryzys Ludów Morza"
  sea_peoples_set_phase_text: "Kryzys Ludów Morza wchodzi w fazę $VALUE|0$"
  sea_peoples_advance_phase_text: "Kryzys Ludów Morza się pogłębia"
  sea_peoples_add_pressure_text: "$VALUE|+=0$ presji kryzysu"
  sea_peoples_add_famine_pressure_text: "$VALUE|+=0$ presji głodu"
  sea_peoples_mark_raided_coast_text: "Najazdy na wybrzeże uderzają w państwo"
  sea_peoples_coastal_raid_damage_text: "Najazd Ludów Morza pali nadbrzeżny port, zabija część ludności prowincji, zmniejsza zapasy żywności, niszczy dobrobyt, podkopuje stabilność i zakłóca lokalny rynek"
  sea_peoples_coastal_raid_repulsed_text: "Obrona wybrzeża odpiera najazd Ludów Morza, choć wybrzeże wciąż ponosi niewielkie straty"
  sea_peoples_apply_raid_stability_shock_text: "Stabilność spada wskutek szoku wywołanego najazdem. Większe lub bardziej zaludnione porty powodują silniejszy spadek."
  sea_peoples_mark_refugee_wave_text: "Fale uchodźców wkraczają do państwa"
  sea_peoples_refugees_admitted_text: "Statki z uchodźcami zostają wpuszczone. Ludność rośnie wokół miejsca lądowania, lecz cierpią zapasy żywności, stabilność i porządek publiczny."
  sea_peoples_refugees_supervised_text: "Uchodźcy zostają osiedleni pod nadzorem pałacu. Natychmiast wchłonięta zostaje mniejsza liczba ludzi, lecz presja kryzysu zostaje lepiej opanowana."
  sea_peoples_mark_trade_collapse_text: "Sieci handlowe Epoki Brązu załamują się"
  sea_peoples_mark_internal_breakdown_text: "Załamuje się porządek wewnętrzny"
  sea_peoples_mark_settlement_pressure_text: "Rośnie presja osadnicza Ludów Morza"
  sea_peoples_unmanaged_settlement_text: "Migrantów osiedlają się tam, gdzie władza jest słaba. Lokalna ludność rośnie, lecz żywność, dobrobyt i stabilność zostają uszczuplone."
  sea_peoples_mark_assimilation_text: "Grupy Ludów Morza rozpoczynają asymilację"
  sea_peoples_watched_settlement_text: "Migranci zostają skierowani do nadzorowanych okręgów. Asymilacja postępuje, lecz możni, kapłani, zapasy żywności i stabilność ponoszą cenę."
  sea_peoples_assimilation_open_text: "Przybysze morscy zostają przyjęci do lokalnego życia. Asymilacja postępuje, a ludność nieznacznie rośnie, lecz porządek religijny i zapasy żywności zostają nadwyrężone."
  sea_peoples_service_trade_integration_text: "Gospodarstwa Ludów Morza zostają związane ze służbą i handlem. Porty zyskują użytecznych ludzi i handel, podczas gdy dawne elity tracą kontrolę."
  sea_peoples_prepare_port_defense_text: "Porty przygotowują się na ataki morskie"
  sea_peoples_egypt_mobilization_text: "Egipt mobilizuje się przeciwko Ludom Morza"
  sea_peoples_phoenician_opening_text: "Otwiera się fenicka szansa morska"
  sea_peoples_phoenician_opening_event_text: "Fenickie porty zamieniają kryzys w szansę, zyskując handel i asymilację, lecz godząc się na niestabilność i presję migrantów."
  sea_peoples_clear_acute_damage_text: "Ostry etap kryzysu zaczyna ustępować"
  sea_peoples_phase_1_climate_pressure: "Presja Klimatyczna"
  sea_peoples_phase_1_climate_pressure_desc: "Nieudane zbiory i zmieniające się wzorce pogodowe obciążają spichlerze, pałacowe magazyny i lojalność wsi."
  sea_peoples_phase_2_migration_pressure: "Presja Migracyjna"
  sea_peoples_phase_2_migration_pressure_desc: "Przesiedlone grupy przemieszczają się wzdłuż wybrzeży, wysp, dróg i rozpadających się szlaków handlowych."
  sea_peoples_phase_3_trade_crash: "Załamanie Handlu Śródziemnomorskiego"
  sea_peoples_phase_3_trade_crash_desc: "Miedź, cyna, zboże, drewno, dobra luksusowe i pałacowe sieci wymiany rozpadają się."
  sea_peoples_phase_4_settlement_fragmentation: "Rozpad Osadnictwa"
  sea_peoples_phase_4_settlement_fragmentation_desc: "Najeźdźcy, uchodźcy, najemnicy i przesiedlone gospodarstwa zaczynają osiedlać się na opuszczonych lub osłabionych ziemiach."
  sea_peoples_phase_5_iron_age_transition: "Przejście do Epoki Żelaza"
  sea_peoples_phase_5_iron_age_transition_desc: "Dawny świat pałaców upadł. Nowe potęgi morskie, plemienne i regionalne zaczynają go zastępować."
  sea_peoples_raided_coast_modifier: "Spalone Wybrzeże"
  sea_peoples_raided_coast_modifier_desc: "Porty, szopy okrętowe, magazyny i nadbrzeżne wsie zostały splądrowane przez morskie drużyny."
  sea_peoples_market_disrupted_modifier: "Zakłócony Rynek Brązu"
  sea_peoples_market_disrupted_modifier_desc: "Najazdy i straty konwojów zakłóciły przepływ zboża, ryb, miedzi, cyny, drewna i towarów portowych przez lokalną sieć rynkową."
  sea_peoples_refugee_pressure_modifier: "Presja Uchodźców"
  sea_peoples_refugee_pressure_modifier_desc: "Głodni uchodźcy i przesiedlone rodziny napływają do państwa, zwiększając obciążenie żywności i porządku."
  sea_peoples_refugee_artisans_modifier: "Rzemieślnicy wśród Uchodźców"
  sea_peoples_refugee_artisans_modifier_desc: "Niektórzy uchodźcy przynoszą umiejętności, wiedzę o ładunkach i pracę portową, lecz zwiększają również zapotrzebowanie na żywność i napięcia społeczne."
  sea_peoples_supervised_refugees_modifier: "Nadzorowani Uchodźcy"
  sea_peoples_supervised_refugees_modifier_desc: "Uchodźcy są ewidencjonowani, nadzorowani i osiedlani pod kontrolą pałacu, co ogranicza nieporządek kosztem cierpliwości politycznej."
  sea_peoples_palace_economy_collapse_modifier: "Upadek Gospodarki Pałacowej"
  sea_peoples_palace_economy_collapse_modifier_desc: "Redystrybucyjna gospodarka pałacowa nie jest już w stanie niezawodnie przemieszczać zboża, brązu, tkanin i siły roboczej."
  sea_peoples_internal_breakdown_modifier: "Wewnętrzny Rozpad"
  sea_peoples_internal_breakdown_modifier_desc: "Rywalizujący możni, pretendenci, głodne wsie i uzbrojone frakcje rozrywają państwo od środka."
  sea_peoples_settlement_pressure_modifier: "Osadnictwo Ludów Morza"
  sea_peoples_settlement_pressure_modifier_desc: "Morscy migranci i drużyny wojenne naciskają na możliwość osiedlenia się na osłabionych obszarach nadbrzeżnych."
  sea_peoples_assimilation_pressure_modifier: "Asymilacja Morska"
  sea_peoples_assimilation_pressure_modifier_desc: "Obcy osadnicy wtapiają się w lokalne społeczeństwo poprzez służbę, małżeństwa, handel i więzi z sanktuariami."
  sea_peoples_assimilation_open_modifier: "Otwarta Asymilacja"
  sea_peoples_assimilation_open_modifier_desc: "Morskie gospodarstwa są przyjmowane do lokalnego życia, przyspieszając integrację, lecz niepokojąc świątynie i uszczuplając zapasy żywności."
  sea_peoples_service_trade_integration_modifier: "Integracja przez Służbę i Handel"
  sea_peoples_service_trade_integration_modifier_desc: "Przybysze zostają związani z portami, obowiązkami służbowymi i sieciami handlowymi, dzięki czemu stają się użyteczni, lecz dawne mechanizmy kontroli słabną."
  sea_peoples_port_defense_preparations_modifier: "Obrona Portów"
  sea_peoples_port_defense_preparations_modifier_desc: "Władcy skierowali zasoby na okręty, nadbrzeżne posterunki obserwacyjne, straże portowe i awaryjne spichlerze."
  sea_peoples_egypt_mobilization_modifier: "Mobilizacja Delty"
  sea_peoples_egypt_mobilization_modifier_desc: "Egipt mobilizuje okręty, łuczników, garnizony i zboże, aby bronić Delty i podejść do Nilu."
  sea_peoples_phoenician_opening_modifier: "Fenicka Szansa"
  sea_peoples_phoenician_opening_modifier_desc: "Upadek dawnych zwierzchników daje lewantyjskim miastom portowym więcej przestrzeni na handel, budowę flot i przyjmowanie migrantów."
  sea_peoples_fortify_coastal_palaces: "Ufortyfikuj Pałace Nadbrzeżne"
  sea_peoples_fortify_coastal_palaces_desc: "Skieruj pracę, brąz, drewno i zboże na wzmocnienie portów, murów pałacowych, posterunków obserwacyjnych i szop okrętowych przeciwko najazdom morskim."
  sea_peoples_open_emergency_granaries: "Otwórz Awaryjne Spichlerze"
  sea_peoples_open_emergency_granaries_desc: "Uwolnij pałacowe zapasy zboża pod zbrojnym nadzorem. Lud może jeść, lecz elity i kapłaństwo będą niezadowolone z utraty świętych i królewskich zapasów."
  sea_peoples_escort_bronze_convoys: "Eskortuj Konwoje z Brązem"
  sea_peoples_escort_bronze_convoys_desc: "Skieruj okręty i marynarzy do ochrony konwojów z miedzią, cyną, drewnem i dobrami luksusowymi. Handel przetrwa kosztem wyczerpania floty."
  sea_peoples_raise_palace_levies: "Powołaj Kontyngenty Pałacowe"
  sea_peoples_raise_palace_levies_desc: "Wezwij wiejskich robotników, drużynników i zależnych od pałacu do nadzwyczajnej obrony. Wzmacnia to państwo teraz, lecz później osłabia zbiory."
  sea_peoples_hire_migrant_war_bands: "Zatrudnij Migranckie Drużyny Wojenne"
  sea_peoples_hire_migrant_war_bands_desc: "Przekształć przesiedlonych wojowników i morskich najeźdźców w opłacanych obrońców. Są użyteczni, uzbrojeni, głodni i raczej nie znikną po cichu."
  sea_peoples_controlled_settlement: "Kontrolowane Osadnictwo"
  sea_peoples_controlled_settlement_desc: "Przyznaj nadzorowane ziemie morskim migrantom w zamian za służbę. Ogranicza to natychmiastową przemoc, lecz przyspiesza przemiany demograficzne."
  sea_peoples_sanctuary_appeasement: "Udobruchaj Sanktuaria"
  sea_peoples_sanctuary_appeasement_desc: "Wydaj bogactwo i zboże na ofiary, święta i wsparcie kapłanów. Bogowie i lud mogą się uspokoić, lecz gospodarka odczuje ten koszt."
  sea_peoples_mycenaean_league_levy: "Powołaj Kontyngent Ligi"
  sea_peoples_mycenaean_league_levy_desc: "Odwołaj się do achajskich przysiąg i zażądaj okrętów, brązu i wojowników od członków ligi. Pomaga to w lokalnym przetrwaniu, lecz osłabia jedność Achajów."
  sea_peoples_delta_defense_mobilization: "Zmobilizuj Obronę Delty"
  sea_peoples_delta_defense_mobilization_desc: "Skieruj egipskie zboże, okręty, łuczników i władzę królewską do obrony ujść Nilu przed wielkim zagrożeniem morskim."
  sea_peoples_open_phoenician_harbours: "Otwórz Fenickie Porty"
  sea_peoples_open_phoenician_harbours_desc: "Pozwól lewantyjskim portom przyjmować marynarzy, rzemieślników, uchodźców i kupców-migrantów. Porty rozkwitną, lecz dawny porządek straci kontrolę."
  sea_peoples_raid_coastal_settlements: "Splądruj Osady Nadbrzeżne"
  sea_peoples_raid_coastal_settlements_desc: "Wyślij łodzie wojenne przeciwko znanemu państwu nadbrzeżnemu. Udany najazd przynosi niewolników, żywność, towary i złoto, lecz powtarzające się najazdy dają okolicznym potęgom karygodne roszczenia wojenne."
  sea_peoples_choose_raid_target: "Wybierz Cel Najazdu"
  sea_peoples_no_valid_raid_targets: "Brak dostępnych prawidłowych celów najazdu na wybrzeże."
  sea_peoples_raid_success_tt: "Najazd kończy się sukcesem: zyskujemy złoto, niewolników, żywność i cenne towary portowe. Cel traci żywność, dobrobyt i stabilność oraz otrzymuje przeciwko nam karny casus belli."
  sea_peoples_raid_rich_success_tt: "Najazd przebija się do bogatych magazynów: zyskujemy większe łupy i więcej niewolników, lecz nasza reputacja najeźdźców gwałtownie rośnie."
  sea_peoples_raid_repulsed_tt: "Najazd zostaje odparty. Tracimy marynarzy, siłę żywą i prestiż, a cel otrzymuje przeciwko nam karny casus belli."
  sea_peoples_raid_punitive_cb_tt: "Nasze powtarzające się najazdy stały się osławione. Znane potęgi morskie mogą otrzymać przeciwko nam karny casus belli."
  sea_peoples_raid_no_target_tt: "Nie wybrano prawidłowego celu najazdu."
  cb_sea_peoples_punitive_raid: "Wojna Karna przeciwko Najeźdźcom Morskim"
  cb_sea_peoples_punitive_raid_desc: "Państwo to wielokrotnie napadało na wybrzeża, brało niewolników i zakłócało morską wymianę Epoki Brązu. Jego okręty i porty muszą zostać ukarane."
  sea_peoples_fortify_coastal_palaces_tt: "Obrona wybrzeża zostaje wzmocniona na kilka lat, lecz zboże, siła robocza i rozwój pałacu zostają obciążone."
  sea_peoples_open_emergency_granaries_tt: "Presja głodu spada, podczas gdy autorytet pałacu i zadowolenie elit cierpią wskutek przymusowego uwolnienia zboża."
  sea_peoples_escort_bronze_convoys_tt: "Szlaki handlowe zostają na pewien czas zabezpieczone, lecz marynarze i wyczerpanie wojenne ponoszą ten ciężar."
  sea_peoples_raise_palace_levies_tt: "Obrona zostaje wzmocniona, lecz pola tracą siłę roboczą, a presja głodu rośnie."
  sea_peoples_hire_migrant_war_bands_tt: "Presja kryzysu gwałtownie spada, lecz uzbrojone grupy migrantów zwiększają presję osadniczą i ryzyko społeczne."
  sea_peoples_controlled_settlement_tt: "Osadnicy są zarządzani poprzez służbę i nadzorowane nadania ziemi, zamieniając niepokoje na długoterminową presję asymilacyjną."
  sea_peoples_sanctuary_appeasement_tt: "Legitymizacja sanktuariów uspokaja niepokoje, lecz ofiary pochłaniają zboże i produktywne bogactwo."
  sea_peoples_mycenaean_league_levy_tt: "Siły ligi zostają zmobilizowane, zmniejszając lokalną presję kryzysu kosztem osłabienia Jedności Achajskiej."
  sea_peoples_delta_defense_mobilization_tt: "Egipt zyskuje silną mobilizację obronną, lecz płaci za nią zbożem, siłą żywą, autorytetem i wyczerpaniem wojennym."
  sea_peoples_open_phoenician_harbours_tt: "Fenickie porty zyskują handel i siłę asymilacji, godząc się na większą niestabilność i presję migrantów."
  sea_peoples_coastal_palaces_fortified_modifier: "Ufortyfikowane Pałace Nadbrzeżne"
  sea_peoples_coastal_palaces_fortified_modifier_desc: "Awaryjna obrona portów, posterunki obserwacyjne i fortyfikacje pałacowe chronią wybrzeże, lecz pochłaniają zboże, pracę i cierpliwość polityczną."
  sea_peoples_emergency_granaries_modifier: "Otwarte Awaryjne Spichlerze"
  sea_peoples_emergency_granaries_modifier_desc: "Pałacowe magazyny żywią państwo. Przetrwanie się poprawia, lecz cierpią handel, zadowolenie elit i dyscyplina rezerw."
  sea_peoples_bronze_convoys_modifier: "Eskortowane Konwoje z Brązem"
  sea_peoples_bronze_convoys_modifier_desc: "Chronione konwoje utrzymują przepływ brązu i handel, lecz okręty zostają związane zadaniem, a marynarze są wyczerpani."
  sea_peoples_palace_levies_modifier: "Powołane Kontyngenty Pałacowe"
  sea_peoples_palace_levies_modifier_desc: "Nadzwyczajne kontyngenty zwiększają siłę obronną kosztem produkcji wiejskiej i wytrzymałości ludności."
  sea_peoples_migrant_war_bands_modifier: "Migranckie Drużyny Wojenne"
  sea_peoples_migrant_war_bands_modifier_desc: "Przesiedleni wojownicy walczą teraz dla państwa, lecz ich obecność tworzy nowe żądania osadnicze i problemy z kontrolą."
  sea_peoples_controlled_settlement_modifier: "Kontrolowane Osadnictwo Ludów Morza"
  sea_peoples_controlled_settlement_modifier_desc: "Morscy migranci są osiedlani pod nadzorem pałacu, co poprawia asymilację, lecz obciąża żywność i lokalną władzę."
  sea_peoples_sanctuary_appeasement_modifier: "Udobruchane Sanktuaria"
  sea_peoples_sanctuary_appeasement_modifier_desc: "Kapłani, ofiary i święta uspokajają lud, lecz ofiary pochłaniają zboże i siłę roboczą."
  sea_peoples_league_emergency_levy_modifier: "Nadzwyczajny Kontyngent Ligi"
  sea_peoples_league_emergency_levy_modifier_desc: "Kontyngenty związane achajskimi przysięgami wzmacniają obronę, lecz wywierają silną presję na możnych, sojuszników i spójność ligi."
  sea_peoples_delta_defense_modifier: "Mobilizacja Obrony Delty"
  sea_peoples_delta_defense_modifier_desc: "Egipt skierował swoje okręty, łuczników, zapasy i królewski prestiż do obrony Delty Nilu."
  sea_peoples_open_phoenician_harbours_modifier: "Otwarte Fenickie Porty"
  sea_peoples_open_phoenician_harbours_modifier_desc: "Porty Lewantu czerpią zyski z przesiedleń i morskiego przystosowania, godząc się na niepokoje i mieszanie kultur."
  sea_peoples_crisis.1.title: "Kryzys Ludów Morza"
  sea_peoples_crisis.1.desc: "Wieści przemieszczają się szybciej niż statki: zbiory zawiodły w odległych krainach, pałacowe magazyny stoją puste, a uzbrojone rodziny wyruszają na morze. Niektórzy przybywają jako najeźdźcy, inni jako uchodźcy, jeszcze inni jako najemnicy, których nie ma już kto opłacać. Porządek wschodniej części Morza Śródziemnego zaczyna pękać."
  sea_peoples_crisis.1.a: "Pałacowe zapiski nazwą tę katastrofę."
  sea_peoples_crisis.1.b: "Ostrzeżcie porty i policzcie zboże."
  sea_peoples_crisis_1a_tt: "Kryzys rozpoczyna się bez nadzwyczajnych przygotowań. Prestiż spada, gdy dwór zostaje zaskoczony rozwojem wydarzeń."
  sea_peoples_crisis_1b_tt: "Kryzys rozpoczyna się, a porty przygotowują się wcześniej. Presja najazdów spada, lecz cierpią zboże, prestiż i zadowolenie kupców."
  sea_peoples_crisis.5.title: "Kryzys się Pogłębia"
  sea_peoples_crisis.5.desc: "To, co zaczęło się od nieudanych zbiorów i rozproszonych najazdów, stało się szerszym ruchem ludzi, statków i strachu. Posłowie mówią o spalonych miastach, utraconych karawanach i królach, którzy nie potrafią już dowodzić własnymi wojownikami."
  sea_peoples_crisis.5.a: "Przypływ rośnie."
  sea_peoples_crisis.5.b: "Utrzymajmy linię jeszcze przez jeden sezon."
  sea_peoples_crisis_5a_tt: "Kryzys przechodzi do następnej fazy."
  sea_peoples_crisis_5b_tt: "Faza zostaje lokalnie opóźniona, lecz presja kryzysu rośnie, a prestiż spada."
  sea_peoples_crisis.10.title: "Puste Spichlerze"
  sea_peoples_crisis.10.desc: "Pałacowe spichlerze zostają otwarte przed następnymi zbiorami. Racjonowanie się kurczy, wsie ukrywają swoje zboże, a kapłani dostrzegają niepokój w każdym omenie."
  sea_peoples_crisis.10.a: "Głód się rozprzestrzenia."
  sea_peoples_crisis.10.b: "Wydajmy prestiż, by utrzymać racjonowanie."
  sea_peoples_crisis_10a_tt: "Głód i presja kryzysu gwałtownie rosną, a stabilność spada."
  sea_peoples_crisis_10b_tt: "Głód rośnie mniej, lecz prestiż, możni i duchowieństwo płacą za przymusową dyscyplinę racjonowania."
  sea_peoples_crisis.20.title: "Najeźdźcy z Morza"
  sea_peoples_crisis.20.desc: "Na horyzoncie pojawiły się długie okręty. Straże portowe pędzą na brzeg, rolnicy ukrywają zboże, a kupcy wycofują ładunki brązu z nabrzeży. Forty, armie nadbrzeżne i okręty patrolowe mogą osłabić atak, lecz słabe wybrzeże może spłonąć, zanim pałac zdoła odpowiedzieć."
  sea_peoples_crisis.20.a: "Wybrzeże płonie."
  sea_peoples_crisis.20.b: "Podnieście straże portowe i okręty patrolowe."
  sea_peoples_crisis_20_unprepared_tt: "Najazd wystawi wybrzeże na próbę. Istniejąca obrona portów, ufortyfikowane pałace, forty, armie nadbrzeżne i flota wciąż mogą go odeprzeć."
  sea_peoples_crisis_20_defended_tt: "Nadzwyczajne straże i okręty patrolowe zwiększają szanse odparcia najazdu, lecz pochłaniają żywność i pracę."
  sea_peoples_crisis.30.title: "Statki z Uchodźcami"
  sea_peoples_crisis.30.desc: "Rodziny tłoczą się na statkach i wozach, niosąc bogów, brązowe narzędzia, dzieci i opowieści o królestwach, które nie odpowiadają już posłańcom. Proszą o zboże, ziemię i ochronę."
  sea_peoples_crisis.30.a: "Wpuśćcie ich przez bramy."
  sea_peoples_crisis.30.b: "Osiedlcie ich pod nadzorem pałacu."
  sea_peoples_crisis_30a_tt: "Ludność i użyteczna siła robocza portów rosną w pobliżu miejsca lądowania, lecz pojawia się presja głodu, spadek stabilności i niepokoje wśród uchodźców."
  sea_peoples_crisis_30b_tt: "Mniejszy przyrost ludności zostaje wchłonięty pod nadzorem. Presja kryzysu spada, lecz cierpią stabilność, możni, duchowieństwo i zapasy żywności."
  sea_peoples_crisis.40.title: "Sieć Brązu Pęka"
  sea_peoples_crisis.40.desc: "Karawany z cyną się spóźniają, transporty miedzi przepadają, a dary luksusowe przestają docierać na dwór. Skrybowie wciąż mogą zapisywać zobowiązania, lecz szlaki, które czyniły te zobowiązania rzeczywistością, zawodzą."
  sea_peoples_crisis.40.a: "Gospodarka pałacowa słabnie."
  sea_peoples_crisis.40.b: "Zajmijcie resztki zapasów handlowych."
  sea_peoples_crisis_40a_tt: "Upadek handlu uderza z pełną siłą, zwiększając presję kryzysu i szkody dla gospodarki pałacowej."
  sea_peoples_crisis_40b_tt: "Zajęte zapasy zmniejszają presję głodu, lecz cierpią prestiż, kupcy i możni, podczas gdy sieć handlowa i tak się rozpada."
  sea_peoples_crisis.50.title: "Władza Pałacu Pęka"
  sea_peoples_crisis.50.desc: "Wanaks, król lub wódz może rozkazywać z sali tronowej, lecz wieś z każdym miesiącem słucha go coraz mniej. Lokalni możni zbroją swoich ludzi, grupy robotników znikają, a dawne rywalizacje stają się niebezpieczne."
  sea_peoples_crisis.50.a: "Centrum nie zdoła się utrzymać."
  sea_peoples_crisis.50.b: "Wyślijcie przysięgi, groźby i dary."
  sea_peoples_crisis_50a_tt: "Rozpoczyna się wewnętrzny rozpad, znacznie zwiększając presję kryzysu i zagrożenie rebelią."
  sea_peoples_crisis_50b_tt: "Pałac unika natychmiastowego rozpadu, lecz presja kryzysu rośnie, stabilność i prestiż spadają, możni zostają ułagodzeni, a chłopi odczuwają ciężar."
  sea_peoples_crisis.60.title: "Przybysze Żądają Ziemi"
  sea_peoples_crisis.60.desc: "Drużyny Ludów Morza, gospodarstwa najemników i przesiedlone klany przestały się przemieszczać. Żądają pól i portów, a podczas oczekiwania na odpowiedź trzymają broń blisko siebie."
  sea_peoples_crisis.60.a: "Niech osiedlą się tam, gdzie władza jest słaba."
  sea_peoples_crisis.60.b: "Skierujcie ich do nadzorowanych okręgów."
  sea_peoples_crisis_60a_tt: "Lokalna ludność rośnie, lecz zwiększają się presja osadnicza, głód, utrata dobrobytu i szkody dla stabilności."
  sea_peoples_crisis_60b_tt: "Nadzorowane osadnictwo poprawia asymilację i obniża presję kryzysu, lecz cierpią stabilność, żywność, możni i duchowieństwo."
  sea_peoples_crisis.70.title: "Ludy Morskie Zapuściły Korzenie"
  sea_peoples_crisis.70.desc: "Obce imiona trafiają do lokalnych rejestrów. Ich bogowie otrzymują ofiary obok dawnych sanktuariów, ich statki przewożą miejscowe towary, a ich wojownicy biorą miejscowe żony. To, co przybyło jako zagrożenie, staje się częścią wybrzeża."
  sea_peoples_crisis.70.a: "Niech lud morski stanie się naszym ludem."
  sea_peoples_crisis.70.b: "Zwiąż ich służbą i handlem."
  sea_peoples_crisis_70a_tt: "Asymilacja rośnie, a lokalna ludność nieznacznie się zwiększa, lecz żywność i porządek religijny zostają nadwyrężone."
  sea_peoples_crisis_70b_tt: "Asymilacja i handel rozwijają się, a ludność portów nieznacznie rośnie; zyskujemy prestiż i poparcie mieszczan, lecz możni są niezadowoleni."
  sea_peoples_crisis.80.title: "Miasta Portowe Nabierają Oddechu"
  sea_peoples_crisis.80.desc: "Gdy dawne imperia upadają, porty Lewantu przystosowują się. Feniccy kupcy przejmują szlaki opuszczone przez pałace, przyjmują przesiedlonych marynarzy i zamieniają kryzys w morską niezależność."
  sea_peoples_crisis.80.a: "Z ruin rodzi się nowy handel morski."
  sea_peoples_crisis_80a_tt: "Fenickie porty zyskują handel, asymilację, prestiż i poparcie mieszczan, lecz pogarszają się stabilność, żywność, pozycja możnych i presja migrantów."
  sea_peoples_crisis.90.title: "Statki przy Delcie"
  sea_peoples_crisis.90.desc: "Wieści z wybrzeża mówią o okrętach wojennych, wozach z wołami, rodzinach i uzbrojonych drużynach zmierzających ku ujściom Nilu. Egipt może przetrwać, lecz tylko wydając zboże, brąz i królewski prestiż na obronę."
  sea_peoples_crisis.90.a: "Zmobilizujcie Deltę."
  sea_peoples_crisis.90.b: "Odpowiedzcie im okrętami, łucznikami i zbożem."
  sea_peoples_crisis_90a_tt: "Egipt mobilizuje się przeciwko inwazji, zmniejszając presję kryzysu kosztem prestiżu i obciążenia wojennego."
  sea_peoples_crisis_90b_tt: "Silniejsza obrona bardziej zmniejsza presję kryzysu, lecz pochłania żywność i gniewa chłopów."
  sea_peoples_crisis.100.title: "Pałace Drżą"
  sea_peoples_crisis.100.desc: "W całym świecie Achajów płoną magazyny, a pałacowe zapisy kończą się w dymie. Rywalizujący wanaktes obwiniają się nawzajem, rolnicy wycofują się na bezpieczniejsze wzgórza, a dawny heroiczny porządek zaczyna się rozpadać."
  sea_peoples_crisis.100.a: "Liga traci kontrolę."
  sea_peoples_crisis.100.b: "Ocalcie zapisy, porzućcie magazyny."
  sea_peoples_crisis_100a_tt: "Wewnętrzny rozpad niszczy świat mykeński, stabilność spada, a Jedność Achajska gwałtownie się zmniejsza."
  sea_peoples_crisis_100b_tt: "Zapisy pałacowe przetrwają lepiej niż magazyny. Handel upada, głód rośnie, a Jedność Achajska nadal spada."
  sea_peoples_crisis.110.title: "Po Pożodze"
  sea_peoples_crisis.110.desc: "Najgorsze pożary minęły, choć nic nie wróci do dawnego stanu. Niektórzy uchodźcy stali się sąsiadami, niektóre pałace nigdy nie zostały ponownie otwarte, a nowe potęgi nadbrzeżne zaczynają zapisywać karty następnej epoki."
  sea_peoples_crisis.110.a: "Świat się zmienił."
  sea_peoples_crisis_110a_tt: "Ostry etap kryzysu zaczyna ustępować, presja i głód spadają, a prestiż nieznacznie rośnie."
  sea_peoples_crisis_european_corridor_target_text: "To państwo leży na europejskim korytarzu uchodźców prowadzącym ku Bałkanom, Grecji lub Anatolii"
  sea_peoples_crisis_levantine_displacement_target_text: "To państwo może przyjmować uchodźców z wybrzeży Lewantu"
  sea_peoples_crisis_anatolian_recomposition_target_text: "To niehetyckie nadbrzeżne państwo Anatolii może przyjmować migrantów w ramach przemian okresu upadku"
  sea_peoples_add_european_corridor_migrants_text: "Europejskie grupy uchodźców przemieszczają się do państwa, tworząc niewielkie społeczności trackie, iliryjskie, peońskie, tryballijskie, dackie, kultur pól popielnicowych lub Gava-Holigrady. Napływ rośnie wraz z pogłębianiem się kryzysu."
  sea_peoples_add_levantine_coastal_flight_text: "Rodziny z wybrzeży Lewantu uciekają w głąb lądu i do bezpieczniejszych miast. Mniejszości kananejskie, fenickie, ugaryckie, aramejskie, Peleset lub Tjekker przybywają, nie wypierając miejscowej większości."
  sea_peoples_add_mediterranean_coastal_enclave_text: "Na wybrzeżu osiada mieszana enklawa morska. Przybywają niewielkie grupy Ludów Morza i ludności nadbrzeżnej Morza Śródziemnego, zwiększając populację, lecz nasilając presję żywnościową i niestabilność."
  sea_peoples_phoenicianize_recent_settlers_text: "Niedawni morscy osadnicy zaczynają przyjmować fenicki styl życia portowego, język, praktyki kultowe i sieci handlowe. Tylko część enklawy ulega zmianie, pozostawiając mieszane społeczności nadbrzeżne."
  sea_peoples_anatolian_recomposition_text: "Nadbrzeżna Anatolia zmienia się pod wpływem upadku. Luwijskie, Lukka, morskie, fenickie i bałkańskie gospodarstwa osiedlają się na osłabionych obszarach, nie wypierając dawnej ludności."
  sea_peoples_refugee_corridor_modifier: "Europejski Korytarz Uchodźców"
  sea_peoples_refugee_corridor_modifier_desc: "Rodziny i uzbrojone gospodarstwa przesiedlone z Europy przemieszczają się szlakami bałkańskimi i egejskimi ku bezpieczniejszym ziemiom."
  sea_peoples_levantine_displacement_modifier: "Ucieczka z Wybrzeży Lewantu"
  sea_peoples_levantine_displacement_modifier_desc: "Rodziny z wybrzeża uciekają przed najazdami, głodem i zakłóceniami portów, przynosząc ze sobą umiejętności i tradycje religijne."
  sea_peoples_mediterranean_enclave_modifier: "Enklawa Migrantów Śródziemnomorskich"
  sea_peoples_mediterranean_enclave_modifier_desc: "Niewielkie społeczności migrantów z całego Morza Śródziemnego zapuściły korzenie na wybrzeżu, nie wypierając dawnej ludności."
  sea_peoples_phoenicianized_settlers_modifier: "Sfenicjanizowani Osadnicy"
  sea_peoples_phoenicianized_settlers_modifier_desc: "Niedawni morscy osadnicy przystosowują się do fenickiej kultury portowej i handlu."
  sea_peoples_anatolian_recomposition_modifier: "Przemiany Nadbrzeżnej Anatolii"
  sea_peoples_anatolian_recomposition_modifier_desc: "Poza upadkiem imperium hetyckiego migracje, osadnictwo nadbrzeżne i asymilacja zmieniają lokalne społeczności Anatolii."
  sea_peoples_crisis.120.title: "Uchodźcy z Europejskich Szlaków"
  sea_peoples_crisis.120.desc: "Karawany przerażonych rodzin, pasterzy i uzbrojonych gospodarstw przemieszczają się na południe europejskimi szlakami. Niektórzy uciekają przed najeźdźcami, inni przed głodem, a jeszcze inni po prostu podążają za pogłoską, że ziemie pałacowe wciąż mają zboże."
  sea_peoples_crisis.120.a: "Pozwólmy im osiedlić się tam, gdzie pola ich wyżywią."
  sea_peoples_crisis_120a_tt: "W pobliżu stolicy pojawiają się niewielkie społeczności migrantów z Europy. Późniejsze fazy przynoszą kolejnych migrantów, a presja żywnościowa, niestabilność i problemy z kontrolą rosną."
  sea_peoples_crisis.130.title: "Wybrzeże Pustoszeje za Ich Plecami"
  sea_peoples_crisis.130.desc: "Rodziny z Lewantu opuszczają zagrożone porty i szukają bezpieczniejszego miejsca. Przynoszą sieci rybackie, wizerunki bóstw, brązowe narzędzia i opowieści o płonących portach."
  sea_peoples_crisis.130.a: "Otwórzcie śródlądowe magazyny i policzcie przybyszów."
  sea_peoples_crisis_130a_tt: "Przybywają niewielkie grupy Kananejczyków, Fenicjan, Ugarityjczyków, Aramejczyków, Peleset lub Tjekker. Rośnie presja żywnościowa i niestabilność, lecz państwo zyskuje użytecznych ludzi."
  sea_peoples_crisis.140.title: "Obce Ogniska na Wybrzeżu"
  sea_peoples_crisis.140.desc: "Gromada dziwnych łodzi przybiła do brzegu. Przybysze to marynarze, wojownicy, kobiety, dzieci i rzemieślnicy z wyniszczonych wybrzeży. Proszą o schronienie, lecz zachowują broń i bogów."
  sea_peoples_crisis.140.a: "Dajcie im nadzorowany pas wybrzeża."
  sea_peoples_crisis_140a_tt: "Pojawia się mieszana nadbrzeżna enklawa śródziemnomorska. Ludność nieznacznie rośnie dzięki losowym grupom Ludów Morza lub ludności nadbrzeżnej, lecz pogarszają się żywność, stabilność i presja osadnicza."
  sea_peoples_crisis.150.title: "Enklawa Poznaje Język Portu"
  sea_peoples_crisis.150.desc: "Przybysze nie zniknęli. Ich dzieci handlują w porcie, starsi targują się z fenickimi kapitanami, a ich bogowie otrzymują ofiary obok miejscowych sanktuariów."
  sea_peoples_crisis.150.a: "Stają się ludźmi portu."
  sea_peoples_crisis_150a_tt: "Część niedawnej enklawy Ludów Morza zostaje przekształcona w ludność fenicką wraz z dodatkowymi fenickimi mieszczanami portowymi. Oznacza to asymilację, a nie całkowite zastąpienie."
  sea_peoples_crisis.160.title: "Anatolia Nadbrzeżna Zmienia Oblicze"
  sea_peoples_crisis.160.desc: "Poza ziemiami objętymi własnym kryzysem imperialnym Hattusy nadbrzeżna Anatolia zmieniła się po latach głodu, najazdów i ucieczek. Drogami przemieszczają się przesiedlone gospodarstwa, zrujnowane porty przyjmują nowych osadników, a lokalni władcy muszą liczyć się z nowymi społecznościami."
  sea_peoples_crisis.160.a: "Ziemia nie jest już taka, jak opisywały ją tabliczki."
  sea_peoples_crisis_160a_tt: "Jednorazowa przemiana w fazie 5 obejmuje niehetycką nadbrzeżną Anatolię, dodając mieszane populacje luwijskie, Lukka, Ludów Morza, fenickie i bałkańskie. Rozpad imperium Hatti jest obsługiwany przez sytuację Upadku Hatti."
  sea_peoples_crisis.170.title: "Ludy Morza Napadają na Wybrzeże"
  sea_peoples_crisis.170.desc: "Obce łodzie wojenne zaatakowały jeden z naszych portów. Magazyny zostały siłą otwarte, żywność zabrana, gospodarstwa wzięte w niewolę, a lokalny rynek został wstrząśnięty. Mamy teraz roszczenie wojenne przeciwko najeźdźcom, lecz wybrzeże będzie potrzebowało czasu na odbudowę."
  sea_peoples_crisis.170.a: "Policzcie zabitych i zapamiętajcie najeźdźców."
  sea_peoples_crisis_170a_tt: "To powiadomienie o działaniu najazdu Ludów Morza: jedna nadbrzeżna lokacja straciła dobrobyt, żywność, stabilność i część ludności. Przeciwko najeźdźcy przyznano karny casus belli."
  sea_peoples_crisis.171.title: "Najeźdźcy Odepchnięci od Brzegu"
  sea_peoples_crisis.171.desc: "Łodzie Ludów Morza wystawiły wybrzeże na próbę, lecz straże, okręty, mury lub lokalne kontyngenty zmusiły je do odwrotu, zanim zdołały splądrować magazyny. Alarm wciąż się rozprzestrzenia, lecz najeźdźcy odchodzą ze stratami, a nasz prestiż rośnie."
  sea_peoples_crisis.171.a: "Wybrzeże wciąż się trzyma."
  sea_peoples_crisis_171a_tt: "To powiadomienie o odpartym najeździe Ludów Morza: najeźdźca traci siłę żywą, marynarzy i prestiż, podczas gdy my zyskujemy prestiż i karny casus belli."
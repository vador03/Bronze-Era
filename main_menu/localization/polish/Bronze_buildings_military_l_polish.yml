l_polish:
  warrior_lodges: "Siedziby wojowników"
  warrior_lodges_desc: "Młodzi wojownicy, drużynnicy i ludzie zdolni do walki gromadzą się we wspólnych siedzibach, gdzie szkolą się, ucztują i przygotowują do służby wojskowej. Instytucje te wzmacniają tradycje wojenne, a jednocześnie zapewniają społecznościom grono doświadczonych wojowników, których można powołać w chwili potrzeby."

  warrior_lodges_maintenance: "Drużyny wojowników"
  warrior_lodges_maintenance_desc: "Mieszkańcom siedziby zapewnia się broń, odzież, zapasy oraz wyposażenie łowieckie w zamian za służbę wojskową, szkolenie i udział we wspólnej obronie."

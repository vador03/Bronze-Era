l_polish:
  levant_silver_debasement: "Kryzys Srebra w Lewancie"
  levant_silver_debasement_desc: "Kryzys Srebra w Lewancie"
  levant_silver_debasement_participant_text: "Jest państwem Lewantu"
  # ODEJŚCIE MYKEŃSKICH KUPCÓW
  levant_silver_debasement.1.title: "Mykeńscy Kupcy Odchodzą"
  levant_silver_debasement.1.desc: "Mykeńscy kupcy nie pragną już z nami handlować. Mówią, że ich bóg jest zaniepokojony i uczynił Wielkie Morze wrogim, zsyłając straszliwe burze oraz ludzi, którzy zajmują statki. Wielu zabrało swoje towary i powróciło do własnej ziemi; ci, którzy wciąż przybywają do naszego portu, docierają na rozbitych statkach i z uszczuplonym ładunkiem.\n\nBiada nam, jeśli to potrwa. Jeśli morski szlak pozostanie w takim stanie, synowie naszych synów nie skosztują już oliwy Danuny ani nie ujrzą naczyń z pięknego srebra sprowadzanych zza Wielkiego Morza."
  levant_silver_debasement.1.a: "Nie potrzebujemy Mykeńczyków! Niech uciekają przez Wielkie Morze."
  levant_silver_debasement.1.a_tt: "Będziemy dumni z tego, co posiadamy. Zwołajcie uroczystości, rozłóżcie purpurowe tkaniny i lejcie lewantyjskie wino ludowi, odwracając jego uwagę."
  levant_silver_debasement.1.b: "Wyślijcie listy do władców Wschodu i Południa; musimy wzmocnić nasze pozostałe relacje."
  levant_silver_debasement.1.b_tt: "Zbierzcie zaufanych posłańców i wyślijcie ich na dwory suchych krain. Niech niosą nasze słowa, dary oraz prośby o odnowienie przyjaźni i handlu."
  levant_silver_debasement.1.c: "Tak Yam niepokoi morze, a Baal odpowiada grzmotem. Taka jest walka bogów."
  levant_silver_debasement.1.c_tt: "Bogowie mają swoje spory, a ludzie muszą je znosić, dopóki ich gniew nie przeminie. Przygotujcie ofiary; przetrwamy burzę dzięki pobożności."
  # NIEDOBÓR SREBRA
  levant_silver_debasement.2.title.a: "Niedobór Srebra w Lewancie"
  levant_silver_debasement.2.desc.a: "Nasze ziemie od dawna czerpią zyski ze szlaków handlowych rozciągających się od zachodnich mórz po dalekie krainy Wschodu. Przynosiły nam egzotyczne napoje i żywność, najlepsze woły oraz najbardziej aromatyczne kadzidła, lecz nasz lud nade wszystko cenił szlachetne srebro — nic bowiem nie świadczy o wspaniałości człowieka bardziej niż posiadanie tego najpiękniejszego z metali.\n\nLecz teraz, pozbawieni dostępu do odległych kopalń Morza Egejskiego, zaczynamy odczuwać niedobór srebra, a jego wartość gwałtownie rośnie. Skrybowie stają się niespokojni, gdyż wraz z niedostatkiem srebra słabnie również nasza kontrola nad walutą królestwa. Jej prestiż tylko rośnie — lecz cóż z tego, skoro władca nie jest już w stanie obdarowywać nią swoich ulubionych sług?"
  levant_silver_debasement.2.desc.b: "Nasze ziemie od dawna czerpią zyski ze szlaków handlowych rozciągających się od zachodnich mórz po dalekie krainy Wschodu. Przynosiły nam egzotyczne napoje i żywność, najlepsze woły oraz najbardziej aromatyczne kadzidła, lecz nasz lud nade wszystko cenił szlachetne srebro — nic bowiem nie świadczy o wspaniałości człowieka bardziej niż posiadanie tego najpiękniejszego z metali.\n\nLecz teraz, pozbawieni dostępu do odległych kopalń Morza Egejskiego, zaczynamy odczuwać niedobór srebra, a jego wartość gwałtownie rośnie. Od pokoleń nasi ojcowie handlowali srebrem na wagę i nasz lud wciąż czyni tak samo; lecz teraz ten pradawny zwyczaj zostaje wystawiony na próbę, gdyż srebro staje się coraz trudniej dostępne. Jego prestiż tylko rośnie — lecz cóż z tego, skoro nawet zwykły człowiek uważa swoje srebrne sztuki za zbyt cenne, by się z nimi rozstać?"
  levant_silver_debasement.2.desc.c: "Nasze ziemie od dawna czerpią zyski ze szlaków handlowych rozciągających się od zachodnich mórz po dalekie krainy Wschodu. Przynosiły nam egzotyczne napoje i żywność, najlepsze woły oraz najbardziej aromatyczne kadzidła, lecz nasz lud nade wszystko cenił szlachetne srebro — nic bowiem nie świadczy o wspaniałości człowieka bardziej niż posiadanie tego najpiękniejszego z metali.\n\nLecz teraz, pozbawieni dostępu do odległych kopalń Morza Egejskiego, zaczynamy odczuwać niedobór srebra, a jego wartość gwałtownie rośnie. Dzięki dalekowzroczności naszego władcy waluta naszego królestwa nie jest już związana z losem srebra, jak za czasów naszych ojców, a nasze monety pozostają bezpieczne przed tym zaburzeniem."
  levant_silver_debasement.2.a: "Niech mądrość naszych ojców i łaska bogów uchronią nas przed losem obcych."
  levant_silver_debasement.2.a_tt: "Mądrość naszych ojców i łaska bogów uchroniły nasze królestwo przed zmiennymi losami odległych krain. Niech obcy cierpią z powodu niedostatku, który sami na siebie sprowadzili; nasz dom pozostanie bezpieczny."
  levant_silver_debasement.2.b: "Niech zostanie ogłoszone, że odtąd niewielka ilość miedzi może być łączona ze srebrem."
  levant_silver_debasement.2.b_tt: "Niech zostanie ogłoszone w całym kraju: odtąd niewielka ilość miedzi może być łączona ze srebrem, aby srebra w królestwie nie zabrakło, podczas gdy drogi do odległych kopalń pozostają niespokojne."
  levant_silver_debasement.2.c: "Niech pomniejsze królestwa słabną; nasze składy kryją dość srebra."
  levant_silver_debasement.2.c_tt: "Niech nikt nie niepokoi się niedostatkiem srebra. Nasze składy są dobrze zaopatrzone, a to, czego innym brakuje, w naszym domu wciąż jest pod dostatkiem. Niech słabsze królestwa zmagają się, jak potrafią; ich siła wyczerpie się przed naszą."
  levant_silver_debasement.2.d: "Niech lud zachowa spokój, albowiem nie splamimy szlachetnego srebra pospolitą miedzią."
  levant_silver_debasement.2.d_tt: "Skrybowie mówią o niepokoju wśród ludu, lecz srebro jest najszlachetniejszym z metali i jego cześć musi pozostać nienaruszona. Nie zmieszamy najpiękniejszego z metali z pospolitą miedzią tylko dlatego, że obcy nie zdołali sprowadzić go na nasze rynki."
  levant_silver_debasement.2.e: "Idźcie do tych, którzy przetapiają srebro, i nakażcie im łączyć je z miedzią."
  levant_silver_debasement.2.e_tt: "Idźcie teraz do tych, którzy przetapiają srebro. Powiedzcie im, by łączyli je z miedzią, aby posiadane przez nas srebro wystarczyło na dłużej i aby rynki kraju nie pozostały bez niego."
  # ROZCIEŃCZANIE SREBRNYCH MONET
  levant_silver_debasement.31.title: "Rozcieńczanie Srebra"
  levant_silver_debasement.31.desc: "Miedź, którą połączyliśmy z naszym srebrem, uchroniła królestwo przed pełnym ciężarem niedoboru i przez pewien czas rynki nie cierpiały z powodu braków. Lecz drogi wciąż są niespokojne, a srebro staje się coraz trudniej dostępne. Czy powinniśmy teraz dodać więcej pospolitego metalu, aby srebra w królestwie nie zabrakło?"
  levant_silver_debasement.31.a: "Takie środki należą do sposobów powierzonych naszej mądrości, lecz nie wolno nam sięgać po nie bez umiaru."
  levant_silver_debasement.31.a_tt: "Takie środki należą do sposobów powierzonych naszej mądrości, lecz nie wolno nam sięgać po nie bez umiaru, aby srebro nie straciło swej wartości w oczach naszego ludu."
  levant_silver_debasement.31.b: "Pozwólmy dodawać większą ilość miedzi, aby srebro królestwa przetrwało i nie zostało wyczerpane."
  levant_silver_debasement.31.b_tt: "Pozwólmy dodawać większą ilość miedzi, aby srebro królestwa przetrwało te chude lata i nie zostało wyczerpane."
  # CZYSTE SREBRO W MONETACH
  levant_silver_debasement.32.title: "Cena Czystości"
  levant_silver_debasement.32.desc: "Zachowaliśmy czystość naszego srebra, a wraz z nią honor i siłę naszej waluty. Lecz szlachetny metal z każdym dniem staje się rzadszy, a mennice coraz dotkliwiej odczuwają niedostatek zapasów. Jeśli drogi pozostaną zamknięte, kolejne mennice mogą zamilknąć, a waluta królestwa może ucierpieć z powodu swej czystości."
  levant_silver_debasement.32.a: "Niech standard zostanie utrzymany, a ci, którzy od niego odstąpią, odpowiedzą przed władcą."
  levant_silver_debasement.32.a_tt: "Niech standard zostanie utrzymany w całym królestwie, a ci, którzy od niego odstąpią, odpowiedzą przed władcą, aby czystość i honor naszego srebra nie zostały umniejszone."
  levant_silver_debasement.32.b: "Cóż znaczy dla nas prestiż, skoro nie możemy zdobyć srebra, by go podtrzymać?"
  levant_silver_debasement.32.b_tt: "Jaki pożytek z prestiżu czystego srebra, skoro nie możemy zdobyć go w ilości wystarczającej do zaopatrzenia naszych mennic? Połączmy je z pospolitym metalem, aby waluta królestwa przetrwała."
  # CZYSTE SREBRO
  levant_silver_debasement.33.title: "Stary Zwyczaj"
  levant_silver_debasement.33.desc: "Przez wiele pokoleń nasi władcy podtrzymywali pozycję urzędników i możnych darami ze srebra, potwierdzając ich miejsce przed dworem i ludem. Lecz teraz, gdy czyste srebro staje się rzadkie, dary te stały się zbyt kosztowne, by je wręczać. Ich serca ogarnia niepokój, a wśród nich rozchodzą się szepty: czy władca tej ziemi wciąż jest godzien nosić koronę?"
  levant_silver_debasement.33.a: "Jeśli nasze dary ich nie zadowalają, niech przyjdą; złamiemy każdą dłoń podniesioną przeciw nam."
  levant_silver_debasement.33.a_tt: "Jeśli dary pałacu już ich nie zadowalają, niech wystąpią; złamiemy każdą dłoń, która podniesie się przeciw nam, a ci, którzy rzucą wyzwanie władcy, poznają siłę jego rodu."
  levant_silver_debasement.33.b: "Nie ośmielamy się narażać królestwa; niech możni otrzymają srebro, które możemy zapewnić."
  levant_silver_debasement.33.b_tt: "Nie możemy ryzykować spójności naszego dominium. Niech możni cieszą się srebrem, które możemy zapewnić, a ich pozycja przed dworem niech pozostanie nienaruszona."
  # ROZCIEŃCZANIE SREBRA
  levant_silver_debasement.34.title: "Rozcieńczanie Srebra"
  levant_silver_debasement.34.desc: "Miedź, którą połączyliśmy z naszym srebrem, uchroniła królestwo przed pełnym ciężarem niedoboru i przez pewien czas lud nie cierpiał z powodu braków. Lecz drogi wciąż są niespokojne, a srebro staje się coraz trudniej dostępne. Czy powinniśmy teraz dodać więcej pospolitego metalu, aby srebra w królestwie nie zabrakło?"
  levant_silver_debasement.34.a: "Nie nadużywajmy tego środka, aby srebro nie straciło swej wartości wśród naszego ludu."
  levant_silver_debasement.34.a_tt: "Takie środki należą do sposobów powierzonych naszej mądrości, lecz nie wolno nam sięgać po nie bez umiaru, aby srebro nie straciło swej wartości w oczach naszego ludu."
  levant_silver_debasement.34.b: "Pozwólmy na dodanie większej ilości miedzi, aby srebro królestwa przetrwało."
  levant_silver_debasement.34.b_tt: "Pozwólmy dodawać większą ilość miedzi, aby srebro królestwa przetrwało te chude lata i nie zostało wyczerpane."
  # PRZYCIEMNIAJĄCE SIĘ SREBRO
  levant_silver_debasement.4.title: "Matowiejące Srebro"
  levant_silver_debasement.4.desc: "Srebro, które wysyłamy z naszego domu, nie lśni już tak jak dawniej. Nasi ludzie zaczęli dostrzegać jego mniejszy blask, a kupcy z odległych krain kwestionują wartość tego, co im oferujemy. Jeśli ta wątpliwość się rozprzestrzeni, więzi spajające nasze królestwo mogą wraz z nią osłabnąć. Musimy działać, zanim srebro utraci swój honor, a wraz z nim siłę naszej władzy."
  levant_silver_debasement.4.a: "Zwołajcie robotników; niech szukają srebra ukrytego pod naszymi stopami."
  levant_silver_debasement.4.a_tt: "Odległe kopalnie są poza naszym zasięgiem, lecz Kothar-wa-Khasis ukrył wiele skarbów pod naszymi stopami. Niech zostaną zwołani robotnicy i niech szukają srebra we własnej ziemi."
  levant_silver_debasement.4.b: "Wesprzyjmy rzemieślników, aby Kothar-wa-Khasis wskazał im inną drogę do srebra."
  levant_silver_debasement.4.b_tt: "Nie wszystko, co się błyszczy, jest srebrem. Wyślijcie wiadomość do naszych rzemieślników i zapewnijcie im wszystko, czego potrzebują; z błogosławieństwem Kothara-wa-Khasisa niech wytopią nowe srebro ze skarbów naszej ziemi."
  # KOPALNIE SREBRA
  levant_silver_debasement.51.title: "Odkryto Srebro"
  levant_silver_debasement.51.desc: "Dobre wieści! Nasi robotnicy natrafili na srebro w jednej z naszych krain. Bogowie nam sprzyjają, a los ukrył swój skarb pod naszymi stopami.\n\nNowe kopalnie srebra powstały w następującym miejscu:\n[SCOPE.sLocation('silver_mine_1').GetName]"
  levant_silver_debasement.51.a: "Jak czynili nasi ojcowie, tak i my uczynimy: gdy królestwo woła, jego władca zapewnia."
  levant_silver_debasement.51.a_tt: "Nowe kopalnie srebra powstały w następującym miejscu: [SCOPE.sLocation('silver_mine_1').GetName]"
  # STOP SREBRA
  levant_silver_debasement.52.title: "Srebro Mistrzów"
  levant_silver_debasement.52.desc: "Rzemieślnicy usłuchali naszego rozkazu i znaleźli sposób na wydobycie srebra z pospolitych metali naszej ziemi. To, co niegdyś było ukryte przed naszymi ojcami, teraz dzięki ich umiejętnościom zaczyna lśnić.\n\n#italic Archeolodzy znaleźli bogate w miedź srebro w Megiddo i Bet-Szemesz, datowane na około 1200–1150 r. p.n.e., a podobne stopy pojawiły się później w Megiddo, Tell Keisan, Aszkelonie, Bet-Sze’an i Wadi el-Makkuk. Niektóre zawierały nawet 80% miedzi, a mimo to zachowywały srebrzysty wygląd dzięki powierzchni wzbogaconej w srebro lub dodatkowi arsenu i antymonu.#!"
  levant_silver_debasement.52.a: "Niech rzemieślnicy zostaną uhonorowani; Kothar-wa-Khasis objawił im swój sekret."
  levant_silver_debasement.52.a_tt: "Nasi rzemieślnicy odkryli sekret: dzięki odpowiedniej domieszce pospolity metal może przybrać wygląd szlachetnego srebra. Niech ich dzieło zostanie wykorzystane w całym królestwie."
l_polish:
  bronze_monument_giza_pyramid_complex: "Kompleks Piramid w Gizie"
  bronze_monument_giza_pyramid_complex_desc: "Królewskie pola piramid w Gizie głoszą nieprzemijającą boską władzę królów Egiptu."
  bronze_pyramid_complex_maintenance: "Opieka nad Piramidami"
  bronze_pyramid_complex_maintenance_desc: "Kamieniarze, brązowe narzędzia, tabliczki pisarskie i królewskie fundusze pozwalają zachować kompleks piramid oraz związany z nim kult."
  bronze_palace_temple_maintenance: "Służba Pałacowa i Świątynna"
  bronze_palace_temple_maintenance_desc: "Rzemieślnicy, skrybowie, kapłani i administratorzy podtrzymują monumentalny kompleks."
  bronze_fortified_monument_maintenance: "Utrzymanie Cytadeli"
  bronze_fortified_monument_maintenance_desc: "Kamienne mury, drewno, narzędzia i brązowe okucia pozwalają utrzymać starożytne fortyfikacje w użytecznym stanie."
  bronze_megalithic_monument_maintenance: "Opieka nad Stanowiskiem Megalitycznym"
  bronze_megalithic_monument_maintenance_desc: "Lokalne społeczności dbają o kamienie, ścieżki i obszary ceremonialne monumentu."
  bronze_monument_karnak_complex: "Kompleks Świątynny Karnaku"
  bronze_monument_karnak_complex_desc: "Rozległy święty kompleks utrzymywany dzięki królewskim darom, służbie kapłanów i bogactwu Nilu."
  bronze_monument_luxor_temple: "Świątynia Luksorska"
  bronze_monument_luxor_temple_desc: "Królewskie sanktuarium poświęcone boskiej władzy królewskiej i odnowieniu zwierzchniej władzy monarchy."
  bronze_monument_abu_simbel: "Świątynie Abu Simbel"
  bronze_monument_abu_simbel_desc: "Świątynie wykute w skale, łączące kult królewski, potęgę pogranicza i święty krajobraz Nubii."
  bronze_monument_theban_necropolis: "Nekropolia Tebańska"
  bronze_monument_theban_necropolis_desc: "Królewskie grobowce, świątynie grobowe i majątki kapłańskie zachowują pamięć o władcach Egiptu."
  bronze_monument_hattusa_complex: "Kompleks Monumentalny Hattusy"
  bronze_monument_hattusa_complex_desc: "Wielka Świątynia, królewskie bramy i pobliskie sanktuarium uosabiają władzę Wielkiego Króla."
  bronze_monument_mycenae_citadel: "Cytadela Myken"
  bronze_monument_mycenae_citadel_desc: "Mury cyklopowe, królewskie grobowce i Lwia Brama górują nad Argolidą z siedziby wanaksa."
  bronze_monument_tiryns_cyclopean: "Mury Cyklopowe Tirynsu"
  bronze_monument_tiryns_cyclopean_desc: "Potężne kamienne mury chronią jedną z najsilniejszych cytadel świata mykeńskiego."
  bronze_monument_pylos_palace: "Pałac w Pylos"
  bronze_monument_pylos_palace_desc: "Pałac archiwów, magazynów, warsztatów i administracji rolnej."
  bronze_monument_troy_citadel: "Cytadela Troi"
  bronze_monument_troy_citadel_desc: "Ufortyfikowana cytadela kontrolująca szlaki między Morzem Egejskim a cieśninami."
  bronze_monument_knossos_complex: "Kompleks Pałacowy w Knossos"
  bronze_monument_knossos_complex_desc: "Zachowany kompleks pałacowy pozostaje potężnym symbolem kreteńskiej administracji i świętej władzy królewskiej."
  bronze_monument_ugarit_complex: "Kompleks Królewski Ugarit"
  bronze_monument_ugarit_complex_desc: "Archiwa pałacowe, świątynie i handel portowy łączą miasto z każdym brzegiem wschodniego morza."
  bronze_monument_ur_ziggurat: "Wielki Ziggurat w Ur"
  bronze_monument_ur_ziggurat_desc: "Monumentalna platforma świątynna Ur dominuje nad świętym i politycznym życiem miasta."
  bronze_monument_assur_complex: "Święty Kompleks Aszur"
  bronze_monument_assur_complex_desc: "Świątynia, pałac i instytucje handlowe skupiają się wokół świętego miasta Asyryjczyków."
  bronze_monument_chogha_zanbil: "Ziggurat Czoha Zanbil"
  bronze_monument_chogha_zanbil_desc: "Elamickie święte miasto skupione wokół potężnego zigguratu wzniesionego dla bogów wyżyn i nizin."
  bronze_monument_yin_xu: "Kompleks Królewski Yin Xu"
  bronze_monument_yin_xu_desc: "Pałace, sanktuaria przodków, królewskie grobowce i warsztaty tworzą ceremonialne serce potęgi Shang."
  bronze_monument_su_nuraxi: "Kompleks Nuragiczny Su Nuraxi"
  bronze_monument_su_nuraxi_desc: "Ufortyfikowany nuraghe wraz z otaczającą go osadą kontroluje wnętrze Sardynii."
  bronze_monument_nuraghe_arrubiu: "Nuraghe Arrubiu"
  bronze_monument_nuraghe_arrubiu_desc: "Potężny kompleks wież nuragijskich, którego kamienne konstrukcje dominują nad społecznością centralnej Sardynii."
  bronze_monument_santu_antine: "Nuraghe Santu Antine"
  bronze_monument_santu_antine_desc: "Dominujący nad okolicą kompleks wież typu tholos łączący lokalną obronę, zgromadzenia i władzę wodza."
  bronze_monument_romanzesu: "Święty Okręg Romanzesu"
  bronze_monument_romanzesu_desc: "Święte źródła, ogrodzenia i miejsca zgromadzeń czynią Romanzesu centrum życia rytualnego Nuragijczyków."
  bronze_monument_serra_orrios: "Sanktuarium Serra Orrios"
  bronze_monument_serra_orrios_desc: "Kamienne chaty, święte ogrodzenia i przestrzenie wspólnotowe wyznaczają nuragijskie sanktuarium i kompleks osadniczy."
  bronze_monument_madau_giants_tombs: "Groby Gigantów w Madau"
  bronze_monument_madau_giants_tombs_desc: "Zbiorowe grobowce centralnych wyżyn stanowią podporę pamięci o przodkach i wspólnotowych obrzędów."
  bronze_monument_stonehenge: "Stonehenge"
  bronze_monument_stonehenge_desc: "Wielki kamienny krąg pozostaje miejscem ceremonii, pamięci i sezonowych zgromadzeń."
  bronze_monument_avebury: "Święty Krajobraz Avebury"
  bronze_monument_avebury_desc: "Kręgi, aleje i ziemne konstrukcje kształtują rozległy krajobraz ceremonialny."
  bronze_monument_bru_na_boinne: "Brú na Bóinne"
  bronze_monument_bru_na_boinne_desc: "Starożytne grobowce korytarzowe i święte kurhany zachowują władzę odległych przodków."
  bronze_monument_great_pyramid_new: "Kompleks Wielkiej Piramidy"
  bronze_monument_great_pyramid_new_desc: "Nowa królewska piramida i kompleks grobowy wznoszony przez dziesięciolecia wydobywania kamienia, transportu i zorganizowanej pracy."
  bronze_monument_great_pyramid_unfinished: "Niedokończona Wielka Piramida"
  bronze_monument_great_pyramid_unfinished_desc: "Wydobyty kamień, rampy, fundamenty i opuszczone obozy robotnicze świadczą o ogromnym królewskim przedsięwzięciu oczekującym na ukończenie."
  bronze_monument_shedet_sluice: "Śluzy Ujścia Kanału"
  bronze_monument_shedet_sluice_desc: "W Shedet potężne śluzy regulują wody wpływające do Fajum, pomagając kontrolować wylewy i obejmować żyzne ziemie kotliny uprawą."
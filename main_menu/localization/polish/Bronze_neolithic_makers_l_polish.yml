l_polish:
  neolithic_leather_maker: "Lokalny Garbarz"
  neolithic_leather_maker_desc: "Obróbka skór jest rozproszona między gospodarstwami domowymi, zamiast być zorganizowana w wyspecjalizowanych warsztatach. Większość rodzin garbuje niewielkie ilości skór na własne potrzeby lub na lokalną wymianę. Produkcja pozostaje nieformalna, sezonowa i oparta na pracy domowej, bez wyspecjalizowanych rzemieślników ani scentralizowanego nadzoru."
  weaponry_maker: "Lokalny Wytwórca Broni"
  weaponry_maker_desc: "We wczesnej epoce brązu produkcja broni jest rzemiosłem wykonywanym w gospodarstwach domowych. Wieśniacy odlewają proste bronie na własny użytek, bez specjalizacji i skali zorganizowanej pracy."
  pottery_maker: "Lokalny Garncarz"
  pottery_maker_desc: "We wczesnej epoce brązu produkcja ceramiki jest rzemiosłem wykonywanym w gospodarstwach domowych. Wieśniacy wytwarzają prostą ceramikę na własny użytek, bez specjalizacji i skali zorganizowanej pracy."
  tools_maker: "Lokalny Wytwórca Narzędzi"
  tools_maker_desc: "We wczesnej epoce brązu produkcja narzędzi jest rzemiosłem wykonywanym w gospodarstwach domowych. Wieśniacy odlewają proste narzędzia na własny użytek, bez specjalizacji i skali zorganizowanej pracy."
  neolithic_beer_maker: "Wiejski Browar"
  neolithic_beer_maker_desc: "Warzenie piwa odbywa się na poziomie gospodarstw domowych i wsi, z wykorzystaniem lokalnie dostępnych zbóż, owoców i innych roślin nadających się do fermentacji. Ci drobni producenci zaopatrują społeczności w napoje wykorzystywane w życiu codziennym, podczas uczt i obrzędów."
  neolithic_dyes_maker: "Wiejska Farbiarnia"
  neolithic_dyes_maker_desc: "Gospodarstwa domowe i małe warsztaty wytwarzają barwniki z lokalnych roślin, minerałów i innych naturalnych materiałów. Choć ich skala jest niewielka, rzemieślnicy ci dostarczają pigmentów do barwienia tkanin, dekoracji i celów rytualnych."
  neolithic_slave_market: "Zagroda dla Jeńców"
  neolithic_slave_market_desc: "Przed powstaniem formalnych targów niewolników jeńcy pojmani podczas wojen, najazdów, sporów o długi lub postępowań sądowych byli gromadzeni w prostych ogrodzonych zagrodach, gdzie mogli być przetrzymywani, wymieniani, wykupywani lub przydzielani nowym panom. Zagrody te służą jako lokalne ośrodki redystrybucji niewolnej siły roboczej."
  navy_supplies_maker: "Wytwórcy Lin i Żagli"
  navy_supplies_maker_desc: "Małe warsztaty produkują liny, płótno żaglowe, smołę i inne materiały potrzebne do budowy i utrzymania jednostek pływających. Ich wyroby wspierają handel, rybołówstwo, transport i podróże po drogach wodnych."
  # #############################
  # METODY PRODUKCJI*
  # #############################
  tools_maker_iron_recipe: "Lokalna Produkcja Żelaznych Narzędzi"
  tools_maker_iron_recipe_desc: "Lokalny wytwórca narzędzi produkuje narzędzia żelazne, lecz ich jakość jest nierówna, a wielkość produkcji ograniczają niedobór rudy żelaza i brak zaawansowanych pieców hutniczych."
  tools_maker_bronze_recipe: "Lokalna Produkcja Narzędzi z Brązu"
  tools_maker_bronze_recipe_desc: "Lokalny wytwórca narzędzi produkuje narzędzia z brązu, lecz wielkość produkcji ograniczają dostawy importowanej cyny i brak zaawansowanych pieców hutniczych."
  tools_maker_stone_recipe: "Lokalna Produkcja Narzędzi Kamiennych"
  tools_maker_stone_recipe_desc: "Lokalny wytwórca narzędzi produkuje narzędzia kamienne."
  tools_maker_copper_recipe: "Lokalna Produkcja Narzędzi Miedzianych"
  tools_maker_copper_recipe_desc: "Lokalny wytwórca narzędzi produkuje narzędzia miedziane."
  pottery_maker_maintenance: "Lokalna Produkcja Ceramiki"
  pottery_maker_maintenance_desc: "Lokalny garncarz wytwarza proste gliniane naczynia do użytku domowego."
  weaponry_maker_iron_recipe: "Lokalna Produkcja Broni Żelaznej"
  weaponry_maker_iron_recipe_desc: "Lokalny wytwórca broni produkuje broń żelazną, lecz jej jakość jest nierówna, a wielkość produkcji ograniczają niedobór rudy żelaza i brak zaawansowanych pieców hutniczych."
  weaponry_maker_bronze_recipe: "Lokalna Produkcja Broni z Brązu"
  weaponry_maker_bronze_recipe_desc: "Lokalny wytwórca broni produkuje broń z brązu, lecz wielkość produkcji ograniczają dostawy importowanej cyny i brak zaawansowanych pieców hutniczych."
  weaponry_maker_stone_recipe: "Lokalna Produkcja Broni Kamiennej"
  weaponry_maker_stone_recipe_desc: "Lokalny wytwórca broni produkuje broń kamienną."
  weaponry_maker_copper_recipe: "Lokalna Produkcja Broni Miedzianej"
  weaponry_maker_copper_recipe_desc: "Lokalny wytwórca broni produkuje broń miedzianą."
  neolithic_leather_maker_maintenance_livestock: "Skóry ze Zwierząt Hodowlanych"
  neolithic_leather_maker_maintenance_livestock_desc: "Skóry pozyskuje się ze zwierząt hodowlanych zabijanych na mięso, dla mleka lub do pracy. Produkcja jest bardziej niezawodna i lepiej zintegrowana z codziennym życiem wiejskim, wspierając regularne rzemiosło domowe i lokalny handel."
  neolithic_leather_maker_maintenance_wild_game: "Skóry z Dzikiej Zwierzyny"
  neolithic_leather_maker_maintenance_wild_game_desc: "Skóry pozyskuje się z upolowanych zwierząt, wiążąc produkcję z sezonowymi polowaniami i dostępem do terenów leśnych. Dostawy są nieregularne, lecz zapewniają trwałe futra i skóry cenione przy wytwarzaniu odzieży prestiżowej, trofeów i wytrzymałego wyposażenia."
  wheat_brewery_maintenance: "Warzenie Piwa Pszennego"
  wheat_brewery_maintenance_desc: "Piwowarzy fermentują pszenicę, wytwarzając pożywne napoje alkoholowe spożywane podczas uczt, obrzędów i zgromadzeń wspólnotowych."
  millet_brewery_maintenance: "Warzenie Piwa Jaglanego"
  millet_brewery_maintenance_desc: "Proso stanowi podstawę lokalnych tradycji piwowarskich, pozwalając wytwarzać niezawodne napoje z odpornej i powszechnie uprawianej rośliny."
  fruit_brewery_maintenance: "Fermentacja Owoców"
  fruit_brewery_maintenance_desc: "Owoce poddaje się fermentacji, uzyskując napoje alkoholowe cenione za smak, różnorodność i wykorzystanie podczas sezonowych świąt."
  maize_brewery_maintenance: "Warzenie Piwa Kukurydzianego"
  maize_brewery_maintenance_desc: "Rozdrobniona kukurydza jest poddawana fermentacji w celu wytworzenia tradycyjnych napojów, które odgrywają ważną rolę w życiu wspólnotowym, gościnności i praktykach rytualnych."
  honey_brewery_maintenance: "Warzenie Miodu"
  honey_brewery_maintenance_desc: "Miód i zboże łączy się w celu wytworzenia cenionych napojów fermentowanych, często kojarzonych z ucztami, ceremoniami i prestiżem społecznym."
  rice_brewery_maintenance: "Warzenie Piwa Ryżowego"
  rice_brewery_maintenance_desc: "Ryż jest poddawany fermentacji w celu wytworzenia napojów alkoholowych służących zarówno codziennemu spożyciu, jak i celom ceremonialnym w społecznościach uprawiających ryż."
  dyes_maker_maintenance: "Naturalne Barwniki"
  dyes_maker_maintenance_desc: "Barwniki wytwarza się z lokalnie dostępnych roślin, kory, korzeni i innych materiałów organicznych zbieranych z okolicznego krajobrazu."
  alum_dyes_maker_maintenance: "Zaprawy ałunowe"
  alum_dyes_maker_maintenance_desc: "Stosowanie ałunu poprawia utrwalanie i trwałość barwników, zapewniając intensywniejsze kolory i ograniczając blaknięcie barwionych tkanin."
  neolithic_slave_market_maintenance: "Obsługa Jeńców"
  neolithic_slave_market_maintenance_desc: "Do zabezpieczania, transportowania i nadzorowania jeńców oczekujących na wymianę, okup lub przydzielenie niezbędni są strażnicy, wyposażenie i podstawowe zapasy."
  naval_supplies_maker_maintenance: "Zaopatrzenie Morskie"
  naval_supplies_maker_maintenance_desc: "Rzemieślnicy wytwarzają liny, płótno żaglowe, materiały uszczelniające i inne niezbędne zaopatrzenie potrzebne do wyposażenia i utrzymania użytkowanych jednostek pływających."
l_polish:
  bronze_age_tablets: "Tabliczki do Pisania"
  bronze_age_tablets_desc: "Wynalezienie tabliczek do pisania umożliwia zapisywanie informacji, komunikację oraz rozwój złożonych systemów administracyjnych w społeczeństwach epoki brązu."
  fine_pottery: "Wysokiej Jakości Ceramika"
  fine_pottery_desc: "Wykwalifikowani garncarze wytwarzają starannie uformowane i wykończone naczynia, wyróżniające się delikatniejszym tworzywem, bardziej regularnymi kształtami i większą dbałością o zdobienia. Takie wyroby służą gospodarstwom domowym, ucztom, handlowi i celom ceremonialnym, odzwierciedlając rosnącą specjalizację rzemiosła ceramicznego."

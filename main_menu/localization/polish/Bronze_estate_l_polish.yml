l_polish:
  protected_travel: "Bezpieczny Przejazd"
  protected_travel_desc: "Kupcom zapewnia się gwarancje bezpiecznego przejazdu drogami, rzekami i szlakami handlowymi. Władze przeznaczają środki na utrzymanie bezpieczeństwa handlu i przepływu towarów."
  protection_abroad: "Ochrona za Granicą"
  protection_abroad_desc: "Państwo rozciąga swoją ochronę na kupców działających poza jego granicami, wykorzystując dyplomację i wpływy polityczne do zabezpieczenia interesów handlowych na obcych ziemiach."
  royal_compensation: "Królewskie Odszkodowania"
  royal_compensation_desc: "Kupcy, którzy ponieśli straty wskutek bandytyzmu, piractwa lub nadużyć urzędników, mogą ubiegać się o odszkodowanie od administracji władcy, zmniejszając ryzyko związane z handlem na duże odległości."
  customs_exemption: "Zwolnienie z Ceł"
  customs_exemption_desc: "Uprzywilejowani kupcy otrzymują zwolnienia z niektórych opłat drogowych, ceł i opłat targowych, co pobudza działalność handlową, jednocześnie ograniczając dochody dostępne dla państwa."
  trade_districts: "Dzielnice Handlowe"
  trade_districts_desc: "Wyznaczone dzielnice handlowe skupiają kupców, magazyny, targowiska i warsztaty w określonych obszarach, tworząc tętniące życiem ośrodki wymiany i działalności gospodarczej."
  commercial_monopolies: "Monopole Handlowe"
  commercial_monopolies_desc: "Uprzywilejowanym grupom kupieckim przyznaje się wyłączne prawa handlowe, pozwalając im zdominować kluczowe szlaki i towary, jednocześnie ograniczając konkurencję ze strony rywali."
  protected_inheritance: "Ochrona Dziedziczenia"
  protected_inheritance_desc: "Majątek handlowy, umowy i zgromadzone bogactwo są objęte silną ochroną prawną, pozwalając rodzinom kupieckim zachowywać i pomnażać swoje fortuny przez kolejne pokolenia."
  administrative_incorporation: "Włączenie do Administracji"
  administrative_incorporation_desc: "Społeczności kupieckie są coraz silniej włączane w struktury administracyjne państwa. Wiedza handlowa jest wykorzystywana w zarządzaniu, poborze podatków, logistyce i organizacji wymiany."
  burghers_protected_faith: "Chroniona Wiara"
  burghers_protected_faith_desc: "Społeczności kupieckie mogą zachowywać własne tradycje i praktyki religijne, co sprzyja handlowi ponad granicami kulturowymi i religijnymi."
  sponsor_maritime_contracts: "Finansowane Umowy Morskie"
  sponsor_maritime_contracts_desc: "Władze wspierają przedsięwzięcia handlowe, uznając i egzekwując umowy dotyczące żeglugi, ładunków i handlu morskiego, zmniejszając niepewność kupców działających na szlakach wodnych."
  clergy_tax_exemption: "Zwolnienie z Podatków"
  clergy_tax_exemption_desc: "Świątynie, sanktuaria i instytucje religijne są zwolnione z niektórych podatków i obowiązków. Zasoby zachowane dzięki tym przywilejom wzmacniają pozycję ekonomiczną i niezależność kapłaństwa."
  clergy_judicial_authority: "Władza Sądownicza"
  clergy_judicial_authority_desc: "Władzom religijnym przyznaje się prawo rozstrzygania sporów, interpretowania świętego prawa i wydawania wyroków w sprawach należących do ich jurysdykcji. Wzmacnia to wpływy instytucji kapłańskich, jednocześnie zachęcając do przestrzegania ustanowionych tradycji."
  clergy_exclusive_literacy_rights: "Wyłączne Prawo do Piśmienności"
  clergy_exclusive_literacy_rights_desc: "Umiejętność czytania i pisania skupia się w świątyniach i instytucjach kapłańskich. Kontrola nad piśmiennością zapewnia kapłaństwu znaczne wpływy na administrację, edukację, prowadzenie zapisów i zachowanie wiedzy."
  ritual_service: "Posługa Rytualna"
  ritual_service_desc: "Instytucjom religijnym powierza się odprawianie publicznych ceremonii, składanie ofiar, organizację świąt i wypełnianie innych świętych obowiązków uznawanych za niezbędne dla pomyślności wspólnoty i przychylności bogów."
  sacred_herds: "Święte Stada"
  sacred_herds_desc: "Kapłaństwo utrzymuje stada przeznaczone do celów religijnych. Zwierzęta te dostarczają ofiar na potrzeby rytuałów, wspierają gospodarkę świątynną i służą jako widoczne symbole boskiej przychylności oraz świętej władzy."
  nobles_tax_exemption: "Zwolnienie z Podatków"
  nobles_tax_exemption_desc: "Arystokraci wojownicy i najważniejsi posiadacze ziemscy są zwolnieni z niektórych podatków i obowiązków. Przywileje te umacniają ich status, jednocześnie ograniczając zasoby dostępne władzom centralnym."
  nobles_judicial_authority: "Władza Sądownicza"
  nobles_judicial_authority_desc: "Szlachcie przyznaje się prawo rozstrzygania sporów i wymierzania sprawiedliwości w obrębie własnych domen. Wzmacnia to lokalną władzę, lecz standardy prawne stają się coraz bardziej zależne od interesów i zwyczajów potężnych rodów."
  court_offices: "Urzędy Dworskie"
  court_offices_desc: "Ważne stanowiska administracyjne, wojskowe i ceremonialne są zastrzeżone dla członków arystokracji. Służba na dworze wzmacnia więzi między władcą a rodami szlacheckimi, jednocześnie włączając elitę w struktury rządzenia."
  right_to_plunder: "Prawo do Grabieży"
  right_to_plunder_desc: "Wojownikom zezwala się na wzbogacanie poprzez zdobywanie dóbr, bydła i jeńców podczas kampanii. Perspektywa łupów zachęca do służby wojskowej i pomaga utrzymać elity wojowników w czasie wojny."
  hereditary_titles: "Tytuły Dziedziczne"
  hereditary_titles_desc: "Rangi, urzędy i przywileje przechodzą z pokolenia na pokolenie, przekształcając stanowiska władzy w trwałą własność rodową. Ustalone rody gromadzą bogactwo i wpływy, zapewniając jednocześnie większą ciągłość rządów."
  charioteer_retinues: "Poczty Rycerzy na Rydwanach"
  charioteer_retinues_desc: "Znaczące rody szlacheckie utrzymują rydwany, konie, woźniców i towarzyszących im ludzi jako część swoich obowiązków wojskowych. Te prestiżowe poczty wojowników zapewniają władcom gotowe źródło elitarnych sił mobilnych, jednocześnie wzmacniając pozycję społeczną arystokracji."
  peasants_tax_exemption: "Zwolnienie z Podatków"
  peasants_tax_exemption_desc: "Wspólnoty chłopskie zostają zwolnione z niektórych podatków i obowiązków, zachowując większą część swojej produkcji, lecz zmniejszając dochody dostępne władcom i lokalnym elitom."
  communal_lands: "Ziemie Wspólnotowe"
  communal_lands_desc: "Pola, pastwiska, lasy i inne zasoby są wspólnie posiadane i zarządzane przez lokalne wspólnoty. Rozwiązania te wzmacniają autonomię wsi i ograniczają koncentrację ziemi w rękach potężnych jednostek."
  common_waterways: "Wspólne Drogi Wodne"
  common_waterways_desc: "Rzeki, jeziora, kanały i łowiska pozostają dostępne dla wspólnego użytku, zamiast stawać się wyłączną własnością elit. Wspólny dostęp wspiera lokalne utrzymanie, handel i komunikację."
  right_to_appeal: "Prawo do Odwołania"
  right_to_appeal_desc: "Ludność pospolita może zwracać się do wyższych władz, gdy uważa lokalne wyroki za niesprawiedliwe. Choć prawa te nie gwarantują równości wobec prawa, zapewniają pewną ochronę przed samowolnym traktowaniem."
  labor_substitution: "Zastępowanie Świadczeń Pracą"
  labor_substitution_desc: "Wspólnotom zezwala się na wypełnianie niektórych obowiązków pracy poprzez alternatywne opłaty, dobra lub uzgodnione rozwiązania. Daje to gospodarstwom domowym większą elastyczność, zachowując jednocześnie ich zobowiązania wobec państwa lub władz lokalnych."
  household_property: "Własność Rodzinna"
  household_property_desc: "Rodziny cieszą się uznanymi prawami do zajmowanych przez siebie domów, pól i zasobów produkcyjnych. Silniejsza ochrona majątku rodzinnego ogranicza ingerencję elit i wzmacnia pozycję niezależnych społeczności wiejskich."
  private_commerce_integration: "Integracja Prywatnego Handlu"
  private_commerce_integration_desc: "Władcy coraz częściej polegają na niezależnych kupcach i społecznościach handlowych przy wykonywaniu funkcji dawniej ściśle związanych z administracją publiczną. Handel, zaopatrzenie, transport i inne działania gospodarcze są coraz silniej zintegrowane z działalnością prywatnych przedsiębiorstw."
  clergy_military_authority: "Kapłańska Władza Wojskowa"
  clergy_military_authority_desc: "Kapłaństwu przyznaje się uznaną rolę w sprawach wojskowych, pozwalając władzom religijnym bezpośrednio uczestniczyć w dowodzeniu i organizacji sił zbrojnych. Władza sakralna staje się tym samym trwałym elementem przywództwa wojskowego."

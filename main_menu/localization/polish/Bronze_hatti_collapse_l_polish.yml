  bronze_hatti_collapse_final_fragmentation_text: "Hatti zostaje podzielone na odwzorowane nowohetyckie królestwa, urartyjskie i luwijskie strefy sukcesyjne oraz frygijską pozostałość. Ziemie zagraniczne pozostają nietknięte."
  bronze_hatti_collapse.200.title: "Dynastia Ucieka do Que"
  bronze_hatti_collapse.200.desc: "Wielkie Królestwo upadło. Hattusa została utracona, dawne świątynie imperialne zamilkły, a władza hetyckich królów załamała się. Jednak królewska krew przetrwała. Prawowita dynastia uciekła na południe do Que, gdzie lojalni możnowładcy i ocalali administratorzy ogłaszają ciągłość z upadłym imperium."
  bronze_hatti_collapse.200.a: "Linia królewska przetrwa w Que."
  bronze_hatti_collapse_200a_tt: "Hatti rozpada się. Que dziedziczy obecnego władcę i dynastię Hatti, zyskuje legitymizację i staje się krajem kontrolowanym przez gracza."
  bronze_hatti_collapse_survival_outcome_text: "Kryzys kończy się w 1185 r. p.n.e. Hatti zachowuje Huseyinabad, dwór królewski i wystarczające zapasy zboża, aby przetrwać jako osłabione królestwo."
  bronze_hatti_collapse.210.title: "Hatti Przetrwało"
  bronze_hatti_collapse.210.desc: "W 1185 r. p.n.e. burza straciła swą największą siłę. Imperium ucierpiało wskutek głodu, najazdów i nieposłusznych wasali, lecz Huseyinabad pozostaje w królewskich rękach, a szlaki zbożowe wciąż funkcjonują. Hatti przetrwało, osłabione, lecz niepokonane."
  bronze_hatti_collapse.210.a: "Wielkie Królestwo trwa."
  bronze_hatti_collapse_210a_tt: "Upadek Hatti kończy się bez rozpadu. Hatti zyskuje stabilność, prestiż i legitymizację za zachowanie swojej stolicy oraz opanowanie głodu i presji kryzysu."
  HATTI_f: "Imperium Hatti"
  collapse_of_hittite_faith: "Upadek Wiary Hetyckiej"
  collapse_of_hittite_faith_desc: "Poza dworami nowohetyckimi upadek Hattusy roztrzaskał autorytet kultu imperialnego. Wpływy religijne zanikają, majątki świątynne tracą znaczenie, konwersja słabnie, a legitymizacja niegdyś nadawana przez Wielkiego Króla zostaje otwarcie podważona."
  neo_hittite_religious_continuity: "Nowohetycka Ciągłość Religijna"
  neo_hittite_religious_continuity_desc: "Ten dwór sukcesyjny zachowuje królewskie obrzędy, archiwa świątynne i ceremonialną legitymizację Hatti, chroniąc wiarę hetycką przed szerszym upadkiem."
  restored_hittite_imperial_cult: "Przywrócony Kult Imperialny Hatti"
  restored_hittite_imperial_cult_desc: "Hattusa ponownie sprawuje władzę nad świątyniami i królewskimi archiwami Anatolii. Przywrócony Wielki Król odnawia święte przymierze między tronem, kapłaństwem i ziemią."
  bronze_hatti_legitimate_dynasty_modifier: "Ród Królewski w Que"
  bronze_hatti_legitimate_dynasty_modifier_desc: "Ocalała dynastia hetycka zapewnia Que prestiż i wiarygodne roszczenie do ciągłości imperialnej."

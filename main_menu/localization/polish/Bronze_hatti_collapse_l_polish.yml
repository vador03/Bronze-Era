l_polish:
  bronze_hatti_collapse: "Upadek Hatti"
  bronze_hatti_collapse_desc: "Władza Hattusy ugina się pod ciężarem głodu, najazdów z wybrzeża, utraconego handlu, buntujących się wasali i szerszego upadku epoki brązu. Jeśli Wielki Król nie zdoła zapewnić zboża, armii i lojalności, Hatti może rozpaść się na nowohetyckie królestwa sukcesyjne."
  hint_bronze_hatti_collapse: "Osiągnięcie 100 punktów Nacisku Imperialnego lub 100 punktów Nacisku Głodu powoduje natychmiastowy upadek. W przeciwnym razie kryzys kończy się w 1185 r. p.n.e.; Hatti przetrwa tylko dzięki zachowaniu Huseyinabadu i utrzymaniu obu rodzajów nacisku na poziomie 25 lub niższym."
  bronze_hatti_collapse_overview_card: "Przegląd Upadku"
  bronze_hatti_collapse_overview_card_desc: "Upadek Hatti to skoncentrowana [situation_with_icon|e] dotycząca Hatti i jego strefy wpływów. Nacisk Ludów Morza może pogorszyć sytuację, lecz głód, nacisk imperialny, buntujący się wasale, splądrowane wybrzeża i rozpad na nowohetyckie państwa sukcesyjne są obsługiwane tutaj."
  bronze_hatti_collapse_panel_phase: "Faza Upadku"
  bronze_hatti_collapse_panel_phase_value: "#Y [GetCountry('HATTI').MakeScope.GetVariable('bronze_hatti_collapse_phase').GetValue|V0]#! /5"
  bronze_hatti_collapse_panel_pressure: "Nacisk Imperialny"
  bronze_hatti_collapse_panel_pressure_value: "#R [GetCountry('HATTI').MakeScope.GetVariable('bronze_hatti_collapse_pressure').GetValue|V0]#! /100"
  bronze_hatti_collapse_panel_famine: "Nacisk Głodu"
  bronze_hatti_collapse_panel_famine_value: "#R [GetCountry('HATTI').MakeScope.GetVariable('bronze_hatti_famine_pressure').GetValue|V0]#! /100"
  bronze_hatti_collapse_panel_months: "Czas Trwania Kryzysu"
  bronze_hatti_collapse_panel_months_value: "#Y [GetSituationByKey('bronze_hatti_collapse').MakeScope.GetVariable('bronze_hatti_situation_months').GetValue|V0]#! /120"
  bronze_hatti_collapse_panel_vassal_oaths: "Przysięgi Wasalne"
  bronze_hatti_collapse_panel_vassal_oaths_value: "#Y [GetCountry('HATTI').MakeScope.GetVariable('bronze_hatti_vassal_oaths').GetValue|V0]#! /4"
  bronze_hatti_collapse_panel_client_status: "Królowie Klienccy"
  bronze_hatti_collapse_panel_client_status_value: "$bronze_hatti_collapse_client_status_text$"
  bronze_hatti_collapse_client_status_text: "Przysięgi Pod Presją"
  bronze_hatti_collapse_actions_card: "Możliwe Reakcje"
  bronze_hatti_collapse_actions_card_desc: "Poniżej dostępne są działania kryzysowe dla Hatti. Mogą spowolnić głód, najazdy, bunt wasali i rozpad, lecz każdy wybór kosztuje zboże, złoto, siłę roboczą, prestiż, cierpliwość stanów lub bezpośrednią kontrolę."
  bronze_hatti_collapse_map_color: "Upadek Hatti"
  bronze_hatti_collapse_secondary_map_color: "Nacisk Nowohetycki"
  bronze_hatti_collapse_map_card: "Odczytywanie Upadku Hatti"
  bronze_hatti_collapse_map_card_desc: "Mapa wyróżnia Hatti, zagrożone ziemie Hatti, splądrowane wybrzeża, wewnętrzny rozpad i nacisk państw sukcesyjnych Nowych Hetytów. Najazdy Ludów Morza napędzają ten kryzys, podczas gdy działania Hatti spowalniają głód, bunt wasali i rozpad za cenę rzeczywistych kosztów politycznych."
  bronze_hatti_collapse_legend_hatti: "Ziemie Hatti"
  bronze_hatti_collapse_legend_successor_pressure: "Wewnętrzny Rozpad"
  bronze_hatti_collapse_legend_defiant_vassal: "Buntowniczy Wasal"
  bronze_hatti_collapse_legend_loyal_vassal: "Lojalny Wasal"
  bronze_hatti_collapse_legend_raided: "Splądrowane Lokacje"
  bronze_hatti_collapse_location_owner_tt: "Ta lokacja należy do kraju wciągniętego w strefę Upadku Hatti."
  bronze_hatti_collapse_raided_location_tt: "Ta lokacja niedawno ucierpiała wskutek najazdu z okresu upadku."
  bronze_hatti_collapse_defiant_vassal_location_tt: "Ta lokacja znajduje się pod władzą władcy klienckiego sprzeciwiającego się Hattusie."
  bronze_hatti_collapse_loyal_vassal_location_tt: "Ta lokacja znajduje się pod władzą władcy klienckiego, którego przysięga została niedawno odnowiona."
  bronze_hatti_send_grain_to_cities: "Wyślij Zboże do Miast"
  bronze_hatti_send_grain_to_cities_desc: "Otwórz królewskie spichlerze i nakaż nadzwyczajne dostawy do miast pałacowych. Zyskuje się w ten sposób czas, lecz uszczupla skarbiec, obciąża królewską administrację i gniewa elity, które liczyły na uprzywilejowany dostęp."
  bronze_hatti_send_grain_to_cities_tt: "Kosztuje dużo złota, władzy rządowej i stabilności. Nacisk Głodu #P -14#!, Nacisk Imperialny #P -5#!. Chłopi zyskują zadowolenie; szlachta traci zadowolenie. Nie można powtórzyć przez 4 lata."
  bronze_hatti_fortify_the_coast: "Ufortyfikuj Wybrzeże"
  bronze_hatti_fortify_the_coast_desc: "Napraw umocnienia wybrzeży Cylicji i południowej Anatolii, rozmieść poborowych w pobliżu portów i obserwuj przystanie w poszukiwaniu najeźdźców. Porty będą oburzone rekwizycjami, lecz wybrzeże może się utrzymać."
  bronze_hatti_fortify_the_coast_tt: "Kosztuje dużo złota, siły roboczej, władzy rządowej i stabilności. Przez 6 lat Hatti otrzymuje stan Ufortyfikowane Wybrzeże: wydarzenia związane z najazdami będą znacznie częściej odpierane. Nacisk Imperialny #P -6#!. Mieszczanie tracą zadowolenie."
  bronze_hatti_appease_vassals: "Udobruchaj Wasali"
  bronze_hatti_appease_vassals_desc: "Uznaj lokalne przywileje, zmniejsz żądania danin, wyślij podarunki i kup lojalność władców, którzy wciąż obawiają się Wielkiego Króla. Przysięgi pozostają w mocy, lecz z każdym sezonem kosztują coraz więcej."
  bronze_hatti_appease_vassals_tt: "Kosztuje złoto, prestiż, władzę rządową i stabilność. Nacisk Imperialny #P -9#!. Zachodni królowie klienccy zyskują Lojalnego Klienta na 6 lat, lecz Hatti traci prestiż i godzi się na słabszą władzę centralną."
  bronze_hatti_crush_rebellious_lords: "Zmiażdż Buntowniczych Władców"
  bronze_hatti_crush_rebellious_lords_desc: "Wyślij armię przeciwko buntowniczym możnowładcom. Zwycięstwo przywraca strach przed Hattusą; porażka zmienia pokaz siły w otwarty rozpad wewnętrzny."
  bronze_hatti_crush_rebellious_lords_success_tt: "Kosztuje złoto, znaczną ilość siły roboczej, stabilność i prestiż. #P 55%#! szans: Nacisk Imperialny #P -12#!, a prestiż wzrasta."
  bronze_hatti_crush_rebellious_lords_failure_tt: "#N 45%#! szans: Nacisk Imperialny #N +8#!, rozpoczyna się wewnętrzny rozpad, stabilność spada, a szlachta traci zadowolenie."
  bronze_hatti_evacuate_settlements: "Ewakuuj Zagrożone Osady"
  bronze_hatti_evacuate_settlements_desc: "Przenieś narażonych wieśniaków i rzemieślników w głąb lądu, zanim nadejdą najazdy. Życie zostaje ocalone, lecz pola, przystanie i nadbrzeżne warsztaty zostają porzucone."
  bronze_hatti_evacuate_settlements_tt: "Kosztuje złoto, władzę rządową i stabilność. Nacisk Imperialny #P -6#!, Nacisk Głodu #N +3#!. Chłopi tracą zadowolenie, ponieważ ewakuacje zakłócają zbiory."
  bronze_hatti_centralize_around_hattusa: "Skoncentruj Siły Wokół Hattusy"
  bronze_hatti_centralize_around_hattusa_desc: "Wycofaj się z najbardziej narażonych peryferii i zachowaj anatolijskie centrum. To przetrwanie, nie zwycięstwo; tabliczki zapiszą porzucone drogi i milczące pałace pogranicza."
  bronze_hatti_centralize_around_hattusa_tt: "Kosztuje złoto, prestiż, władzę rządową i stabilność. Nacisk Imperialny #P -16#!, Nacisk Głodu #P -4#!. Hatti zyskuje Skoncentrowane Centrum i Porzucone Peryferia na kilka lat."
  bronze_hatti_recognize_successors: "Uznaj Królestwa Nowych Hetytów"
  bronze_hatti_recognize_successors_desc: "Pozwól regionalnym dynastom rządzić jako królowie sukcesyjni, zamiast walczyć o każdą prowincję do ostatniego człowieka. Hatti przetrwa mniejsze, lecz struktura imperialna rozpadnie się."
  bronze_hatti_recognize_successors_tt: "Kosztuje znaczny prestiż, władzę rządową i stabilność. Pełny, odwzorowany porządek państw sukcesyjnych zostaje wprowadzony wyłącznie na ziemiach należących do Hatti. Gracz będący Hatti kontynuuje grę jako Que."
  bronze_hatti_host_vassal_kings: "Podejmij Królów Klienckich"
  bronze_hatti_host_vassal_kings_desc: "Wezwij Wilusę, Seha, Mirę i Hapallę do Hattusy na podarunki, ucztę, odnowienie przysięgi i publiczne upokorzenie starannie zamaskowane jako ceremonia."
  bronze_hatti_host_vassal_kings_tt: "Kosztuje złoto, prestiż, władzę rządową i stabilność. Nacisk Imperialny #P -7#!. Główne zachodnie królestwa klienckie zyskują Lojalnego Klienta na 6 lat i tracą Buntowniczego Klienta."
  bronze_hatti_seize_temple_grain: "Zarekwirować Zboże Świątynne"
  bronze_hatti_seize_temple_grain_desc: "Zabierz nadzwyczajne zapasy zboża z magazynów świątynnych i dóbr sanktuariów. Miasta będą jadły; bogowie i kapłani nie zapomną."
  bronze_hatti_seize_temple_grain_tt: "Kosztuje stabilność, prestiż i władzę rządową. Nacisk Głodu #P -12#!, Nacisk Imperialny #N +4#!. Kapłani i szlachta tracą zadowolenie; Hatti zyskuje Zarekwirowane Zboże Świątynne na 5 lat."
  bronze_hatti_call_chariot_host: "Powołaj Wojsko Rydwanów"
  bronze_hatti_call_chariot_host_desc: "Zmobilizuj arystokrację rydwanów i wojska dworskie, by przypomnieć gubernatorom, najeźdźcom i buntownikom, że Hatti wciąż ma brąz, konie i królów."
  bronze_hatti_call_chariot_host_tt: "Kosztuje złoto, znaczną ilość siły roboczej i stabilność. Nacisk Imperialny #P -8#!, Nacisk Głodu #N +4#!. Hatti zyskuje Zmobilizowane Wojsko Rydwanów na 4 lata."
  bronze_hatti_abandon_syrian_road: "Porzuć Drogę Syryjską"
  bronze_hatti_abandon_syrian_road_desc: "Wycofaj się z najbardziej narażonej sieci południowej i pozwól lokalnym rodom królewskim ocalić to, co zdołają. Centrum odzyska oddech, lecz imperium stanie się w rzeczywistości mniejsze."
  bronze_hatti_abandon_syrian_road_tt: "Kosztuje znaczny prestiż, władzę rządową i stabilność. Karkemisz, Kummuh i Hamath mogą wyłonić się z odpowiednich ziem należących do Hatti. Nacisk Imperialny #P -10#!, Nacisk Głodu #P -2#!, lecz handel ucierpi."
  bronze_hatti_phase_1_rumours_from_the_coast: "Wieści z Wybrzeża"
  bronze_hatti_phase_2_grain_crisis: "Kryzys Zbożowy"
  bronze_hatti_phase_3_vassals_defy_hattusa: "Wasale Sprzeciwiają się Hattusie"
  bronze_hatti_phase_4_empire_cracks: "Imperium Pęka"
  bronze_hatti_phase_5_fall_of_hatti: "Upadek Hatti"
  bronze_hatti_grain_crisis_modifier: "Kryzys Zbożowy Hetytów"
  bronze_hatti_trade_collapse_modifier: "Upadek Handlu Anatolijskiego"
  bronze_hatti_vassal_defiance_modifier: "Buntowniczy Wasale"
  bronze_hatti_internal_breakdown_modifier: "Wewnętrzny Rozpad"
  bronze_hatti_southern_coast_raided_modifier: "Splądrowane Południowe Wybrzeże"
  bronze_hatti_successor_state_modifier: "Nowohetyckie Państwo Sukcesyjne"
  bronze_hatti_grain_relief_sent_modifier: "Królewska Pomoc Zbożowa"
  bronze_hatti_grain_relief_sent_modifier_desc: "Pałac otworzył królewskie magazyny i nakazał nadzwyczajne dostawy do głodujących miast."
  bronze_hatti_coast_fortified_modifier: "Ufortyfikowane Wybrzeże"
  bronze_hatti_coast_fortified_modifier_desc: "Porty, ogniska sygnałowe i oddziały nadbrzeżne są przygotowane na nadejście najeźdźców."
  bronze_hatti_vassals_appeased_modifier: "Udobruchani Wasale"
  bronze_hatti_vassals_appeased_modifier_desc: "Władcy klienccy otrzymali podarunki, przywileje i obniżone żądania danin."
  bronze_hatti_lords_crushed_modifier: "Zmiażdżeni Buntowniczy Władcy"
  bronze_hatti_lords_crushed_modifier_desc: "Armia przypomniała lokalnym możnowładcom, że Hattusa wciąż potrafi karać za sprzeciw."
  bronze_hatti_evacuation_orders_modifier: "Rozkazy Ewakuacji"
  bronze_hatti_evacuation_orders_modifier_desc: "Narażone wioski i warsztaty są przenoszone w głąb lądu przed nadejściem najeźdźców."
  bronze_hatti_centralized_core_modifier: "Skoncentrowane Centrum"
  bronze_hatti_centralized_core_modifier_desc: "Dwór skupił ludzi, zboże i skrybów wokół anatolijskiego centrum."
  bronze_hatti_peripheral_abandonment_modifier: "Porzucone Peryferia"
  bronze_hatti_peripheral_abandonment_modifier_desc: "Ziemie peryferyjne czują się poświęcone, aby hetyckie centrum mogło przetrwać."
  bronze_hatti_client_loyal_modifier: "Lojalny Król Kliencki"
  bronze_hatti_client_loyal_modifier_desc: "Ten władca kliencki na razie odnowił swoją przysięgę wobec Hattusy."
  bronze_hatti_client_defiant_modifier: "Buntowniczy Król Kliencki"
  bronze_hatti_client_defiant_modifier_desc: "Ten władca kliencki opóźnia daninę, uzbraja miejscowych i wystawia słabość Hattusy na próbę."
  bronze_hatti_client_broken_oath_modifier: "Złamana Przysięga"
  bronze_hatti_client_broken_oath_modifier_desc: "To królestwo złamało swoją przysięgę wobec Hattusy i odtąd utrzymuje się dzięki własnej władzy."
  bronze_hatti_client_kings_hosted_modifier: "Przyjęci Królowie Klienccy"
  bronze_hatti_client_kings_hosted_modifier_desc: "Dwór poniósł znaczne wydatki, aby odnowić przysięgi królów klienckich."
  bronze_hatti_client_kings_restless_modifier: "Niespokojni Królowie Klienccy"
  bronze_hatti_client_kings_restless_modifier_desc: "Królowie klienccy obserwują słabnięcie Hattusy i odpowiednio prowadzą negocjacje."
  bronze_hatti_temple_grain_seized_modifier: "Zarekwirowane Zboże Świątynne"
  bronze_hatti_temple_grain_seized_modifier_desc: "Zapasy zboża ze świątyń zostały przejęte na potrzeby nadzwyczajnej dystrybucji."
  bronze_hatti_chariot_host_mobilized_modifier: "Zmobilizowane Wojsko Rydwanów"
  bronze_hatti_chariot_host_mobilized_modifier_desc: "Pałac powołał wojsko rydwanów, wzmacniając władzę kosztem siły roboczej i zapasów żywności."
  bronze_hatti_syrian_road_abandoned_modifier: "Porzucona Droga Syryjska"
  bronze_hatti_syrian_road_abandoned_modifier_desc: "Południowa sieć imperialna została poświęcona, aby zachować anatolijskie centrum."

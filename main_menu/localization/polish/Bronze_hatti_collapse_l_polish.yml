  bronze_hatti_collapse_release_successor_text: "$tag$ może wyłonić się z rdzeni należących do Hatti."
  bronze_hatti_collapse_spawn_tarhuntassa_text: "Tarhuntassa może wyłonić się w południowo-środkowej Anatolii."
  bronze_hatti_collapse_spawn_tabal_text: "Tabal może wyłonić się na wyżynach Kapadocji."
  bronze_hatti_collapse_spawn_melid_gurgum_text: "Melid i Gurgum mogą wyłonić się w górnym biegu Eufratu i w regionach Marasu."
  bronze_hatti_collapse_spawn_kummuh_hamath_text: "Kummuh i Hamath mogą wyłonić się, jeśli Hatti kontroluje ich ziemie pograniczne."
  bronze_hatti_collapse_spawn_que_pattin_text: "Que i Pattin mogą wyłonić się w Cylicji i na wybrzeżu Amuku."
  bronze_hatti_collapse_spawn_kaskian_north_text: "Władza Kasków może rozprzestrzenić się na północnych terenach górskich."
  bronze_hatti_collapse_spawn_carchemish_continuity_text: "Karkemisz może zachować linię królewską na pograniczu Eufratu."
  bronze_hatti_collapse_fragment_periphery_text: "Hatti rozpada się zgodnie z deterministyczną mapą państw sukcesyjnych."
  bronze_hatti_collapse_cleanup_text: "Trwa sprzątanie zmiennych Upadku Hatti."
  bronze_hatti_collapse.1.title: "Rubieże Hatti Drżą"
  bronze_hatti_collapse.1.desc: "Statki znikają na południowym morzu, karawany ze zbożem przybywają z opóźnieniem, a gubernatorzy pytają, czy Hattusa wciąż może ich chronić. Wielki Król nadal włada pałacami, skrybami, rydwanami i przysięgami, lecz dawny porządek nie wydaje się już niezmienny."
  bronze_hatti_collapse.1.a: "Zwołaj dwór do Hattusy."
  bronze_hatti_collapse.1.b: "Wyślij obserwatorów na wybrzeże."
  bronze_hatti_collapse_1a_tt: "Upadek Hatti rozpoczyna się w fazie 1 z Naciskiem Imperialnym 5 i Naciskiem Głodu 5."
  bronze_hatti_collapse_1b_tt: "Upadek Hatti rozpoczyna się w fazie 1. Hatti zyskuje Ufortyfikowane Wybrzeże na 4 lata, a Nacisk Imperialny wynosi #P -3#!."
  bronze_hatti_collapse.5.title: "Kryzys Zbożowy"
  bronze_hatti_collapse.5.desc: "Pałacowe tabliczki wciąż żądają racji, pracy i brązu, lecz pola odpowiadają marnymi zbiorami. Miasta zwracają się ku królewskim spichlerzom, podczas gdy szlachta gromadzi to, co pozostało."
  bronze_hatti_collapse.5.a: "Spichlerze nie mogą wyżywić wszystkich."
  bronze_hatti_collapse_5a_tt: "Hatti zyskuje Kryzys Zbożowy na 6 lat i Upadek Handlu Anatolijskiego na 5 lat. Nacisk Imperialny #N +6#!, Nacisk Głodu #N +12#!."
  bronze_hatti_collapse.6.title: "Wasale Sprzeciwiają się Hattusie"
  bronze_hatti_collapse.6.desc: "Władcy klienccy opóźniają daniny i odpowiadają królewskim posłańcom wymówkami. Mówią o lokalnej obronie, pustych magazynach i niebezpieczeństwie na każdej drodze. Pod słowami kryje się ostrzejsze pytanie: kto wciąż obawia się Wielkiego Króla?"
  bronze_hatti_collapse.6.a: "Ich lojalność się kruszy."
  bronze_hatti_collapse_6a_tt: "Hatti zyskuje Buntowniczych Wasali na 8 lat. Nacisk Imperialny #N +8#!, a stabilność spada."
  bronze_hatti_collapse.7.title: "Imperium Pęka"
  bronze_hatti_collapse.7.desc: "Lokalni dynastowie gromadzą ludzi pod własnymi sztandarami. Magazyny pałacowe są strzeżone zacieklej niż bramy miast. Hatti wciąż istnieje, lecz władza dociera teraz tylko tak daleko, jak sięgają żywność, strach i królewskie wojska."
  bronze_hatti_collapse.7.a: "Centrum nie zdoła utrzymać każdej drogi."
  bronze_hatti_collapse.7.b: "Wycofajmy się ku anatolijskiemu centrum."
  bronze_hatti_collapse_7a_tt: "Hatti zyskuje Wewnętrzny Rozpad na 8 lat. Nacisk Imperialny #N +10#!, stabilność spada, a szlachta traci zadowolenie."
  bronze_hatti_collapse_7b_tt: "Hatti zyskuje Skoncentrowane Centrum na 8 lat. Nacisk Imperialny #P -10#!, lecz prestiż spada, gdy porzucana jest władza nad peryferiami."
  bronze_hatti_collapse.8.title: "Upadek Hatti"
  bronze_hatti_collapse.8.desc: "Dawne imperium dotarło do krawędzi. Niektóre rody królewskie szukają przetrwania poza Hattusą, niektórzy gubernatorzy ogłaszają miasta własnym imieniem, a północne wzgórza przestają być posłuszne. Hatti może przetrwać, lecz nie będzie już takie jak dawniej."
  bronze_hatti_collapse.8.a: "Uznajmy to, co można jeszcze ocalić."
  bronze_hatti_collapse_8a_tt: "Deterministyczna mapa państw sukcesyjnych zostaje wprowadzona wyłącznie na ziemiach należących do Hatti. Gracz będący Hatti kontynuuje grę jako Que z prawowitą dynastią królewską."
  bronze_hatti_collapse.10.title: "Uchodźcy na Drodze Królewskiej"
  bronze_hatti_collapse.10.desc: "Rodziny przybywają ze spalonych wiosek, nadbrzeżnych miast i niepewnych pograniczy. Przynoszą narzędzia, żal, pogłoski i głód. Skrybowie mogą ich policzyć, lecz liczenie nie daje im pożywienia."
  bronze_hatti_collapse.10.a: "Niech znajdą żywność, gdzie tylko mogą."
  bronze_hatti_collapse.10.b: "Zarejestrujmy ich pod nadzorem pałacu."
  bronze_hatti_collapse_10a_tt: "Nacisk Imperialny #N +4#!, a Nacisk Głodu #N +3#!."
  bronze_hatti_collapse_10b_tt: "Nacisk Imperialny #N +1#!. Szlachta traci zadowolenie z powodu nadzwyczajnej rejestracji."
  bronze_hatti_collapse.20.title: "Najeźdźcy na Południowym Wybrzeżu"
  bronze_hatti_collapse.20.desc: "Nad portami płoną ogniska sygnałowe. Obce statki i przesiedlone bandy wojenne badają plaże, licząc na zdobycie żywności, metalu, niewolników i bydła, zanim nadejdą wojska Hatti."
  bronze_hatti_collapse.20.a: "Utrzymajmy wybrzeże, jeśli zdołamy."
  bronze_hatti_collapse_20a_tt: "Fortece, armie na wybrzeżu, floty i działanie Ufortyfikuj Wybrzeże zwiększają szansę na odparcie najazdu. Nieudana obrona uszkadza jedną nadbrzeżną lokację, niszczy żywność, zabija część ludności i zwiększa nacisk."
  bronze_hatti_collapse_raid_repulsed_tt: "Najazd został odparty. Nacisk Imperialny spada o #P 2-3#! w zależności od obrony."
  bronze_hatti_collapse_chariot_raid_repulsed_tt: "Zmobilizowane wojsko rydwanów dociera na wybrzeże na czas. Nacisk Imperialny #P -2#!."
  bronze_hatti_collapse.30.title: "Dostawy Zboża Zawodzą"
  bronze_hatti_collapse.30.desc: "Oczekiwane dostawy nie docierają. Niektóre łodzie nigdy nie opuściły portu; inne zostały przejęte, rozbite lub przekierowane przez lokalne władze obawiające się głodu we własnych domach."
  bronze_hatti_collapse.30.a: "Skonfiskuj zapasy szlachty."
  bronze_hatti_collapse.30.b: "Poproś świątynie i majątki o powściągliwość."
  bronze_hatti_collapse_30a_tt: "Hatti zyskuje Kryzys Zbożowy i Upadek Handlu Anatolijskiego. Nacisk Imperialny #N +6#!, Nacisk Głodu #N +12#!."
  bronze_hatti_collapse_30b_tt: "Nacisk Głodu #N +4#! i Nacisk Imperialny #N +2#!. Szlachta traci zadowolenie."
  bronze_hatti_collapse.40.title: "Odmowa Złożenia Daniny"
  bronze_hatti_collapse.40.desc: "Król pogranicza wysyła podarki zamiast daniny i nazywa je oznakami przyjaźni. To rozróżnienie jest celowe. Jeśli Hattusa je zaakceptuje, inni pójdą w jego ślady."
  bronze_hatti_collapse.40.a: "To jest bunt."
  bronze_hatti_collapse.40.b: "Przyjmijmy teraz mniej, aby zachować przysięgę."
  bronze_hatti_collapse_40a_tt: "Hatti zyskuje Buntowniczych Wasali na 8 lat. Nacisk Imperialny #N +8#!, a stabilność spada."
  bronze_hatti_collapse_40b_tt: "Nacisk Imperialny #P -4#!, lecz prestiż spada z powodu zmniejszenia daniny."
  bronze_hatti_collapse.50.title: "Najazdy Kasków"
  bronze_hatti_collapse.50.desc: "Z północnych wzgórz przybywają najeźdźcy, złodzieje bydła i bandy wojenne, które znają drogi lepiej niż królewskie garnizony. Każda wieś spalona w pobliżu pogranicza sprawia, że Hattusa wydaje się coraz bardziej odległa."
  bronze_hatti_collapse.50.a: "Wyślij kolumny karne na północ."
  bronze_hatti_collapse.50.b: "Zapłać miejscowym wodzom za ochronę przełęczy."
  bronze_hatti_collapse_50a_tt: "Nacisk Imperialny #N +7#! i Nacisk Głodu #N +3#!, ponieważ północna kampania pochłania ludzi i żywność."
  bronze_hatti_collapse_50b_tt: "Nacisk Imperialny #N +3#!. Szlachta traci zadowolenie, gdy wodzowie pogranicza otrzymują zapłatę."
  bronze_hatti_collapse.60.title: "Południowi Dynastowie Żądają Uznania"
  bronze_hatti_collapse.60.desc: "Południowi gubernatorzy żądają dziedzicznych dowództw, lokalnej kontroli nad zbożem i prawa do obrony swoich dróg bez oczekiwania na rozkazy Hattusy. Ustępstwa mogą na razie zachować porządek, lecz przygotowują również grunt pod późniejsze królestwa."
  bronze_hatti_collapse.60.a: "Uznaj ich nadzwyczajne uprawnienia."
  bronze_hatti_collapse.60.b: "Odrzuć tę nielojalność."
  bronze_hatti_collapse_60a_tt: "Żadne państwo nie zostaje jeszcze uwolnione. Nacisk Imperialny #P -4#!, lecz Hatti traci prestiż i wzmacnia południowych dynastów."
  bronze_hatti_collapse_60b_tt: "Dynastowie zostają pozbawieni żądanych uprawnień. Nacisk Imperialny #N +10#!."
  bronze_hatti_collapse.70.title: "Karkemisz Zachowuje Linię"
  bronze_hatti_collapse.70.desc: "Na pograniczu Eufratu Karkemisz wciąż posiada skrybów, żołnierzy i królewski prestiż. Pobliskie gubernatorstwa zwracają się ku ocalałym pałacom, zamiast odległej Hattusie."
  bronze_hatti_collapse.70.a: "Niech pogranicze ocali, co zdoła."
  bronze_hatti_collapse.70.b: "Linia królewska pozostaje w Hattusie."
  bronze_hatti_collapse_70a_tt: "Archiwa Eufratu i administracja prowincjonalna zostają zachowane na potrzeby możliwego porządku sukcesyjnego. Nacisk Imperialny #P -5#!, lecz Hatti traci prestiż."
  bronze_hatti_collapse_70b_tt: "Nie uznaje się ciągłości sukcesyjnej. Nacisk Imperialny #N +8#!."
  bronze_hatti_collapse.80.title: "Wielki Król Przywraca Porządek"
  bronze_hatti_collapse.80.desc: "Dwór wycofał się, lecz centrum znów może odetchnąć. Zboże dociera do kluczowych miast, królewscy posłańcy podróżują pod eskortą, a pozostali możnowładcy wiedzą, że Hatti nie zniknęło."
  bronze_hatti_collapse.80.a: "Burza nas nie złamała."
  bronze_hatti_collapse_80a_tt: "Nacisk Imperialny #P -15#! i Nacisk Głodu #P -8#!."
  bronze_hatti_collapse.90.title: "Hatti Rozpada się"
  bronze_hatti_collapse.90.desc: "Ostatnie roszczenia do powszechnego posłuszeństwa upadają. Regionalni królowie, ocalałe pałace i władcy pogranicza przemawiają teraz we własnym imieniu. Dawne ciało imperialne przestało istnieć; to, co pozostało, musi nauczyć się przetrwać."
  bronze_hatti_collapse.90.a: "Ród królewski musi przetrwać w Que."
  bronze_hatti_collapse_90a_tt: "Królestwa sukcesyjne otrzymują wyłącznie przypisane im ziemie należące do Hatti. Gracz będący Hatti kontynuuje grę jako Que z tą samą dynastią panującą."
  bronze_hatti_collapse.100.title: "Wilusa Obserwuje Morze"
  bronze_hatti_collapse.100.desc: "Wilusa spogląda na zachód i morze. Jej władcy wciąż posługują się językiem przysiąg, lecz każdy spalony port i każda zaginiona karawana sprawiają, że Hattusa wydaje się coraz bardziej odległa. Ich posłowie proszą o brąz, małżeństwa i swobodę obrony własnego wybrzeża."
  bronze_hatti_collapse.100.a: "Zwiąż Wilusę podarkami i małżeństwem."
  bronze_hatti_collapse.100.b: "Zażądaj statków i ludzi."
  bronze_hatti_collapse.100.c: "Pozwól Wilusie strzec własnego wybrzeża."
  bronze_hatti_collapse_100a_tt: "Wilusa zyskuje Lojalnego Klienta na 6 lat. Nacisk Imperialny #P -3#!, lecz Hatti traci prestiż."
  bronze_hatti_collapse_100b_tt: "Wilusa zyskuje Buntowniczego Klienta na 6 lat. Nacisk Imperialny #N +5#!."
  bronze_hatti_collapse_100c_tt: "Wilusa łamie swoją przysięgę wasalną, jeśli nadal jest podległa. Przysięgi Wasalne #N -1#! i Nacisk Imperialny #N +2#!."
  bronze_hatti_collapse.110.title: "Układ z Krajem Rzeki Seha"
  bronze_hatti_collapse.110.desc: "Kraj Rzeki Seha przesyła uprzejme słowa i mniej wozów. Jego władca twierdzi, że lokalne spichlerze muszą najpierw wyżywić miejscową ludność. To jeszcze nie bunt, lecz nie jest to już posłuszeństwo."
  bronze_hatti_collapse.110.a: "Przyjmijmy w tym roku mniejszą daninę."
  bronze_hatti_collapse.110.b: "Wyślij królewskich inspektorów."
  bronze_hatti_collapse.110.c: "Uwolnij Seha od bezpośrednich zobowiązań."
  bronze_hatti_collapse_110a_tt: "Seha zyskuje Lojalnego Klienta na 6 lat. Nacisk Imperialny #P -3#!, a szlachta zyskuje zadowolenie."
  bronze_hatti_collapse_110b_tt: "Seha zyskuje Buntowniczego Klienta na 6 lat. Nacisk Imperialny #N +6#!, a Hatti traci prestiż."
  bronze_hatti_collapse_110c_tt: "Seha łamie swoją przysięgę wasalną, jeśli nadal jest podległe. Przysięgi Wasalne #N -1#! i Nacisk Imperialny #N +3#!."
  bronze_hatti_collapse.120.title: "Mira Żąda Autonomii"
  bronze_hatti_collapse.120.desc: "Mira kontroluje drogi, porty i zapasy pałacowe zbyt cenne, by je zignorować. Jej dwór żąda teraz prawa do dowodzenia własnymi poborowymi i rozstrzygania własnych sporów, zachowując jedynie ceremonialną lojalność wobec Hattusy."
  bronze_hatti_collapse.120.a: "Kup lojalność Miry królewskim brązem."
  bronze_hatti_collapse.120.b: "Odrzuć żądanie."
  bronze_hatti_collapse.120.c: "Uznaj autonomię Miry."
  bronze_hatti_collapse_120a_tt: "Mira zyskuje Lojalnego Klienta na 6 lat. Nacisk Imperialny #P -4#!, lecz Hatti traci umiarkowaną ilość prestiżu."
  bronze_hatti_collapse_120b_tt: "Mira zyskuje Buntowniczego Klienta na 8 lat. Nacisk Imperialny #N +8#!."
  bronze_hatti_collapse_120c_tt: "Mira łamie swoją przysięgę wasalną, jeśli nadal jest podległa. Przysięgi Wasalne #N -1#! i Nacisk Imperialny #N +4#!."
  bronze_hatti_collapse.130.title: "Hapalla Uzbraja Przełęcze"
  bronze_hatti_collapse.130.desc: "Górskie drogi Hapalli wypełniają się uzbrojonymi rodami i zamkniętymi bramami. Lokalny król przysięga, że działa dla Hatti, lecz jego posłańcy odmawiają wskazania, którym królewskim rozkazom wciąż jest posłuszny."
  bronze_hatti_collapse.130.a: "Potwierdź górskie przywileje Hapalli."
  bronze_hatti_collapse.130.b: "Wmaszeruj w przełęcze."
  bronze_hatti_collapse.130.c: "Pozwól Hapalli samotnie strzec pogranicza."
  bronze_hatti_collapse_130a_tt: "Hapalla zyskuje Lojalnego Klienta na 6 lat. Nacisk Imperialny #P -4#!, a szlachta zyskuje zadowolenie."
  bronze_hatti_collapse_130b_tt: "Hapalla zyskuje Buntowniczego Klienta na 8 lat. Nacisk Imperialny #N +7#!, a Hatti traci stabilność."
  bronze_hatti_collapse_130c_tt: "Hapalla łamie swoją przysięgę wasalną, jeśli nadal jest podległa. Przysięgi Wasalne #N -1#! i Nacisk Imperialny #N +4#!."

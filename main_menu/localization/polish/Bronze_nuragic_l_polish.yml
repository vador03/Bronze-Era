l_polish:
  nuragic_simple_nuraghe: "Prosty Nurag"
  nuragic_simple_nuraghe_desc: "Lokalna kamienna wieża wykorzystywana jako schronienie obronne, punkt obserwacyjny i ważny punkt orientacyjny dla wspólnoty."
  nuragic_complex_nuraghe: "Złożony Nurag"
  nuragic_complex_nuraghe_desc: "Większy kompleks wieżowy z dołączonymi pomieszczeniami przeznaczonymi do przechowywania zapasów, zgromadzeń oraz sprawowania władzy przez lokalnych przywódców."
  nuragic_giants_tombs: "Groby Gigantów"
  nuragic_giants_tombs_desc: "Zbiorowe kamienne grobowce wykorzystywane do obrzędów ku czci przodków i podtrzymywania pamięci o rozległych grupach krewniaczych."
  nuragic_circular_house_village: "Wieś Okrągłych Domów"
  nuragic_circular_house_village_desc: "Rozproszona wieś nuragijska z okrągłymi kamiennymi domami, zagrodami dla zwierząt, pomieszczeniami magazynowymi i przydomowymi warsztatami."
  nuragic_bronze_workshop: "Nuragijski Warsztat Brązowniczy"
  nuragic_bronze_workshop_desc: "Niewielkie warsztaty odlewnicze i wykończeniowe wytwarzają narzędzia, ozdoby i brązowe przedmioty wotywne na potrzeby lokalnej wymiany."
  nuragic_communal_cistern: "Wspólna Cysterna"
  nuragic_communal_cistern_desc: "Zarządzany punkt poboru i magazynowania wody, wspierający pasterzy, gospodarstwa domowe i sezonowe zgromadzenia."
  nuragic_simple_nuraghe_maintenance: "Utrzymanie Wieży"
  nuragic_simple_nuraghe_maintenance_desc: "Kamień, drewno i narzędzia służą do utrzymania wieży oraz jej bezpośrednich umocnień obronnych."
  nuragic_complex_nuraghe_maintenance: "Utrzymanie Kompleksu"
  nuragic_complex_nuraghe_maintenance_desc: "Murarze, cieśle i strażnicy utrzymują większy kompleks wieży nuragijskiej."
  nuragic_giants_tombs_maintenance: "Ofiary dla Przodków"
  nuragic_giants_tombs_maintenance_desc: "Ofiary i okresowe naprawy pozwalają zachować zbiorowe grobowce oraz prowadzące do nich miejsca obrzędowe."
  nuragic_household_compounds: "Zespoły Gospodarstw Domowych"
  nuragic_household_compounds_desc: "Rodziny hodują zwierzęta, przechowują zboże oraz utrzymują ceramikę i narzędzia domowe w obrębie skupisk okrągłych domów."
  nuragic_bronze_casting: "Odlewanie Brązu"
  nuragic_bronze_casting_desc: "Miedź, cyna, narzędzia i wykwalifikowana siła robocza są wykorzystywane do ograniczonej produkcji brązu."
  nuragic_votive_casting: "Odlewanie Przedmiotów Wotywnych"
  nuragic_votive_casting_desc: "Brąz i wosk są formowane w niewielkie przedmioty rytualne i dobra prestiżowe."
  nuragic_cistern_maintenance: "Gospodarowanie Wodą"
  nuragic_cistern_maintenance_desc: "Kamienne konstrukcje, naczynia ceramiczne i narzędzia pozwalają utrzymać wspólną cysternę w użyciu podczas pór suchych."
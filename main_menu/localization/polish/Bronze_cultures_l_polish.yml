l_polish:
 egypt_nile_group: "Egipt i Nil"
 egypt_nile_group_desc: "Kultury doliny i delty Nilu, ukształtowane przez królestwa rzeczne i tradycje starożytnego Egiptu."
 mesopotamian_group: "Mezopotamska"
 mesopotamian_group_desc: "Kultury Tygrysu i Eufratu, obejmujące miasta, królestwa i tradycje starożytnej Mezopotamii."
 anatolian_bronze_group: "Anatolijska"
 anatolian_bronze_group_desc: "Kultury Anatolii, łączące ludy i królestwa centralnych wyżyn, zachodnich wybrzeży i wschodnich płaskowyżów."
 levant_bronze_group: "Lewantyńska"
 levant_bronze_group_desc: "Kultury wybrzeży Lewantu i dolin śródlądowych, ukształtowane przez tradycje kananejskie, amoryckie i pokrewne tradycje epoki brązu."
 arabian_bronze_group: "Arabski"
 arabian_bronze_group_desc: "Kultury Półwyspu Arabskiego, od osiadłych społeczności oazowych po pasterskie ludy jego pustyń i terenów górskich."
 iranian_plateau_group: "Wyżyna Irańska"
 iranian_plateau_group_desc: "Kultury Wyżyny Irańskiej i otaczających ją wyżyn, będących skrzyżowaniem tradycji wschodniomezopotamskich, środkowoazjatyckich i miejscowych."
 caucasus_bronze_group: "Kaukaska"
 caucasus_bronze_group_desc: "Kultury Kaukazu, ukształtowane przez społeczności górskie i sieci łączące Morze Czarne, Anatolię i wnętrze Eurazji."
 steppe_bronze_group: "Stepowa"
 steppe_bronze_group_desc: "Kultury stepów pontyjsko-kaspijskich i eurazjatyckich, zdominowane przez mobilne społeczności pasterskie i rozległe sieci wymiany."
 aegean_bronze_group: "Egejska"
 aegean_bronze_group_desc: "Kultury wysp i kontynentalnych obszarów Morza Egejskiego, obejmujące społeczności morskie świata egejskiego epoki brązu."
 balkans_bronze_group: "Bałkańska"
 balkans_bronze_group_desc: "Kultury ziem bałkańskich, od dorzecza Dunaju po południowe góry, ukształtowane przez społeczności rolnicze, metalurgię i wymianę regionalną."
 italic_bronze_group: "Italska"
 italic_bronze_group_desc: "Kultury Półwyspu Apenińskiego, obejmujące różnorodne społeczności epoki brązu połączone handlem, migracjami i wspólnymi tradycjami materialnymi."
 iberian_bronze_group: "Iberyjski"
 iberian_bronze_group_desc: "Kultury Półwyspu Iberyjskiego, od społeczności atlantyckich i śródziemnomorskich po ludy zamieszkujące jego góry i doliny rzeczne."
 gaulish_bronze_group: "Galijska"
 gaulish_bronze_group_desc: "Kultury Galii i zachodniej części Europy, zakorzenione w różnorodnych społecznościach epoki brązu zamieszkujących lasy, doliny rzeczne i otwarte równiny."
 germanic_nordic_group: "Germańska i Nordycka"
 germanic_nordic_group_desc: "Kultury północnej i środkowej Europy, obejmujące ziemie nordyckie, wybrzeża Bałtyku i zalesione obszary północnych krain śródlądowych."
 britain_bronze_group: "Brytyjski"
 britain_bronze_group_desc: "Kultury Wysp Brytyjskich, ukształtowane przez społeczności wyspiarskie, dalekosiężną wymianę i charakterystyczne tradycje epoki brązu."
 indic_bronze_group: "Indusu i Wedyjska"
 indic_bronze_group_desc: "Kultury doliny Indusu i północnej części subkontynentu indyjskiego, obejmujące tradycje miejskie oraz kształtujące się społeczności wczesnego świata wedyjskiego."
 central_asian_bronze_group: "Środkowoazjatycka"
 central_asian_bronze_group_desc: "Kultury środkowoazjatyckich oaz, stepów i korytarzy górskich, łączące świat irański, step eurazjatycki i Azję Południową."
 north_african_bronze_group: "Północnoafrykańska"
 north_african_bronze_group_desc: "Kultury Afryki Północnej poza doliną Nilu, obejmujące wybrzeża Morza Śródziemnego, płaskowyże śródlądowe i społeczności Sahary."
 sea_peoples_group: "Ludy Morza"
 sea_peoples_group_desc: "Morskie i przesiedlone społeczności wojowników związane z niepokojami i migracjami późnej epoki brązu we wschodniej części Morza Śródziemnego."
 east_asian_bronze_group: "Wschodnioazjatycka epoki brązu"
 east_asian_bronze_group_desc: "Kultury Azji Wschodniej, obejmujące wczesne społeczności zajmujące się obróbką brązu oraz regionalne tradycje dorzeczy Huang He, Jangcy i sąsiednich ziem."
 southeast_asian_bronze_group: "Południowo-Wschodnioazjatycka epoki brązu"
 southeast_asian_bronze_group_desc: "Kultury kontynentalnej i wyspiarskiej Azji Południowo-Wschodniej, ukształtowane przez doliny rzeczne, sieci przybrzeżne i wczesne tradycje obróbki brązu."
 siberian_bronze_group: "Syberyjska epoki brązu"
 siberian_bronze_group_desc: "Kultury Syberii i północnych krain śródlądowych, przystosowane do rozległych lasów, obrzeży stepów, systemów rzecznych i dalekosiężnych sieci wymiany."
 african_bronze_group: "Afrykańska epoki brązu"
 african_bronze_group_desc: "Kultury Afryki Subsaharyjskiej, reprezentujące różnorodne społeczności i regionalne tradycje rozwijające się na sawannach, w lasach i krainach rzecznych."
 american_bronze_group: "Amerykańska epoki brązu"
 american_bronze_group_desc: "Kultury obu Ameryk, obejmujące różnorodne społeczeństwa Mezoameryki, Andów i innych regionów posiadających własne, niezależne tradycje metalurgiczne i rzemieślnicze."
 oceanian_bronze_group: "Oceaniańska epoki brązu"
 oceanian_bronze_group_desc: "Kultury Oceanii, obejmujące społeczności wyspiarskie i nadbrzeżne ukształtowane przez żeglugę, migracje i charakterystyczne tradycje Pacyfiku."
 baltic_group: "Bałtycka"
 baltic_group_desc: "Kultury wschodniego wybrzeża Bałtyku, śródlądowych szlaków wodnych i zalesionych ziem plemiennych, połączone szlakami bursztynowymi i regionalną wymianą."
 finnic_group: "Fińska"
 finnic_group_desc: "Kultury północnych lasów, jezior i przybrzeżnych szlaków wodnych wokół Zatoki Fińskiej i jeziora Pejpus, ukształtowane przez rybołówstwo, łowiectwo i handel regionalny."
 italian_bronze_group: "Italska epoki brązu"
 italian_bronze_group_desc: "Społeczności Italii epoki brązu, sprzed ukształtowania się późniejszych tożsamości łacińskiej, etruskiej i rzymskiej."
 alpine_bronze_group: "Alpejska epoki brązu"
 alpine_bronze_group_desc: "Społeczności zamieszkujące jeziora, doliny i przełęcze północnej Italii oraz przylegających Alp."
 adriatic_bronze_group: "Adriatycka epoki brązu"
 adriatic_bronze_group_desc: "Społeczności grodów warownych i osad zwróconych ku morzu wokół północno-wschodniego Adriatyku i wybrzeża Apulii."
 island_bronze_group: "Wyspiarska epoki brązu"
 island_bronze_group_desc: "Kultury epoki brązu Sardynii, Korsyki i Sycylii."

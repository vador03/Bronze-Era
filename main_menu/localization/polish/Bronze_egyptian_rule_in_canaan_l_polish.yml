  egyptian_rule_in_canaan_annual_pressure_text: "Zastosuj coroczną presję na egipską władzę"
  egyptian_rule_in_canaan_check_garrison_loss_text: "Sprawdź, czy egipskie garnizony zostały zajęte"
  egyptian_rule_in_canaan_mark_subject_defiant_text: "Oznacz tego wasala jako buntowniczego"
  egyptian_rule_in_canaan_mark_all_subjects_defiant_text: "Oznacz wszystkich kananejskich wasali jako buntowniczych"

l_polish:
  egyptian_rule_in_canaan: "Egipskie panowanie w Kanaanie"
  egyptian_rule_in_canaan_desc: "Egipskie garnizony i traktaty wasalne wiążą Kanaan z Nilem, lecz królowie miast uważnie obserwują siłę Egiptu. Władza rośnie dzięki opłacanym garnizonom i lojalnym poddanym, a słabnie wskutek buntu, utraty twierdz, głodu i szerszego upadku epoki brązu."
  egyptian_rule_in_canaan_overview_card: "Protektorat Kanaanu"
  egyptian_rule_in_canaan_overview_card_desc: "Egipt rozpoczyna z silną, lecz kruchą siecią imperialną w Kanaanie. Lokalne królestwa-miasta pozostają na swoich ziemiach, podczas gdy egipskie garnizony strzegą głównych dróg i portów."
  egyptian_rule_in_canaan_panel_phase: "Faza"
  egyptian_rule_in_canaan_panel_phase_value: "#Y [GetSituationByKey('egyptian_rule_in_canaan').MakeScope.GetVariable('egyptian_rule_in_canaan_phase').GetValue|V0]#!/3"
  egyptian_rule_in_canaan_panel_authority: "Egipska władza"
  egyptian_rule_in_canaan_panel_authority_value: "#Y [GetSituationByKey('egyptian_rule_in_canaan').MakeScope.GetVariable('egyptian_authority_in_canaan').GetValue|V0]#!/100"
  egyptian_rule_in_canaan_panel_subjects: "Wasale kananejscy"
  egyptian_rule_in_canaan_panel_subjects_value: "#Y [GetSituationByKey('egyptian_rule_in_canaan').MakeScope.GetVariable('egyptian_rule_in_canaan_subjects').GetValue|V0]#!/10"
  egyptian_rule_in_canaan_actions_card: "Dostępne działania"
  egyptian_rule_in_canaan_actions_card_desc: "Egipt może poświęcić bogactwo i siłę roboczą na wzmocnienie garnizonów. Kananejscy wasale mogą przeciwstawić się egipskiej władzy, zyskując niepokoje i ryzyko dyplomatyczne."
  egyptian_rule_in_canaan_map_card: "Znaczniki na mapie"
  egyptian_rule_in_canaan_map_card_desc: "Żółty kolor oznacza kananejskie królestwa-miasta. Miejsca oznaczone kolorem Egiptu posiadają egipskie garnizony. Czerwone dodatkowe oznaczenie wskazuje okupowane pozycje garnizonów."
  hint_egyptian_rule_in_canaan: "Egipskie panowanie w Kanaanie"
  egyptian_rule_in_canaan_hint_text: "Egipt kontroluje Kanaan poprzez wasalne królestwa-miasta i zagraniczne garnizony. Jeśli władza spadnie do zera, Egipt musi albo opuścić Kanaan, albo ponieść dotkliwy jednorazowy koszt, by utrzymać protektorat."
  egyptian_rule_in_canaan_phase_1: "Egipska hegemonia"
  egyptian_rule_in_canaan_phase_2: "Słabnąca władza"
  egyptian_rule_in_canaan_phase_3: "Kananejski bunt"
  egyptian_rule_reinforce_canaanite_garrisons: "Wzmocnij kananejskie garnizony"
  egyptian_rule_reinforce_canaanite_garrisons_desc: "Wyślij żołnierzy, skrybów i srebro do kananejskich twierdz. Koszt jest realny, lecz widoczna egipska siła może opóźnić rebelię."
  egyptian_rule_reinforce_canaanite_garrisons_tt: "Egipska władza w Kanaanie wzrasta o #P 8#!. Zadowolenie egipskiej szlachty nieznacznie spada, gdy ludzie i zasoby są wysyłane za granicę."
  egyptian_rule_defy_egyptian_authority: "Sprzeciw się egipskiej władzy"
  egyptian_rule_defy_egyptian_authority_desc: "Wstrzymaj daninę, udziel schronienia lokalnym oddziałom wojennym i wystaw na próbę zasięg władzy faraonowych urzędników."
  egyptian_rule_defy_egyptian_authority_tt: "Egipska władza w Kanaanie spada o #N 4#!. Ten kraj zyskuje pragnienie wolności, a jego stosunki z Egiptem ulegają pogorszeniu."
  egyptian_rule_in_canaan.1.title: "Kananejski protektorat"
  egyptian_rule_in_canaan.1.desc: "Drogi Kanaanu wciąż podlegają Egiptowi. Garnizony strzegą Gazy, Jafy i Sychem, podczas gdy królowie miast wysyłają daniny nad Nil. Równowaga zależy jednak od strachu, złota i reputacji wojsk faraona."
  egyptian_rule_in_canaan.1.a: "Wasalni królowie zapamiętają Egipt."
  egyptian_rule_in_canaan_1a_tt: "Sytuacja Egipskiego panowania w Kanaanie rozpoczyna się z poziomem władzy #Y 80#!."
  egyptian_rule_in_canaan.2.title: "W cieniu faraona"
  egyptian_rule_in_canaan.2.desc: "Egipscy skrybowie liczą zboże, żołnierze strzegą dróg, a posłańcy przynoszą żądania z południa. Twoje miasto zachowuje swój tron, lecz nie pełną wolność."
  egyptian_rule_in_canaan.2.a: "Przetrwamy ten porządek."
  egyptian_rule_in_canaan_2a_tt: "Jesteś częścią sytuacji Egipskiego panowania w Kanaanie jako kananejski wasal."
  egyptian_rule_in_canaan.10.title: "Odmowa złożenia daniny"
  egyptian_rule_in_canaan.10.desc: "Kilku królów kananejskich miast opóźnia daninę i wysyła wymijające listy. Garnizony żądają srebra, posłowie domagają się kary, a skrybowie ostrzegają, że egipska władza staje się przedmiotem negocjacji."
  egyptian_rule_in_canaan.10.a: "Niech ostrzeżenie pozostanie."
  egyptian_rule_in_canaan_10a_tt: "Egipska władza w Kanaanie spada o #N 4#!."
  egyptian_rule_in_canaan.10.b: "Sami spłaćmy zaległości."
  egyptian_rule_in_canaan_10b_tt: "Kosztuje #N 45#! szt. złota. Egipska władza w Kanaanie wzrasta o #P 3#!, a pragnienie wolności kananejskich wasali nieznacznie spada."
  egyptian_rule_in_canaan.20.title: "Garnizon zostaje odcięty"
  egyptian_rule_in_canaan.20.desc: "Ufortyfikowany egipski posterunek w Kanaanie został zajęty lub odcięty od miejscowego władcy. Strata nie jest jedynie wojskowa. Każdy pobliski król mierzy teraz egipską władzę z dymem unoszącym się nad drogą."
  egyptian_rule_in_canaan.20.a: "Wieść się rozniesie."
  egyptian_rule_in_canaan_20a_tt: "Egipska władza w Kanaanie spadła, ponieważ pozycja garnizonu została zajęta."
  egyptian_rule_in_canaan.100.title: "Protektorat upada"
  egyptian_rule_in_canaan.100.desc: "Kananejskie miasta nie są już posłuszne z przyzwyczajenia ani ze strachu. Posłańcy faraona są ignorowani, garnizony stają się kosztownymi wyspami kontroli, a skarbiec musi zdecydować, czy Kanaan jest wart kolejnego wielkiego poświęcenia."
  egyptian_rule_in_canaan.100.a: "Wycofajmy się z Kanaanu."
  egyptian_rule_in_canaan_100a_tt: "Wszyscy pozostali kananejscy wasale zostają uwolnieni, egipskie garnizony są usuwane, a sytuacja dobiega końca."
  egyptian_rule_in_canaan.100.b: "Kanaan musi zostać utrzymany."
  egyptian_rule_in_canaan_100b_tt: "Jednorazowy środek nadzwyczajny. Kosztuje #N 180#! złota, #N 500#! siły roboczej i stabilność. Władza zostaje przywrócona do poziomu #Y 30#!, lecz wszyscy kananejscy wasale stają się bardziej buntowniczy."
  egyptian_rule_in_canaan.200.title: "Kanaan przetrwał pod władzą Egiptu"
  egyptian_rule_in_canaan.200.desc: "Burze szerszego upadku przeminęły, nie łamiąc egipskiej władzy w Kanaanie. Garnizony pozostają kosztowne, lecz królowie wasalni nie rozbili protektoratu."
  egyptian_rule_in_canaan.200.a: "Drogi pozostają otwarte dla Egiptu."
  egyptian_rule_in_canaan_200a_tt: "Egipt zyskuje prestiż, a sytuacja kończy się, podczas gdy Kanaan pozostaje pod egipskim zwierzchnictwem."
  egyptian_rule_hegemony_modifier: "Egipska hegemonia w Kanaanie"
  egyptian_rule_declining_authority_modifier: "Słabnąca władza w Kanaanie"
  egyptian_rule_canaanite_defiance_modifier: "Kananejski bunt"
  egyptian_rule_subject_under_hegemony_modifier: "Pod egipską hegemonią"
  egyptian_rule_subject_declining_authority_modifier: "Niespokojny kananejski wasal"
  egyptian_rule_subject_defiance_modifier: "Buntowniczy kananejski wasal"
  egyptian_rule_canaanite_defiant_modifier: "Sprzeciw wobec egipskiej władzy"
  egyptian_rule_garrisons_reinforced_modifier: "Wzmocnione kananejskie garnizony"
  egyptian_rule_defied_authority: "Sprzeciwiono się egipskiej władzy"
  egyptian_canaanite_garrison: "Egipski garnizon"
  egyptian_canaanite_garrison_desc: "Ufortyfikowany egipski posterunek utrzymywany w obrębie kananejskiego królestwa-miasta. Stanowi przejaw władzy faraona bez przenoszenia miejscowej własności na Egipt."
  egyptian_canaanite_garrison_setup_only_tt: "Ten budynek jest umieszczany podczas przygotowania gry oraz przez sytuację Egipskiego panowania w Kanaanie."
  egyptian_rule_in_canaan_egypt_text: "To Egipt"
  egyptian_rule_in_canaan_city_kingdom_text: "To kananejskie królestwo-miasto"
  egyptian_rule_in_canaan_participant_text: "Uczestniczy w Egipskim panowaniu w Kanaanie"

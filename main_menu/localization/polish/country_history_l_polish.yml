  country_history_scandinavia: "Ziemie [**ShowRegionName(***'scandinavian_region'***)**] oraz [**ShowRegionName(***'north_atlantic_islands_region'***)**] leżą na północnym krańcu znanego świata. Ich rozproszone społeczności łączą więzy pokrewieństwa, sezonowe migracje, żegluga i handel. Zimne morza dostarczają [**ShowGoodsName(***'fish'***)**], drewna, futer, bursztynu oraz innych zasobów poszukiwanych przez kupców z odległych krain.\n\nJednak dobrobyt tych północnych ludów zależy od ich zdolności do opanowania morza i zjednoczenia rozproszonych osad. Rywalizujący wodzowie walczą o zwolenników i żyzne ziemie, podczas gdy surowy klimat i długie zimy wystawiają każdą społeczność na próbę. Silny władca może przekształcić te ludy w większą potęgę, lecz tylko jeśli starożytne więzi pokrewieństwa zdołają przezwyciężyć dzielące je rywalizacje."

  country_history_ruthenia: "Ziemie wokół wielkich rzek północy i wschodu są domem rozproszonych ludów, lasów i ufortyfikowanych osad. Wielkie szlaki wodne łączą [**ShowRegionName(***'ruthenia_region'***)**] z Bałtykiem, Stepem Pontyjskim oraz odległymi krainami po drugiej stronie. Kupcy, wojownicy i rzemieślnicy podążają tymi rzekami, przewożąc bursztyn, futra, metale, zboże i inne towary między odległymi ludami.\n\nJednak ziemie te są dalekie od jedności. Rywalizujące plemiona i wodzowie walczą o kontrolę nad dolinami rzecznymi, podczas gdy konne ludy [**ShowRegionName(***'steppes_region'***)**] pozostają stałym zagrożeniem od południa. Aby zbudować trwałe państwo na tych ziemiach, władca musi kontrolować rzeki, zabezpieczyć lasy i zjednoczyć liczne ludy północy pod jednym sztandarem."

  country_history_france: "Ziemie [**ShowRegionName(***'france_region'***)**] zamieszkują liczne ludy i społeczności, których terytoria dzielą rzeki, lasy, góry i dawne rywalizacje. W całym regionie ufortyfikowane osady i warownie na wzgórzach strzegą żyznych dolin oraz ważnych szlaków, podczas gdy kupcy przewożą metale, sól, zboże i inne towary między wybrzeżem Atlantyku, Morzem Śródziemnym a ziemiami za Renem.\n\nWładza spoczywa w rękach lokalnych wodzów i wojowniczych elit, których sojusze mogą zmieniać się równie szybko jak losy wojny. Za górami i rzekami żyją inne ludy, posiadające własne ambicje, podczas gdy rosnące wpływy potęg śródziemnomorskich sięgają coraz dalej w głąb Galii. Nadchodzące pokolenia rozstrzygną, czy ziemie te pozostaną podzielone między rywalizujące ludy, czy też jedna wielka potęga zdoła je zjednoczyć."

  country_history_britain: "Ziemie [**ShowRegionName(***'great_britain_region'***)**] są podzielone między liczne ludy i wodzostwa, połączone starożytnymi tradycjami, lecz rozdzielone rywalizacją o ziemię, bydło, handel i prestiż. Na całej wyspie ufortyfikowane osady na wzgórzach panują nad okolicznymi terenami, podczas gdy społeczności nadbrzeżne utrzymują kontakty z kupcami przemierzającymi zachodnie morza.\n\nBogactwo wyspy tkwi w jej żyznych ziemiach, hodowli zwierząt, metalach, drewnie oraz dostępie do otaczających ją mórz. Jednak jej ludy muszą mierzyć się nie tylko z rywalizującymi wodzami, lecz także z rosnącymi kontaktami i konkurencją zza Kanału La Manche i Morza Północnego. Z czasem zagraniczni kupcy i wojownicy mogą próbować wywierać wpływ na wyspę, podczas gdy ambitni władcy mogą dążyć do zjednoczenia jej licznych ludów pod jednym sztandarem."

  country_history_balkan: "[**ShowRegionName(***'balkan_region'***)**] leży pomiędzy wielkimi światami Morza Śródziemnego, Dunaju i Stepu Pontyjskiego. Jej góry i doliny rzeczne są domem licznych ludów, plemion i ufortyfikowanych osad, podczas gdy starożytne szlaki łączą wybrzeże Morza Egejskiego z ziemiami w głębi lądu.\n\nNa południu bogate miasta i królestwa Morza Egejskiego wywierają coraz większy wpływ, podczas gdy ludy z północy i wschodu przemierzają wielkie doliny rzeczne w poszukiwaniu ziemi i bogactwa. Wojownicy, kupcy i osadnicy rywalizują o kontrolę nad żyznymi równinami, kopalniami i górskimi przełęczami regionu. Nadchodzące stulecia zdecydują, czy ludy Bałkanów pozostaną podzielone, czy też potężne królestwo zdoła zjednoczyć te ziemie i rzucić wyzwanie otaczającym je wielkim mocarstwom."

  # Africa

  country_history_maghreb: "Głównymi graczami kulturowymi w regionie [ShowRegionName('maghreb_region')] są [ShowCultureGroupName('amazigh_group')] oraz [ShowCultureGroupName('arabic_group')], które współistnieją i walczą ze sobą od czasu najazdów w VII wieku. Dynastie wywodzące się z obu stron, w tym niektóre o mieszanym pochodzeniu, powstawały i upadały w tym regionie [ShowSubContinentName('north_africa')].\n\nPo raz kolejny podziały między różnymi narodami sprawiły, że stały się one potencjalnie podatne na działania silniejszych potęg. Czy ta ziemia ponownie zostanie zjednoczona?"

  country_history_sahel: "Regiony [ShowRegionName('sahel_region')] i Afryki Zachodniej stopniowo przechodzą od suchego obszaru Sahary, przez wybrzeża [ShowAreaName('gulf_of_guinea_area')], poprzez złociste sawanny [ShowRegionNameWithNoTooltip('sahel_region')] aż po głębokie dżungle dolnego Nigru. Na tych rozległych terytoriach imperia [GetCountry('MAL').GetName] i [GetCountry('KBO').GetName] kontrolują rozległe posiadłości oraz saharyjskie szlaki handlowe, podczas gdy inne ludy, takie jak [ShowCultureName('mossi')], [ShowCultureName('hausa')] i [ShowCultureName('yoruba')], czekają na okazję, by skonsolidować swoje ziemie i rozszerzyć je kosztem sąsiadów."

  country_history_kongo: "[ShowRegionName('kongo_region')] to kraina królestw rzecznych i zalesionych serc kontynentu, gdzie klany i wodzowie zawierają sojusze poprzez więzy krwi, handel i wojnę. W ostatnich dziesięcioleciach ambitni władcy zaczęli łączyć te ziemie w większe państwa, z których każde dąży do zdominowania żyznych dolin i przejęcia kontroli nad przepływem towarów wzdłuż wielkiej rzeki.\n\nRównowaga sił pozostaje krucha, a w nadchodzących dziesięcioleciach jeden silny przywódca może zjednoczyć lud [ShowCultureName('kongo')]... lub pogrążyć go w cyklu niekończącej się rywalizacji, osłabionego i podatnego na wykorzystanie przez obcych."

  country_history_east_africa: "Od żyznych brzegów Nilu po zachwycające wybrzeża [ShowRegionName('madagascar_region')]; od starożytnych portów [ShowRegionName('somalia_region')] po tętniące życiem społeczności [ShowRegionName('swahili_coast_region')], niezliczone narody stawiały czoła zarówno siłom natury, jak i najazdom niedoszłych zdobywców, pozostając niezłomne. To kraina możliwości, pełna bogactw czekających na zgromadzenie i wykorzystanie do stworzenia potężnego imperium, którego wpływy sięgać będą za morza."

  # Asia

  country_history_anatolia: "Ziemie [**ShowRegionName(***'anatolia_region'***)**] leżą na skrzyżowaniu wielu światów. Wielkie królestwa i ludy powstawały i upadały na tym surowym płaskowyżu, pozostawiając po sobie ufortyfikowane miasta, starożytne drogi i długą pamięć o wojnach. Hetyccy królowie, książęta luwijscy, wojownicy frygijscy i wiele innych ludów dążyło do władania tymi ziemiami, lecz żadnemu z nich nie było łatwo utrzymać ich przez długi czas. *$anatolia_desc$*"

  anatolia_desc: "Równowaga sił w [**ShowRegionName(***'anatolia_region'***)**] nieustannie się zmienia. Stare królestwa słabną, ambitni władcy gromadzą swoje armie, a nowe ludy przybywają zza gór i mórz. Ten, kto kontroluje wielkie doliny rzeczne, górskie przełęcze i bogate miasta Anatolii, może stać się potęgą zdolną rzucić wyzwanie wielkim królestwom otaczającego świata."

  country_history_caucasus: "[**ShowRegionName(***'caucasus_region'***)**] od zawsze stanowił świat sam dla siebie. Potężne góry dzielą jego doliny i ludy, podczas gdy przełęcze łączą Morze Czarne, Anatolię, Wyżynę Irańską oraz północny step. Wśród tych gór powstawały królestwa i ludy plemienne, broniąc swojej niezależności przed każdą potęgą, która próbowała je przekroczyć.\n\nKontrolowanie Kaukazu oznacza władzę nad drogami łączącymi wielkie cywilizacje. Jednak same góry są trudne do podbicia, a ludy, które je zamieszkują, są zaciekle przywiązane do swoich ziem i tradycji. Asyria, Urartu i wielkie królestwa południa mogą próbować rozszerzać tutaj swoje wpływy, lecz przyszłość będzie należeć do tych, którzy zdołają zjednoczyć rozproszone ludy gór i opanować przełęcze, które je ze sobą łączą."

  country_history_middle_east: "Na ziemiach [**ShowRegionName(***'egypt_region'***)**], [**ShowRegionName(***'crescent_region'***)**] i [**ShowRegionName(***'arabia_region'***)**] spotykają się najstarsze cywilizacje znanego świata. Wielkie rzeki Egiptu i Mezopotamii podtrzymują potężne królestwa, podczas gdy Lewant stanowi wąski pomost między nimi. Poza terenami zamieszkanymi pustynie Arabii przemierzają ludy pasterskie i kupcy przewożący towary między odległymi osadami.\n\nRegion ten od dawna jest przedmiotem rywalizacji ambitnych królów. Egipt, królestwa Mezopotamii, potęgi Anatolii oraz ludy Lewantu dążą do zdobycia wpływów nad jego żyznymi dolinami, portami, szlakami karawanowymi i świętymi miastami. Ten, kto zdoła kontrolować te ziemie, będzie władał skrzyżowaniem dróg między Afryką, Azją i Morzem Śródziemnym."

  country_history_china: "Ziemie *$china$* są domem dla jednych z najstarszych królestw i miast wschodniego świata. Wzdłuż wielkich rzek potężni władcy kontrolują żyzne równiny, ufortyfikowane osady i armie wojowników uzbrojonych w brąz. Tradycje starożytnych dynastii królewskich kształtowały zwyczaje, rytuały i polityczne ambicje niezliczonych ludów, podczas gdy bogactwo wschodnich równin przyciąga kupców i posłów z odległych krain.\n\nJednak ziemie te są dalekie od jedności. Rywalizujące królestwa walczą o terytorium i prestiż, podczas gdy ludy zza północnej granicy nieustannie wystawiają na próbę siłę osiadłych państw. Władcy, którzy zdołają zgromadzić największe armie, kontrolować najbogatsze doliny rzeczne i rościć sobie prawo do Mandatu Niebios, mogą stworzyć imperium zdolne zdominować wschodni świat."

  country_history_indonesia: "[**ShowRegionName(***'indonesia_region'***)**] to kraina niezliczonych wysp, oddzielonych wąskimi morzami, lecz połączonych starożytnymi tradycjami żeglugi i wymiany handlowej. Jej ludy od dawna podróżują między wyspami, handlując [**ShowGoodsName(***'fish'***)**], przyprawami, cennym drewnem i innymi towarami z odległych wybrzeży. Wody [**ShowRegionNameWithNoTooltip(***'indonesia_region'***)**] stanowią część wielkich szlaków morskich łączących ziemie *$india$* i *$china$*, sprowadzając na jej wybrzeża zagranicznych kupców, zwyczaje i wierzenia.\n\nWpływy tradycji [**ShowReligionName(***'hindu'***)**] oraz [**ShowReligionGroupName(***'buddhist'***)**] zaczynają docierać na te odległe wyspy, mieszając się z dawnymi lokalnymi wierzeniami i zwyczajami. Jednak żadne pojedyncze mocarstwo nie kontroluje archipelagu, a liczne wyspiarskie społeczności pozostają podzielone między wodzów, nadbrzeżne osady i powstające królestwa. Ten, kto opanuje te morza, może pewnego dnia kontrolować jedno z najbogatszych skrzyżowań wschodniego świata."

  country_history_indochina: "Leżące pomiędzy wielkimi cywilizacjami *$india$* i *$china$*, [**ShowRegionName(***'indochina_region'***)**] od dawna znajduje się na skrzyżowaniu ludów, kultur i szlaków handlowych. Żyzne doliny rzeczne podtrzymują rozwijające się osady, podczas gdy wielkie drogi wodne zapewniają naturalne szlaki zarówno kupcom, jak i armiom. Na tych ziemiach zaczynają powstawać starożytne królestwa, rywalizujące o kontrolę nad żyznymi równinami i ważnymi przeprawami rzecznymi.\n\nIndyjscy kupcy i tradycje religijne rozprzestrzeniają się na wschód, podczas gdy wpływy *$china$* sięgają na południe poprzez handel, dyplomację i migracje. Jednak żadna z tych wielkich cywilizacji nie kontroluje w pełni [**ShowRegionNameWithNoTooltip(***'indochina_region'***)**]. Region pozostaje podzielony między liczne ludy i wschodzące potęgi, a nadchodzące stulecia mogą sprawić, że jedna z nich wyniesie się ponad pozostałe."

  # Generic Continental

  # America

  country_history_america: "Na ziemiach [**ShowContinentName(***'america'***)**] niezliczone ludy zbudowały swoje życie zgodnie z rzekami, lasami, górami, równinami i wybrzeżami, które je otaczają. Społeczności wykształciły własne tradycje, sieci handlowe, święte miejsca i sposoby życia, podczas gdy odległe ludy pozostają od siebie oddzielone przez rozległe obszary dzikiej przyrody.\n\nNasi przodkowie przetrwali zmieniający się klimat, migracje, rywalizację oraz nieustanną walkę o utrzymanie się z ziemi. Niektóre ludy skupiały się w wielkich osadach, podczas gdy inne nadal podążały sezonowymi szlakami przez dzikie tereny. To, czy zachowamy tradycje przekazane nam przez przodków, czy też wytyczymy nową drogę, zadecyduje o przyszłości naszego ludu."

  # Europe

  country_history_europe: "Ziemie [**ShowContinentName(***'europe'***)**] są domem dla niezliczonych ludów, królestw, plemion i ufortyfikowanych osad. Od wybrzeży Morza Śródziemnego po północne lasy i wielkie rzeki wschodu społeczności rywalizują o żyzne ziemie, metale, szlaki handlowe i kontrolę nad morzami. Bogactwo południowych królestw zaczęło docierać coraz dalej na północ i zachód, przynosząc nowe towary, technologie i idee.\n\nBrązowa broń i rydwany zmieniły sposób prowadzenia wojny, podczas gdy żelazo zaczyna rozprzestrzeniać się wśród ludów kontynentu. Z tego okresu wstrząsów mogą wyłonić się wielkie królestwa, lecz stare potęgi mogą upaść równie szybko. Nadchodzące pokolenia zdecydują, które ludy zdołają opanować te przemiany, a które zostaną przez nie zmiecione."

  # Africa

  country_history_africa: "Ziemie [**ShowContinentName(***'africa'***)**] należą do najbardziej zróżnicowanych obszarów znanego świata. Wielkie doliny rzeczne podtrzymują osiadłych rolników, rozległe sawanny zapewniają przestrzeń ludom pasterskim, lasy dają schronienie niezliczonym społecznościom, a pustynie oddzielają odległe krainy, jednocześnie służąc kupcom i podróżnym jako szlaki prowadzące przez nie od pokoleń.\n\nWzdłuż Nilu potężne królestwa powstawały nad jedną z największych rzek świata, podczas gdy dalej na zachodzie i południu inne ludy rozwijały własne tradycje, rzemiosło i systemy wymiany. Złoto, miedź, kość słoniowa, bydło, sól i inne zasoby łączą społeczności na ogromnych odległościach. Pomimo barier tworzonych przez pustynie, lasy i góry, ludy Afryki łączą sieci migracji, handlu i wymiany kulturowej, które przetrwały przez pokolenia."

  # Asia

  country_history_asia: "Ziemie [**ShowContinentName(***'asia'***)**] rozciągają się przez ogromny świat gór, pustyń, żyznych dolin rzecznych, lasów i wielkich równin. Od królestw *$china$* na wschodzie po starożytne cywilizacje *$india$*, Mezopotamii i Wyżyny Irańskiej, potężne społeczeństwa powstawały nad wielkimi rzekami i wzdłuż szlaków, które je łączyły.\n\nDalekosiężny handel przewozi metale, konie, kamienie szlachetne, tkaniny, przyprawy i inne towary przez pustynie i góry, podczas gdy kupcy i podróżnicy przenoszą ze sobą języki, technologie, wierzenia i zwyczaje. Żadna pojedyncza potęga nie kontroluje tego ogromnego kontynentu, lecz królestwa i ludy, które nauczą się kontrolować jego rzeki, przełęcze i szlaki handlowe, mogą zbudować państwa, jakich wcześniej nie widziano. Nadchodząca epoka niesie ze sobą zarówno dobrobyt, jak i konflikt."

  # Fallback

  country_history_fallback: "W tym przełomowym momencie nasz naród staje przed nowymi możliwościami i wyzwaniami. Wraz z rozwojem światowych szlaków handlowych możemy czerpać korzyści z nowych idei, towarów i wymiany kulturowej. Jednak zachowanie naszych tradycji i suwerenności w obliczu tych przemian pozostaje kluczowym zadaniem.\n\nNasz kraj musi zdecydować, czy skupić się na wzbogacaniu swojej kultury, czy na wzmacnianiu potęgi militarnej. Nasze decyzje ukształtują przyszły kierunek naszego narodu w coraz bardziej połączonym świecie."

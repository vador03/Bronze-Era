l_polish:

  # Tag specific. Please keep alphabetical order

  country_history_EGY: "The [**GetCountry(***'EGY'***)**.**GetLongName**] stoi w samym sercu starożytnego świata, błogosławiony wodami Nilu i wzbogacany przez stulecia rolnictwa, rzemiosła oraz handlu. Od żyznych ziem Delty po wielkie miasta Górnego Egiptu, królestwo czerpie swoją siłę z rzeki, która podtrzymuje jego lud. Jego położenie między Morzem Śródziemnym a ziemiami Morza Czerwonego zapewnia mu również dostęp do kupców i towarów przybywających z odległych krain.\n\nJednak dobrobyt Nilu nie gwarantuje bezpieczeństwa. Potężne królestwa i ludy otaczają [**GetCountry(***'EGY'***)**.**GetLongName**], podczas gdy rywalizujące mocarstwa dążą do zdobycia wpływów we wschodniej części Morza Śródziemnego oraz na ziemiach leżących za Synajem. Na południu starożytne królestwa [**ShowRegionName(***'nubia_region'***)**] pozostają zarówno partnerami handlowymi, jak i potencjalnymi rywalami, podczas gdy na wschodzie leżą bogate ziemie [**ShowRegionName(***'arabia_region'***)**] oraz wielkie szlaki prowadzące w kierunku serca Azji. Ten, kto kontroluje Nil, Deltę i drogi łączące Egipt z jego sąsiadami, będzie władał jedną z najbogatszych krain starożytnego świata.\n\nJak władca [**GetCountry(***'EGY'***)**] powinien stawić czoła nadchodzącym wyzwaniom? Czy [**GetCountry(***'EGY'***)**.**GetGovernment.GetRuler.GetHeShe**] wzmocni królestwo wzdłuż Nilu i zachowa jego starożytne tradycje? Czy [**GetCountry(***'EGY'***)**.**GetGovernment.GetRuler.GetHeShe**] będzie dążyć do dominacji nad wschodnią częścią Morza Śródziemnego i ziemiami za Synajem? A może [**GetCountry(***'EGY'***)**.**GetGovernment.GetRuler.GetHeShe**] zwróci się na południe i mocno podporządkuje ziemie [**ShowRegionName(***'nubia_region'***)**] władzy Nilu?"

  country_history_0001G: "The [**GetCountry(***'0001G'***)**.**GetLongName**] jawi się jako największa potęga wśród królestw Morza Egejskiego, a jej siła opiera się na potężnej cytadeli Myken oraz licznych ziemiach, które zostały zjednoczone pod jednym berłem. Przez pokolenia greccy królowie strzegli swojej niezależności, rywalizując między sobą o bogactwo, prestiż i wpływy. Teraz, po raz pierwszy, [**GetCountry(***'0001G'***)**.**GetGovernment.GetRuler.GetName**] zdołał zjednoczyć te rywalizujące królestwa pod zwierzchnictwem Myken.\n\nTa nowo odkryta jedność nie pozostała niezauważona. Po drugiej stronie Morza Egejskiego wpływy [**GetCultureGroupName(***'hittite_group'***)**] i [**GetCountry(***'HIT'***)**.**GetLongName**] sięgają głęboko w zachodnią Anatolię. Wśród ich wasali znajduje się bogate miasto [**ShowLocationName(***'troy'***)**], którego położenie pozwala kontrolować szlaki między Morzem Egejskim a ziemiami Anatolii. Stosunki między Grekami a Troją stają się coraz bardziej wrogie, a wojna z każdym kolejnym sezonem wydaje się coraz bliższa.\n\nKrólowie Morza Egejskiego zgromadzili swoje okręty i wojowników, lecz pozostaje niepewne, czy ten kruchy sojusz przetrwa, gdy tylko popłynie pierwsza krew. Wyprawa przeciwko Troi może przynieść Mykenom chwałę i bogactwo, ale równie łatwo może postawić nowo zjednoczone królestwa przeciwko potędze świata Hetytów. Decyzje [**GetCountry(***'0001G'***)**.**GetGovernment.GetRuler.GetName**] mogą zadecydować o tym, czy sojusz ten stanie się fundamentem trwałego państwa mykeńskiego, czy jedynie tymczasowym związkiem zawartym w oczekiwaniu na wojnę.\n\nCzy [**GetCountry(***'0001G'***)**.**GetGovernment.GetRuler.GetHeShe**] poprowadzi zjednoczone królestwa Grecji przeciwko [**ShowLocationName(***'troy'***)**] i rzuci wyzwanie hetyckim wpływom na Morzu Egejskim? Czy [**GetCountry(***'0001G'***)**.**GetGovernment.GetRuler.GetHeShe**] spróbuje wzmocnić swoje państwo, zanim zaangażuje się w tak niebezpieczną kampanię? A może rywalizujący królowie Grecji okażą się zbyt trudni do utrzymania w jedności, gdy zagrożenie wojną zacznie wystawiać ich lojalność na próbę?"

  country_history_HATTI: "The [**GetCountry(***'HATTI'***)**.**GetLongName**] należy do największych potęg starożytnego świata, władając z wyżyn centralnej Anatolii i kontrolując rozległą sieć wasali, królestw trybutarnych oraz ufortyfikowanych miast. Przez pokolenia królowie Hatti rozszerzali swoje wpływy na Anatolię i północną Syrię, wiążąc odległe krainy z władzą Wielkiego Króla za pomocą dyplomacji, trybutu i wojny.\n\nJednak zachodnia granica staje się coraz bardziej niespokojna. Królestwa Morza Egejskiego zjednoczyły się w większym stopniu pod rosnącą potęgą Myken, podczas gdy bogate miasto [**ShowLocationName(***'troy'***)**], lojalny wasal Hatti, stoi na skrzyżowaniu szlaków między Morzem Egejskim a Anatolią. Napięcia z mykeńskimi królami rosną, a wieści o gromadzących się po drugiej stronie morza okrętach dotarły na dwór Wielkiego Króla. Jeśli wybuchnie wojna, Troja może stać się pierwszym polem bitwy znacznie większej walki o wpływy na zachodnich morzach.\n\nSiła [**GetCountry(***'HATTI'***)**.**GetLongName**] zależy od utrzymania lojalności licznych wasali i bezpieczeństwa granic. Na wschodzie rywalizujące potęgi i niespokojni poddani wymagają uwagi, podczas gdy na zachodzie Mykeny stają się coraz śmielsze z każdym mijającym rokiem. Wielki Król musi zdecydować, gdzie skierować potęgę Hatti, zanim krucha równowaga regionu zostanie zachwiana.\n\nCzy [**GetCountry(***'HATTI'***)**.**GetGovernment.GetRuler.GetHeShe**] wzmocni zachodnie królestwa i zagwarantuje, że [**ShowLocationName(***'troy'***)**] pozostanie lojalna wobec Hatti? Czy [**GetCountry(***'HATTI'***)**.**GetGovernment.GetRuler.GetHeShe**] zwróci się ku Morzu Egejskiemu i stawi czoła rosnącej potędze Myken, zanim stanie się ona jeszcze większym zagrożeniem? A może [**GetCountry(***'HATTI'***)**.**GetGovernment.GetRuler.GetHeShe**] skupi się na zachowaniu rozległego państwa już znajdującego się pod władzą Wielkiego Króla, aby jego liczni wasale nie zaczęli kwestionować siły swojego pana?"


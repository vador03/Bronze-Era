l_polish:
  a_slingers: "Procarze"
  a_slingers_desc: "Wywodzący się spośród pasterzy, myśliwych i pospólstwa procarze ciskają kamieniami z zaskakującą siłą i celnością. Tani w wyposażeniu i łatwi do zwerbowania, zapewniają cenne wsparcie dystansowe na polu bitwy."
  a_household_warriors: "Straż Przyboczna"
  a_simple_chariots: "Proste Rydwany"
  a_simple_chariots_desc: "Szybkie i zwrotne pojazdy obsługiwane przez woźnicę i wojownika. Proste rydwany doskonale sprawdzają się w zwiadzie, potyczkach i nękaniu wolniejszych przeciwników na otwartym terenie."
  a_heavy_chariots: "Ciężkie Rydwany"
  a_heavy_chariots_desc: "Budowane z solidniejszych ram i przeznaczone dla liczniejszych załóg, ciężkie rydwany zapewniają siłę uderzeniową i prestiż na polu bitwy. Choć kosztowne i zależne od terenu, mogą dominować nad mniej zorganizowanymi przeciwnikami na otwartym terenie."
  a_light_chariots: "Lekkie Rydwany"
  a_light_chariots_desc: "Trzon dojrzałej sztuki wojennej opartej na rydwanach. Lekkie rydwany łączą szybkość, manewrowość i siłę ognia, by dominować na otwartych polach bitew. Obsługiwane przez wyszkolonych wojowników i ciągnięte przez zaprzęgi wytrenowanych koni, doskonale sprawdzają się w potyczkach, pościgach i rozbijaniu formacji wroga."
  a_spearmen: "Włócznicy"
  a_spearmen_desc: "Uzbrojeni w długie włócznie i proste tarcze, włócznicy tworzą zdyscyplinowane formacje obronne zdolne utrzymać linię przeciwko piechocie, rydwanom i jeździe. Stanowią trzon wielu armii epoki brązu."
  a_axemen: "Topornicy"
  a_axemen_desc: "Posługujący się ciężkimi toporami przeznaczonymi do brutalnej walki w zwarciu, topornicy doskonale nadają się do przełamywania formacji wroga i pokonywania przeciwników dzięki agresywnym atakom. Ich zaciekłość czyni z nich cenne oddziały uderzeniowe."
  a_swordsmen: "Miecznicy"
  a_swordsmen_desc: "Wyposażeni w wszechstronne miecze przeznaczone zarówno do cięcia, jak i pchnięć, wojownicy ci są wyszkoleni do mobilnej walki w zwarciu. Wykorzystują luki w liniach wroga i łatwo dostosowują się do zmiennych warunków bitwy."
  a_neolithic_bowmen: "Łucznicy"
  a_neolithic_bowmen_desc: "Uzbrojeni w proste łuki jednoczęściowe, łucznicy zapewniają wsparcie dystansowe i mogą nękać wrogów, zanim dojdzie do walki w zwarciu."
  a_composite_bowmen: "Łucznicy z Łukami Refleksyjnymi"
  a_composite_bowmen_desc: "Wyposażeni w zaawansowane łuki refleksyjne, ci wyszkoleni łucznicy prowadzą celny ostrzał z większego dystansu i z większą siłą niż zwykli łucznicy."
  a_mustered_infantry: "Powołana Piechota"
  a_mustered_infantry_desc: "Powoływani spośród gospodarstw domowych zobowiązanych do służby wojskowej, wojownicy ci przybywają z własną bronią i wyposażeniem, gdy zostają wezwani przez lokalnych wodzów i władców. Brakuje im wyszkolenia elitarnych drużynników, lecz zapewniają siłę ludzką niezbędną do prowadzenia większych kampanii."
  a_iron_horsemen: "Wojownicy Konni"
  a_iron_horsemen_desc: "Wyszkoleni jeźdźcy walczący z grzbietów koni, cenieni za szybkość i mobilność, a nie za masową siłę uderzenia późniejszej jazdy. Doskonale sprawdzają się w zwiadzie, pościgach, najazdach oraz wykorzystywaniu luk i odsłoniętych pozycji na polu bitwy."
  # JEDNOSTKI REGIONALNE
  a_pastoralist_slingers: "Procarze Pasterzy"
  a_pastoralist_slingers_desc: "Społeczności pasterskie przyzwyczajone do hodowli zwierząt i pracy z wełną rozwijają znaczną biegłość w posługiwaniu się procą, tworząc zwinnych wojowników doskonale nadających się do potyczek i nękania.\n\nJednostka ta jest znacznie tańsza w tworzeniu i utrzymaniu niż zwykli procarze, lecz podczas walki otrzymuje dodatkowe obrażenia i ponosi większe straty morale."
  a_nomadic_mounted_warriors: "Koczowniczy Jeźdźcy"
  a_nomadic_mounted_warriors_desc: "Społeczności koczownicze przyzwyczajone do życia w siodle rozwijają umiejętności wojowników konnych, którzy wykorzystują mobilność do zwiadu, nękania, najazdów i pościgu za wrogami na otwartych przestrzeniach."
  a_highland_warriors: "Wojownicy Górscy"
  a_highland_warriors_desc: "Społeczności przyzwyczajone do surowych terenów wyżynnych rozwijają wojowników doświadczonych w walce na stromym i trudnym terenie. Ich znajomość takich obszarów pozwala im utrzymywać trudne pozycje i skutecznie wykorzystywać ukształtowanie terenu w bitwie.\n\nJednostka ta jest przeciętnie słabsza i bardziej podatna na straty niż zwykli żołnierze, lecz zadaje znacznie większe obrażenia podczas walki w górach i na wzgórzach."
  a_highland_bowmen: "Górscy Łucznicy"
  a_highland_bowmen_desc: "Łucznicy wywodzący się ze społeczności przyzwyczajonych do surowych terenów wyżynnych, gdzie polowania i lokalne wojny sprzyjają rozwijaniu umiejętności posługiwania się łukiem. Ich znajomość trudnego terenu pozwala im nękać i osłabiać wrogów z pozycji, do których trudno dotrzeć.\n\nJednostka ta jest przeciętnie słabsza i bardziej podatna na straty niż zwykli łucznicy, lecz zadaje znacznie większe obrażenia podczas walki w górach i na wzgórzach."
  a_sea_peoples_swordsmen: "Miecznicy Ludów Morza"
  a_sea_peoples_swordsmen_desc: "Wojownicy z nadmorskich społeczności wschodniej części Morza Śródziemnego, ukształtowani przez tradycję morskich najazdów, migracji i wojny. Ich charakterystyczne tradycje wojenne wyrosły ze społeczeństw przyzwyczajonych do prowadzenia walk między osadami nadbrzeżnymi i przez szlaki wodne.\n\nJednostka ta jest ogólnie silniejsza od zwykłych mieczników i jeszcze lepiej radzi sobie na terenach nadbrzeżnych i rzecznych, lecz jej rekrutacja i utrzymanie kosztują złoto."
  # JEDNOSTKI UNIKATOWE
  a_myrmidones: "Mirmidonowie"
  a_myrmidones_desc: "Elitarny korpus wojowników przybocznych, słynących z niezachwianej dyscypliny i bezwzględnej lojalności wobec swego pana. Wywodzący się ze szlachty i związani reputacją oraz tradycją, Mirmidonowie doskonale utrzymują linię nawet podczas najzacieklejszych walk, zdobywając przerażającą sławę na polu bitwy."
  a_hittite_chariot: "Rydwany Hetyckie"
  a_hittite_chariot_desc: "Słynące z solidnej konstrukcji i liczniejszych załóg, rydwany hetyckie łączą mobilność z wyjątkową odpornością w walce. Obsługiwane przez doświadczonych wojowników wywodzących się z arystokracji, doskonale sprawdzają się w długotrwałych starciach i stanowią elitarną siłę uderzeniową armii hetyckich."
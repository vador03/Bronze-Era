l_polish:
  ASGARD_f: "Asgard"
  ASGARD_f_desc: "Szlaki morskie, lasy i brązowe hale północy mogą zostać zjednoczone pod jedną wysoką koroną. Asgard nie jest boskim królestwem, lecz ludzkim państwem roszczącym sobie prestiż domeny Asów."
  bronze_asgard_high_kingship: "Wielkie Królestwo Asgardu"
  bronze_asgard_high_kingship_desc: "Władcy Asgardu jednoczą nordyckich wodzów, miejsca kultu i szlaki morskie w trwały porządek królewski."
  bronze_asgard_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Asgardu, ale bez darmowych rdzeni."
  MIDGARD_f: "Midgard"
  MIDGARD_f_desc: "Centralne szwedzkie krainy ludowe mogą zostać zjednoczone w trwałe ludzkie królestwo pod norweskimi obrzędami i prawem epoki brązu. Midgard przedstawia świat środkowy jako polityczny ideał, a nie magiczną krainę."
  bronze_midgard_folkland_order: "Porządek Krain Ludowych"
  bronze_midgard_folkland_order_desc: "Królowie Midgardu jednoczą rozproszone osady, zgromadzenia i drużyny wojenne w stabilniejsze szwedzkie państwo."
  bronze_midgard_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Midgardu, ale bez darmowych rdzeni."
  JOTUNHEIM_f: "Jotunheim"
  JOTUNHEIM_f_desc: "Góry, fiordy i śródlądowe doliny Norwegii mogą zostać zjednoczone w surowe ludzkie królestwo. Jotunheim zawdzięcza nazwę legendarnym klanom górskim, lecz jego władza opiera się na norweskich obrzędach, prawie górskim i bronionych przełęczach."
  bronze_jotunheim_mountain_clans: "Siedziby Klanów Górskich"
  bronze_jotunheim_mountain_clans_desc: "Władcy Jotunheimu jednoczą górskie hale, gospodarstwa dolinne i ufortyfikowane przełęcze w trwałe państwo obronne."
  bronze_jotunheim_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Jotunheimu, ale bez darmowych rdzeni."
  VANAHEIM_f: "Vanaheim"
  VANAHEIM_f_desc: "Południowe lasy, wyspiarskie pola i krainy hodowli bydła nordyckiego świata mogą zostać zjednoczone w wiejskie ludzkie królestwo. Vanaheim czci Wanów poprzez kult, prawo i obrzędy płodności, nie roszcząc sobie prawa do nadprzyrodzonej władzy."
  bronze_vanaheim_vanir_folklands: "Krainy Ludowe Wanów"
  bronze_vanaheim_vanir_folklands_desc: "Władcy Vanaheimu chronią pola, stada i wiejskie zgromadzenia, przekształcając rozproszone ziemie uprawne w trwałe nordyckie państwo."
  bronze_vanaheim_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Vanaheimu, ale bez darmowych rdzeni."
  ALFHEIM_f: "Alfheim"
  ALFHEIM_f_desc: "Fińskie wybrzeża, jeziora i leśne krainy ludowe mogą zostać zjednoczone w ludzkie królestwo pod religią nordycką. Alfheim wykorzystuje świętą, mitologiczną nazwę dla leśnego królestwa, nie zmieniając lokalnych kultur ani nie roszcząc sobie prawa do nadprzyrodzonych ludów."
  bronze_alfheim_forest_folklands: "Leśne Krainy Ludowe"
  bronze_alfheim_forest_folklands_desc: "Władcy Alfheimu dostosowują nordyckie obrzędy do szlaków jeziornych, leśnych polan i trudnego terenu leśnego."
  bronze_alfheim_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Alfheimu, ale bez darmowych rdzeni."
  NIDAVELLIR_f: "Nidavellir"
  NIDAVELLIR_f_desc: "Północne złoża rud, doliny rzeczne i osady kowalskie mogą zostać zjednoczone w Nidavellir. Niektóre tradycje nazywają takie królestwo Svartalfheimem, lecz tutaj nazwa ta odnosi się do ludzkich górników, metalurgów i legendarnych rodów rzemieślniczych."
  bronze_nidavellir_bronze_smiths: "Klany Kowali Brązu"
  bronze_nidavellir_bronze_smiths_desc: "Nidavellir chroni kopalnie, szlaki transportu węgla drzewnego i warsztaty brązownicze, wzmacniając wydobycie miedzi i praktyczną produkcję rzemieślniczą."
  bronze_nidavellir_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Nidavelliru, ale bez darmowych rdzeni."
  MUSPELLHEIM_f: "Muspellheim"
  MUSPELLHEIM_f_desc: "Wulkaniczne wyspy i północne stacje morskie mogą zostać zjednoczone w Muspellheim, ludzkie nordyckie królestwo ukształtowane przez surowe wybrzeża, popiołem przesyconą glebę i długie szlaki zaopatrzeniowe. Samo w sobie nie odkrywa ani nie kolonizuje żadnych terenów."
  bronze_muspellheim_volcanic_seaways: "Wulkaniczne Szlaki Morskie"
  bronze_muspellheim_volcanic_seaways_desc: "Załogi Muspellheimu uczą się utrzymywać zaopatrzenie statków na trudnych północnych wodach i bronić odizolowanych osad wyspiarskich."
  bronze_muspellheim_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Muspellheimu, ale bez darmowych rdzeni ani kolonii."
  NIFLHEIM_f: "Niflheim"
  NIFLHEIM_f_desc: "Zimne rubieże dalekiej północy mogą zostać zjednoczone w ludzkie nordyckie królestwo gór, mgieł i trudnych szlaków. Niflheim jest religijną nazwą północnego państwa, a nie nadprzyrodzoną domeną."
  bronze_niflheim_cold_marches: "Przystosowanie do Zimnych Rubieży"
  bronze_niflheim_cold_marches_desc: "Klany Niflheimu znoszą złe drogi, zimne ziemie i górskie przełęcze, sprawiając, że inwazja staje się kosztowna."
  bronze_niflheim_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Niflheimu, ale bez darmowych rdzeni."
  HELHEIM_f: "Helheim"
  HELHEIM_f_desc: "Duńskie wyspy, cieśniny i ziemie Jutlandii mogą zostać zjednoczone w Helheim, ludzkie nordyckie królestwo związane z obrzędami pogrzebowymi, kultem przodków i strzeżonymi przeprawami. Nie ma w nim nieumarłych ani nadprzyrodzonej władzy."
  bronze_helheim_ancestor_straits: "Cieśniny Przodków"
  bronze_helheim_ancestor_straits_desc: "Władcy Helheimu wzmacniają prawo przodków, spójność rytualną oraz obronę wysp i cieśnin."
  bronze_helheim_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Helheimu, ale bez darmowych rdzeni."
  VINDLAND_f: "Vindland"
  VINDLAND_f_desc: "Bałtyckie i fińskie krainy rzeczne mogą zostać zjednoczone w Vindland przez państwo wyznające religię nordycką, które zachowuje swoją lokalną kulturę. Bursztyn, lasy i drogi wodne definiują królestwo bardziej niż jakiekolwiek nordyckie pochodzenie."
  bronze_vindland_amber_waterways: "Bursztynowe Drogi Wodne"
  bronze_vindland_amber_waterways_desc: "Władcy Vindlandu chronią szlaki bursztynowe, leśne trakty i bałtyckie przeprawy rzeczne."
  bronze_vindland_remaining_claims_tt: "Zyskaj roszczenia do podboju pozostałych lokacji Vindlandu, ale bez darmowych rdzeni."
  PERSIA_f: "Imperium Perskie"
  PERSIA_f_desc: "Perskie królestwo, które przyjęło wszystkie instytucje epoki brązu, może zjednoczyć Anszan, Medię, Marhasi i górskie społeczności Wyżyny Irańskiej pod imperialną koroną."
  bronze_formed_persian_empire: "Utworzono Imperium Perskie"
  bronze_formed_persian_empire_desc: "To państwo utworzyło Imperium Perskie."
  bronze_formed_asgard: "Utworzono Asgard"
  bronze_formed_asgard_desc: "To państwo utworzyło Asgard i stoi teraz ponad regionalnymi koronami nordyckimi."
  bronze_formed_norse_regional_realm: "Utworzono Nordyckie Państwo Regionalne"
  bronze_formed_norse_regional_realm_desc: "To państwo utworzyło jedno z regionalnych państw nordyckich i nie może utworzyć kolejnej regionalnej korony nordyckiej."
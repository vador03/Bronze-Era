l_polish:
  age_1_traditions:0 "Brąz" 
  age_1_traditions_desc:0 "Chronologia przedstawiona wizualnie: 1209–1050 p.n.e. Gospodarki pałacowe, obróbka brązu, wojna rydwanowa, królestwa rzeczne i wymiana morska definiują pierwszy horyzont technologiczny scenariusza epoki brązu. Wewnętrznie silnik gry wykorzystuje lata dodatnie dla zachowania stabilności."
  age_2_renaissance:0 "Żelazo"
  age_2_renaissance_desc:0 "Chronologia przedstawiona wizualnie: 1050–800 p.n.e. Żelazne narzędzia, nowa organizacja wojskowa, rozdrobnione królestwa oraz odbudowa po okresie upadku przekształcają dawny świat epoki brązu."
  age_3_discovery:0 "Archaiczna"
  age_3_discovery_desc:0 "Chronologia przedstawiona wizualnie: 800–500 p.n.e. Miasta, sanktuaria, porty kolonizacyjne, prawo pisane i regionalne arystokracje zaczynają przekształcać Morze Śródziemne oraz jego zaplecze."
  age_4_reformation:0 "Klasyczna"
  age_4_reformation_desc:0 "Chronologia przedstawiona wizualnie: 500–323 p.n.e. Dojrzałe miasta-państwa, zorganizowane imperia, instytucje obywatelskie i zdyscyplinowane armie określają układ sił w całym starożytnym świecie."
  age_5_absolutism:0 "Hellenistyczna"
  age_5_absolutism_desc:0 "Chronologia przedstawiona wizualnie: 323–147 p.n.e. Królestwa następców, dwory królewskie, zawodowe armie i wymiana dalekosiężna łączą wschodnią część Morza Śródziemnego w szerszy świat polityczny."
  age_6_revolutions:0 "Rzymska"
  age_6_revolutions_desc:0 "Chronologia przedstawiona wizualnie: 147 p.n.e.–120 n.e. Administracja imperialna, systemy dróg, profesjonalne armie oraz hegemonia nad Morzem Śródziemnym wyznaczają ostatnią epokę kampanii."

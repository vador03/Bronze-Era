l_polish:
  bronze_rome_foundation.1.title: "Założenie Rzymu"
  bronze_rome_foundation.1.desc: "Na brzegach Tybru ufortyfikowana osada Latynów skupia się wokół nowego rodu królewskiego. Jej starszyzna mówi o omenach, szlakach bydła, kamieniach granicznych i mieście, które może władać wzgórzami Lacjum. Jeśli zostanie uznany, Rzym wyróżni się jako młode królestwo."
  bronze_rome_foundation.1.a: "Wznieśmy wilczy sztandar nad Rzymem."
  bronze_rome_foundation.1.b: "Pozostawmy osadę pod władzą królów Latynów."
  bronze_rome_foundation.2.title: "Osada nad Tybrem"
  bronze_rome_foundation.2.desc: "Latyńscy osadnicy i drużyny wojowników znad Tybru proszą o utworzenie własnego miasta pod władzą nowego króla. Przyznanie im niezależności stworzy Rzym, lecz odmowa pozostawi przeprawę przez rzekę pod naszym bezpośrednim panowaniem."
  bronze_rome_foundation.2.a: "Zezwólmy na założenie Rzymu."
  bronze_rome_foundation.2.b: "Włączmy osadę do naszego państwa."
  bronze_rome_foundation_1a_tt: "Rzym zostaje utworzony jako niezależne królestwo Lacjum w lokacji Rzymu. Od tej pory będziesz kontynuować grę jako Rzym."
  bronze_rome_foundation_1b_tt: "Rzym nie zostaje utworzony. Osada pozostaje pod władzą twojego obecnego państwa i otrzymuje mniejszy lokalny bonus. Ta odmowa nie uniemożliwia powstania Rzymu na stałe, jeśli inny władca przejmie później kontrolę nad Tybrem."
  bronze_rome_foundation_2a_tt: "Rzym zostaje utworzony jako niezależne królestwo Lacjum. Twoje państwo z własnego wyboru traci lokację Rzymu."
  bronze_rome_foundation_2b_tt: "Rzym nie zostaje utworzony. Osada pozostaje pod władzą twojego obecnego państwa i otrzymuje mniejszy lokalny bonus. Ta odmowa nie uniemożliwia powstania Rzymu na stałe, jeśli inny władca przejmie później kontrolę nad Tybrem."
  bronze_rome_foundation_momentum: "Rozmach Założycielski"
  bronze_rome_foundation_momentum_desc: "Nowe królestwo Rzymu czerpie prestiż, osadników i poparcie arystokracji z obrzędów założycielskich nad Tybrem."
  bronze_rome_foundation_site: "Miejsce Założenia Rzymu"
  bronze_rome_foundation_site_desc: "Nowo uznana osada przyciąga wojowników, migrantów i miejscowych możnych wokół swojej ufortyfikowanej przeprawy przez rzekę."
  bronze_rome_absorbed_settlement: "Włączona Osada nad Tybrem"
  bronze_rome_absorbed_settlement_desc: "Latyńska osada nad Tybrem została włączona do istniejącego państwa, zamiast otrzymać możliwość przekształcenia się w odrębne królestwo."
l_french:
 nuragic_simple_nuraghe: "Nuraghe simple"
 nuragic_simple_nuraghe_desc: "Une tour de pierre locale servant de refuge défensif, de poste d'observation et de repère communautaire."
 nuragic_complex_nuraghe: "Nuraghe complexe"
 nuragic_complex_nuraghe_desc: "Un complexe de tours plus vaste, avec espaces de stockage, d'assemblée et d'autorité des chefs locaux."
 nuragic_giants_tombs: "Tombes des Géants"
 nuragic_giants_tombs_desc: "Des tombes collectives de pierre liées aux rites des ancêtres et à la mémoire des groupes de parenté."
 nuragic_circular_house_village: "Village à maisons circulaires"
 nuragic_circular_house_village_desc: "Un village nuragique dispersé composé de maisons rondes en pierre, d'enclos, de réserves et de petits ateliers domestiques."
 nuragic_bronze_workshop: "Atelier de bronze nuragique"
 nuragic_bronze_workshop_desc: "De petits ateliers de fonte et de finition produisent outils, ornements et bronzes votifs pour l'échange local."
 nuragic_communal_cistern: "Citerne communautaire"
 nuragic_communal_cistern_desc: "Un point d'eau aménagé et un système de stockage soutenant pasteurs, foyers et rassemblements saisonniers."

 nuragic_simple_nuraghe_maintenance: "Entretien de la tour"
 nuragic_simple_nuraghe_maintenance_desc: "Pierre, bois et outils entretiennent la tour et ses abords défensifs."
 nuragic_complex_nuraghe_maintenance: "Entretien du complexe"
 nuragic_complex_nuraghe_maintenance_desc: "Maçons, charpentiers et gardes entretiennent un grand complexe de tours nuragiques."
 nuragic_giants_tombs_maintenance: "Offrandes ancestrales"
 nuragic_giants_tombs_maintenance_desc: "Des offrandes et des réparations périodiques préservent les tombes collectives et leurs accès rituels."
 nuragic_household_compounds: "Ensembles domestiques"
 nuragic_household_compounds_desc: "Les familles gardent des animaux, stockent des céréales et entretiennent poterie et outils domestiques dans des groupes de maisons circulaires."
 nuragic_bronze_casting: "Fonte du bronze"
 nuragic_bronze_casting_desc: "Cuivre, étain, outils et travail qualifié servent à une production modeste de bronze."
 nuragic_votive_casting: "Fonte votive"
 nuragic_votive_casting_desc: "Le bronze et la cire sont façonnés en petits objets rituels et biens de prestige."
 nuragic_cistern_maintenance: "Gestion de l'eau"
 nuragic_cistern_maintenance_desc: "Maçonnerie, récipients en poterie et outils gardent la citerne commune utilisable pendant les saisons sèches."

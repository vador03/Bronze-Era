l_french:
 be_romulus_she_wolf: "Fils de la louve"
 be_romulus_she_wolf_desc: "Les Romains racontent qu'une louve sauva leur fondateur. Ce récit renforce ses prétentions à protéger et commander une cité née de l'adversité."
 bronze_roman_kings.1.title: "La fin des rois de Rome"
 bronze_roman_kings.1.desc: "Le règne de Tarquin le Superbe traverse une crise. La tradition romaine rapporte l'indignation contre la maison royale et la décision de confier le pouvoir public à des magistrats élus. La cité doit choisir sa réponse."
 bronze_roman_kings.1.a: "Établir la République"
 bronze_roman_kings.1.b: "Conserver la royauté"
 bronze_roman_kings.2.title: "L'enlèvement des Sabines"
 bronze_roman_kings.2.desc: "Les fondateurs de Rome craignent que leur cité nouvelle ne puisse durer sans familles. Leurs demandes d'alliances matrimoniales auprès des communautés voisines ont été rejetées. Selon la tradition romaine, Romulus invite les Sabins et d'autres peuples proches aux Consualia, puis ordonne l'enlèvement de femmes tandis que les invités ont l'attention détournée. Les captives sont conduites à Rome contre leur gré. Leur arrivée peut faire croître la cité, mais cette violence envenimera les relations avec ses voisins."
 bronze_roman_kings.2.a: "L'acte est accompli ; Rome devra répondre à ses voisins."
 bronze_rome_sabine_households: "Foyers de la nouvelle cité"
 bronze_rome_sabine_households_desc: "De nouveaux foyers accroissent temporairement la population de Rome. Leur origine dans un enlèvement violent reste une source de tension."
 bronze_rome_sabine_abductions: "Enlèvement aux Consualia"
 bronze_rome_sabine_abductions_desc: "Nos voisins condamnent l'enlèvement de femmes organisé par Rome pendant la fête."

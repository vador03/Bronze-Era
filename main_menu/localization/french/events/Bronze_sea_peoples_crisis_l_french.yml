l_french:
 ASGARD_f: "Asgard"
 ASGARD_f_desc: "Les routes maritimes, les forets et les halles de bronze du Nord peuvent etre rassemblees sous une haute couronne. Asgard n'est pas un royaume divin, mais un royaume humain qui revendique le prestige du domaine des Ases."
 bronze_asgard_high_kingship: "Haute royaute d'Asgard"
 bronze_asgard_high_kingship_desc: "Les souverains d'Asgard lient les chefs nordiques, les lieux de culte et les routes maritimes dans un ordre royal durable."
 bronze_asgard_remaining_claims_tt: "Recoit des revendications de conquete sur les locations restantes d'Asgard, mais aucun core gratuit."

 MIDGARD_f: "Midgard"
 MIDGARD_f_desc: "Les folklands centraux de Suede peuvent etre rassembles en un royaume humain durable, fonde sur les rites norses et la loi de l'age du Bronze. Midgard revendique le monde central comme ideal politique, pas comme royaume magique."
 bronze_midgard_folkland_order: "Ordre des folklands"
 bronze_midgard_folkland_order_desc: "Les rois de Midgard lient les habitats disperses, les assemblees et les bandes guerrieres dans un royaume suedois plus stable."
 bronze_midgard_remaining_claims_tt: "Recoit des revendications de conquete sur les locations restantes de Midgard, mais aucun core gratuit."

 JOTUNHEIM_f: "Jotunheim"
 JOTUNHEIM_f_desc: "Les montagnes, fjords et vallees interieures de Norvege peuvent etre rassembles en un royaume humain austere. Jotunheim tire son nom des clans montagnards legendaires, mais son autorite repose sur les rites norses, la loi des montagnes et les cols defendus."
 bronze_jotunheim_mountain_clans: "Tenures des clans montagnards"
 bronze_jotunheim_mountain_clans_desc: "Les souverains de Jotunheim lient halles d'altitude, fermes de vallee et cols fortifies en un royaume defensif durable."
 bronze_jotunheim_remaining_claims_tt: "Recoit des revendications de conquete sur les locations restantes de Jotunheim, mais aucun core gratuit."

 VANAHEIM_f: "Vanaheim"
 VANAHEIM_f_desc: "Les bois du Sud, les champs insulaires et les terres d'elevage du monde norse peuvent etre rassembles en un royaume humain rural. Vanaheim honore les Vanes par le culte, la loi et les rites de fertilite, sans pretendre a un pouvoir surnaturel."
 bronze_vanaheim_vanir_folklands: "Folklands des Vanes"
 bronze_vanaheim_vanir_folklands_desc: "Les souverains de Vanaheim protegent les champs, les troupeaux et les assemblees rurales, transformant des terres agricoles dispersees en royaume nordique durable."
 bronze_vanaheim_remaining_claims_tt: "Recoit des revendications de conquete sur les locations restantes de Vanaheim, mais aucun core gratuit."

 ALFHEIM_f: "Alfheim"
 ALFHEIM_f_desc: "Les cotes finlandaises, les lacs et les folklands forestiers peuvent etre rassembles en un royaume humain de religion norse. Alfheim utilise un nom sacre issu du mythe pour un royaume forestier, sans changer les cultures locales ni pretendre a un peuple surnaturel."
 bronze_alfheim_forest_folklands: "Folklands forestiers"
 bronze_alfheim_forest_folklands_desc: "Les souverains d'Alfheim adaptent les rites norses aux routes lacustres, aux clairieres boisees et aux terrains forestiers difficiles."
 bronze_alfheim_remaining_claims_tt: "Recoit des revendications de conquete sur les locations restantes d'Alfheim, mais aucun core gratuit."

 NIDAVELLIR_f: "Nidavellir"
 NIDAVELLIR_f_desc: "Les champs de minerai du Nord, les vallees fluviales et les etablissements de forgerons peuvent etre rassembles en Nidavellir. Certaines traditions appellent un tel royaume Svartalfheim, mais ici le nom appartient a des mineurs, metallurgistes et lignees humaines d'artisans legendaires."
 bronze_nidavellir_bronze_smiths: "Clans de bronziers"
 bronze_nidavellir_bronze_smiths_desc: "Nidavellir protege les mines, les pistes de charbon et les ateliers du bronze, renforcant l'extraction du cuivre et la production artisanale pratique."
 bronze_nidavellir_remaining_claims_tt: "Recoit des revendications de conquete sur les locations restantes de Nidavellir, mais aucun core gratuit."

 MUSPELLHEIM_f: "Muspellheim"
 MUSPELLHEIM_f_desc: "Les iles volcaniques et les stations maritimes du Nord peuvent etre liees en Muspellheim, un royaume humain norse faconne par des cotes dures, des sols sombres de cendre et de longues routes de ravitaillement. Il ne revele ni ne colonise rien par lui-meme."
 bronze_muspellheim_volcanic_seaways: "Routes volcaniques"
 bronze_muspellheim_volcanic_seaways_desc: "Les equipages de Muspellheim apprennent a ravitailler les navires dans les eaux dures du Nord et a defendre les etablissements insulaires isoles."
 bronze_muspellheim_remaining_claims_tt: "Recoit des revendications de conquete sur les locations restantes de Muspellheim, mais aucun core ni colonie gratuite."

 NIFLHEIM_f: "Niflheim"
 NIFLHEIM_f_desc: "Les marches froides du grand Nord peuvent etre rassemblees en un royaume humain norse de montagnes, de brume et de routes difficiles. Niflheim est un nom religieux pour un royaume septentrional, pas un domaine surnaturel."
 bronze_niflheim_cold_marches: "Adaptation aux marches froides"
 bronze_niflheim_cold_marches_desc: "Les clans de Niflheim endurent les mauvaises routes, les terres froides et les cols montagneux tout en rendant l'invasion couteuse."
 bronze_niflheim_remaining_claims_tt: "Recoit des revendications de conquete sur les locations restantes de Niflheim, mais aucun core gratuit."

 HELHEIM_f: "Helheim"
 HELHEIM_f_desc: "Les iles danoises, les detroits et les terres du Jutland peuvent etre rassembles en Helheim, un royaume humain norse lie aux rites funeraires, aux cultes des ancetres et aux passages gardes. Il n'a ni morts-vivants ni pouvoir surnaturel."
 bronze_helheim_ancestor_straits: "Detroits des ancetres"
 bronze_helheim_ancestor_straits_desc: "Les souverains de Helheim renforcent la loi ancestrale, la cohesion rituelle et la defense des iles et detroits."
 bronze_helheim_remaining_claims_tt: "Recoit des revendications de conquete sur les locations restantes de Helheim, mais aucun core gratuit."

 VINDLAND_f: "Vindland"
 VINDLAND_f_desc: "Les terres fluviales baltes et finniques peuvent etre rassemblees en Vindland par un royaume de religion norse qui conserve sa culture locale. L'ambre, les forets et les voies d'eau definissent le royaume plus qu'une lignee nordique."
 bronze_vindland_amber_waterways: "Voies d'ambre"
 bronze_vindland_amber_waterways_desc: "Les souverains de Vindland protegent les routes de l'ambre, les pistes forestieres et les passages fluviaux baltes."
 bronze_vindland_remaining_claims_tt: "Recoit des revendications de conquete sur les locations restantes de Vindland, mais aucun core gratuit."

 PERSIA_f: "Empire perse"
 PERSIA_f_desc: "Un royaume perse ayant adopte toutes les institutions de l'age du Bronze peut unir Anshan, la Medie, Marhasi et les communautes des hautes terres du plateau iranien sous une couronne imperiale."
 bronze_formed_persian_empire: "Empire perse forme"
 bronze_formed_persian_empire_desc: "Ce pays a forme l'Empire perse."

 bronze_formed_asgard: "Asgard forme"
 bronze_formed_asgard_desc: "Ce pays a forme Asgard et se tient desormais au-dessus des couronnes nordiques regionales."
 bronze_formed_norse_regional_realm: "Royaume regional norse forme"
 bronze_formed_norse_regional_realm_desc: "Ce pays a forme l'un des royaumes norses regionaux et ne peut plus former une autre couronne regionale norse."

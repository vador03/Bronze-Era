l_french:
 bronze_assyrian_campaigns: "Campagnes assyriennes au Levant"
 bronze_assyrian_campaigns_desc: "En 804 av. J.-C., Adad-nirari III mena l'Assyrie à travers la Syrie et la Palestine jusqu'à Gaza. Assurez Damas et Gaza avant la fin de la campagne."
 hint_bronze_assyrian_campaigns: "Campagnes assyriennes"
 hint_bronze_assyrian_campaigns_hint_text: "À partir de 804 av. J.-C., l'Assyrie dispose de trente ans pour tenir Damas et Gaza."
 bronze_assyrian_campaigns_legend: "Terres assyriennes"
 bronze_assyrian_campaigns_objectives: "Objectifs de campagne"
 bronze_assyrian_campaigns.1.title: "La campagne occidentale d'Adad-nirari"
 bronze_assyrian_campaigns.1.desc: "Le roi Adad-nirari III rassemble les armées assyriennes pour une campagne à l'ouest. Les cités syriennes et la route de Palestine jusqu'à Gaza promettent tribut, voies stratégiques et gloire royale."
 bronze_assyrian_campaigns.1.a: "Marcher vers Damas et Gaza."
 bronze_assyrian_campaigns.2.title: "L'Assyrie atteint Gaza"
 bronze_assyrian_campaigns.2.desc: "Damas et Gaza répondent au roi d'Assyrie. La route occidentale est soumise à l'autorité impériale, et la cour célèbre la campagne."
 bronze_assyrian_campaigns.2.a: "Consigner la victoire."
 bronze_assyrian_campaigns.3.title: "La campagne occidentale s'éteint"
 bronze_assyrian_campaigns.3.desc: "Le délai pour assurer Damas et Gaza est passé. La cour royale doit accepter que la campagne occidentale reste inachevée."
 bronze_assyrian_campaigns.3.a: "La cour s'en souviendra."

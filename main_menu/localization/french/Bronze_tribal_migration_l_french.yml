l_french:
 be_tribal_migration: "Devenir un peuple migrateur"
 be_tribal_migration_desc: "Une tribu ou horde des steppes indépendante et en paix peut lancer une migration totale. Tous les nobles et soldats, 60 % des bourgeois, ouvriers et membres du clergé, et 20 % des paysans et membres des tribus rejoignent un camp frontalier. Une escorte contrôlable est levée et le pays devient de type armée. Coût : 50 or et 5 stabilité ; une fois par pays."
 be_tribal_migration_decision.title: "Devenir un peuple migrateur"
 be_tribal_migration_decision.desc: "Menez le peuple entier vers un camp frontalier voisin sans propriétaire. Le camp est choisi automatiquement ; l'action de l'écran Former un pays permet de le choisir manuellement. Cette migration totale est possible une fois par pays."
 be_tribal_migration_decision.a: "Lancer la migration"
 be_tribal_migration_select_camp: "Choisissez une province voisine sans propriétaire pour le camp migratoire :"
 be_tribal_migration_no_camp: "@trigger_no! Aucune province voisine sans propriétaire ne convient."
 be_move_migration_camp: "Déplacer le peuple vers l'armée"
 be_move_migration_camp_desc: "Après avoir déplacé l'armée migratoire, ordonnez à la population de la rejoindre. La migration native des POP prend six mois. Cet ordre a un délai d'un an."
 be_move_migration_camp_select_army: "Choisissez l'armée migratoire :"
 be_settle_migration: "Installer le peuple migrateur"
 be_settle_migration_desc: "Installez le peuple là où se trouve l'armée migratoire, si le lieu est sans propriétaire ou vous appartient déjà. La population du dernier camp suit en six mois. Un territoire étranger doit d'abord être acquis par les mécanismes normaux du jeu."
 be_settle_migration_select_army: "Choisissez l'armée et le lieu d'installation :"
 be_migration_no_army: "@trigger_no! Aucune armée migratoire ne se trouve dans un lieu valable."
 be_migration_escort: "Escorte migratoire"
 be_migration_colonize_decision.title: "Coloniser la terre sous l'armée"
 be_migration_colonize_decision.desc: "Déplacez l'escorte migratoire sur une terre libre, puis prenez cette décision dans Contenu du pays. Le pays reste de type armée. La colonie reçoit immédiatement 20 % des POP du camp. Coût : 25 or ; délai : 5 ans ; quatre colonies au maximum en plus du camp."
 be_migration_colonize_decision.a: "Fonder la colonie"
 be_migration_settle_decision.title: "Installer définitivement le peuple"
 be_migration_settle_decision.desc: "Déplacez l'escorte sur une terre libre ou déjà possédée, puis prenez cette décision. Les POP du camp rejoignent immédiatement ce lieu et le pays redevient territorial. Une terre étrangère doit d'abord être acquise par les mécanismes normaux du jeu."
 be_migration_settle_decision.a: "Fonder un pays territorial"
 be_create_migration_offshoot: "Détacher un groupe migrateur"
 be_create_migration_offshoot_desc: "Détache 10 à 40 % de chaque POP assez nombreuse dans un lieu possédé. Le groupe devient un vassal de type armée avec son propre camp et une escorte ; le pays d'origine reste indépendant. Vous pouvez jouer le groupe. Coût : 30 or, paix requise et délai de 20 ans."
 be_create_migration_offshoot_select_source: "Choisissez le lieu d'origine :"
 be_create_migration_offshoot_select_camp: "Choisissez une province voisine sans propriétaire pour le camp :"
 be_create_migration_offshoot_select_share: "Choisissez la part de POP à détacher :"
 be_create_migration_offshoot_select_play: "Jouer le groupe migrant ?"
 be_tribal_migration_no_source: "@trigger_no! Aucun lieu possédé ne dispose d'une population suffisante."
 be_migrant_band: "Groupe migrateur"
 be_migrant_band_desc: "Un peuple migrateur subordonné disposant de sa propre armée."
 be_migration.1.title: "Pénurie dans le camp migratoire"
 be_migration.1.desc: "Les réserves de nourriture du peuple migrateur deviennent dangereusement faibles."
 be_migration.1.a: "Supporter la pénurie"
 be_migration.1.b: "Acheter des vivres pour 20 or"
 be_migration.2.title: "Passage en territoire étranger"
 be_migration.2.desc: "Notre peuple migrant a établi un camp sur le territoire d'un autre pays. Les autorités locales exigent un paiement pour le passage."
 be_migration.2.a: "Payer 20 or pour le passage"
 be_migration.2.b: "Refuser et subir le mécontentement"

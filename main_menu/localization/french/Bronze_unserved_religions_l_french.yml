 be_rite_pasture: "Pâturages saisonniers"
 be_rite_shelter: "Réserves protégées"
 be_rite_lineage: "Accord des ancêtres"
 be_rite_guard: "Garde communautaire"
 be_rite_hunt: "Chasse mesurée"
 be_rite_oaths: "Accords locaux"
 be_rite_food: "Récoltes partagées"
 be_rite_exchange: "Échanges sûrs"
 be_rite_seaways: "Routes côtières"
 baal_hammon_guardian: "Baal Hammon, protecteur de la cité"
 aramazd_royal_oath: "Aramazd, garant des serments royaux"

 bronze_unserved_religions.1.title: "Les troupeaux au gué asséché"
 bronze_unserved_religions.1.desc: "Les pâturages s'appauvrissent. Les anciens disent que les offrandes du foyer doivent suivre les troupeaux ; les gardiens demandent du fourrage."
 bronze_unserved_religions.1.a: "Porter les offrandes du foyer"
 bronze_unserved_religions.1.b: "Ouvrir les réserves de fourrage"
 bronze_unserved_religions.2.title: "Serments près du tertre"
 bronze_unserved_religions.2.desc: "Les bandes armées se réunissent près d'un tertre ancestral. Les clans voient dans le rite un engagement envers leurs proches ; les chefs demandent du matériel."
 bronze_unserved_religions.2.a: "Renouveler le serment des clans"
 bronze_unserved_religions.2.b: "Équiper les cavaliers"
 bronze_unserved_religions.3.title: "Le bois sacré et les villages frontaliers"
 bronze_unserved_religions.3.desc: "Des villages contestés demandent aux anciens de protéger un bois employé pour les offrandes saisonnières. Aucun prêtre ne parle au nom de tous les foyers."
 bronze_unserved_religions.3.a: "Soutenir les gardiens du bois"
 bronze_unserved_religions.3.b: "Négocier des serments villageois"
 bronze_unserved_religions.4.title: "Offrandes au bord du fleuve"
 bronze_unserved_religions.4.desc: "Avant de traverser, des familles déposent des présents au bord de l'eau et espèrent un retour sans danger. Les guerriers veulent aussi garder le gué."
 bronze_unserved_religions.4.a: "Tenir le rite du fleuve"
 bronze_unserved_religions.4.b: "Garder le passage"
 bronze_unserved_religions.5.title: "Les réserves hivernales du lac"
 bronze_unserved_religions.5.desc: "La saison menace les prises de pêche et de chasse. Des spécialistes locaux évoquent le respect dû aux gardiens du lac ; les foyers ont besoin de vivres."
 bronze_unserved_religions.5.a: "Soutenir le rite du lac"
 bronze_unserved_religions.5.b: "Organiser les réserves d'hiver"
 bronze_unserved_religions.6.title: "Un devin sur le sentier forestier"
 bronze_unserved_religions.6.desc: "Les éclaireurs reviennent d'un sentier boisé. Un devin interprète les signes selon les croyances de la communauté, tandis que les guerriers envisagent une embuscade."
 bronze_unserved_religions.6.a: "Écouter le devin"
 bronze_unserved_religions.6.b: "Préparer la garde forestière"
 bronze_unserved_religions.7.title: "Offrandes au débarcadère"
 bronze_unserved_religions.7.desc: "Quand le fleuve nourrit moins les villages, les familles demandent des offrandes à un débarcadère local. Les équipages proposent de déplacer du grain."
 bronze_unserved_religions.7.a: "Honorer les eaux locales"
 bronze_unserved_religions.7.b: "Transporter du grain par bateau"
 bronze_unserved_religions.8.title: "Des hôtes de l'autre rive"
 bronze_unserved_religions.8.desc: "Des marins étrangers arrivent avec des rites inconnus. Les anciens insistent pour que les échanges respectent les cérémonies des foyers locaux."
 bronze_unserved_religions.8.a: "Organiser un festin commun"
 bronze_unserved_religions.8.b: "Limiter les échanges au débarcadère"
 bronze_unserved_religions.9.title: "Jarres de grain pour les ancêtres"
 bronze_unserved_religions.9.desc: "Les réserves diminuent et les familles débattent de la part destinée aux offrandes du foyer. Le conseil du village peut aussi préserver les semences."
 bronze_unserved_religions.9.a: "Garder la part des ancêtres"
 bronze_unserved_religions.9.b: "Préserver les semences"
 bronze_unserved_religions.10.title: "Des pierres entre les villages"
 bronze_unserved_religions.10.desc: "Plusieurs villages se disputent l'entretien d'un ancien lieu funéraire. Les anciens proposent une commémoration commune ; d'autres préfèrent un accord pratique."
 bronze_unserved_religions.10.a: "Tenir une commémoration commune"
 bronze_unserved_religions.10.b: "Fixer des limites communes"
 bronze_unserved_religions.11.title: "Le nouveau défrichement"
 bronze_unserved_religions.11.desc: "Des familles ouvrent des champs à la lisière et demandent aux anciens de marquer le lieu par des rites domestiques. Le voisinage craint une querelle."
 bronze_unserved_religions.11.a: "Marquer ensemble le défrichement"
 bronze_unserved_religions.11.b: "Régler d'abord la limite"
 bronze_unserved_religions.12.title: "Un festin après les faibles pluies"
 bronze_unserved_religions.12.desc: "Un village propose un repas saisonnier malgré la mauvaise récolte. Certains y voient un devoir envers les ancêtres ; d'autres veulent conserver le grain."
 bronze_unserved_religions.12.a: "Partager une offrande modeste"
 bronze_unserved_religions.12.b: "Conserver le reste de la récolte"
 bronze_unserved_religions.13.title: "Le bassin et le sanctuaire local"
 bronze_unserved_religions.13.desc: "Une mauvaise récolte attise une querelle autour de l'eau. Les gardiens du sanctuaire sollicitent le souverain ; les cultivateurs veulent réparer les canaux."
 bronze_unserved_religions.13.a: "Soutenir les gardiens du sanctuaire"
 bronze_unserved_religions.13.b: "Réparer les canaux"
 bronze_unserved_religions.14.title: "Un serment pour les nouvelles communautés"
 bronze_unserved_religions.14.desc: "De nouveaux établissements demandent à être reconnus. Les gardiens locaux proposent un serment cérémoniel ; les chefs de village réclament des devoirs précis."
 bronze_unserved_religions.14.a: "Recevoir les gardiens locaux"
 bronze_unserved_religions.14.b: "Confirmer les obligations villageoises"
 bronze_unserved_religions.15.title: "Pistes de troupeaux en saison froide"
 bronze_unserved_religions.15.desc: "Les parcours de pâture s'épuisent. Les familles voient dans les anciens cairns un rappel des ancêtres, mais les éleveurs veulent changer d'itinéraire."
 bronze_unserved_religions.15.a: "Renouveler le rassemblement au cairn"
 bronze_unserved_religions.15.b: "Déplacer les troupeaux plus tôt"
 bronze_unserved_religions.16.title: "Signes dans la steppe"
 bronze_unserved_religions.16.desc: "Les guerriers consultent un devin avant la campagne. Son interprétation exprime leurs croyances ; les chefs peuvent aussi envoyer des éclaireurs."
 bronze_unserved_religions.16.a: "Écouter le devin"
 bronze_unserved_religions.16.b: "Envoyer davantage d'éclaireurs"
 bronze_unserved_religions.17.title: "Encens sur la côte"
 bronze_unserved_religions.17.desc: "Des marins préparent un voyage côtier. Des familles brûlent de la résine odorante pour souhaiter leur retour ; les marchands réclament une meilleure veille au port."
 bronze_unserved_religions.17.a: "Soutenir la cérémonie du rivage"
 bronze_unserved_religions.17.b: "Renforcer la veille du port"
 bronze_unserved_religions.18.title: "Une saison difficile à l'intérieur"
 bronze_unserved_religions.18.desc: "Les marchands du littoral apprennent que les communautés de l'intérieur manquent de ressources. Les anciens proposent un repas commun ; les transporteurs veulent envoyer des réserves."
 bronze_unserved_religions.18.a: "Organiser un repas commun"
 bronze_unserved_religions.18.b: "Envoyer des réserves à l'intérieur"
 bronze_unserved_religions.19.title: "Le point d'eau disputé"
 bronze_unserved_religions.19.desc: "Les troupeaux convergent vers un puits qui baisse. Les familles demandent aux anciens de régler l'accès et les offrandes ; les éleveurs réclament un calendrier."
 bronze_unserved_religions.19.a: "Réunir les anciens"
 bronze_unserved_religions.19.b: "Fixer un calendrier d'abreuvement"
 bronze_unserved_religions.20.title: "Un engagement avant le raid"
 bronze_unserved_religions.20.desc: "Une guerre frontalière inquiète les familles pastorales. Les clans peuvent renouveler leurs obligations mutuelles ou protéger d'abord les troupeaux."
 bronze_unserved_religions.20.a: "Renouveler l'engagement des clans"
 bronze_unserved_religions.20.b: "Garder les troupeaux"
 bronze_unserved_religions.21.title: "Les marques d'un fleuve bas"
 bronze_unserved_religions.21.desc: "Les villages comparent les marques des anciennes crues au niveau présent. Des gardiens locaux appellent à un rite commun ; les cultivateurs veulent partager les réserves."
 bronze_unserved_religions.21.a: "Se réunir sur la rive"
 bronze_unserved_religions.21.b: "Partager les greniers"
 bronze_unserved_religions.22.title: "L'accord des villages du fleuve"
 bronze_unserved_religions.22.desc: "Des villages éloignés se disputent l'entretien d'un passage. Leurs anciens proposent un serment public ; les bateliers demandent une corvée régulière."
 bronze_unserved_religions.22.a: "Témoigner du serment villageois"
 bronze_unserved_religions.22.b: "Répartir l'entretien du passage"
 bronze_unserved_religions.23.title: "Les ancêtres des routes"
 bronze_unserved_religions.23.desc: "Les caravanes relient désormais plusieurs communautés. Les anciens des lignages demandent le respect des ancêtres locaux ; les marchands veulent des règles communes."
 bronze_unserved_religions.23.a: "Réunir les lignages"
 bronze_unserved_religions.23.b: "Fixer les devoirs du marché"
 bronze_unserved_religions.24.title: "Les forgerons et les guerriers"
 bronze_unserved_religions.24.desc: "Une bande armée demande des outils et des armes aux forgerons. Des familles donnent un sens rituel à la forge ; les chefs ont besoin d'équipement."
 bronze_unserved_religions.24.a: "Soutenir le rassemblement à la forge"
 bronze_unserved_religions.24.b: "Équiper les guerriers"
 bronze_unserved_religions.25.title: "Des semences de l'ancien village"
 bronze_unserved_religions.25.desc: "Une mauvaise saison pousse un village à demander des semences à ses voisins. Les anciens veulent rappeler les obligations envers les ancêtres lors de l'échange."
 bronze_unserved_religions.25.a: "Partager les semences avec un rite"
 bronze_unserved_religions.25.b: "Organiser une réserve"
 bronze_unserved_religions.26.title: "Parenté entre les nouveaux champs"
 bronze_unserved_religions.26.desc: "Des familles installées sur de nouveaux champs se disputent la terre et l'eau. Les anciens des clans peuvent servir de médiateurs, ou le souverain fixer une limite."
 bronze_unserved_religions.26.a: "Laisser les anciens arbitrer"
 bronze_unserved_religions.26.b: "Délimiter les champs"
 bronze_unserved_religions.27.title: "Un point d'eau en saison sèche"
 bronze_unserved_religions.27.desc: "Plusieurs groupes se rencontrent près d'un point d'eau qui baisse. Les anciens rappellent les récits locaux sur son entretien ; les chasseurs proposent de partir."
 bronze_unserved_religions.27.a: "Convenir d'un accès partagé"
 bronze_unserved_religions.27.b: "Déplacer le camp"
 bronze_unserved_religions.28.title: "Des traces derrière la crête"
 bronze_unserved_religions.28.desc: "Des éclaireurs trouvent les traces d'un ennemi proche. Un rassemblement permet aux familles de renouveler leurs liens ; d'autres préfèrent disperser les chasseurs."
 bronze_unserved_religions.28.a: "Rassembler les familles"
 bronze_unserved_religions.28.b: "Envoyer les chasseurs"
 bronze_unserved_religions.29.title: "La première pluie tarde"
 bronze_unserved_religions.29.desc: "Les champs attendent la pluie. Les familles interprètent la saison à travers leurs récits du ciel et de l'eau ; les cultivateurs pressent le souverain de protéger les greniers."
 bronze_unserved_religions.29.a: "Soutenir la cérémonie de la pluie"
 bronze_unserved_religions.29.b: "Protéger les greniers"
 bronze_unserved_religions.30.title: "Des noms ancestraux à la nouvelle cour"
 bronze_unserved_religions.30.desc: "Les établissements grandissent et un lignage dirigeant demande une commémoration publique de ses ancêtres. Les chefs de village veulent que leurs histoires soient aussi entendues."
 bronze_unserved_religions.30.a: "Établir un sanctuaire de lignage"
 bronze_unserved_religions.30.b: "Inviter les chefs de village"
 bronze_unserved_religions.31.title: "Signes dans le calendrier rituel"
 bronze_unserved_religions.31.desc: "Plusieurs communautés d'Oaxaca discutent de la date d'une cérémonie publique. Les gardiens du calendrier proposent un jour commun ; les villages défendent leurs coutumes."
 bronze_unserved_religions.31.a: "Soutenir les gardiens du calendrier et leur sanctuaire"
 bronze_unserved_religions.31.b: "Laisser les rites aux villages"
 bronze_unserved_religions.32.title: "Offrandes sur la hauteur"
 bronze_unserved_religions.32.desc: "Une mauvaise récolte rassemble les habitants sur une hauteur. Certains veulent y honorer les ancêtres ; d'autres souhaitent remettre les champs en état."
 bronze_unserved_religions.32.a: "Tenir le rassemblement sur la hauteur"
 bronze_unserved_religions.32.b: "Réparer les champs"
 bronze_unserved_religions.33.title: "De l'eau pour la cour"
 bronze_unserved_religions.33.desc: "Un établissement manque d'eau. Les gardiens des foyers demandent une observance commune ; les bâtisseurs veulent réparer les canaux et les jarres."
 bronze_unserved_religions.33.a: "Réunir les foyers"
 bronze_unserved_religions.33.b: "Réparer les réserves d'eau"
 bronze_unserved_religions.34.title: "Le lieu de rassemblement commun"
 bronze_unserved_religions.34.desc: "Des communautés éloignées se disputent l'entretien d'un lieu de réunion. Leurs anciens peuvent rechercher un accord, ou les équipes se partager le travail."
 bronze_unserved_religions.34.a: "Chercher un engagement commun"
 bronze_unserved_religions.34.b: "Répartir les équipes"
 bronze_unserved_religions.35.title: "Un tertre avant la marche"
 bronze_unserved_religions.35.desc: "Une bande armée passe près d'un tertre ancestral. Les familles demandent un hommage aux défunts ; les éclaireurs pressent le départ."
 bronze_unserved_religions.35.a: "Tenir la commémoration"
 bronze_unserved_religions.35.b: "Partir avec les éclaireurs"
 bronze_unserved_religions.36.title: "Des présents le long du fleuve"
 bronze_unserved_religions.36.desc: "Des communautés voisines se rencontrent au bord de l'eau pour échanger des présents et régler l'accès à la pêche. Les anciens donnent au rassemblement une portée cérémonielle."
 bronze_unserved_religions.36.a: "Marquer l'échange par un repas"
 bronze_unserved_religions.36.b: "Fixer des règles de pêche"
 bronze_unserved_religions.37.title: "Le retour des canoës"
 bronze_unserved_religions.37.desc: "Des canoës rapportent des nouvelles et des biens d'une autre côte. Les familles veulent accueillir les équipages selon l'usage local ; les marchands préparent le prochain départ."
 bronze_unserved_religions.37.a: "Tenir l'accueil du rivage"
 bronze_unserved_religions.37.b: "Équiper le prochain voyage"
 bronze_unserved_religions.38.title: "Des jardins après la tempête"
 bronze_unserved_religions.38.desc: "Une tempête a abîmé les jardins côtiers. Les voisins rappellent leurs devoirs mutuels ; les équipages proposent d'apporter des vivres."
 bronze_unserved_religions.38.a: "Réunir les foyers"
 bronze_unserved_religions.38.b: "Transporter des vivres en canoë"
 bronze_unserved_religions.39.title: "Un village au méandre"
 bronze_unserved_religions.39.desc: "Un nouveau village et ses voisins se disputent l'accès à la pêche. Les anciens proposent une cérémonie de parenté ; les chasseurs veulent une limite nette."
 bronze_unserved_religions.39.a: "Renouveler les liens de parenté"
 bronze_unserved_religions.39.b: "Délimiter les lieux de pêche"
 bronze_unserved_religions.40.title: "Le conseil de guerre des canoës"
 bronze_unserved_religions.40.desc: "Les guerriers se réunissent avant une campagne fluviale. Les familles évoquent leurs récits ancestraux ; les chefs demandent des vivres et des éclaireurs."
 bronze_unserved_religions.40.a: "Écouter les anciens"
 bronze_unserved_religions.40.b: "Ravitailler les équipages"
 bronze_unserved_religions.41.title: "Glace mince, peu de phoques"
 bronze_unserved_religions.41.desc: "Les chasseurs signalent une glace incertaine et peu de prises. Les anciens rappellent les devoirs envers les animaux selon leurs traditions ; les familles préparent le trajet suivant."
 bronze_unserved_religions.41.a: "Réunir les chasseurs"
 bronze_unserved_religions.41.b: "Garder des vivres pour la traversée"
 bronze_unserved_religions.42.title: "Des visiteurs sur le rivage"
 bronze_unserved_religions.42.desc: "Un autre groupe arrive par bateau. Les hôtes peuvent suivre leurs usages d'accueil ou privilégier l'échange d'outils et de nourriture."
 bronze_unserved_religions.42.a: "Suivre l'usage d'accueil"
 bronze_unserved_religions.42.b: "Échanger des provisions utiles"
 bronze_unserved_religions.43.title: "Des coquillages venus d'ailleurs"
 bronze_unserved_religions.43.desc: "Des foyers côtiers accueillent des visiteurs porteurs de coquillages et de vivres. Les anciens des clans veulent rappeler les devoirs locaux avant les échanges."
 bronze_unserved_religions.43.a: "Confier l'accueil aux clans"
 bronze_unserved_religions.43.b: "Organiser les échanges maritimes"
 bronze_unserved_religions.44.title: "Des chemins entre les jardins"
 bronze_unserved_religions.44.desc: "Des familles se disputent les chemins entre jardins et lieux de pêche. Les gardiens locaux peuvent arbitrer ; des équipes peuvent ouvrir une autre voie."
 bronze_unserved_religions.44.a: "Demander l'arbitrage des gardiens locaux"
 bronze_unserved_religions.44.b: "Ouvrir un nouveau chemin"
 bronze_unserved_religions.45.title: "Prendre soin du point d'eau"
 bronze_unserved_religions.45.desc: "Un point d'eau est menacé. Ses gardiens locaux rappellent les obligations envers le territoire ancestral et ses récits ; les familles ont aussi besoin de réserves."
 bronze_unserved_religions.45.a: "Soutenir le rassemblement des gardiens"
 bronze_unserved_religions.45.b: "Protéger les réserves d'eau"
 bronze_unserved_religions.46.title: "Des chemins à travers le territoire ancestral"
 bronze_unserved_religions.46.desc: "La guerre perturbe les voies entre communautés. Les gardiens demandent le respect des lieux et récits locaux ; les éclaireurs cherchent un passage plus sûr."
 bronze_unserved_religions.46.a: "Consulter les gardiens locaux"
 bronze_unserved_religions.46.b: "Préparer un autre passage"
 bronze_unserved_religions.47.title: "L'offrande à Tanit au port"
 bronze_unserved_religions.47.desc: "Des marchands prêts à appareiller demandent au temple de bénir leur départ. Ils voient en Tanit une protectrice de la traversée, tandis que les anciens du port souhaitent que les quais restent ouverts à toutes les familles de négociants."
 bronze_unserved_religions.47.a: "Soutenir la procession du temple"
 bronze_unserved_religions.47.b: "Confier le départ aux familles du port"
 bronze_unserved_religions.48.title: "Un serment devant Baal Hammon"
 bronze_unserved_religions.48.desc: "La guerre menace la cité. Les prêtres proposent un serment public devant Baal Hammon, que les fidèles considèrent comme son protecteur. Les commandants réclament des vivres et un plan de défense clair."
 bronze_unserved_religions.48.a: "Financer le serment public"
 bronze_unserved_religions.48.b: "Équiper la garde de la cité"
 bronze_unserved_religions.49.title: "L'offrande royale à Anahit"
 bronze_unserved_religions.49.desc: "Un district récemment gouverné conteste ses obligations envers la cour. Les gardiens du temple proposent une offrande à Anahit, honorée dans la tradition arménienne tardive, tandis que les anciens demandent au souverain de confirmer leurs droits coutumiers."
 bronze_unserved_religions.49.a: "Tenir une cérémonie au temple royal"
 bronze_unserved_religions.49.b: "Confirmer les accords des anciens"
 bronze_unserved_religions.50.title: "Le serment royal d'Aramazd"
 bronze_unserved_religions.50.desc: "Face à l'approche d'un ennemi, les proches du souverain invoquent Aramazd comme témoin divin d'un engagement à défendre le pays. Les chefs de village proposent de garder les cols si leurs obligations sont reconnues."
 bronze_unserved_religions.50.a: "Proclamer l'engagement royal"
 bronze_unserved_religions.50.b: "Confier les cols aux gardes locaux"

l_french:
 bronze_zoroastrian_revelation: "La révélation de Zarathoustra"
 bronze_zoroastrian_revelation_desc: "Les enseignements attribués à Zarathoustra prennent racine parmi les communautés des rites iraniens. Les cours du plateau doivent choisir entre accueillir la nouvelle foi et défendre les anciens usages."
 hint_bronze_zoroastrian_revelation: "La révélation de Zarathoustra"
 hint_bronze_zoroastrian_revelation_hint_text: "La tradition situe la naissance de Zarathoustra vers 660 av. J.-C. ; ses enseignements apparaissent dans le mod vers 630 av. J.-C. Les pays des rites iraniens, ou dont au moins 35 % de la population les pratique, reçoivent un événement. Embrasser le zoroastrisme convertit progressivement les anciens fidèles et limite les troubles. Résister bloque cette diffusion automatique."
 bronze_zoroastrian_panel_title: "Enseignements de Zarathoustra"
 bronze_zoroastrian_panel_date: "Vers 630 av. J.-C."
 bronze_zoroastrian_panel_goal: "Une foi nouvelle"
 bronze_zoroastrian_panel_goal_value: "Ahura Mazda"
 bronze_zoroastrian_adopters_label: "Cours converties"
 bronze_zoroastrian_adopters_value: "#Y [GetSituationByKey('bronze_zoroastrian_revelation').MakeScope.GetVariable('bronze_zoroastrian_adopters').GetValue|V0]#!"
 bronze_zoroastrian_resisters_label: "Cours résistantes"
 bronze_zoroastrian_resisters_value: "#Y [GetSituationByKey('bronze_zoroastrian_revelation').MakeScope.GetVariable('bronze_zoroastrian_resisters').GetValue|V0]#!"
 bronze_zoroastrian_story_card: "Une tradition en mutation"
 bronze_zoroastrian_story_card_desc: "La tradition situe Zarathoustra autour de 660 av. J.-C., mais sa datation reste débattue. Dans ce scénario, ses premiers disciples apparaissent parmi les populations des rites iraniens. Chaque cour concernée décide si elle embrasse ou combat la nouvelle doctrine."
 bronze_zoroastrian_spread_card: "Choisir et accompagner la conversion"
 bronze_zoroastrian_spread_card_desc: "Embrasser : la cour et la famille régnante adoptent le zoroastrisme. Chaque année, une part des populations des rites iraniens se convertit ; pendant 25 ans, la tolérance et l'ordre public limitent les révoltes. Résister : le pays conserve sa religion et bloque cette diffusion automatique. La foi peut subsister chez une petite communauté locale."
 bronze_zoroastrian_legend_embraced: "Cour ayant embrassé le zoroastrisme"
 bronze_zoroastrian_legend_resisted: "Cour défendant les anciens rites"
 bronze_zoroastrian_legend_undecided: "Pays concerné sans décision"
 bronze_zoroastrian_gentle_transition: "Transition religieuse accompagnée"
 bronze_zoroastrian_gentle_transition_desc: "La cour protège les anciens sanctuaires et les nouveaux fidèles pendant la diffusion des enseignements de Zarathoustra."
 bronze_zoroastrian_ritual_resistance: "Défense des anciens rites"
 bronze_zoroastrian_ritual_resistance_desc: "La cour préserve les rites établis, mais la lutte contre une doctrine déjà présente dans le pays nourrit les tensions."
 bronze_zoroastrian_religious_settlement: "Foi établie dans le royaume"
 bronze_zoroastrian_religious_settlement_desc: "La majorité de la population suit désormais le zoroastrisme et la cour peut apaiser durablement les provinces."
 bronze_zoroastrian_relevant_text: "Suit les rites iraniens ou compte une importante population de cette religion"
 bronze_zoroastrian_can_receive_teaching_text: "Peut recevoir les enseignements de Zarathoustra"
 bronze_zoroastrian_offer_teaching_text: "Présenter les enseignements aux cours concernées"
 bronze_zoroastrian_refresh_totals_text: "Actualiser les choix des cours"
 bronze_zoroastrian_spread_to_iranic_pops_text: "Diffuser le zoroastrisme parmi les populations des rites iraniens"
 bronze_zoroastrian_revelation.1.title: "Les enseignements de Zarathoustra"
 bronze_zoroastrian_revelation.1.desc: "Des prédicateurs venus des communautés iraniennes parlent d'Ahura Mazda et d'un choix moral entre vérité et mensonge. Leur enseignement trouve déjà quelques adeptes parmi notre peuple. La cour doit décider si elle le reconnaît ou défend les rites hérités des ancêtres."
 bronze_zoroastrian_revelation.1.a: "Embrasser la foi nouvelle et guider sa diffusion."
 bronze_zoroastrian_revelation.1.b: "Combattre la doctrine et défendre les anciens rites."
 bronze_zoroastrian_revelation.2.title: "Une foi devenue majoritaire"
 bronze_zoroastrian_revelation.2.desc: "La majorité de notre population suit désormais les enseignements de Zarathoustra. Les prêtres et les administrateurs peuvent régler les derniers conflits de coutume sans recourir à la force."
 bronze_zoroastrian_revelation.2.a: "Sceller la paix entre les communautés."

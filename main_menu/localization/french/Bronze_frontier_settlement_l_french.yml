l_french:
 bronze_northern_frontier_settlement_advance: "Colonisation des frontières nordiques"
 bronze_northern_frontier_settlement_advance_desc: "À l'âge du Fer, les communautés nordiques et finniques peuvent s'établir dans une location voisine, découverte et sans propriétaire en Scandinavie ou en Finlande. Des habitants quittent progressivement une location voisine possédée. Cette avancée ne débloque pas la colonisation outre-mer."
 bronze_begin_frontier_settlement: "Coloniser une terre voisine"
 bronze_begin_frontier_settlement_desc: "Lance un projet de colonisation de 40 mois dans une location voisine, découverte et sans propriétaire en Scandinavie ou en Finlande. Choisissez une location voisine vous appartenant, peuplée de paysans ou de membres des tribus de votre culture principale. Une petite partie de sa population migre chaque mois en conservant sa culture et sa religion. Un seul projet peut être actif à la fois."
 bronze_cancel_frontier_settlement: "Annuler la colonisation"
 bronze_cancel_frontier_settlement_desc: "Met fin au projet en cours. Les migrants déjà installés restent dans la location cible."
 bronze_frontier_choose_target: "Choisir une location voisine libre"
 bronze_frontier_choose_source: "Choisir la location voisine d'origine"
 bronze_frontier_no_target: "Aucune location voisine découverte et sans propriétaire n'est disponible en Scandinavie ou en Finlande."
 bronze_frontier_no_source: "Aucune location voisine possédée n'a assez de paysans ou de membres des tribus de votre culture principale."
 bronze_frontier_progress_label: "Colonisation"
 bronze_frontier_months_label: "mois restants"
 bronze_frontier_progress_tip: "Des habitants de la location voisine choisie s'installent ici chaque mois. La location change de propriétaire seulement lorsque la progression atteint 100 %."

 baiyue_rites: "Rites baiyue"
 baiyue_rites_ADJ: "baiyue"
 baiyue_rites_desc: "Les communautés des fleuves et des estuaires suivent des rites domestiques, liés à l'eau et aux saisons, sans panthéon baiyue unique."
 jomon_rites: "Jomon Rites"
 jomon_rites_ADJ: "Jomon Rites"
 jomon_rites_desc: "A Bronze Age religious system rooted in local temples, seasonal rites, dynastic cult, and community tradition."
 mumun_rites: "Rites mumun"
 mumun_rites_ADJ: "mumun"
 mumun_rites_desc: "Les réunions villageoises, les réserves de grain et la mémoire des ancêtres marquent ces rites coréens anciens ; les noms des divinités restent incertains."
 austroasiatic_rites: "Rites austroasiatiques"
 austroasiatic_rites_ADJ: "austroasiatique"
 austroasiatic_rites_desc: "Cette appellation réunit des coutumes variées des foyers, des lisières et des fleuves, entretenues localement sans clergé unique."
 khmer_rites: "Rites khmers"
 khmer_rites_ADJ: "khmer"
 khmer_rites_desc: "Les gardiens de sanctuaires locaux, la gestion de l'eau et les pouvoirs émergents se côtoient dans les communautés khmères anciennes, sans reprendre les temples plus tardifs."
 austronesian_rites: "Austronesian Rites"
 austronesian_rites_ADJ: "Austronesian Rites"
 austronesian_rites_desc: "A Bronze Age religious system rooted in local temples, seasonal rites, dynastic cult, and community tradition."
 karasuk_rites: "Rites de Karasuk"
 karasuk_rites_ADJ: "de Karasuk"
 karasuk_rites_desc: "Les foyers pastoraux suivent les parcours saisonniers et les lieux ancestraux ; les mythes précis des communautés de Karasuk restent mal connus."
 puntite_rites: "Rites du Pount"
 puntite_rites_ADJ: "du Pount"
 puntite_rites_desc: "Les foyers côtiers et intérieurs associent les échanges maritimes à leurs cérémonies locales ; les noms des cultes de l'ancien Pount restent incertains."
 cushitic_rites: "Rites couchitiques"
 cushitic_rites_ADJ: "couchitique"
 cushitic_rites_desc: "Un ensemble de traditions pastorales et villageoises diverses, liées aux troupeaux, aux puits et aux obligations familiales."
 nilo_saharan_rites: "Rites nilo-sahariens"
 nilo_saharan_rites_ADJ: "nilo-saharien"
 nilo_saharan_rites_desc: "Les communautés du fleuve et de l'intérieur suivent des usages saisonniers et ancestraux distincts ; cette appellation n'implique pas un clergé commun."
 mande_rites: "Rites mandés"
 mande_rites_ADJ: "mandé"
 mande_rites_desc: "Les réunions de lignages et les devoirs locaux accompagnent les échanges et la vie des villages, sans imposer à cette époque les traditions nommées plus tard."
 bantu_rites: "Rites bantous"
 bantu_rites_ADJ: "bantou"
 bantu_rites_desc: "Ce terme général représente des pratiques domestiques et ancestrales variées parmi les communautés de langues bantoues, sans panthéon commun."
 khoisan_rites: "Rites khoïsan"
 khoisan_rites_ADJ: "khoïsan"
 khoisan_rites_desc: "Les récits et devoirs liés à l'eau, à la chasse et à la parenté varient beaucoup selon les communautés ; ils ne forment pas une religion uniforme."
 olmec_rites: "Olmec Rites"
 olmec_rites_ADJ: "Olmec Rites"
 olmec_rites_desc: "A Bronze Age religious system rooted in local temples, seasonal rites, dynastic cult, and community tradition."
 mayan_rites: "Rites mayas"
 mayan_rites_ADJ: "maya"
 mayan_rites_desc: "Les communautés mayas anciennes relient pluie, cultures et mémoire des lignages par des cérémonies locales ; les noms divins attestés plus tard sont employés avec prudence."
 zapotec_rites: "Rites zapotèques"
 zapotec_rites_ADJ: "zapotèque"
 zapotec_rites_desc: "Les rites villageois et lieux ancestraux d'Oaxaca accompagnent les cérémonies publiques puis les pratiques calendaires, sans supposer un panthéon plus tardif."
 puebloan_rites: "Rites pueblo"
 puebloan_rites_ADJ: "pueblo"
 puebloan_rites_desc: "Des communautés distinctes organisent localement l'eau, les devoirs des foyers et les lieux de réunion ; ce terme large ne désigne pas un clergé unique."
 andean_rites: "Andean Rites"
 andean_rites_ADJ: "Andean Rites"
 andean_rites_desc: "A Bronze Age religious system rooted in local temples, seasonal rites, dynastic cult, and community tradition."
 woodland_rites: "Rites des forêts orientales"
 woodland_rites_ADJ: "des forêts orientales"
 woodland_rites_desc: "Les communautés régionales donnent des sens locaux différents aux tertres ancestraux, aux fleuves, à la chasse saisonnière et aux échanges de présents."
 arawak_rites: "Rites arawaks"
 arawak_rites_ADJ: "arawak"
 arawak_rites_desc: "Les foyers des côtes et des îles conservent leurs usages ancestraux et d'accueil le long des routes de canoës et des terres cultivées."
 tupi_rites: "Rites tupis"
 tupi_rites_ADJ: "tupi"
 tupi_rites_desc: "Ce terme large couvre des coutumes fluviales, villageoises, familiales et ancestrales variées, sans former un panthéon tupi intemporel."
 saqqaq_rites: "Rites saqqaq"
 saqqaq_rites_ADJ: "saqqaq"
 saqqaq_rites_desc: "Les foyers de chasse arctiques entretiennent des devoirs locaux envers les personnes, les animaux et les voyages côtiers ; leurs mythes nommés sont mal connus."
 lapita_rites: "Lapita Rites"
 lapita_rites_ADJ: "Lapita Rites"
 lapita_rites_desc: "A Bronze Age religious system rooted in local temples, seasonal rites, dynastic cult, and community tradition."
 papuan_rites: "Rites papous"
 papuan_rites_ADJ: "papou"
 papuan_rites_desc: "Les communautés papoues entretiennent des coutumes distinctes de clans, d'ancêtres, de jardins et d'échanges côtiers, sans panthéon commun à toute l'île."
 dreaming_ways: "Traditions du Temps du rêve"
 dreaming_ways_ADJ: "du Temps du rêve"
 dreaming_ways_desc: "Les récits ancestraux, la garde des lieux et les devoirs envers le territoire varient selon les peuples autochtones d'Australie ; ce nom de jeu ne désigne pas une croyance uniforme."

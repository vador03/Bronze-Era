l_french:
 bronze_archaic_greek_colonies: "Colonies grecques archaïques"
 bronze_archaic_greek_colonies_desc: "Les cités grecques envoient des colons sur les côtes de la Méditerranée et de la mer Noire."
 bronze_archaic_greek_colony: "Fonder une colonie grecque côtière"
 bronze_archaic_greek_colony_desc: "Établir une colonie sur une côte découverte et libre de la Méditerranée ou de la mer Noire."
 bronze_archaic_greek_colony_choose_target: "Choisir un site côtier"
 bronze_archaic_greek_colony_no_target: "Aucun site côtier libre et découvert n'est disponible dans ces mers."
 bronze_archaic_greece.1.title: "Les chants d'Homère"
 bronze_archaic_greece.1.desc: "Dans toute la mer Égée, les chanteurs racontent la guerre de Troie et les errances d'Ulysse. La tradition attribue l'Iliade et l'Odyssée à Homère. Ces poèmes donnent au monde grec naissant une mémoire commune."
 bronze_archaic_greece.1.a: "Préserver les deux épopées."
 bronze_iliad: "L'Iliade"
 bronze_odyssey: "L'Odyssée"
 bronze_archaic_greece.2.title: "Des colons grecs sur nos côtes"
 bronze_archaic_greece.2.desc: "Plusieurs vagues de marins, paysans et marchands grecs se sont installées dans nos ports. Leurs coutumes marquent désormais les cités côtières. Notre cour doit-elle adopter leur culture ou accueillir ces communautés en gardant ses traditions ?"
 bronze_archaic_greece.2.a: "Adopter les coutumes grecques."
 bronze_archaic_greece.2.b: "Accueillir les colons et garder nos traditions."

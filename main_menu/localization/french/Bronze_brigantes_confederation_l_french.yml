 brigantes_confederation: "Confédération tribale des Brigantes"
 brigantes_confederation_desc: "Le chef des Brigantes préside le conseil des Lopocares et des Metantii. Les trois tribus échangent vivres et marchandises, se donnent accès à leurs routes, règlent leurs différends par la diplomatie et se défendent contre toute attaque extérieure."

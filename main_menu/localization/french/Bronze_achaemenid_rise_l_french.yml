l_french:
 bronze_achaemenid_rise: "Ascension des Achéménides"
 bronze_achaemenid_rise_desc: "Les royaumes mèdes rassemblent les peuples du plateau iranien. Le prétendant le plus puissant peut transformer cette suprématie fragile en empire en contrôlant Ecbatane, le cœur mède et la Perside. Ninive et Babylone prolongent cette ascension."
 hint_bronze_achaemenid_rise: "Ascension des Achéménides"
 hint_bronze_achaemenid_rise_hint_text: "Le plus puissant royaume indépendant mède ou perse de la région iranienne devient prétendant. La Médie bénéficie d'un avantage initial. Il faut contrôler Abhar, Ecbatane (Hamadan), Istakhr et 55 % des terres iraniennes requises, puis former l'Empire perse."
 bronze_achaemenid_panel_phase: "Ascension impériale"
 bronze_achaemenid_panel_phase_value: "#Y [GetSituationByKey('bronze_achaemenid_rise').MakeScope.GetVariable('bronze_achaemenid_phase').GetValue|V0]#!/3"
 bronze_achaemenid_panel_goal: "Couronne impériale"
 bronze_achaemenid_panel_goal_value: "Abhar · Ecbatane · Perside"
 bronze_achaemenid_story_card: "De l'alliance mède à l'Empire perse"
 bronze_achaemenid_story_card_desc: "Dès 750 av. J.-C., la Médie peut rallier le plateau grâce à ses levées et à sa cavalerie. Chaque année, les États iraniens indépendants sont classés selon leur puissance militaire, leurs revenus et leur rang. Le plus fort reçoit le soutien du prétendant. La faveur peut changer après une guerre."
 bronze_achaemenid_milestones_card: "Les trois étapes de l'ascension"
 bronze_achaemenid_milestones_card_desc: "1. Unir les terres mèdes et perses. 2. Dès 612 av. J.-C., Ninive (Mossoul) devient un objectif de conquête et apporte du prestige. 3. Dès 552 av. J.-C., le prétendant peut réconcilier les élites mèdes et perses. Pour former l'empire : Abhar, Hamadan, Istakhr et 55 % du cœur iranien."
 bronze_achaemenid_map_card: "Carte de campagne"
 bronze_achaemenid_map_card_desc: "L'or désigne le prétendant dominant, le brun les autres États iraniens admissibles. Le jaune indique Ecbatane et la Perside ; le rouge, Ninive. Les dates affichées suivent le calendrier historique du mod."
 bronze_achaemenid_legend_claimant: "Prétendant iranien dominant"
 bronze_achaemenid_legend_rivals: "Autres royaumes mèdes et perses"
 bronze_achaemenid_legend_objectives: "Cœurs de l'empire"
 bronze_achaemenid_median_head_start: "Confédération mède"
 bronze_achaemenid_median_head_start_desc: "Les tribus mèdes rassemblent cavaliers et tributs autour de la cour royale durant la première ascension."
 bronze_achaemenid_leading_claimant: "Prétendant à l'empire iranien"
 bronze_achaemenid_leading_claimant_desc: "Le royaume iranien le plus puissant attire guerriers et nobles ambitieux."
 bronze_achaemenid_median_cavalry: "Cavalerie iranienne réorganisée"
 bronze_achaemenid_median_cavalry_desc: "Une armée montée plus nombreuse répond au trône ; fermes et ateliers supportent la mobilisation."
 bronze_achaemenid_court_of_peoples: "Cour des peuples iraniens"
 bronze_achaemenid_court_of_peoples_desc: "Les aristocrates locaux administrent le royaume grâce à des accords royaux, au prix de concessions à leurs intérêts concurrents."
 bronze_achaemenid_imperial_foundation: "Fondation impériale achéménide"
 bronze_achaemenid_imperial_foundation_desc: "Une cour impériale durable unit les institutions mèdes et perses sous une même couronne."
 bronze_achaemenid_babylonian_settlement: "Accord babylonien"
 bronze_achaemenid_babylonian_settlement_desc: "Les garanties royales données aux communautés babyloniennes renforcent les échanges et l'ordre provincial."
 bronze_achaemenid_royal_road: "Route royale"
 bronze_achaemenid_royal_road_desc: "Relais, gardes et messagers royaux relient les provinces éloignées à la cour impériale."
 bronze_achaemenid_rise_candidate_text: "Est un pays indépendant mède ou perse du plateau iranien"
 bronze_achaemenid_rise_claimant_text: "Est le principal prétendant iranien"
 bronze_achaemenid_select_claimant_text: "Choisir le plus puissant prétendant iranien"
 bronze_achaemenid_rise.1.title: "L'étendard du plateau"
 bronze_achaemenid_rise.1.desc: "Les chefs du plateau iranien cherchent un roi capable d'unir leurs maisons. Les cavaliers affluent à la cour, tandis que les scribes comptent les présents nécessaires pour maintenir les alliances. Ce royaume porte désormais la principale prétention à un vaste empire."
 bronze_achaemenid_rise.1.a: "Rassembler les cavaliers du plateau."
 bronze_achaemenid_rise.1.b: "Lier les maisons nobles à la cour."
 bronze_achaemenid_rise.10.title: "La route de Ninive"
 bronze_achaemenid_rise.10.desc: "La grande cité assyrienne de Ninive domine encore les routes du nord de la Mésopotamie. Sa chute annoncerait le basculement des forces en faveur des hautes terres iraniennes."
 bronze_achaemenid_rise.10.a: "Préparer la campagne contre Ninive."
 bronze_achaemenid_rise.20.title: "La prise de Ninive"
 bronze_achaemenid_rise.20.desc: "La cité connue sous le nom de Ninive est tombée devant nos armées. La nouvelle voyage de cour en cour et le prestige de la couronne iranienne grandit."
 bronze_achaemenid_rise.20.a: "Que toutes les cours apprennent cette victoire."
 bronze_achaemenid_rise.30.title: "Mèdes et Perses"
 bronze_achaemenid_rise.30.desc: "Les rois des hautes terres ne peuvent plus s'appuyer sur l'allégeance d'un seul peuple. Cavaliers mèdes, nobles perses et élites provinciales doivent trouver leur place sous le même sceau royal."
 bronze_achaemenid_rise.30.a: "Reconnaître les deux peuples à la cour."
 bronze_achaemenid_rise.40.title: "Le roi des rois"
 bronze_achaemenid_rise.40.desc: "Ecbatane et la Perside répondent désormais à une seule couronne impériale. Le socle mède et la cour perse proclament ensemble une nouvelle puissance sur le plateau iranien."
 bronze_achaemenid_rise.40.a: "Un empire s'est levé."
 bronze_achaemenid_rise.50.title: "Les portes de Babylone"
 bronze_achaemenid_rise.50.desc: "Babylone rejoint l'empire. Ses temples, ses marchands et ses communautés seront gouvernés par des garanties royales et des officiers provinciaux."
 bronze_achaemenid_rise.50.a: "Sceller l'accord babylonien."
 bronze_achaemenid_rise.60.title: "La route royale"
 bronze_achaemenid_rise.60.desc: "Depuis Suse, une chaîne de routes gardées et de relais porte les ordres du roi à travers les provinces. Messagers, armées et marchands parcourent désormais l'empire sous la protection de la couronne."
 bronze_achaemenid_rise.60.a: "Lancer les messagers du roi."
